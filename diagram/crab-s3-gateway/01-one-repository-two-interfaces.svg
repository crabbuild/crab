<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">One repository, two native interfaces</title>
  <desc id="description">Crab stores versioned code and large files in an object-store bucket and exposes the same repository to existing applications through an S3 gateway.</desc>
  <defs>
    <style>
      text { font-family: 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace; }
      .title { fill: #f8fafc; font-size: 24px; font-weight: 700; letter-spacing: -0.6px; }
      .subtitle { fill: #94a3b8; font-size: 11px; }
      .eyebrow { fill: #fb923c; font-size: 9px; font-weight: 700; letter-spacing: 1.8px; }
      .region { font-size: 9px; font-weight: 700; letter-spacing: 1px; }
      .name { fill: #f8fafc; font-size: 12px; font-weight: 700; }
      .label { fill: #cbd5e1; font-size: 9px; }
      .muted { fill: #94a3b8; font-size: 8px; }
      .tiny { fill: #64748b; font-size: 7px; }
      .flow { fill: #e2e8f0; font-size: 8px; font-weight: 600; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bucketFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#713f12" stop-opacity="0.56"/>
      <stop offset="1" stop-color="#451a03" stop-opacity="0.28"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#0f172a"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect x="0" y="0" width="1280" height="112" fill="#0b1220" fill-opacity="0.86"/>
  <rect x="50" y="99" width="1180" height="2" rx="1" fill="url(#headline)" opacity="0.8"/>

  <text x="50" y="34" class="eyebrow">CRAB S3 GATEWAY</text>
  <text x="50" y="67" class="title">ONE REPOSITORY. TWO NATIVE INTERFACES.</text>
  <text x="50" y="88" class="subtitle">Version code and large artifacts with Git. Serve the same repository to existing applications through S3.</text>

  <rect x="35" y="150" width="220" height="380" rx="14" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,5" opacity="0.68"/>
  <text x="50" y="171" class="region" fill="#22d3ee">DEVELOPER WORKSPACE</text>

  <rect x="570" y="150" width="300" height="380" rx="14" fill="none" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="9,5" opacity="0.78"/>
  <text x="585" y="171" class="region" fill="#fbbf24">YOUR CLOUD / YOUR BUCKET</text>

  <rect x="1080" y="150" width="165" height="380" rx="14" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,5" opacity="0.68"/>
  <text x="1095" y="171" class="region" fill="#a78bfa">S3 ECOSYSTEM</text>

  <line x1="235" y1="322" x2="310" y2="322" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="310" y1="342" x2="235" y2="342" stroke="#22d3ee" stroke-width="1.3" stroke-opacity="0.68" marker-end="url(#arrow-cyan)"/>
  <line x1="515" y1="322" x2="590" y2="322" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <line x1="590" y1="342" x2="515" y2="342" stroke="#22d3ee" stroke-width="1.3" stroke-opacity="0.68" marker-end="url(#arrow-cyan)"/>
  <line x1="905" y1="322" x2="850" y2="322" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <line x1="850" y1="342" x2="905" y2="342" stroke="#fbbf24" stroke-width="1.3" stroke-opacity="0.78" marker-end="url(#arrow-amber)"/>
  <line x1="1095" y1="322" x2="1060" y2="322" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <line x1="1060" y1="342" x2="1095" y2="342" stroke="#a78bfa" stroke-width="1.3" stroke-opacity="0.68" marker-end="url(#arrow-violet)"/>

  <text x="272" y="305" class="flow" text-anchor="middle">Git</text>
  <text x="552" y="305" class="flow" text-anchor="middle">storage</text>
  <text x="877" y="305" class="flow" text-anchor="middle">repo</text>
  <text x="1077" y="305" class="flow" text-anchor="middle">S3</text>

  <rect x="55" y="200" width="180" height="70" rx="8" fill="#0f172a"/>
  <rect x="55" y="200" width="180" height="70" rx="8" fill="rgba(8,51,68,0.42)" stroke="#22d3ee" stroke-width="1.4"/>
  <text x="75" y="228" class="name">CODE</text>
  <text x="75" y="248" class="muted">source • config • docs</text>
  <path d="M207 219 h18 v25 h-24 v-19 z" fill="none" stroke="#67e8f9" stroke-width="1.4"/>
  <path d="M207 219 v6 h-6" fill="none" stroke="#67e8f9" stroke-width="1.4"/>

  <rect x="55" y="290" width="180" height="70" rx="8" fill="#0f172a"/>
  <rect x="55" y="290" width="180" height="70" rx="8" fill="rgba(6,78,59,0.42)" stroke="#34d399" stroke-width="1.4"/>
  <text x="75" y="318" class="name">MODELS</text>
  <text x="75" y="338" class="muted">weights • checkpoints</text>
  <circle cx="213" cy="325" r="12" fill="none" stroke="#6ee7b7" stroke-width="1.4"/>
  <circle cx="213" cy="325" r="4" fill="#34d399"/>

  <rect x="55" y="380" width="180" height="70" rx="8" fill="#0f172a"/>
  <rect x="55" y="380" width="180" height="70" rx="8" fill="rgba(76,29,149,0.42)" stroke="#a78bfa" stroke-width="1.4"/>
  <text x="75" y="408" class="name">DATASETS</text>
  <text x="75" y="428" class="muted">tiny files → huge assets</text>
  <ellipse cx="213" cy="404" rx="13" ry="5" fill="none" stroke="#c4b5fd" stroke-width="1.4"/>
  <path d="M200 404 v18 c0 3 6 5 13 5 s13-2 13-5 v-18" fill="none" stroke="#c4b5fd" stroke-width="1.4"/>
  <path d="M200 413 c0 3 6 5 13 5 s13-2 13-5" fill="none" stroke="#c4b5fd" stroke-width="1"/>

  <text x="145" y="490" class="muted" text-anchor="middle">one working tree</text>
  <text x="145" y="507" class="label" text-anchor="middle">small + large files together</text>

  <rect x="310" y="245" width="205" height="175" rx="10" fill="#0f172a"/>
  <rect x="310" y="245" width="205" height="175" rx="10" fill="rgba(8,51,68,0.38)" stroke="#22d3ee" stroke-width="1.7"/>
  <rect x="331" y="268" width="50" height="50" rx="10" fill="#22d3ee" fill-opacity="0.13" stroke="#22d3ee"/>
  <g transform="translate(329,266) scale(0.135)">
    <path d="M260.766 83.26c-10.641 1.138-15.122 7.689-11.634 17.01 1.272 3.4 4.097 7.227 10.653 14.432 17.026 18.712 24.794 39.036 14.923 39.045-2.383.002-3.641-.831-12.507-8.278-8.04-6.754-10.797-8.176-15.347-7.918-9.369.531-12.486 12.163-6.991 26.085 3.125 7.917 9.057 16.641 20.986 30.861 11.007 13.122 12.604 19.983 6.708 28.812-3.742 5.604-7.219 6.283-14.161 2.766-32.08-16.256-72.16-16.578-104.752-.842-4.992 2.41-6.846 3.157-7.838 3.156-7.458-.001-13.125-11.163-10.307-20.301 1.282-4.158 2.438-5.903 9.378-14.165 17.285-20.574 23.216-31.498 23.201-42.727-.012-8.826-3.6-13.554-10.287-13.556-4.591-.001-6.641 1.083-14.535 7.685-10.815 9.044-12.805 9.977-15.675 7.347-5.078-4.653 3.437-22.012 19.501-39.753 8.296-9.163 11.025-14.596 10.073-20.058-2.756-15.83-33.537-11.6-55.983 7.692-47.991 41.248-39.988 117.855 15.243 145.903 2.91 1.478 3.683 4.379 1.695 6.367-1.279 1.279-1.816 1.325-5.411.46-9.45-2.273-13.905-3.203-15.345-3.203-8.627 0-12.606 10.847-6.16 16.789 2.169 1.999 3.142 2.214 16.502 3.639 6.747.72 12.49 1.429 12.763 1.575 1.836.983 2.406 3.365 1.224 5.11-.752 1.108-.824 1.134-9.884 3.523-10.164 2.679-11.529 3.281-13.25 5.84-4.373 6.503-.228 14.727 7.408 14.698 2.497-.01 2.776-.097 13.014-4.061 12.763-4.942 13.376-4.999 16.142-1.5 2.325 2.941 2.01 3.313-6.328 7.486-4.694 2.349-6.887 3.625-7.521 4.375-5.118 6.056-1.073 15.253 6.709 15.253 2.692 0 4.074-.627 12.511-5.679 10.815-6.476 10.836-6.48 16.598-3.04 32.58 19.447 65.808 19.263 96.881-.537 4.529-2.886 5.171-2.741 15.56 3.508 8.711 5.239 9.814 5.743 12.578 5.746 8.133.009 12.157-10.063 6.27-15.692-.796-.762-3.454-2.262-7.5-4.233-6.56-3.195-6.8-3.352-7.116-4.636-.234-.951 1.794-3.635 3.434-4.544 1.867-1.035 2.935-.765 14.364 3.626 10.75 4.13 10.917 4.182 12.998 4.033 7.977-.57 11.551-10.332 5.864-16.018-1.902-1.903-1.927-1.912-14.141-5.131-8.287-2.184-9.358-2.96-8.341-6.042.698-2.116.905-2.169 14.22-3.623 13.216-1.444 14.372-1.697 16.561-3.624 6.548-5.763 2.611-16.841-5.985-16.841-.862 0-4.964.797-9.114 1.772-10.531 2.473-10.761 2.484-11.997.599-1.484-2.266-.382-4.558 3.097-6.438 36.478-19.712 53.587-59.017 43.317-99.513-8.212-32.386-37.25-60.525-65.089-63.076-4.135-.379-4.982-.398-7.177-.164m-89.634 105.685c-12.692 4.214-10.218 22.307 3.053 22.329 9.954.017 15.044-12.186 8.052-19.305-2.749-2.798-7.713-4.15-11.105-3.024m51.538.199c-12.145 4.502-9.079 22.055 3.86 22.096 12.013.039 15.457-16.664 4.473-21.692-2.475-1.134-5.916-1.3-8.333-.404" fill="#f8fafc" fill-rule="evenodd"/>
  </g>
  <text x="395" y="286" class="eyebrow" fill="#22d3ee">VERSION CONTROL</text>
  <text x="395" y="308" class="name">Crab CLI</text>
  <line x1="331" y1="337" x2="494" y2="337" stroke="#164e63"/>
  <text x="331" y="359" class="label">git push • clone • fetch</text>
  <text x="331" y="379" class="label">chunk • dedupe • verify</text>
  <text x="331" y="401" class="muted">no Crab data server in this path</text>

  <rect x="590" y="194" width="260" height="306" rx="10" fill="#0f172a"/>
  <rect x="590" y="194" width="260" height="306" rx="10" fill="rgba(120,53,15,0.22)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="720" y="221" class="eyebrow" fill="#fbbf24" text-anchor="middle">DURABLE ORIGIN</text>

  <g transform="translate(640,245)">
    <rect x="0" y="10" width="160" height="70" fill="#0f172a"/>
    <ellipse cx="80" cy="10" rx="80" ry="15" fill="#0f172a"/>
    <ellipse cx="80" cy="80" rx="80" ry="15" fill="#0f172a"/>
    <rect x="0" y="10" width="160" height="70" fill="url(#bucketFill)"/>
    <ellipse cx="80" cy="10" rx="80" ry="15" fill="rgba(120,53,15,0.5)" stroke="#fbbf24" stroke-width="1.6"/>
    <ellipse cx="80" cy="80" rx="80" ry="15" fill="rgba(120,53,15,0.32)" stroke="#fbbf24" stroke-width="1.6"/>
    <line x1="0" y1="10" x2="0" y2="80" stroke="#fbbf24" stroke-width="1.6"/>
    <line x1="160" y1="10" x2="160" y2="80" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="80" y="50" class="name" text-anchor="middle">Crab repository</text>
  </g>
  <text x="720" y="354" class="muted" text-anchor="middle">object-store bucket</text>

  <rect x="612" y="365" width="216" height="33" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="720" y="386" class="label" text-anchor="middle">Git objects + refs + commits</text>
  <rect x="612" y="408" width="216" height="33" rx="6" fill="#1e293b" stroke="#475569"/>
  <text x="720" y="429" class="label" text-anchor="middle">Xet chunks + LFS content</text>
  <text x="720" y="470" class="muted" text-anchor="middle">S3 • GCS • Azure • S3-compatible</text>

  <rect x="905" y="245" width="155" height="175" rx="10" fill="#0f172a"/>
  <rect x="905" y="245" width="155" height="175" rx="10" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.7"/>
  <circle cx="982" cy="286" r="22" fill="#a78bfa" fill-opacity="0.13" stroke="#a78bfa"/>
  <path d="M967 286 h30 M976 277 l-9 9 9 9 M988 277 l9 9-9 9" fill="none" stroke="#c4b5fd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="982" y="332" class="name" text-anchor="middle">Crab S3 Gateway</text>
  <text x="982" y="354" class="label" text-anchor="middle">S3 protocol projection</text>
  <line x1="925" y1="371" x2="1040" y2="371" stroke="#4c1d95"/>
  <text x="982" y="391" class="muted" text-anchor="middle">SigV4 • ranges • multipart</text>

  <rect x="1095" y="200" width="135" height="70" rx="8" fill="#0f172a"/>
  <rect x="1095" y="200" width="135" height="70" rx="8" fill="rgba(76,29,149,0.38)" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="1162" y="228" class="name" text-anchor="middle">ML service</text>
  <text x="1162" y="248" class="muted" text-anchor="middle">load model via S3</text>

  <rect x="1095" y="290" width="135" height="70" rx="8" fill="#0f172a"/>
  <rect x="1095" y="290" width="135" height="70" rx="8" fill="rgba(76,29,149,0.38)" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="1162" y="318" class="name" text-anchor="middle">Data pipeline</text>
  <text x="1162" y="338" class="muted" text-anchor="middle">GET • PUT • LIST</text>

  <rect x="1095" y="380" width="135" height="70" rx="8" fill="#0f172a"/>
  <rect x="1095" y="380" width="135" height="70" rx="8" fill="rgba(76,29,149,0.38)" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="1162" y="408" class="name" text-anchor="middle">S3 tooling</text>
  <text x="1162" y="428" class="muted" text-anchor="middle">SDK • CLI • filesystem</text>
  <text x="1162" y="490" class="muted" text-anchor="middle">configure endpoint + credentials</text>
  <text x="1162" y="507" class="label" text-anchor="middle">no application rewrite</text>

  <rect x="50" y="575" width="1180" height="92" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1.2"/>
  <circle cx="88" cy="621" r="17" fill="#34d399" fill-opacity="0.14" stroke="#34d399" filter="url(#glow)"/>
  <path d="M80 621 l6 6 11-14" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="122" y="612" class="name">THE SAME DURABLE REPOSITORY</text>
  <text x="122" y="635" class="label">Git remains the version model. S3 becomes the application interface.</text>
  <rect x="858" y="596" width="340" height="47" rx="7" fill="#111c2e" stroke="#475569"/>
  <text x="878" y="615" class="tiny">S3 KEY</text>
  <text x="878" y="633" class="label">s3://my-repository/main/data/model.bin</text>
</svg>
