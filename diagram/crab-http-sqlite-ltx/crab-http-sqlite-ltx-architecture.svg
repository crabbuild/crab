<svg viewBox="0 0 1600 1900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
    <style>
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
      .title { fill: #f8fafc; font-size: 24px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 12px; }
      .panel-title { fill: #e2e8f0; font-size: 17px; font-weight: 700; }
      .name { fill: #f8fafc; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .desc { fill: #94a3b8; font-size: 9px; text-anchor: middle; }
      .region { fill: #fbbf24; font-size: 10px; font-weight: 600; }
      .label { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
      .small { fill: #94a3b8; font-size: 8px; }
      .step { fill: #60a5fa; font-size: 8px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="1900" fill="#0f172a"/>
  <rect width="1600" height="1900" fill="url(#grid)"/>

  <text x="40" y="42" class="title">Crab HTTP Server：SQLite + LTX 下一代存储架构</text>
  <text x="40" y="66" class="subtitle">每仓库一个 SQLite；LTX 是复制格式；对象存储是权威；CAS owner + epoch 防止双写</text>

  <text x="40" y="110" class="panel-title">一、组件与数据边界</text>

  <rect x="30" y="135" width="205" height="660" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="155" class="region" fill="#22d3ee">客户端</text>

  <rect x="55" y="190" width="155" height="70" rx="7" fill="#0f172a"/>
  <rect x="55" y="190" width="155" height="70" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="132" y="220" class="name">Repository UI</text>
  <text x="132" y="240" class="desc">Issues / PR / Releases</text>

  <rect x="55" y="335" width="155" height="70" rx="7" fill="#0f172a"/>
  <rect x="55" y="335" width="155" height="70" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="132" y="365" class="name">Git Client</text>
  <text x="132" y="385" class="desc">clone / fetch / push</text>

  <rect x="55" y="480" width="155" height="70" rx="7" fill="#0f172a"/>
  <rect x="55" y="480" width="155" height="70" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="132" y="510" class="name">API / CI</text>
  <text x="132" y="530" class="desc">Status / Check Run</text>

  <rect x="270" y="135" width="920" height="660" rx="12" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="284" y="155" class="region" fill="#34d399">crab-http-server 集群</text>

  <path d="M 210 225 L 300 225" fill="none" stroke="#22d3ee" stroke-width="1.7" marker-end="url(#arrow-cyan)"/>
