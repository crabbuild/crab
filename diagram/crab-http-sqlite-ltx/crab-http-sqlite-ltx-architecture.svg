  <rect x="300" y="180" width="190" height="90" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="395" y="211" class="name">HTTP Router + Auth</text>
  <text x="395" y="231" class="desc">鉴权 / CSRF / 30s deadline</text>
  <text x="395" y="248" class="desc">按 Repository UUID 路由</text>

  <rect x="300" y="325" width="190" height="90" rx="7" fill="#0f172a"/>
  <rect x="300" y="325" width="190" height="90" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="395" y="356" class="name">Git Data Plane</text>
  <text x="395" y="376" class="desc">crab-remote-git / receive</text>
  <text x="395" y="393" class="desc">ref lease / GC fence / journal</text>

  <rect x="300" y="470" width="190" height="90" rx="7" fill="#0f172a"/>
  <rect x="300" y="470" width="190" height="90" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="395" y="501" class="name">AppCell Router</text>
  <text x="395" y="521" class="desc">本机 owner：执行</text>
  <text x="395" y="538" class="desc">远端 owner：私网代理</text>

  <path d="M 490 225 L 545 225 L 545 515 L 585 515" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#arrow-emerald)"/>
  <text x="540" y="461" class="small" text-anchor="end">应用请求</text>
  <path d="M 490 370 L 1110 370" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#arrow-emerald)"/>
  <text x="790" y="359" class="label">Git 对象与 ref 继续走原路径</text>

  <rect x="585" y="180" width="250" height="125" rx="8" fill="#0f172a"/>
  <rect x="585" y="180" width="250" height="125" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.7"/>
  <text x="710" y="210" class="name">AppCellManager</text>
  <text x="710" y="232" class="desc">key = CatalogRecord.id (UUIDv7)</text>
  <text x="710" y="250" class="desc">activate / route / idle-close / shutdown</text>
  <text x="710" y="268" class="desc">owner session + fencing epoch</text>
  <text x="710" y="286" class="desc">限制活跃 cell 数与恢复并发</text>

  <rect x="585" y="455" width="250" height="125" rx="8" fill="#0f172a"/>
  <rect x="585" y="455" width="250" height="125" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.7"/>
  <text x="710" y="485" class="name">Repository AppCell</text>
  <text x="710" y="507" class="desc">单写 actor / 有界队列</text>
  <text x="710" y="525" class="desc">SQLite transaction + idempotency</text>
  <text x="710" y="543" class="desc">LTX durability gate</text>
  <text x="710" y="561" class="desc">失去 owner 后立即拒绝响应</text>

  <path d="M 710 305 L 710 455" fill="none" stroke="#60a5fa" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="742" y="385" class="small">激活 / 接管</text>
  <path d="M 585 515 L 535 515 L 535 243 L 585 243" fill="none" stroke="#60a5fa" stroke-width="1.4" marker-end="url(#arrow)"/>

  <g transform="translate(920,190)">
    <rect x="0" y="10" width="210" height="80" rx="2" fill="#0f172a"/>
    <ellipse cx="105" cy="10" rx="105" ry="14" fill="#0f172a"/>
    <ellipse cx="105" cy="90" rx="105" ry="14" fill="#0f172a"/>
    <rect x="0" y="10" width="210" height="80" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="105" cy="10" rx="105" ry="14" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="105" cy="90" rx="105" ry="14" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="90" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="210" y1="10" x2="210" y2="90" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="105" y="43" class="name">repo-&lt;uuid&gt;.sqlite</text>
    <text x="105" y="63" class="desc">本地、可丢弃、WAL 模式</text>
    <text x="105" y="80" class="desc">应用连接只由 cell actor 使用</text>
  </g>

  <rect x="920" y="455" width="210" height="125" rx="8" fill="#0f172a"/>
  <rect x="920" y="455" width="210" height="125" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.7"/>
  <text x="1025" y="485" class="name">crab-ltx</text>
  <text x="1025" y="507" class="desc">WAL capture：Db::sync</text>
  <text x="1025" y="525" class="desc">LTX upload：Replica::sync</text>
  <text x="1025" y="543" class="desc">restore / snapshot / compaction</text>
  <text x="1025" y="561" class="desc">CrabReplicaClient → Store</text>

  <path d="M 835 515 L 920 515" fill="none" stroke="#a78bfa" stroke-width="1.7" marker-end="url(#arrow)"/>
  <path d="M 835 490 L 880 490 L 880 245 L 920 245" fill="none" stroke="#a78bfa" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="880" y="310" class="small" text-anchor="middle">SQL</text>
  <path d="M 1025 294 L 1025 455" fill="none" stroke="#a78bfa" stroke-width="1.7" marker-end="url(#arrow)"/>
  <text x="1043" y="382" class="small">WAL</text>

  <rect x="1215" y="135" width="355" height="660" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="10,5"/>
  <text x="1229" y="155" class="region">对象存储（唯一权威）</text>

  <rect x="1245" y="180" width="295" height="80" rx="7" fill="#0f172a"/>
  <rect x="1245" y="180" width="295" height="80" rx="7" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="1392" y="210" class="name">Owner / Node Lease</text>
  <text x="1392" y="230" class="desc">CAS + session + epoch + expires_at</text>
  <text x="1392" y="247" class="desc">防双写与自我 fencing</text>

  <rect x="1245" y="315" width="295" height="95" rx="7" fill="#0f172a"/>
  <rect x="1245" y="315" width="295" height="95" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1392" y="345" class="name">Epoch LTX Objects</text>
  <text x="1392" y="366" class="desc">app-sqlite/v1/epochs/e42/ltx/...</text>
  <text x="1392" y="384" class="desc">immutable segment / snapshot / retention</text>
  <text x="1392" y="401" class="desc">恢复 SQLite 的唯一应用数据来源</text>

  <rect x="1245" y="465" width="295" height="95" rx="7" fill="#0f172a"/>
  <rect x="1245" y="465" width="295" height="95" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1392" y="495" class="name">Git Authority</text>
  <text x="1392" y="516" class="desc">objects / refs / manifests / journals</text>
  <text x="1392" y="534" class="desc">仍由 Crab 原有协议管理</text>
  <text x="1392" y="551" class="desc">绝不放入 SQLite</text>

  <rect x="1245" y="615" width="295" height="95" rx="7" fill="#0f172a"/>
  <rect x="1245" y="615" width="295" height="95" rx="7" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="1392" y="645" class="name">Catalog / Auth / Blobs</text>
  <text x="1392" y="666" class="desc">catalog、session、LFS、release assets</text>
  <text x="1392" y="684" class="desc">继续直接使用 crab_storage::Store</text>
  <text x="1392" y="701" class="desc">不经过 SQLite / LTX</text>

  <path d="M 1130 515 L 1180 515 L 1180 362 L 1245 362" fill="none" stroke="#fbbf24" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="1182" y="430" class="small">PUT LTX</text>
  <path d="M 835 215 L 1180 215 L 1180 220 L 1245 220" fill="none" stroke="#fb7185" stroke-width="1.7" marker-end="url(#arrow-rose)"/>
  <text x="1040" y="204" class="label">CAS owner / 每次响应前重读</text>
  <path d="M 1110 370 L 1185 370 L 1185 512 L 1245 512" fill="none" stroke="#34d399" stroke-width="1.7" marker-end="url(#arrow-emerald)"/>

  <rect x="300" y="645" width="830" height="110" rx="8" fill="#0f172a"/>
  <rect x="300" y="645" width="830" height="110" rx="8" fill="rgba(120,53,15,0.18)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="320" y="674" fill="#fbbf24" font-size="11" font-weight="600">核心边界</text>
  <text x="320" y="698" fill="#cbd5e1" font-size="10">SQLite = 查询与本地事务；LTX = SQLite 页级复制日志；对象存储 = durable authority；CAS owner = 单写资格。</text>
  <text x="320" y="721" fill="#cbd5e1" font-size="10">“只用 LTX”应理解为：不运行 Litestream sidecar、不引入 Celld runtime；但不能去掉 SQLite、对象存储和 fencing。</text>
  <text x="320" y="744" fill="#cbd5e1" font-size="10">第一版使用 bucket durability：每次 mutation 必须等 LTX 上传并确认 owner 后才返回 2xx。</text>

  <line x1="40" y1="835" x2="1560" y2="835" stroke="#334155" stroke-width="1"/>
  <text x="40" y="880" class="panel-title">二、一次应用写入的 RPO=0 时序</text>

  <!-- Sequence actors -->
  <rect x="45" y="915" width="170" height="50" rx="6" fill="#0f172a"/>
  <rect x="45" y="915" width="170" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="946" class="name">Browser / API</text>

  <rect x="295" y="915" width="190" height="50" rx="6" fill="#0f172a"/>
  <rect x="295" y="915" width="190" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="390" y="946" class="name">接入节点</text>

  <rect x="570" y="915" width="190" height="50" rx="6" fill="#0f172a"/>
  <rect x="570" y="915" width="190" height="50" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="665" y="946" class="name">Owner AppCell</text>

  <rect x="845" y="915" width="190" height="50" rx="6" fill="#0f172a"/>
  <rect x="845" y="915" width="190" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="940" y="946" class="name">SQLite + WAL</text>

  <rect x="1120" y="915" width="190" height="50" rx="6" fill="#0f172a"/>
  <rect x="1120" y="915" width="190" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1215" y="946" class="name">crab-ltx</text>

  <rect x="1385" y="915" width="170" height="50" rx="6" fill="#0f172a"/>
  <rect x="1385" y="915" width="170" height="50" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="1470" y="946" class="name">Object Store</text>

  <line x1="130" y1="965" x2="130" y2="1740" stroke="#334155" stroke-dasharray="6,4"/>
  <line x1="390" y1="965" x2="390" y2="1740" stroke="#334155" stroke-dasharray="6,4"/>
  <line x1="665" y1="965" x2="665" y2="1740" stroke="#334155" stroke-dasharray="6,4"/>
  <line x1="940" y1="965" x2="940" y2="1740" stroke="#334155" stroke-dasharray="6,4"/>
  <line x1="1215" y1="965" x2="1215" y2="1740" stroke="#334155" stroke-dasharray="6,4"/>
  <line x1="1470" y1="965" x2="1470" y2="1740" stroke="#334155" stroke-dasharray="6,4"/>

  <rect x="660" y="1050" width="10" height="595" rx="2" fill="rgba(59,130,246,0.55)" stroke="#60a5fa"/>
  <rect x="935" y="1160" width="10" height="180" rx="2" fill="rgba(76,29,149,0.6)" stroke="#a78bfa"/>
  <rect x="1210" y="1360" width="10" height="120" rx="2" fill="rgba(76,29,149,0.6)" stroke="#a78bfa"/>

  <line x1="130" y1="1015" x2="390" y2="1015" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <circle cx="150" cy="1015" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="150" y="1018" class="step">1</text>
  <text x="260" y="1004" class="label">POST issue(request_id, expected_version)</text>

  <line x1="390" y1="1065" x2="1470" y2="1065" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrow-rose)"/>
  <circle cx="415" cy="1065" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="415" y="1068" class="step">2</text>
  <text x="920" y="1054" class="label">读取 owner.json：定位 repository UUID 当前 owner + epoch</text>

  <line x1="390" y1="1115" x2="665" y2="1115" stroke="#34d399" stroke-width="1.6" marker-end="url(#arrow-emerald)"/>
  <circle cx="415" cy="1115" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="415" y="1118" class="step">3</text>
  <text x="525" y="1104" class="label">本地调用或认证私网代理</text>

  <line x1="665" y1="1175" x2="940" y2="1175" stroke="#60a5fa" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="690" cy="1175" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="690" y="1178" class="step">4</text>
  <text x="802" y="1164" class="label">BEGIN IMMEDIATE；检查 request_id</text>

  <path d="M 940 1220 L 1015 1220 L 1015 1260 L 940 1260" fill="none" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="965" cy="1220" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="965" y="1223" class="step">5</text>
  <text x="1030" y="1244" class="small">同一事务：counter + reservation + row + outbox</text>

  <line x1="940" y1="1315" x2="665" y2="1315" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <circle cx="915" cy="1315" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="915" y="1318" class="step">6</text>
  <text x="802" y="1304" class="label">COMMIT；得到 local generation</text>

  <line x1="665" y1="1375" x2="1215" y2="1375" stroke="#a78bfa" stroke-width="1.6" marker-end="url(#arrow)"/>
  <circle cx="690" cy="1375" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="690" y="1378" class="step">7</text>
  <text x="940" y="1364" class="label">Db::sync()：WAL → L0 LTX；Replica::sync()</text>

  <line x1="1215" y1="1425" x2="1470" y2="1425" stroke="#fbbf24" stroke-width="1.7" marker-end="url(#arrow-amber)"/>
  <circle cx="1240" cy="1425" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="1240" y="1428" class="step">8</text>
  <text x="1342" y="1414" class="label">上传覆盖该事务的 LTX segment</text>

  <line x1="1470" y1="1475" x2="665" y2="1475" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <circle cx="1445" cy="1475" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="1445" y="1478" class="step">9</text>
  <text x="1060" y="1464" class="label">durable position 已覆盖 local generation</text>

  <line x1="665" y1="1535" x2="1470" y2="1535" stroke="#fb7185" stroke-width="1.6" marker-end="url(#arrow-rose)"/>
  <circle cx="690" cy="1535" r="9" fill="rgba(59,130,246,0.3)" stroke="#60a5fa"/><text x="690" y="1538" class="step">10</text>
  <text x="1065" y="1524" class="label">重新读取 owner.json；必须仍为同一 session + epoch</text>

  <rect x="550" y="1570" width="940" height="72" rx="6" fill="none" stroke="#64748b" stroke-dasharray="4,3"/>
  <rect x="550" y="1570" width="55" height="19" rx="4" fill="rgba(30,41,59,0.8)" stroke="#64748b"/>
  <text x="577" y="1583" class="small" text-anchor="middle" font-weight="600">alt</text>
  <text x="620" y="1584" class="small">owner 匹配：允许响应；owner 改变/读取失败：不返回成功，客户端以同一 request_id 重试</text>
  <line x1="665" y1="1615" x2="390" y2="1615" stroke="#60a5fa" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="525" y="1604" class="label">200/201 + committed result</text>

  <line x1="390" y1="1675" x2="130" y2="1675" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <text x="260" y="1664" class="label">仅返回已持久化、仍由当前 epoch 拥有的结果</text>

  <rect x="45" y="1770" width="1510" height="90" rx="8" fill="#0f172a"/>
  <rect x="45" y="1770" width="1510" height="90" rx="8" fill="rgba(136,19,55,0.18)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="65" y="1798" fill="#fb7185" font-size="11" font-weight="600">跨域事务例外：PR merge / release tag</text>
  <text x="65" y="1822" fill="#cbd5e1" font-size="10">SQLite 不能与 Git ref 原子提交。必须采用 durable outbox：SQLite 写 pending → LTX 持久化 → 原 Git ref lease/journal 发布 → SQLite 写 completed → LTX 持久化。</text>
  <text x="65" y="1846" fill="#cbd5e1" font-size="10">接管时先恢复 SQLite，再扫描 pending，并依据实际 ref OID 幂等完成或回滚；现有 merge_pending 语义应被保留和收敛，而不是删除。</text>

  <text x="45" y="1885" class="small">颜色：青=客户端　绿=服务/Git　蓝=owner/cell　紫=SQLite/LTX　黄=对象存储　红=协调与 fencing</text>
</svg>
