<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1500">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
    .title { fill: #f8fafc; font-size: 18px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 10px; font-weight: 400; }
    .phase-label { fill: #fbbf24; font-size: 10px; font-weight: 600; letter-spacing: 0; }
    .box-title { fill: #f8fafc; font-size: 12px; font-weight: 700; }
    .box-sub { fill: #cbd5e1; font-size: 9px; font-weight: 400; }
    .tiny { fill: #94a3b8; font-size: 8px; font-weight: 400; }
    .arrow-label { fill: #cbd5e1; font-size: 8px; font-weight: 500; }
    .yes { fill: #34d399; font-size: 8px; font-weight: 600; }
    .no { fill: #fb7185; font-size: 8px; font-weight: 600; }
    .region { fill: none; stroke: #334155; stroke-width: 1; stroke-dasharray: 8 5; }
    .lane { fill: rgba(15, 23, 42, 0.55); stroke: #334155; stroke-width: 1; stroke-dasharray: 8 5; }
    .line { fill: none; stroke: #64748b; stroke-width: 1.6; marker-end: url(#arrow); }
    .line-blue { fill: none; stroke: #60a5fa; stroke-width: 2; marker-end: url(#arrow-blue); }
    .line-green { fill: none; stroke: #34d399; stroke-width: 1.8; marker-end: url(#arrow-green); }
    .line-orange { fill: none; stroke: #fb923c; stroke-width: 1.7; marker-end: url(#arrow-orange); }
    .line-rose { fill: none; stroke: #fb7185; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow-rose); }
    .line-soft { fill: none; stroke: #475569; stroke-width: 1.4; marker-end: url(#arrow-soft); }
    .mask { fill: #0f172a; }
    .primary { fill: rgba(8, 51, 68, 0.45); stroke: #22d3ee; stroke-width: 1.5; }
    .secondary { fill: rgba(6, 78, 59, 0.45); stroke: #34d399; stroke-width: 1.5; }
    .tertiary { fill: rgba(76, 29, 149, 0.45); stroke: #a78bfa; stroke-width: 1.5; }
    .accent { fill: rgba(120, 53, 15, 0.35); stroke: #fbbf24; stroke-width: 1.5; }
    .alert { fill: rgba(136, 19, 55, 0.42); stroke: #fb7185; stroke-width: 1.5; }
    .connector { fill: rgba(251, 146, 60, 0.35); stroke: #fb923c; stroke-width: 1.5; }
    .neutral { fill: rgba(30, 41, 59, 0.6); stroke: #94a3b8; stroke-width: 1.5; }
    .highlight { fill: rgba(59, 130, 246, 0.34); stroke: #60a5fa; stroke-width: 1.5; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb923c"/>
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1280" height="1500" fill="#0f172a"/>
  <rect width="1280" height="1500" fill="url(#grid)"/>

  <text x="40" y="42" class="title">Crab add pipeline</text>
  <text x="40" y="62" class="subtitle">Native parallel staging: discover tracked files, stream chunks locally, prepare push plans, then publish pointer blobs to Git's index.</text>
  <text x="40" y="80" class="subtitle">Key invariant: working tree bytes stay visible; committed Git content is the small Crab pointer.</text>

  <rect x="34" y="116" width="1212" height="1250" rx="16" class="region"/>
  <text x="50" y="138" class="phase-label">run_add orchestration in crab/src/cmd/add.rs</text>

  <rect x="84" y="170" width="1030" height="210" rx="12" class="lane"/>
  <text x="104" y="194" class="phase-label">1. Discover candidates</text>
  <rect x="84" y="416" width="1030" height="410" rx="12" class="lane"/>
  <text x="104" y="440" class="phase-label">2. Stream each file with bounded parallelism (--jobs)</text>
  <rect x="84" y="862" width="1030" height="196" rx="12" class="lane"/>
  <text x="104" y="886" class="phase-label">3. Prepare add-time push plans</text>
  <rect x="84" y="1094" width="1030" height="190" rx="12" class="lane"/>
  <text x="104" y="1118" class="phase-label">4. Flush staging, then publish Git index entries</text>

  <!-- Discovery side components -->
  <path d="M 344 218 L 418 218" class="line-blue"/>
  <path d="M 600 218 L 674 218" class="line-blue"/>
  <path d="M 856 218 L 930 218" class="line-blue"/>
  <path d="M 1015 248 L 1015 300 L 856 300" class="line"/>
  <path d="M 770 330 L 770 430" class="line-blue"/>
  <path d="M 684 300 L 522 300" class="line-rose"/>
  <path d="M 254 248 L 254 274" class="line-soft"/>

  <!-- Stream/stage path -->
  <path d="M 770 500 L 770 562" class="line-blue"/>
  <path d="M 770 642 L 770 700" class="line-blue"/>
  <path d="M 770 780 L 770 872" class="line-blue"/>
  <path d="M 640 602 L 392 602" class="line-green"/>
  <path d="M 392 602 L 392 742 L 681 742" class="line-green"/>
  <path d="M 862 742 L 970 742 L 970 605 L 1040 605" class="line-rose"/>

  <!-- Plan path -->
  <path d="M 900 940 L 1030 940" class="line-orange"/>
  <path d="M 770 1012 L 770 1104" class="line-blue"/>
  <path d="M 640 940 L 342 940" class="line-green"/>
  <path d="M 342 940 L 260 940 L 260 1006 L 640 1006" class="line-green"/>

  <!-- Flush/publish path -->
  <path d="M 770 1174 L 770 1226" class="line-blue"/>
  <path d="M 770 1286 L 770 1342" class="line-blue"/>
  <path d="M 866 1256 L 1034 1256" class="line-orange"/>
  <path d="M 674 1256 L 516 1256" class="line-rose"/>

  <!-- Masks and boxes: discovery -->
  <rect x="164" y="188" width="180" height="60" rx="25" class="mask"/>
  <rect x="164" y="188" width="180" height="60" rx="25" class="highlight"/>
  <text x="254" y="213" class="box-title" text-anchor="middle">User command</text>
  <text x="254" y="230" class="box-sub" text-anchor="middle">crab add patterns</text>

  <rect x="418" y="188" width="182" height="60" rx="6" class="mask"/>
  <rect x="418" y="188" width="182" height="60" rx="6" class="primary"/>
  <text x="509" y="213" class="box-title" text-anchor="middle">Resolve worktree</text>
  <text x="509" y="230" class="box-sub" text-anchor="middle">root, index, shared staging</text>

  <rect x="674" y="188" width="182" height="60" rx="6" class="mask"/>
  <rect x="674" y="188" width="182" height="60" rx="6" class="primary"/>
  <text x="765" y="213" class="box-title" text-anchor="middle">Open classifier</text>
  <text x="765" y="230" class="box-sub" text-anchor="middle">filter=crab attributes</text>

  <rect x="930" y="188" width="170" height="60" rx="6" class="mask"/>
  <rect x="930" y="188" width="170" height="60" rx="6" class="secondary"/>
  <text x="1015" y="213" class="box-title" text-anchor="middle">Build path filter</text>
  <text x="1015" y="230" class="box-sub" text-anchor="middle">git pathspec rules</text>

  <g transform="translate(770,300)">
    <polygon points="0,-40 86,0 0,40 -86,0" class="mask"/>
    <polygon points="0,-40 86,0 0,40 -86,0" class="accent"/>
    <text x="0" y="-5" class="box-title" text-anchor="middle">Walk tree</text>
    <text x="0" y="12" class="box-sub" text-anchor="middle">tracked + matched?</text>
  </g>
  <text x="982" y="286" class="arrow-label">filter</text>
  <text x="784" y="372" class="yes">Yes</text>
  <text x="608" y="292" class="no">No</text>

  <rect x="342" y="270" width="180" height="60" rx="6" class="mask"/>
  <rect x="342" y="270" width="180" height="60" rx="6" class="alert"/>
  <text x="432" y="295" class="box-title" text-anchor="middle">No candidates</text>
  <text x="432" y="312" class="box-sub" text-anchor="middle">diagnose / auto-track / exit</text>

  <rect x="684" y="398" width="172" height="62" rx="6" class="mask"/>
  <rect x="684" y="398" width="172" height="62" rx="6" class="secondary"/>
  <text x="770" y="423" class="box-title" text-anchor="middle">Skip clean indexed</text>
  <text x="770" y="440" class="box-sub" text-anchor="middle">pointer + stat already match</text>

  <rect x="126" y="274" width="188" height="52" rx="6" class="mask"/>
  <rect x="126" y="274" width="188" height="52" rx="6" class="neutral"/>
  <text x="220" y="296" class="box-title" text-anchor="middle">Dry run?</text>
  <text x="220" y="312" class="box-sub" text-anchor="middle">print matches, no writes</text>

  <!-- Masks and boxes: streaming/staging -->
  <rect x="640" y="470" width="260" height="70" rx="6" class="mask"/>
  <rect x="640" y="470" width="260" height="70" rx="6" class="primary"/>
  <text x="770" y="496" class="box-title" text-anchor="middle">Spawn file tasks</text>
  <text x="770" y="513" class="box-sub" text-anchor="middle">tokio semaphore limits --jobs</text>

  <rect x="640" y="562" width="260" height="80" rx="6" class="mask"/>
  <rect x="640" y="562" width="260" height="80" rx="6" class="secondary"/>
  <text x="770" y="588" class="box-title" text-anchor="middle">stage_file_streaming</text>
  <text x="770" y="606" class="box-sub" text-anchor="middle">128 KiB reads feed Blake3 + CDC</text>
  <text x="770" y="622" class="box-sub" text-anchor="middle">working tree file is untouched</text>

  <rect x="126" y="552" width="266" height="96" rx="6" class="mask"/>
  <rect x="126" y="552" width="266" height="96" rx="6" class="tertiary"/>
  <text x="259" y="580" class="box-title" text-anchor="middle">StagingArea</text>
  <text x="259" y="599" class="box-sub" text-anchor="middle">.crab/staging/segments + SQLite</text>
  <text x="259" y="616" class="box-sub" text-anchor="middle">batch dedup, append new chunks</text>
  <text x="259" y="633" class="box-sub" text-anchor="middle">pending rows become durable on flush</text>

  <g transform="translate(770,742)">
    <polygon points="0,-40 92,0 0,40 -92,0" class="mask"/>
    <polygon points="0,-40 92,0 0,40 -92,0" class="accent"/>
    <text x="0" y="-5" class="box-title" text-anchor="middle">File stable?</text>
    <text x="0" y="12" class="box-sub" text-anchor="middle">stat before == after</text>
  </g>
  <text x="622" y="732" class="yes">Yes</text>
  <text x="928" y="732" class="no">No</text>

  <rect x="1040" y="562" width="146" height="86" rx="6" class="mask"/>
  <rect x="1040" y="562" width="146" height="86" rx="6" class="alert"/>
  <text x="1113" y="590" class="box-title" text-anchor="middle">Retire rows</text>
  <text x="1113" y="608" class="box-sub" text-anchor="middle">cleanup partial</text>
  <text x="1113" y="624" class="box-sub" text-anchor="middle">staging state</text>

  <rect x="630" y="792" width="278" height="60" rx="6" class="mask"/>
  <rect x="630" y="792" width="278" height="60" rx="6" class="secondary"/>
  <text x="769" y="817" class="box-title" text-anchor="middle">Adopt final file hash</text>
  <text x="769" y="834" class="box-sub" text-anchor="middle">provisional key -> Blake3 file hash</text>

  <!-- Planning -->
  <rect x="640" y="910" width="260" height="60" rx="6" class="mask"/>
  <rect x="640" y="910" width="260" height="60" rx="6" class="connector"/>
  <text x="770" y="935" class="box-title" text-anchor="middle">Prepare file push plans</text>
  <text x="770" y="952" class="box-sub" text-anchor="middle">verify staged chunk sequence</text>

  <rect x="112" y="900" width="230" height="80" rx="6" class="mask"/>
  <rect x="112" y="900" width="230" height="80" rx="6" class="secondary"/>
  <text x="227" y="928" class="box-title" text-anchor="middle">Local prepared xorbs</text>
  <text x="227" y="946" class="box-sub" text-anchor="middle">reuse cache when placements match</text>
  <text x="227" y="962" class="box-sub" text-anchor="middle">pack remaining chunks locally</text>

  <rect x="1030" y="900" width="166" height="80" rx="6" class="mask"/>
  <rect x="1030" y="900" width="166" height="80" rx="6" class="tertiary"/>
  <text x="1113" y="927" class="box-title" text-anchor="middle">Remote chunk index</text>
  <text x="1113" y="945" class="box-sub" text-anchor="middle">optional crab:// lookup</text>
  <text x="1113" y="961" class="box-sub" text-anchor="middle">3s timeout, no upload</text>

  <rect x="640" y="976" width="260" height="60" rx="6" class="mask"/>
  <rect x="640" y="976" width="260" height="60" rx="6" class="connector"/>
  <text x="770" y="1001" class="box-title" text-anchor="middle">Write push-plan files</text>
  <text x="770" y="1018" class="box-sub" text-anchor="middle">later crab push consumes them</text>

  <!-- Flush and index -->
  <rect x="640" y="1134" width="260" height="70" rx="6" class="mask"/>
  <rect x="640" y="1134" width="260" height="70" rx="6" class="tertiary"/>
  <text x="770" y="1161" class="box-title" text-anchor="middle">Flush and close staging</text>
  <text x="770" y="1179" class="box-sub" text-anchor="middle">fsync pending rows before Git index</text>

  <g transform="translate(770,1256)">
    <polygon points="0,-42 96,0 0,42 -96,0" class="mask"/>
    <polygon points="0,-42 96,0 0,42 -96,0" class="accent"/>
    <text x="0" y="-6" class="box-title" text-anchor="middle">Publish index?</text>
    <text x="0" y="12" class="box-sub" text-anchor="middle">not --skip-git-add</text>
  </g>
  <text x="914" y="1246" class="yes">Yes</text>
  <text x="624" y="1246" class="no">No</text>

  <rect x="1034" y="1216" width="170" height="80" rx="6" class="mask"/>
  <rect x="1034" y="1216" width="170" height="80" rx="6" class="primary"/>
  <text x="1119" y="1242" class="box-title" text-anchor="middle">Git ODB + index</text>
  <text x="1119" y="1260" class="box-sub" text-anchor="middle">gix write_blob</text>
  <text x="1119" y="1276" class="box-sub" text-anchor="middle">git update-index -z</text>

  <rect x="320" y="1218" width="196" height="76" rx="6" class="mask"/>
  <rect x="320" y="1218" width="196" height="76" rx="6" class="neutral"/>
  <text x="418" y="1245" class="box-title" text-anchor="middle">Staged only</text>
  <text x="418" y="1263" class="box-sub" text-anchor="middle">chunks + plans stay local</text>
  <text x="418" y="1279" class="box-sub" text-anchor="middle">manual Git add later</text>

  <rect x="640" y="1342" width="260" height="60" rx="25" class="mask"/>
  <rect x="640" y="1342" width="260" height="60" rx="25" class="highlight"/>
  <text x="770" y="1367" class="box-title" text-anchor="middle">Summary result</text>
  <text x="770" y="1384" class="box-sub" text-anchor="middle">text, JSON, or JSONL progress</text>

  <!-- Error/rollback rail -->
  <rect x="78" y="1186" width="210" height="118" rx="8" class="mask"/>
  <rect x="78" y="1186" width="210" height="118" rx="8" class="alert"/>
  <text x="183" y="1212" class="box-title" text-anchor="middle">Rollback rail</text>
  <text x="183" y="1232" class="box-sub" text-anchor="middle">before index mutation:</text>
  <text x="183" y="1248" class="box-sub" text-anchor="middle">retire unpublished rows</text>
  <text x="183" y="1264" class="box-sub" text-anchor="middle">sweep orphan segments</text>
  <text x="183" y="1280" class="box-sub" text-anchor="middle">report failure/cancel</text>

  <path d="M 770 1036 L 770 1064 L 560 1064 L 560 1198 L 288 1198" class="line-rose"/>
  <path d="M 640 1174 L 560 1174 L 560 1210 L 288 1210" class="line-rose"/>
  <text x="430" y="1190" class="no">failure before index: rollback</text>

  <!-- Legend -->
  <rect x="48" y="1406" width="1180" height="58" rx="10" fill="rgba(15,23,42,0.9)" stroke="#334155" stroke-width="1"/>
  <rect x="72" y="1424" width="14" height="14" rx="3" class="primary"/>
  <text x="94" y="1436" class="tiny">CLI / Git-facing work</text>
  <rect x="270" y="1424" width="14" height="14" rx="3" class="secondary"/>
  <text x="292" y="1436" class="tiny">streaming and local packing</text>
  <rect x="518" y="1424" width="14" height="14" rx="3" class="tertiary"/>
  <text x="540" y="1436" class="tiny">persistent staging / metadata</text>
  <rect x="778" y="1424" width="14" height="14" rx="3" class="accent"/>
  <text x="800" y="1436" class="tiny">decision point</text>
  <rect x="956" y="1424" width="14" height="14" rx="3" class="alert"/>
  <text x="978" y="1436" class="tiny">failure / cleanup path</text>
  <text x="72" y="1454" class="tiny">Source: crab/src/cmd/add.rs, crab/src/cmd/stream_stage.rs, crab/src/cmd/add_push_plan.rs, crates/crab-staging/src/lib.rs</text>
</svg>
