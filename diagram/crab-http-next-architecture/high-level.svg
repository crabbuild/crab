      text { font-family: 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace; }
      .title { fill: #f8fafc; font-size: 34px; font-weight: 700; letter-spacing: -1px; }
      .subtitle { fill: #94a3b8; font-size: 16px; }
      .eyebrow { fill: #22d3ee; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .region { fill: #fbbf24; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
      .name { fill: #f8fafc; font-size: 21px; font-weight: 600; }
