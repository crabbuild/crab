  <rect x="1030" y="831" width="331" height="24" rx="4" fill="#16152c"/>

  <text x="720" y="174" class="name" text-anchor="middle">Browser · Git · API clients</text>
  <text x="720" y="197" class="muted" text-anchor="middle">UI / clone / fetch / push / CI</text>
  <text x="720" y="277" class="name" text-anchor="middle">TLS edge + public Service</text>
  <text x="720" y="298" class="muted" text-anchor="middle">Requests can enter any healthy Pod</text>

  <text x="85" y="172" class="eyebrow">REPOSITORY OWNERSHIP</text>
  <text x="85" y="203" class="note-title">One UUID → one active writer</text>
  <text x="85" y="229" class="label">Each Pod owns many repositories.</text>
  <text x="85" y="253" class="label">Ownership can move between Pods.</text>
  <text x="1030" y="172" class="eyebrow">DISPOSABLE COMPUTE</text>
  <text x="1030" y="203" class="note-title">Local SQLite is recoverable</text>
  <text x="1030" y="229" class="label">Restore from the published</text>
  <text x="1030" y="253" class="label">LTX graph after Pod loss.</text>

  <text x="85" y="372" class="region">CRAB HTTP FLEET · KUBERNETES DEPLOYMENT</text>
  <text x="1355" y="372" class="muted" text-anchor="end">1 Pod for development · 3 recommended for production</text>
  <text x="720" y="414" class="name" text-anchor="middle">Authenticate + route by UUID</text>
  <text x="720" y="439" class="label" text-anchor="middle">Any entry Pod</text>
  <text x="720" y="459" class="muted" text-anchor="middle">Resolve the repository owner when needed</text>
  <text x="290" y="411" class="flow" text-anchor="middle">Owner lookup / routing hint</text>
  <text x="290" y="483" class="flow" text-anchor="middle">Collaboration: local or peer mTLS :8790</text>
  <text x="1135" y="492" class="flow" text-anchor="middle">Git operations: any Pod</text>

  <text x="420" y="563" class="name" text-anchor="middle">Repository owner · AppCell</text>
  <text x="255" y="614" class="name" text-anchor="middle">SQLite + WAL</text>
  <text x="255" y="641" class="muted" text-anchor="middle">One database per repository</text>
  <text x="570" y="614" class="name" text-anchor="middle">Embedded Rust LTX</text>
  <text x="570" y="641" class="muted" text-anchor="middle">Capture + publication gate</text>
  <text x="420" y="673" class="muted" text-anchor="middle">Issues · PRs · reviews · labels · checks · release metadata</text>
  <text x="420" y="711" class="label" text-anchor="middle">Owner may be a different Pod from the request entry.</text>

  <text x="850" y="589" class="muted" text-anchor="middle">Merge / tag intent</text>
  <text x="850" y="635" class="muted" text-anchor="middle">Durable outbox</text>
  <text x="1135" y="578" class="name" text-anchor="middle">Existing Git runtime</text>
  <text x="1135" y="606" class="label" text-anchor="middle">Read / receive / publication</text>
  <text x="1135" y="633" class="muted" text-anchor="middle">Canonical ref locks + GC fences</text>
  <text x="1135" y="711" class="label" text-anchor="middle">Git has its own commit boundary.</text>

  <text x="285" y="798" class="flow" text-anchor="middle">2 · Publish head with owner CAS</text>
  <text x="735" y="794" class="flow" text-anchor="middle">1 · Upload LTX + manifest</text>
  <text x="1135" y="794" class="flow" text-anchor="middle">Existing storage path</text>

  <text x="85" y="848" class="region" style="fill:#a78bfa">OBJECT STORAGE · DURABLE AUTHORITY</text>
  <text x="1355" y="848" class="muted" text-anchor="end">RustFS / qualified S3, GCS or Azure</text>
  <text x="275" y="899" class="name" text-anchor="middle">Owner + published head</text>
  <text x="275" y="925" class="label" text-anchor="middle">One conditional control record</text>
  <text x="275" y="950" class="muted" text-anchor="middle">Session · epoch · exact recovery root</text>
  <text x="710" y="899" class="name" text-anchor="middle">Immutable LTX + manifests</text>
  <text x="710" y="925" class="label" text-anchor="middle">Snapshots + committed page changes</text>
  <text x="710" y="950" class="muted" text-anchor="middle">Restore only the published graph</text>
  <text x="1135" y="899" class="name" text-anchor="middle">Git + large objects</text>
  <text x="1135" y="925" class="label" text-anchor="middle">Refs · journal · packs · LFS</text>
  <text x="1135" y="950" class="muted" text-anchor="middle">Release asset bytes stay here</text>
  <text x="720" y="1003" class="muted" text-anchor="middle">Catalog, identity and repository policy retain their direct object-store records.</text>

  <rect x="60" y="1050" width="1320" height="65" rx="10" fill="#064e3b" fill-opacity="0.28" stroke="#34d399" stroke-opacity="0.4"/>
  <text x="85" y="1077" class="eyebrow" style="fill:#34d399">APPLICATION WRITE SUCCESS</text>
  <text x="85" y="1101" class="label">Local COMMIT → upload LTX + manifest → owner/head CAS accepted → HTTP success</text>
  <text x="1355" y="1101" class="muted" text-anchor="end">Local commit alone is not durable.</text>

  <text x="60" y="1152" class="eyebrow" style="fill:#fbbf24">HARD CUTOVER</text>
  <text x="240" y="1152" class="label">Stop old fleet → offline import + verify → start new fleet → reopen traffic</text>
  <path d="M60 1180 H1380" stroke="#334155"/>
  <path d="M60 1207 H90" class="line" stroke="#34d399"/>
  <text x="102" y="1211" class="foot">Request / data path</text>
  <path d="M320 1207 H350" class="line" stroke="#a78bfa" stroke-dasharray="5 4"/>
  <text x="362" y="1211" class="foot">Ownership lookup</text>
  <text x="1380" y="1211" class="foot" text-anchor="end">PROPOSED DESIGN · SQLite/LTX runtime not yet implemented</text>

  <text x="60" y="36" class="eyebrow">CRAB / HIGH-LEVEL SYSTEM DESIGN</text>
  <text x="60" y="78" class="title">crab-http-server · next architecture</text>
  <text x="60" y="102" class="subtitle">Repository-scoped SQLite · embedded LTX replication · object-store authority</text>
</svg>
