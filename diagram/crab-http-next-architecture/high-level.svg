      <path d="M0 0 L9 3.5 L0 7Z" fill="#22d3ee"/>
    </marker>
    <marker id="green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0 0 L9 3.5 L0 7Z" fill="#34d399"/>
    </marker>
    <marker id="violet" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
