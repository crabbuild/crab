  <rect x="60" y="820" width="1320" height="205" rx="16" fill="#19132f" fill-opacity="0.55" stroke="#a78bfa" stroke-opacity="0.8"/>

  <path d="M720 210 V250" class="line" stroke="#22d3ee" marker-end="url(#cyan)"/>
