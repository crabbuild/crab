      .muted { fill: #94a3b8; font-size: 13px; }
      .flow { fill: #e2e8f0; font-size: 13px; font-weight: 500; }
      .note-title { fill: #f8fafc; font-size: 16px; font-weight: 600; }
      .foot { fill: #94a3b8; font-size: 12px; }
      .line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
