<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
  <title id="title">Crab with existing GitHub workflow</title>
  <desc id="desc">Architecture diagram showing how Crab fits into a team's existing GitHub code review and CI workflow while storing large file content in an object store and pointer files in Git history.</desc>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#1b2a44" stroke-width="1" opacity="0.5"/>
    </pattern>

    <linearGradient id="blueFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4078"/>
      <stop offset="1" stop-color="#142b53"/>
    </linearGradient>
    <linearGradient id="cyanFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3443"/>
      <stop offset="1" stop-color="#0b2634"/>
    </linearGradient>
    <linearGradient id="greenFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3f37"/>
      <stop offset="1" stop-color="#092c2b"/>
    </linearGradient>
    <linearGradient id="violetFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33216d"/>
      <stop offset="1" stop-color="#21184d"/>
    </linearGradient>
    <linearGradient id="orangeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#593925"/>
      <stop offset="1" stop-color="#3b281f"/>
    </linearGradient>
    <linearGradient id="roseFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b1633"/>
      <stop offset="1" stop-color="#381225"/>
    </linearGradient>
    <linearGradient id="darkFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>

    <filter id="shadow" x="-8%" y="-12%" width="116%" height="128%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020817" flood-opacity="0.34"/>
    </filter>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #0b1220; }
    .grid { fill: url(#grid); opacity: 0.72; }
    .title { fill: #f8fafc; font: 700 30px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    .subtitle { fill: #94a3b8; font: 500 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    .group-title { font: 700 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    .node-title { fill: #f8fafc; font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    .node-copy { fill: #a8b3c7; font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    .tiny { fill: #a8b3c7; font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    .label { fill: #d8e2f0; font: 700 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
    .section { fill: none; stroke-width: 2; stroke-dasharray: 10 8; rx: 14; }
    .node { stroke-width: 2.2; rx: 8; filter: url(#shadow); }
    .soft { fill: rgba(15, 23, 42, 0.78); stroke: #334155; stroke-width: 1.5; rx: 10; }
    .cyan { stroke: #22d3ee; }
    .green { stroke: #34d399; }
    .blue { stroke: #60a5fa; }
    .violet { stroke: #a78bfa; }
    .orange { stroke: #fb923c; }
    .rose { stroke: #fb7185; }
    .muted { stroke: #94a3b8; }
    .flow-cyan { fill: none; stroke: #22d3ee; stroke-width: 2.5; marker-end: url(#arrowCyan); }
    .flow-green { fill: none; stroke: #34d399; stroke-width: 2.5; marker-end: url(#arrowGreen); }
    .flow-blue { fill: none; stroke: #60a5fa; stroke-width: 2.5; marker-end: url(#arrowBlue); }
    .flow-violet { fill: none; stroke: #a78bfa; stroke-width: 2.5; marker-end: url(#arrowViolet); }
    .flow-orange { fill: none; stroke: #fb923c; stroke-width: 2.5; stroke-dasharray: 9 7; marker-end: url(#arrowOrange); }
    .bus { fill: none; stroke: #22d3ee; stroke-width: 2.2; }
  </style>

  <rect class="bg" width="1800" height="1220"/>
  <rect class="grid" width="1800" height="1220"/>

  <text class="title" x="50" y="62">Crab fits existing GitHub workflows</text>
  <text class="subtitle" x="50" y="94">Keep code review, branch protection, Actions CI, and cloud buckets. Crab moves large bytes out of Git history and keeps reviewable pointer files in Git.</text>
  <text class="subtitle" x="50" y="118">Developers and CI hydrate on demand from object storage, so the existing workflow stays familiar while large-file storage scales separately.</text>

  <!-- Section boundaries -->
  <rect class="section cyan" x="40" y="150" width="420" height="510" rx="14"/>
  <text class="group-title" x="64" y="178" fill="#22d3ee">Developer workstation</text>

  <rect class="section blue" x="500" y="150" width="560" height="510" rx="14"/>
  <text class="group-title" x="524" y="178" fill="#60a5fa">Existing GitHub workflow</text>

  <rect class="section orange" x="1100" y="150" width="650" height="510" rx="14"/>
  <text class="group-title" x="1124" y="178" fill="#fb923c">Team-owned storage and access</text>

  <rect class="section green" x="500" y="700" width="1250" height="245" rx="14"/>
  <text class="group-title" x="524" y="728" fill="#34d399">CI / automation lane</text>

  <rect class="section violet" x="40" y="700" width="420" height="280" rx="14"/>
  <text class="group-title" x="64" y="728" fill="#a78bfa">What remains unchanged</text>

  <!-- Connections behind nodes -->
  <path class="flow-cyan" d="M 250 302 V 350"/>
  <path class="flow-cyan" d="M 250 440 V 490"/>
  <path class="flow-green" d="M 420 395 H 480 V 630 H 1128 V 270 H 1160"/>
  <text class="label" x="790" y="618" text-anchor="middle">crab uploads immutable large-file content</text>

  <path class="flow-blue" d="M 760 265 H 820"/>
  <path class="flow-blue" d="M 930 310 V 370"/>
  <path class="flow-blue" d="M 800 450 V 510"/>
  <path class="flow-blue" d="M 800 590 V 690 H 665 V 760"/>
  <text class="label" x="725" y="678" text-anchor="middle">existing workflow trigger</text>

  <path class="flow-cyan" d="M 790 800 H 850"/>
  <path class="flow-green" d="M 1100 800 H 1160"/>
  <path class="flow-blue" d="M 1410 800 H 1470"/>
  <path class="flow-orange" d="M 1580 760 V 682 H 1070 V 265 H 1040"/>
  <text class="label" x="1325" y="670" text-anchor="middle">status checks report to PR</text>

  <path class="flow-violet" d="M 980 760 V 675 H 1136 V 425 H 1160"/>
  <text class="label" x="1068" y="664" text-anchor="middle">hydrate reads real bytes</text>

  <path class="flow-orange" d="M 1300 320 V 370"/>
  <path class="flow-orange" d="M 1550 320 V 370"/>

  <!-- Developer nodes -->
  <rect class="node cyan" fill="url(#cyanFill)" x="80" y="220" width="340" height="82" rx="8"/>
  <text class="node-title" x="250" y="254" text-anchor="middle">Normal working tree</text>
  <text class="node-copy" x="250" y="277" text-anchor="middle">code, configs, notebooks, assets</text>
  <text class="node-copy" x="250" y="295" text-anchor="middle">developers still use Git locally</text>

  <rect class="node green" fill="url(#greenFill)" x="80" y="350" width="340" height="90" rx="8"/>
  <text class="node-title" x="250" y="384" text-anchor="middle">Crab CLI / filter</text>
  <text class="node-copy" x="250" y="408" text-anchor="middle">crab add, push, pull, hydrate</text>
  <text class="node-copy" x="250" y="426" text-anchor="middle">splits pointer metadata from bytes</text>

  <rect class="node violet" fill="url(#violetFill)" x="80" y="490" width="340" height="86" rx="8"/>
  <text class="node-title" x="250" y="524" text-anchor="middle">Git commit</text>
  <text class="node-copy" x="250" y="548" text-anchor="middle">source code plus pointer files</text>
  <text class="node-copy" x="250" y="566" text-anchor="middle">small, reviewable Git history</text>

  <!-- GitHub nodes -->
  <rect class="node blue" fill="url(#blueFill)" x="540" y="220" width="220" height="90" rx="8"/>
  <text class="node-title" x="650" y="254" text-anchor="middle">GitHub repo</text>
  <text class="node-copy" x="650" y="278" text-anchor="middle">code + pointer files</text>
  <text class="node-copy" x="650" y="296" text-anchor="middle">ordinary branches and commits</text>

  <path class="flow-blue" d="M 250 576 V 612 H 610 V 306"/>
  <text class="label" x="430" y="602" text-anchor="middle">git push</text>

  <rect class="node blue" fill="url(#blueFill)" x="820" y="220" width="220" height="90" rx="8"/>
  <text class="node-title" x="930" y="254" text-anchor="middle">Pull request</text>
  <text class="node-copy" x="930" y="278" text-anchor="middle">review code and pointers</text>
  <text class="node-copy" x="930" y="296" text-anchor="middle">no new review surface</text>

  <rect class="node rose" fill="url(#roseFill)" x="650" y="370" width="300" height="80" rx="8"/>
  <text class="node-title" x="800" y="403" text-anchor="middle">Branch protection</text>
  <text class="node-copy" x="800" y="427" text-anchor="middle">owners, required checks, merge rules</text>
  <text class="node-copy" x="800" y="445" text-anchor="middle">continue to work as-is</text>

  <rect class="node blue" fill="url(#blueFill)" x="650" y="510" width="300" height="80" rx="8"/>
  <text class="node-title" x="800" y="543" text-anchor="middle">GitHub Actions</text>
  <text class="node-copy" x="800" y="567" text-anchor="middle">existing workflows trigger on PRs</text>
  <text class="node-copy" x="800" y="585" text-anchor="middle">checkout still starts from Git</text>

  <!-- Object store nodes -->
  <rect class="node orange" fill="url(#orangeFill)" x="1160" y="220" width="500" height="100" rx="8"/>
  <text class="node-title" x="1410" y="257" text-anchor="middle">Existing cloud bucket</text>
  <text class="node-copy" x="1410" y="283" text-anchor="middle">S3 / GCS / Azure under the team's account</text>
  <text class="node-copy" x="1410" y="301" text-anchor="middle">IAM, lifecycle, encryption, audit stay familiar</text>

  <rect class="node violet" fill="url(#violetFill)" x="1160" y="370" width="280" height="92" rx="8"/>
  <text class="node-title" x="1300" y="405" text-anchor="middle">Large file content</text>
  <text class="node-copy" x="1300" y="430" text-anchor="middle">chunks, xorbs, shards</text>
  <text class="node-copy" x="1300" y="448" text-anchor="middle">content-addressed, immutable</text>

  <rect class="node violet" fill="url(#violetFill)" x="1470" y="370" width="250" height="92" rx="8"/>
  <text class="node-title" x="1595" y="405" text-anchor="middle">Crab metadata</text>
  <text class="node-copy" x="1595" y="430" text-anchor="middle">file and chunk indexes</text>
  <text class="node-copy" x="1595" y="448" text-anchor="middle">fast hydrate and dedup</text>

  <rect class="node orange" fill="url(#orangeFill)" x="1295" y="515" width="310" height="78" rx="8"/>
  <text class="node-title" x="1450" y="546" text-anchor="middle">Enterprise cache optional</text>
  <text class="node-copy" x="1450" y="569" text-anchor="middle">reduce repeated object-store reads</text>
  <text class="node-copy" x="1450" y="587" text-anchor="middle">while bucket remains authority</text>

  <!-- CI nodes -->
  <rect class="node blue" fill="url(#blueFill)" x="540" y="760" width="250" height="80" rx="8"/>
  <text class="node-title" x="665" y="792" text-anchor="middle">actions/checkout</text>
  <text class="node-copy" x="665" y="816" text-anchor="middle">pulls code and pointer files</text>
  <text class="node-copy" x="665" y="834" text-anchor="middle">same GitHub repo</text>

  <rect class="node green" fill="url(#greenFill)" x="850" y="760" width="250" height="80" rx="8"/>
  <text class="node-title" x="975" y="792" text-anchor="middle">crab hydrate</text>
  <text class="node-copy" x="975" y="816" text-anchor="middle">resolves pointers</text>
  <text class="node-copy" x="975" y="834" text-anchor="middle">downloads needed bytes</text>

  <rect class="node green" fill="url(#greenFill)" x="1160" y="760" width="250" height="80" rx="8"/>
  <text class="node-title" x="1285" y="792" text-anchor="middle">Build / test / train</text>
  <text class="node-copy" x="1285" y="816" text-anchor="middle">tools see normal files</text>
  <text class="node-copy" x="1285" y="834" text-anchor="middle">no app rewrite required</text>

  <rect class="node blue" fill="url(#blueFill)" x="1470" y="760" width="220" height="80" rx="8"/>
  <text class="node-title" x="1580" y="792" text-anchor="middle">Status checks</text>
  <text class="node-copy" x="1580" y="816" text-anchor="middle">posted to the PR</text>
  <text class="node-copy" x="1580" y="834" text-anchor="middle">same merge gates</text>

  <!-- What remains unchanged -->
  <rect class="node violet" fill="url(#violetFill)" x="80" y="760" width="340" height="56" rx="8"/>
  <text class="node-title" x="250" y="785" text-anchor="middle">GitHub remains source control</text>
  <text class="node-copy" x="250" y="806" text-anchor="middle">PRs, reviews, branches, checks</text>

  <rect class="node violet" fill="url(#violetFill)" x="80" y="835" width="340" height="56" rx="8"/>
  <text class="node-title" x="250" y="860" text-anchor="middle">Cloud bucket remains storage</text>
  <text class="node-copy" x="250" y="881" text-anchor="middle">access policy and lifecycle stay yours</text>

  <rect class="node violet" fill="url(#violetFill)" x="80" y="910" width="340" height="56" rx="8"/>
  <text class="node-title" x="250" y="935" text-anchor="middle">Existing tools keep working</text>
  <text class="node-copy" x="250" y="956" text-anchor="middle">CI, IDEs, scripts see hydrated files</text>

  <!-- Impact row -->
  <rect class="soft" x="40" y="990" width="1710" height="92" rx="10"/>
  <text class="group-title" x="70" y="1020" fill="#60a5fa">Team impact</text>
  <text class="tiny" x="70" y="1048">Crab adds a large-file data plane without replacing GitHub: pointer files remain reviewable, large bytes move to object storage, and CI hydrates only when it needs real content.</text>
  <text class="tiny" x="70" y="1068">Result: smaller Git history, reusable cloud storage, familiar reviews, familiar branch protection, and less pressure to rebuild the team's existing developer platform.</text>

  <!-- Legend -->
  <rect class="soft" x="40" y="1110" width="1710" height="76" rx="10"/>
  <path class="flow-cyan" d="M 90 1148 H 150"/>
  <text class="tiny" x="170" y="1152">developer Git flow</text>
  <path class="flow-green" d="M 410 1148 H 470"/>
  <text class="tiny" x="490" y="1152">Crab large-file path</text>
  <path class="flow-blue" d="M 760 1148 H 820"/>
  <text class="tiny" x="840" y="1152">GitHub workflow</text>
  <path class="flow-violet" d="M 1080 1148 H 1140"/>
  <text class="tiny" x="1160" y="1152">hydrate reads from object store</text>
  <path class="flow-orange" d="M 1480 1148 H 1540"/>
  <text class="tiny" x="1560" y="1152">status / optional cache</text>
</svg>
