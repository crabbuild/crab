<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" width="520" height="480">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowhead-sky" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="520" height="480" fill="#ffffff"/>
  </g>

  <g id="containers">
  </g>

  <g id="nodes">
    <!-- Input -->
    <rect x="130" y="30" width="260" height="38" rx="19" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Step 1 -->
    <rect x="130" y="100" width="260" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Step 2 -->
    <rect x="130" y="176" width="260" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Step 3 -->
    <rect x="130" y="252" width="260" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Step 4 -->
    <rect x="130" y="328" width="260" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Output -->
    <rect x="130" y="404" width="260" height="38" rx="19" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  </g>

  <g id="labels">
    <!-- Title -->
    <text x="260" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Clean Path (git add)</text>

    <!-- Input -->
    <text x="260" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">File content (streaming)</text>

    <!-- Steps -->
    <text x="260" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">1. Blake3 hash + CDC chunking</text>
    <text x="260" y="134" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#e0f2fe">single-pass, simultaneous</text>

    <text x="260" y="194" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">2. Fast-path check (≥64 MiB)</text>
    <text x="260" y="210" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#e0f2fe">bloom → file-index → skip if known</text>

    <text x="260" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">3. Classify chunks (3-tier dedup)</text>
    <text x="260" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#e0f2fe">A: skip · B: skip · C: stage</text>

    <text x="260" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">4. Stage class-C chunks</text>
    <text x="260" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#e0f2fe">append segment + SQLite WAL index</text>

    <!-- Output -->
    <text x="260" y="428" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Pointer blob (~200 B) → Git ODB</text>

    <!-- Side note -->
    <text x="420" y="460" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">No network I/O — entirely local</text>
  </g>

  <g id="connections">
    <line x1="260" y1="68" x2="260" y2="100" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="260" y1="144" x2="260" y2="176" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="260" y1="220" x2="260" y2="252" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="260" y1="296" x2="260" y2="328" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="260" y1="372" x2="260" y2="404" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

</svg>
