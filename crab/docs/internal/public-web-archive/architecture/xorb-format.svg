<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" width="520" height="460">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="520" height="460" fill="#ffffff"/>
  </g>

  <g id="containers">
    <!-- Overall xorb container -->
    <rect x="60" y="50" width="400" height="380" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <g id="nodes">
    <!-- Header section -->
    <rect x="80" y="70" width="360" height="80" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Chunk Data section -->
    <rect x="80" y="165" width="360" height="80" rx="6" fill="#0c4a6e" stroke="#082f49" stroke-width="1.5"/>
    <!-- Metadata section -->
    <rect x="80" y="260" width="360" height="80" rx="6" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
    <!-- Footer section -->
    <rect x="80" y="355" width="360" height="55" rx="6" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  </g>

  <g id="labels">
    <!-- Title -->
    <text x="260" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Xorb Binary Format (~64 MiB)</text>

    <!-- Header -->
    <text x="100" y="92" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Header</text>
    <text x="100" y="112" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8">magic: "XORB" (4B) · version: u16 · chunk_count: u32</text>
    <text x="100" y="130" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#94a3b8">metadata_offset: u64</text>

    <!-- Chunk Data -->
    <text x="100" y="187" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Chunk Data</text>
    <text x="100" y="207" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#bae6fd">for each chunk:</text>
    <text x="115" y="225" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#bae6fd">length: u32 · compressed_bytes: [u8; length] (zstd)</text>

    <!-- Metadata -->
    <text x="100" y="282" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Metadata</text>
    <text x="100" y="302" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e0f2fe">for each chunk:</text>
    <text x="115" y="320" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e0f2fe">hash: MerkleHash (32B) · uncompressed_length: u32 · offset: u64</text>

    <!-- Footer -->
    <text x="100" y="380" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Footer</text>
    <text x="100" y="398" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#cbd5e1">hash_of_metadata: MerkleHash · hash_of_xorb: MerkleHash (content address)</text>

    <!-- Side annotations -->
    <text x="480" y="110" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="start">fixed</text>
    <text x="480" y="205" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="start">variable</text>
    <text x="480" y="300" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="start">variable</text>
    <text x="480" y="383" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b" text-anchor="start">fixed</text>

    <!-- Bottom note -->
    <text x="260" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">Content address = MerkleHash over chunk hashes (not compressed bytes)</text>
  </g>

  <g id="connections">
  </g>

</svg>
