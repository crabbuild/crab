<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 720" width="780" height="720">

  <!-- Layer 0: Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowhead-sky" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Layer 1: Background -->
  <g id="background">
    <rect x="0" y="0" width="780" height="720" fill="#ffffff"/>
  </g>

  <!-- Layer 2: Containers (layer backgrounds) -->
  <g id="containers">
    <!-- Entry Layer -->
    <rect x="30" y="50" width="720" height="80" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>

    <!-- Interface Layer -->
    <rect x="30" y="155" width="720" height="80" rx="10" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="1"/>

    <!-- Core Layer -->
    <rect x="30" y="260" width="720" height="80" rx="10" fill="#bae6fd" stroke="#38bdf8" stroke-width="1"/>

    <!-- Domain Layer -->
    <rect x="30" y="365" width="720" height="80" rx="10" fill="#7dd3fc" stroke="#0ea5e9" stroke-width="1"/>

    <!-- Infrastructure Layer -->
    <rect x="30" y="470" width="720" height="80" rx="10" fill="#0ea5e9" stroke="#0284c7" stroke-width="1"/>

    <!-- Cross-cutting (side) -->
    <rect x="30" y="580" width="720" height="80" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Layer 3: Nodes -->
  <g id="nodes">
    <!-- Entry Layer: main.rs, lib.rs -->
    <rect x="260" y="68" width="120" height="42" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="410" y="68" width="100" height="42" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Interface Layer: cmd/, git/ remote_helper, git/ filter_process -->
    <rect x="80" y="173" width="180" height="42" rx="6" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="290" y="173" width="180" height="42" rx="6" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="500" y="173" width="200" height="42" rx="6" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Core Layer: engine/, metadata/, coordination/ -->
    <rect x="80" y="278" width="180" height="42" rx="6" fill="#0c4a6e" stroke="#082f49" stroke-width="1.5"/>
    <rect x="290" y="278" width="180" height="42" rx="6" fill="#0c4a6e" stroke="#082f49" stroke-width="1.5"/>
    <rect x="500" y="278" width="200" height="42" rx="6" fill="#0c4a6e" stroke="#082f49" stroke-width="1.5"/>

    <!-- Domain Layer: diff/, lfs/, vfs/, cache/ -->
    <rect x="60" y="383" width="140" height="42" rx="6" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
    <rect x="225" y="383" width="140" height="42" rx="6" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
    <rect x="390" y="383" width="140" height="42" rx="6" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>
    <rect x="555" y="383" width="140" height="42" rx="6" fill="#0369a1" stroke="#075985" stroke-width="1.5"/>

    <!-- Infrastructure Layer: storage/, object_store -->
    <rect x="160" y="488" width="200" height="42" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="420" y="488" width="200" height="42" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Cross-cutting: core/ -->
    <rect x="120" y="598" width="130" height="42" rx="6" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
    <rect x="280" y="598" width="130" height="42" rx="6" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
    <rect x="440" y="598" width="130" height="42" rx="6" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
    <rect x="600" y="598" width="130" height="42" rx="6" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Layer 4: Labels -->
  <g id="labels">
    <!-- Title -->
    <text x="390" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Crab Module Architecture (Layered)</text>

    <!-- Layer titles -->
    <text x="745" y="93" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0369a1" font-weight="bold">ENTRY</text>
    <text x="745" y="198" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0369a1" font-weight="bold">INTERFACE</text>
    <text x="745" y="303" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0369a1" font-weight="bold">CORE</text>
    <text x="745" y="408" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0369a1" font-weight="bold">DOMAIN</text>
    <text x="745" y="513" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0369a1" font-weight="bold">INFRA</text>
    <text x="745" y="623" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b" font-weight="bold">CROSS-CUTTING</text>

    <!-- Entry layer labels -->
    <text x="320" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">main.rs</text>
    <text x="460" y="94" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">lib.rs</text>

    <!-- Interface layer labels -->
    <text x="170" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">cmd/ (30+ cmds)</text>
    <text x="380" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">git/remote_helper</text>
    <text x="600" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">git/filter_process</text>

    <!-- Core layer labels -->
    <text x="170" y="293" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">engine/</text>
    <text x="170" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#bae6fd">CDC, dedup, staging</text>
    <text x="380" y="293" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">metadata/</text>
    <text x="380" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#bae6fd">shards, indices, refs</text>
    <text x="600" y="293" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">coordination/</text>
    <text x="600" y="308" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#bae6fd">locks, CAS, heartbeat</text>

    <!-- Domain layer labels -->
    <text x="130" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">diff/</text>
    <text x="295" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">lfs/</text>
    <text x="460" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">vfs/</text>
    <text x="625" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">cache/</text>

    <!-- Infrastructure layer labels -->
    <text x="260" y="514" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">storage/</text>
    <text x="520" y="514" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">object_store crate</text>

    <!-- Cross-cutting labels -->
    <text x="185" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">core/config</text>
    <text x="185" y="629" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#cbd5e1">4-layer resolution</text>
    <text x="345" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">core/error</text>
    <text x="345" y="629" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#cbd5e1">CrabError + catalog</text>
    <text x="505" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">core/metrics</text>
    <text x="505" y="629" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#cbd5e1">atomic counters</text>
    <text x="665" y="614" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">core/tracing</text>
    <text x="665" y="629" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#cbd5e1">structured logging</text>

    <!-- Dependency direction label -->
    <text x="40" y="700" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">↓ Dependencies flow downward. Cross-cutting modules are used by all layers.</text>
  </g>

  <!-- Layer 5: Connections -->
  <g id="connections">
    <!-- Entry to Interface -->
    <line x1="320" y1="110" x2="170" y2="173" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="320" y1="110" x2="380" y2="173" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="320" y1="110" x2="600" y2="173" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Interface to Core -->
    <line x1="170" y1="215" x2="170" y2="278" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>
    <line x1="380" y1="215" x2="380" y2="278" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>
    <line x1="600" y1="215" x2="600" y2="278" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>

    <!-- Core to Domain -->
    <line x1="170" y1="320" x2="130" y2="383" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>
    <line x1="170" y1="320" x2="295" y2="383" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>
    <line x1="380" y1="320" x2="460" y2="383" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>
    <line x1="380" y1="320" x2="625" y2="383" stroke="#0ea5e9" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>

    <!-- Domain/Core to Infrastructure -->
    <line x1="170" y1="320" x2="260" y2="488" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="380" y1="320" x2="260" y2="488" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
    <line x1="460" y1="425" x2="520" y2="488" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="625" y1="425" x2="520" y2="488" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- storage to object_store -->
    <line x1="360" y1="509" x2="420" y2="509" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  </g>

</svg>
