<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" width="640" height="260">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="640" height="260" fill="#ffffff"/>
  </g>

  <g id="containers">
    <!-- Segment file container -->
    <rect x="30" y="50" width="580" height="70" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <!-- Frame detail container -->
    <rect x="30" y="155" width="580" height="70" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  </g>

  <g id="nodes">
    <!-- Segment frames -->
    <rect x="50" y="65" width="120" height="40" rx="4" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="185" y="65" width="120" height="40" rx="4" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="320" y="65" width="120" height="40" rx="4" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="455" y="65" width="60" height="40" rx="4" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="530" y="65" width="60" height="40" rx="4" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Frame detail fields -->
    <rect x="50" y="170" width="120" height="40" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="185" y="170" width="280" height="40" rx="4" fill="#0c4a6e" stroke="#082f49" stroke-width="1.5"/>
    <rect x="480" y="170" width="110" height="40" rx="4" fill="#64748b" stroke="#475569" stroke-width="1.5"/>
  </g>

  <g id="labels">
    <!-- Title -->
    <text x="320" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Segment File Format</text>

    <!-- Segment frame labels -->
    <text x="110" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Frame 0</text>
    <text x="245" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Frame 1</text>
    <text x="380" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Frame 2</text>
    <text x="485" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">...</text>
    <text x="560" y="90" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0c4a6e">N</text>

    <!-- Frame detail title -->
    <text x="320" y="155" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#475569">Each Frame:</text>

    <!-- Frame detail labels -->
    <text x="110" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">length: u32</text>
    <text x="325" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">chunk_data: [u8]</text>
    <text x="535" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">crc32: u32</text>

    <!-- Size annotations -->
    <text x="110" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">4 bytes</text>
    <text x="325" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">variable length</text>
    <text x="535" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">4 bytes</text>

    <!-- Append-only note -->
    <text x="320" y="250" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">Append-only. Frames are written sequentially; reads use pread + CRC verification.</text>
  </g>

  <g id="connections">
    <!-- Arrow from segment to frame detail -->
    <line x1="110" y1="105" x2="110" y2="170" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  </g>

</svg>
