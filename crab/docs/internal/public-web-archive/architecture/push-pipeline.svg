<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="680" height="500">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowhead-sky" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
  </g>

  <g id="containers">
    <!-- Phase 1 -->
    <rect x="30" y="60" width="300" height="180" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <!-- Phase 2 -->
    <rect x="350" y="60" width="300" height="180" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <!-- Phase 3 -->
    <rect x="30" y="270" width="300" height="180" rx="10" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
    <!-- Phase 4 -->
    <rect x="350" y="270" width="300" height="180" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  </g>

  <g id="nodes">
    <!-- Phase 1 steps -->
    <rect x="50" y="100" width="260" height="28" rx="4" fill="#0ea5e9" stroke="#0284c7" stroke-width="1"/>
    <rect x="50" y="134" width="260" height="28" rx="4" fill="#0ea5e9" stroke="#0284c7" stroke-width="1"/>
    <rect x="50" y="168" width="260" height="28" rx="4" fill="#0ea5e9" stroke="#0284c7" stroke-width="1"/>
    <rect x="50" y="202" width="260" height="28" rx="4" fill="#0ea5e9" stroke="#0284c7" stroke-width="1"/>

    <!-- Phase 2 steps -->
    <rect x="370" y="100" width="260" height="28" rx="4" fill="#10b981" stroke="#059669" stroke-width="1"/>
    <rect x="370" y="134" width="260" height="28" rx="4" fill="#10b981" stroke="#059669" stroke-width="1"/>

    <!-- Phase 3 steps -->
    <rect x="50" y="310" width="260" height="28" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
    <rect x="50" y="344" width="260" height="28" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
    <rect x="50" y="378" width="260" height="28" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
    <rect x="50" y="412" width="260" height="28" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>

    <!-- Phase 4 steps -->
    <rect x="370" y="310" width="260" height="28" rx="4" fill="#f87171" stroke="#dc2626" stroke-width="1"/>
    <rect x="370" y="344" width="260" height="28" rx="4" fill="#f87171" stroke="#dc2626" stroke-width="1"/>
    <rect x="370" y="378" width="260" height="28" rx="4" fill="#f87171" stroke="#dc2626" stroke-width="1"/>
    <rect x="370" y="412" width="260" height="28" rx="4" fill="#f87171" stroke="#dc2626" stroke-width="1"/>
  </g>

  <g id="labels">
    <!-- Title -->
    <text x="340" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Push Pipeline (14 Steps)</text>

    <!-- Phase labels -->
    <text x="180" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0369a1">PHASE 1: CLASSIFY</text>
    <text x="500" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#047857">PHASE 2: PACK</text>
    <text x="180" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">PHASE 3: UPLOAD</text>
    <text x="500" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">PHASE 4: COMMIT</text>

    <!-- Phase 1 step labels -->
    <text x="180" y="119" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">1. Enumerate pointer blobs</text>
    <text x="180" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">2. Staging lookup per pointer</text>
    <text x="180" y="187" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">3. Pre-push shard sync</text>
    <text x="180" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">4. Classify chunks (A/B/C)</text>

    <!-- Phase 2 step labels -->
    <text x="500" y="119" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">5. Pack B/C chunks → ~64 MiB xorbs</text>
    <text x="500" y="153" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">6. HEAD check (skip uploaded)</text>

    <!-- Phase 3 step labels -->
    <text x="180" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#422006">7. Parallel xorb uploads (16x)</text>
    <text x="180" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#422006">8. Build + upload shard</text>
    <text x="180" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#422006">9. Upload file-index entries</text>
    <text x="180" y="431" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#422006">10. Upload Git pack</text>

    <!-- Phase 4 step labels -->
    <text x="500" y="329" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">11. CAS update manifests</text>
    <text x="500" y="363" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">12. Lock → CAS ref → release</text>
    <text x="500" y="397" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">13. Post-success cleanup</text>
    <text x="500" y="431" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">14. On failure: no-op rollback</text>

    <!-- Invariant note -->
    <text x="340" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">Invariant: Phases 1-3 (immutable data) complete before Phase 4 (mutable refs)</text>
    <text x="340" y="492" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">Interrupted push → orphaned data (cleaned by GC), never dangling references</text>
  </g>

  <g id="connections">
    <!-- Phase flow arrows -->
    <line x1="330" y1="150" x2="370" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="330" y1="360" x2="370" y2="360" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="180" y1="240" x2="180" y2="270" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="500" y1="170" x2="500" y2="240" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
    <path d="M 500 240 L 500 255 L 340 255 L 340 270" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrowhead)"/>
  </g>

</svg>
