<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 680" width="720" height="680">

  <!-- Layer 0: Definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowhead-sky" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9"/>
    </marker>
  </defs>

  <!-- Layer 1: Background -->
  <g id="background">
    <rect x="0" y="0" width="720" height="680" fill="#ffffff"/>
  </g>

  <!-- Layer 2: Containers -->
  <g id="containers">
    <!-- User's Workstation -->
    <rect x="30" y="30" width="660" height="490" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Crab binary container -->
    <rect x="80" y="150" width="560" height="300" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>

    <!-- Local state container -->
    <rect x="80" y="470" width="400" height="36" rx="6" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
  </g>

  <!-- Layer 3: Nodes -->
  <g id="nodes">
    <!-- git CLI -->
    <rect x="290" y="55" width="140" height="44" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Interface layer -->
    <rect x="100" y="175" width="155" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="283" y="175" width="155" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="466" y="175" width="155" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Core modules -->
    <rect x="100" y="275" width="100" height="44" rx="8" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="218" y="275" width="100" height="44" rx="8" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="336" y="275" width="100" height="44" rx="8" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="454" y="275" width="120" height="44" rx="8" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Support modules -->
    <rect x="100" y="345" width="80" height="44" rx="8" fill="#bae6fd" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="198" y="345" width="80" height="44" rx="8" fill="#bae6fd" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="296" y="345" width="80" height="44" rx="8" fill="#bae6fd" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="394" y="345" width="80" height="44" rx="8" fill="#bae6fd" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="492" y="345" width="80" height="44" rx="8" fill="#bae6fd" stroke="#7dd3fc" stroke-width="1.5"/>

    <!-- object_store -->
    <rect x="240" y="415" width="240" height="44" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>

    <!-- Cloud storage -->
    <rect x="240" y="600" width="240" height="50" rx="10" fill="#0ea5e9" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- Layer 4: Labels -->
  <g id="labels">
    <!-- Title -->
    <text x="60" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#64748b" font-weight="bold">USER'S WORKSTATION</text>

    <!-- git CLI -->
    <text x="360" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">git CLI</text>

    <!-- Crab binary label -->
    <text x="110" y="168" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#0369a1" font-weight="bold">CRAB BINARY</text>

    <!-- Interface layer labels -->
    <text x="177" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Remote Helper</text>
    <text x="360" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Filter Driver</text>
    <text x="543" y="202" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">CLI Commands</text>

    <!-- Core module labels -->
    <text x="150" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">engine</text>
    <text x="268" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">storage</text>
    <text x="386" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">metadata</text>
    <text x="514" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0c4a6e">coordination</text>

    <!-- Support module labels -->
    <text x="140" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0c4a6e">cache</text>
    <text x="238" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0c4a6e">diff</text>
    <text x="336" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0c4a6e">lfs</text>
    <text x="434" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0c4a6e">vfs</text>
    <text x="532" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#0c4a6e">git</text>

    <!-- object_store label -->
    <text x="360" y="442" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">object_store (S3 / GCS / Azure)</text>

    <!-- Local state label -->
    <text x="280" y="493" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#92400e">.crab/staging/    ~/.cache/crab/    .git/lfs/</text>

    <!-- Protocol labels -->
    <text x="395" y="120" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">remote helper protocol (stdio)</text>
    <text x="395" y="133" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">clean/smudge filter (stdio)</text>

    <!-- Cloud storage label -->
    <text x="360" y="621" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Object Storage</text>
    <text x="360" y="638" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e0f2fe">S3 / GCS / Azure / R2</text>

    <!-- Network label -->
    <text x="375" y="565" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">HTTPS + cloud-native auth</text>
  </g>

  <!-- Layer 5: Connections -->
  <g id="connections">
    <!-- git CLI to interface layer -->
    <line x1="360" y1="99" x2="177" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="360" y1="99" x2="360" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="360" y1="99" x2="543" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Interface to core modules -->
    <line x1="177" y1="219" x2="150" y2="275" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>
    <line x1="177" y1="219" x2="268" y2="275" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>
    <line x1="360" y1="219" x2="150" y2="275" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>
    <line x1="360" y1="219" x2="268" y2="275" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>
    <line x1="543" y1="219" x2="386" y2="275" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>
    <line x1="543" y1="219" x2="514" y2="275" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowhead-sky)"/>

    <!-- Core to object_store -->
    <line x1="268" y1="319" x2="320" y2="415" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <line x1="386" y1="319" x2="380" y2="415" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- object_store to cloud -->
    <line x1="360" y1="459" x2="360" y2="540" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="360" y1="540" x2="360" y2="600" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
  </g>

</svg>
