<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="480" height="520">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowhead-sky" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="480" height="520" fill="#ffffff"/>
  </g>

  <g id="containers">
  </g>

  <g id="nodes">
    <!-- Input -->
    <rect x="120" y="30" width="240" height="40" rx="20" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Ref Resolver -->
    <rect x="120" y="110" width="240" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Term Resolver -->
    <rect x="120" y="194" width="240" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Chunk Comparator -->
    <rect x="120" y="278" width="240" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Format Hints -->
    <rect x="120" y="362" width="240" height="44" rx="8" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Formatter -->
    <rect x="120" y="446" width="240" height="44" rx="8" fill="#7dd3fc" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <g id="labels">
    <!-- Title -->
    <text x="240" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Diff Engine Pipeline</text>

    <!-- Input -->
    <text x="240" y="55" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">crab diff HEAD~1 HEAD</text>

    <!-- Ref Resolver -->
    <text x="240" y="137" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Ref Resolver</text>

    <!-- Term Resolver -->
    <text x="240" y="221" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Term Resolver</text>

    <!-- Chunk Comparator -->
    <text x="240" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Chunk Comparator</text>

    <!-- Format Hints -->
    <text x="240" y="389" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">Format Hints</text>

    <!-- Formatter -->
    <text x="240" y="473" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#0c4a6e">Formatter</text>

    <!-- Side annotations -->
    <text x="380" y="135" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">refs → trees → pointers</text>
    <text x="380" y="219" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">file_hash → shard → terms</text>
    <text x="380" y="303" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">old vs new terms</text>
    <text x="380" y="387" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">format-aware context</text>
    <text x="380" y="471" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">human / JSON / stat</text>

    <!-- Output label -->
    <text x="240" y="510" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">→ stdout (zero data transfer — metadata only)</text>
  </g>

  <g id="connections">
    <line x1="240" y1="70" x2="240" y2="110" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="240" y1="154" x2="240" y2="194" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="240" y1="238" x2="240" y2="278" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="240" y1="322" x2="240" y2="362" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="240" y1="406" x2="240" y2="446" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
  </g>

</svg>
