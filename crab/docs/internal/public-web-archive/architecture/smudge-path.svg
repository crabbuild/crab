<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 560" width="540" height="560">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowhead-sky" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="540" height="560" fill="#ffffff"/>
  </g>

  <g id="containers">
  </g>

  <g id="nodes">
    <!-- Input -->
    <rect x="130" y="30" width="280" height="38" rx="19" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <!-- Step 1 -->
    <rect x="130" y="100" width="280" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Step 2 (decision) -->
    <rect x="130" y="176" width="280" height="44" rx="8" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <!-- Step 3 -->
    <rect x="130" y="252" width="280" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Step 4 -->
    <rect x="130" y="328" width="280" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Step 5 -->
    <rect x="130" y="404" width="280" height="44" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Output -->
    <rect x="130" y="480" width="280" height="38" rx="19" fill="#16a34a" stroke="#15803d" stroke-width="1.5"/>
  </g>

  <g id="labels">
    <!-- Title -->
    <text x="270" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Smudge Path (git checkout)</text>

    <!-- Input -->
    <text x="270" y="54" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Pointer blob from Git ODB</text>

    <!-- Steps -->
    <text x="270" y="127" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">1. Parse pointer → (hash, size, hint)</text>

    <text x="270" y="203" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#78350f">2. Lazy mode? → return pointer as-is</text>

    <text x="270" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">3. Resolve shard → reconstruction terms</text>
    <text x="270" y="286" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#e0f2fe">file-index → shard (cache or S3)</text>

    <text x="270" y="346" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">4. Coalesce ranges + parallel Range GETs</text>
    <text x="270" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#e0f2fe">up to 16 concurrent xorb fetches</text>

    <text x="270" y="422" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">5. Decompress + verify (blake3 per chunk)</text>
    <text x="270" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#e0f2fe">zstd decompress, streaming output</text>

    <!-- Output -->
    <text x="270" y="504" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Reconstructed file → working tree</text>

    <!-- Side note -->
    <text x="270" y="540" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">Byte-identical reconstruction guaranteed (blake3 verified)</text>
  </g>

  <g id="connections">
    <line x1="270" y1="68" x2="270" y2="100" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="270" y1="144" x2="270" y2="176" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="270" y1="220" x2="270" y2="252" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="270" y1="296" x2="270" y2="328" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="270" y1="372" x2="270" y2="404" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead-sky)"/>
    <line x1="270" y1="448" x2="270" y2="480" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>

</svg>
