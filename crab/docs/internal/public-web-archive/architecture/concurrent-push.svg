<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480">

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="700" height="480" fill="#ffffff"/>
  </g>

  <g id="containers">
  </g>

  <g id="nodes">
    <!-- Participant boxes -->
    <rect x="60" y="40" width="120" height="40" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="290" y="40" width="120" height="40" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <rect x="520" y="40" width="120" height="40" rx="8" fill="#0ea5e9" stroke="#0284c7" stroke-width="1.5"/>
  </g>

  <g id="labels">
    <!-- Title -->
    <text x="350" y="25" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#0f172a">Two Pushers to the Same Ref</text>

    <!-- Participant labels -->
    <text x="120" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Pusher A</text>
    <text x="350" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">S3</text>
    <text x="580" y="65" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Pusher B</text>

    <!-- Message labels -->
    <text x="205" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Upload xorbs + shard</text>
    <text x="455" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Upload xorbs + shard</text>

    <text x="205" y="165" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#16a34a">Acquire lock</text>
    <text x="350" y="185" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#16a34a">lock created ✓</text>

    <text x="455" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#dc2626">Acquire lock</text>
    <text x="455" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#dc2626">CAS conflict ✗</text>

    <text x="205" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#16a34a">CAS update ref</text>
    <text x="205" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">Release lock</text>
    <text x="350" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#475569">lock deleted</text>

    <text x="455" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#16a34a">Retry acquire</text>
    <text x="350" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#16a34a">lock created ✓</text>

    <text x="455" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#475569">CAS ref (fast-forward check)</text>
    <text x="580" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#64748b">FF OK → success | non-FF → error</text>
  </g>

  <g id="connections">
    <!-- Lifelines -->
    <line x1="120" y1="80" x2="120" y2="330" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
    <line x1="350" y1="80" x2="350" y2="460" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>
    <line x1="580" y1="80" x2="580" y2="460" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>

    <!-- Pusher A uploads -->
    <line x1="120" y1="118" x2="348" y2="118" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <!-- Pusher B uploads -->
    <line x1="580" y1="138" x2="352" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Pusher A acquire lock (success) -->
    <line x1="120" y1="173" x2="348" y2="173" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>

    <!-- Pusher B acquire lock (fail) -->
    <line x1="580" y1="223" x2="352" y2="223" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowhead-red)"/>

    <!-- Pusher A CAS ref -->
    <line x1="120" y1="283" x2="348" y2="283" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>

    <!-- Pusher A release lock -->
    <line x1="120" y1="318" x2="348" y2="318" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- Pusher B retry acquire (success) -->
    <line x1="580" y1="373" x2="352" y2="373" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrowhead-green)"/>

    <!-- Pusher B CAS ref -->
    <line x1="580" y1="423" x2="352" y2="423" stroke="#475569" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  </g>

</svg>
