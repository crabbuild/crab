<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 1180" role="img" aria-labelledby="title desc">
  <title id="title">Crab Continuity push and read sequence</title>
  <desc id="desc">A push freshens local state, receives into quarantine, uploads immutable dependencies, prepares refs, commits an immutable batch through a conditional head update, applies locally, acknowledges, and emits a lossy hint. A later read conditionally probes the head and either serves immediately or catches up before serving.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#34d399"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polyline points="0 0,10 3.5,0 7" fill="none" stroke="#fb923c" stroke-width="1.5"/></marker>
  </defs>
  <style>
      text{font-family:'JetBrains Mono','SF Mono','Cascadia Code',monospace}.title{font-size:22px;font-weight:700;fill:#f8fafc}.subtitle{font-size:10px;fill:#94a3b8}.actor{font-size:11px;font-weight:600;fill:#f8fafc;text-anchor:middle}.msg{font-size:8.5px;fill:#e2e8f0;text-anchor:middle}.ret{font-size:8px;fill:#94a3b8;text-anchor:middle;font-style:italic}.section{font-size:11px;font-weight:700}.note{font-size:8px;fill:#cbd5e1}.num{font-size:7px;font-weight:700;text-anchor:middle}.legend{font-size:8px;fill:#cbd5e1}
  </style>
  <rect width="1650" height="1180" fill="#0f172a"/><rect width="1650" height="1180" fill="url(#grid)"/>
  <text x="40" y="44" class="title">Crab Continuity · push and read linearization</text>
  <text x="40" y="66" class="subtitle">Time flows downward. Only the conditional commit-head update makes a push globally visible.</text>

  <!-- Actors -->
  <g><rect x="55" y="92" width="180" height="52" rx="7" fill="#0f172a"/><rect x="55" y="92" width="180" height="52" rx="7" fill="rgba(8,51,68,.4)" stroke="#22d3ee" stroke-width="1.5"/><text x="145" y="123" class="actor">Git client</text><line x1="145" y1="144" x2="145" y2="1110" stroke="#334155" stroke-dasharray="6 4"/></g>
  <g><rect x="360" y="92" width="210" height="52" rx="7" fill="#0f172a"/><rect x="360" y="92" width="210" height="52" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="465" y="123" class="actor">Continuity node</text><line x1="465" y1="144" x2="465" y2="1110" stroke="#334155" stroke-dasharray="6 4"/></g>
  <g><rect x="680" y="92" width="190" height="52" rx="7" fill="#0f172a"/><rect x="680" y="92" width="190" height="52" rx="7" fill="rgba(6,78,59,.4)" stroke="#34d399" stroke-width="1.5"/><text x="775" y="123" class="actor">Local bare Git</text><line x1="775" y1="144" x2="775" y2="1110" stroke="#334155" stroke-dasharray="6 4"/></g>
  <g><rect x="1000" y="92" width="210" height="52" rx="7" fill="#0f172a"/><rect x="1000" y="92" width="210" height="52" rx="7" fill="rgba(76,29,149,.4)" stroke="#a78bfa" stroke-width="1.5"/><text x="1105" y="123" class="actor">Object store authority</text><line x1="1105" y1="144" x2="1105" y2="1110" stroke="#334155" stroke-dasharray="6 4"/></g>
  <g><rect x="1340" y="92" width="180" height="52" rx="7" fill="#0f172a"/><rect x="1340" y="92" width="180" height="52" rx="7" fill="rgba(251,146,60,.18)" stroke="#fb923c" stroke-width="1.5"/><text x="1430" y="123" class="actor">Peer node</text><line x1="1430" y1="144" x2="1430" y2="1110" stroke="#334155" stroke-dasharray="6 4"/></g>

  <text x="40" y="185" class="section" fill="#34d399">PUSH</text>
  <rect x="445" y="192" width="40" height="570" rx="3" fill="rgba(6,78,59,.45)" stroke="#34d399"/>
  <rect x="765" y="260" width="20" height="390" rx="3" fill="rgba(6,78,59,.35)" stroke="#34d399"/>
  <rect x="1095" y="205" width="20" height="500" rx="3" fill="rgba(76,29,149,.4)" stroke="#a78bfa"/>

  <!-- Push messages -->
  <line x1="465" y1="215" x2="1105" y2="215" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><text x="785" y="205" class="msg">1 · conditional GET head → freshness point</text>
  <line x1="1105" y1="245" x2="465" y2="245" stroke="#64748b" stroke-width="1" stroke-dasharray="6 3" marker-end="url(#arrow)"/><text x="785" y="237" class="ret">unchanged or new head + opaque provider version</text>
  <line x1="465" y1="275" x2="775" y2="275" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/><text x="620" y="265" class="msg">2 · catch up if advanced</text>
  <line x1="145" y1="315" x2="465" y2="315" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/><text x="305" y="305" class="msg">3 · POST git-receive-pack</text>
  <line x1="465" y1="350" x2="775" y2="350" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/><text x="620" y="340" class="msg">receive into quarantine · extract expected-old edits</text>
  <line x1="465" y1="395" x2="1105" y2="395" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><text x="785" y="385" class="msg">4 · flush shards + content-create packs + entry</text>
  <line x1="1105" y1="425" x2="465" y2="425" stroke="#64748b" stroke-width="1" stroke-dasharray="6 3" marker-end="url(#arrow)"/><text x="785" y="417" class="ret">durable immutable dependency closure</text>
  <line x1="465" y1="465" x2="775" y2="465" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/><text x="620" y="455" class="msg">5 · prepare local ref transaction</text>
  <rect x="540" y="485" width="470" height="66" rx="6" fill="rgba(120,53,15,.22)" stroke="#fbbf24" stroke-dasharray="4 3"/>
  <text x="555" y="505" class="note">Prepared refs are invisible to served readers.</text>
  <text x="555" y="524" class="note">The per-repo session gate blocks concurrent local observation.</text>
  <text x="555" y="543" class="note">A changed expected-old OID aborts; user commits are never rebased.</text>
  <line x1="465" y1="580" x2="1105" y2="580" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><text x="785" y="570" class="msg">6 · content-create immutable candidate batch</text>
  <line x1="465" y1="620" x2="1105" y2="620" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/><text x="785" y="608" class="msg">7 · UPDATE head IF exact prior version matches</text>
  <rect x="865" y="635" width="475" height="58" rx="6" fill="rgba(76,29,149,.24)" stroke="#a78bfa"/>
  <text x="1102.5" y="657" class="msg">LINEARIZATION POINT</text><text x="1102.5" y="677" class="ret">head selects one immutable batch; ambiguous result is resolved by batch ID</text>
  <line x1="1105" y1="715" x2="465" y2="715" stroke="#64748b" stroke-width="1" stroke-dasharray="6 3" marker-end="url(#arrow)"/><text x="785" y="707" class="ret">committed head generation + version token</text>
  <line x1="465" y1="750" x2="775" y2="750" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/><text x="620" y="740" class="msg">8 · commit local refs; quarantine cache on failure</text>
  <line x1="465" y1="785" x2="145" y2="785" stroke="#22d3ee" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrow-cyan)"/><text x="305" y="775" class="msg">9 · report push success</text>
  <line x1="465" y1="820" x2="1430" y2="820" stroke="#fb923c" stroke-width="1.4" marker-end="url(#arrow-open)"/><text x="947" y="810" class="msg">10 · async authenticated warm-up hint · loss is safe</text>

  <line x1="40" y1="855" x2="1610" y2="855" stroke="#334155" stroke-width="1"/>
  <text x="40" y="885" class="section" fill="#22d3ee">READ AFTER ACK</text>
  <rect x="445" y="900" width="40" height="170" rx="3" fill="rgba(8,51,68,.45)" stroke="#22d3ee"/>
  <rect x="765" y="980" width="20" height="90" rx="3" fill="rgba(6,78,59,.35)" stroke="#34d399"/>
  <rect x="1095" y="930" width="20" height="90" rx="3" fill="rgba(76,29,149,.4)" stroke="#a78bfa"/>
  <line x1="145" y1="920" x2="465" y2="920" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/><text x="305" y="910" class="msg">fetch / clone discovery</text>
  <line x1="465" y1="955" x2="1105" y2="955" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/><text x="785" y="945" class="msg">conditional GET head with cached version</text>
  <rect x="545" y="975" width="670" height="100" rx="5" fill="none" stroke="#64748b" stroke-dasharray="4 3"/>
  <rect x="545" y="975" width="55" height="18" rx="4" fill="rgba(30,41,59,.8)" stroke="#64748b"/><text x="572.5" y="988" class="note" text-anchor="middle">alt</text>
  <text x="615" y="989" class="note">[unchanged] serve local Git at the proven sequence</text>
  <line x1="545" y1="1023" x2="1215" y2="1023" stroke="#64748b" stroke-dasharray="4 3"/>
  <text x="560" y="1040" class="note">[advanced] fetch batches/entries/packs → apply under repo gate → serve</text>
  <line x1="465" y1="1090" x2="775" y2="1090" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/><text x="620" y="1080" class="msg">git-upload-pack on verified local state</text>
  <line x1="465" y1="1125" x2="145" y2="1125" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow-cyan)"/><text x="305" y="1115" class="msg">refs / pack stream includes push or later state</text>

  <text x="40" y="1160" class="legend">Durability precedes head CAS. Head CAS precedes acknowledgement. Every later read performs its own freshness operation.</text>
</svg>
