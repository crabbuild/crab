<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Crab Continuity node components</title>
  <desc id="desc">A Continuity node has an isolated request-serving plane and an optimization plane. Both share a repository session gate and disposable NVMe repository pool. Only validated commit and compaction paths may update the object-store commit head.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#64748b"/></marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#fb923c"/></marker>
  </defs>
  <style>
      text{font-family:monospace}.title{font-size:22px;font-weight:700;fill:#f8fafc}.subtitle{font-size:10px;fill:#94a3b8}.region{fill:none;stroke-width:1;stroke-dasharray:8 4}.region-label{font-size:10px;font-weight:600}.name{font-size:11px;font-weight:600;fill:#f8fafc;text-anchor:middle}.copy{font-size:8.5px;fill:#94a3b8;text-anchor:middle}.tiny{font-size:8px;fill:#94a3b8}.box{stroke-width:1.5}.arrow-label{font-size:8px;fill:#cbd5e1;text-anchor:middle}.legend{font-size:8px;fill:#cbd5e1}
  </style>
  <rect width="1600" height="1100" fill="#0f172a"/><rect width="1600" height="1100" fill="url(#grid)"/>
  <text x="40" y="46" class="title">Crab Continuity node · component boundaries</text>
  <text x="40" y="68" class="subtitle">Per-request correctness tasks are isolated from lossy optimization tasks; local repository mutation is serialized by a per-repo gate.</text>

  <rect x="35" y="120" width="190" height="790" rx="12" class="region" stroke="#22d3ee"/><text x="50" y="143" class="region-label" fill="#22d3ee">External inputs</text>
  <rect x="255" y="100" width="1030" height="870" rx="14" class="region" stroke="#34d399"/><text x="275" y="125" class="region-label" fill="#34d399">crab-continuity-server process</text>
  <rect x="290" y="155" width="960" height="395" rx="10" class="region" stroke="#22d3ee"/><text x="305" y="179" class="region-label" fill="#22d3ee">Request-serving plane · correctness path</text>
  <rect x="290" y="590" width="960" height="320" rx="10" class="region" stroke="#fb923c"/><text x="305" y="614" class="region-label" fill="#fb923c">Optimization / operations plane</text>
  <rect x="1320" y="120" width="245" height="790" rx="12" class="region" stroke="#a78bfa"/><text x="1335" y="143" class="region-label" fill="#a78bfa">External dependencies</text>

  <!-- Connections -->
  <path d="M190 245H330" fill="none" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <path d="M190 365H330" fill="none" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrow-cyan)"/>
  <path d="M190 720H315V680H350" fill="none" stroke="#fb923c" stroke-width="1.4" marker-end="url(#arrow-orange)"/>
  <path d="M490 245H545" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M490 365H545" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M725 245H785" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M725 365H785" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M965 245H1015" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M965 365H1015" fill="none" stroke="#64748b" stroke-width="1.4" marker-end="url(#arrow)"/>
  <path d="M1015 420H990V470H635V400" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow-violet)"/>
  <path d="M1195 245H1360" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <path d="M1195 365H1360" fill="none" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#arrow-violet)"/>
  <path d="M590 680H650" fill="none" stroke="#fb923c" stroke-width="1.4" marker-end="url(#arrow-orange)"/>
  <path d="M830 680H890" fill="none" stroke="#fb923c" stroke-width="1.4" marker-end="url(#arrow-orange)"/>
  <path d="M1070 680H1130" fill="none" stroke="#fb923c" stroke-width="1.4" marker-end="url(#arrow-orange)"/>
  <path d="M740 645V570H1230V305H1105V290" fill="none" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
  <path d="M980 645V535H1150V445" fill="none" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
  <path d="M1210 845H1300V720H1360" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- External inputs -->
  <g><rect x="65" y="210" width="125" height="70" rx="7" fill="#0f172a"/><rect x="65" y="210" width="125" height="70" rx="7" class="box" fill="rgba(8,51,68,.4)" stroke="#22d3ee"/><text x="127.5" y="240" class="name">Git read</text><text x="127.5" y="259" class="copy">clone / fetch</text></g>
  <g><rect x="65" y="330" width="125" height="70" rx="7" fill="#0f172a"/><rect x="65" y="330" width="125" height="70" rx="7" class="box" fill="rgba(8,51,68,.4)" stroke="#22d3ee"/><text x="127.5" y="360" class="name">Git push</text><text x="127.5" y="379" class="copy">receive-pack</text></g>
  <g><rect x="65" y="685" width="125" height="70" rx="7" fill="#0f172a"/><rect x="65" y="685" width="125" height="70" rx="7" class="box" fill="rgba(251,146,60,.18)" stroke="#fb923c"/><text x="127.5" y="715" class="name">Discovery</text><text x="127.5" y="734" class="copy">healthy nodes</text></g>

  <!-- Request plane -->
  <g><rect x="330" y="210" width="160" height="70" rx="7" fill="#0f172a"/><rect x="330" y="210" width="160" height="70" rx="7" class="box" fill="rgba(8,51,68,.4)" stroke="#22d3ee"/><text x="410" y="238" class="name">Smart HTTP + auth</text><text x="410" y="258" class="copy">limits · correlation · drain</text></g>
  <g><rect x="330" y="330" width="160" height="70" rx="7" fill="#0f172a"/><rect x="330" y="330" width="160" height="70" rx="7" class="box" fill="rgba(8,51,68,.4)" stroke="#22d3ee"/><text x="410" y="358" class="name">Smart HTTP + auth</text><text x="410" y="378" class="copy">push admission</text></g>
  <g><rect x="545" y="210" width="180" height="70" rx="7" fill="#0f172a"/><rect x="545" y="210" width="180" height="70" rx="7" class="box" fill="rgba(6,78,59,.4)" stroke="#34d399"/><text x="635" y="238" class="name">Freshness + catch-up</text><text x="635" y="258" class="copy">conditional head proof</text></g>
  <g><rect x="545" y="330" width="180" height="70" rx="7" fill="#0f172a"/><rect x="545" y="330" width="180" height="70" rx="7" class="box" fill="rgba(6,78,59,.4)" stroke="#34d399"/><text x="635" y="358" class="name">Push orchestrator</text><text x="635" y="378" class="copy">stage · prepare · commit</text></g>
  <g><rect x="785" y="210" width="180" height="70" rx="7" fill="#0f172a"/><rect x="785" y="210" width="180" height="70" rx="7" class="box" fill="rgba(6,78,59,.4)" stroke="#34d399"/><text x="875" y="238" class="name">Repository session gate</text><text x="875" y="258" class="copy">shared read lease</text></g>
  <g><rect x="785" y="330" width="180" height="70" rx="7" fill="#0f172a"/><rect x="785" y="330" width="180" height="70" rx="7" class="box" fill="rgba(6,78,59,.4)" stroke="#34d399"/><text x="875" y="358" class="name">Repository session gate</text><text x="875" y="378" class="copy">exclusive ref phase</text></g>
  <g><rect x="1015" y="190" width="180" height="100" rx="8" fill="#0f172a"/><rect x="1015" y="190" width="180" height="100" rx="8" class="box" fill="rgba(76,29,149,.4)" stroke="#a78bfa"/><text x="1105" y="220" class="name">NVMe repository pool</text><text x="1105" y="242" class="copy">bare Git repos · refcounts</text><text x="1105" y="262" class="copy">single-flight materialization</text></g>
  <g><rect x="1015" y="320" width="180" height="125" rx="8" fill="#0f172a"/><rect x="1015" y="320" width="180" height="125" rx="8" class="box" fill="rgba(6,78,59,.4)" stroke="#34d399"/><text x="1105" y="350" class="name">Git process adapter</text><text x="1105" y="374" class="copy">quarantine · index-pack</text><text x="1105" y="394" class="copy">ref prepare/commit/abort</text><text x="1105" y="414" class="copy">upload-pack · fsck</text></g>

  <!-- Optimization plane -->
  <g><rect x="350" y="645" width="240" height="70" rx="7" fill="#0f172a"/><rect x="350" y="645" width="240" height="70" rx="7" class="box" fill="rgba(120,53,15,.3)" stroke="#fbbf24"/><text x="470" y="675" class="name">Membership + route calculator</text><text x="470" y="694" class="copy">pure rendezvous ranking</text></g>
  <g><rect x="650" y="645" width="180" height="115" rx="8" fill="#0f172a"/><rect x="650" y="645" width="180" height="115" rx="8" class="box" fill="rgba(251,146,60,.18)" stroke="#fb923c"/><text x="740" y="675" class="name">Hint agent</text><text x="740" y="698" class="copy">authenticated · bounded</text><text x="740" y="718" class="copy">drop-safe warm-up</text><text x="740" y="738" class="copy">no correctness state</text></g>
  <g><rect x="890" y="645" width="180" height="115" rx="8" fill="#0f172a"/><rect x="890" y="645" width="180" height="115" rx="8" class="box" fill="rgba(251,146,60,.18)" stroke="#fb923c"/><text x="980" y="675" class="name">Compaction scheduler</text><text x="980" y="698" class="copy">low-priority repo lease</text><text x="980" y="718" class="copy">snapshot + segment</text><text x="980" y="738" class="copy">same compare/append</text></g>
  <g><rect x="1130" y="645" width="80" height="115" rx="8" fill="#0f172a"/><rect x="1130" y="645" width="80" height="115" rx="8" class="box" fill="rgba(251,146,60,.18)" stroke="#fb923c"/><text x="1170" y="680" class="name">Evict</text><text x="1170" y="704" class="copy">refcount</text><text x="1170" y="722" class="copy">+ budget</text></g>
  <g><rect x="350" y="815" width="240" height="60" rx="7" fill="#0f172a"/><rect x="350" y="815" width="240" height="60" rx="7" class="box" fill="rgba(30,41,59,.5)" stroke="#94a3b8"/><text x="470" y="842" class="name">Admin / health / drain</text><text x="470" y="860" class="copy">separate authenticated listener</text></g>
  <g><rect x="650" y="815" width="240" height="60" rx="7" fill="#0f172a"/><rect x="650" y="815" width="240" height="60" rx="7" class="box" fill="rgba(30,41,59,.5)" stroke="#94a3b8"/><text x="770" y="842" class="name">Bounded resource budgets</text><text x="770" y="860" class="copy">CPU · disk · network · store</text></g>
  <g><rect x="950" y="815" width="260" height="60" rx="7" fill="#0f172a"/><rect x="950" y="815" width="260" height="60" rx="7" class="box" fill="rgba(30,41,59,.5)" stroke="#94a3b8"/><text x="1080" y="842" class="name">Metrics / logs / evidence</text><text x="1080" y="860" class="copy">safe dimensions · no repo content</text></g>

  <!-- External dependencies -->
  <g><rect x="1360" y="190" width="165" height="330" rx="9" fill="#0f172a"/><rect x="1360" y="190" width="165" height="330" rx="9" class="box" fill="rgba(76,29,149,.4)" stroke="#a78bfa"/><text x="1442.5" y="225" class="name">Object store</text><text x="1442.5" y="255" class="copy">conditional head</text><text x="1442.5" y="278" class="copy">commit batches</text><text x="1442.5" y="301" class="copy">entries + packs</text><text x="1442.5" y="324" class="copy">segments + snapshots</text><line x1="1380" y1="350" x2="1505" y2="350" stroke="#6d5aa7"/><text x="1442.5" y="382" class="copy">only durable truth</text><text x="1442.5" y="405" class="copy">version retention</text><text x="1442.5" y="428" class="copy">provider preflight</text><text x="1442.5" y="470" class="copy" fill="#ddd6fe">head UPDATE</text><text x="1442.5" y="490" class="copy" fill="#ddd6fe">immutable CREATE</text></g>
  <g><rect x="1360" y="550" width="165" height="80" rx="7" fill="#0f172a"/><rect x="1360" y="550" width="165" height="80" rx="7" class="box" fill="rgba(120,53,15,.3)" stroke="#fbbf24"/><text x="1442.5" y="580" class="name">Discovery API</text><text x="1442.5" y="600" class="copy">workload identity</text></g>
  <g><rect x="1360" y="680" width="165" height="80" rx="7" fill="#0f172a"/><rect x="1360" y="680" width="165" height="80" rx="7" class="box" fill="rgba(30,41,59,.5)" stroke="#94a3b8"/><text x="1442.5" y="710" class="name">Telemetry backend</text><text x="1442.5" y="730" class="copy">not in request truth</text></g>

  <text x="40" y="1020" class="legend">Request rule: freshen → acquire repo lease → serve/apply. Optimization rule: yield under pressure; never bypass compare/append.</text>
  <text x="40" y="1044" class="legend">Failure rule: after head CAS, a local apply failure quarantines the cache; another node can reconstruct from committed object-store state.</text>
</svg>
