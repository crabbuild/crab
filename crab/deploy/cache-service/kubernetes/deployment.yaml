# Kubernetes Deployment for crab-cache-server.
#
# Prerequisites:
#   - ConfigMap "crab-cache-config" with config.toml (see configmap.yaml)
#   - A PersistentVolume or hostPath for NVMe cache storage
#   - TLS secrets mounted if using cache-server TLS
#
# Apply:
#   kubectl apply -f kubernetes/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: crab-cache-server
  labels:
    app: crab-cache-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: crab-cache-server
  template:
    metadata:
      labels:
        app: crab-cache-server
    spec:
      containers:
        - name: crab-cache-server
          image: crab-cache-server:latest
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          args:
            - "--config"
            - "/etc/crab-cache-server/config.toml"

          # Liveness: unconditional — restarts only if the process is stuck.
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: checks origin connectivity — removes from Service
          # endpoints when the origin is unreachable.
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"

          volumeMounts:
            # NVMe-backed cache storage.
            - name: cache-data
              mountPath: /data/crab-cache
            # Config file from ConfigMap.
            - name: config
              mountPath: /etc/crab-cache-server
              readOnly: true

          env:
            # Cloud credentials — inject via Secret or IRSA/Workload Identity.
            - name: AWS_REGION
              value: "us-east-1"

      volumes:
        # NVMe cache volume — use a PVC backed by local NVMe storage class,
        # or a hostPath for single-node deployments.
        - name: cache-data
          persistentVolumeClaim:
            claimName: crab-cache-data
        # Config from ConfigMap.
        - name: config
          configMap:
            name: crab-cache-config
