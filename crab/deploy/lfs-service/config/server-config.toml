# Production-oriented starting point for crab-lfs-server.
# Replace every example value before startup. Keep this file and the policy
# file outside the image and provide origin credentials through workload
# identity, an instance role, or a secret manager.

[server]
listen_addr = "0.0.0.0:8444"
public_url = "https://lfs.example.com"
spool_dir = "/var/lib/crab-lfs/spool"
policy_path = "/etc/crab-lfs/policy.yaml"
max_batch_objects = 1000
max_object_bytes = 68719476736
max_uploads = 8
# Aggregate bytes that may exist in upload spool files at once.
max_spool_bytes = 549755813888
# Process-local request admission; 429 responses include Retry-After.
max_requests_per_second = 5000
request_burst = 10000
request_timeout_secs = 3600
# Prefer an environment variable in production so the secret is not stored in
# the configuration volume.
# action_secret = "replace-with-a-long-random-secret"
action_ttl_secs = 900

[auth]
mechanism = "basic"
# Replace the example with a scrypt PHC hash generated from a unique password.
[auth.users]
operator = "$scrypt$ln=16,r=8,p=1$aM15713r3Xsvxbi31lqr1Q$nFNh2CVHVjNldFVKDHDlm4CbdRSCdEBsjjJxD+iCs5E"

[origin]
url = "s3://replace-with-your-crab-bucket"
