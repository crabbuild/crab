---
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: tls-combined-portable-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  CRAB_RELEASE_ARCHIVE: crab-protocol-v2-linux-x86_64.tar.gz
  CRAB_RELEASE_ARTIFACT: crab-protocol-v2-linux-x86_64-42649451866
name: Combined TLS portable certificate qualification
jobs:
  verify-original-contracts:
    name: Verify original immutable build and completed contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: 0
    - name: Verify source reuse and original results
      env:
        GH_TOKEN: "${{ github.token }}"
      run: |
        set -euo pipefail
        git diff --quiet 7553a760cc0f4b9b80667864ff23ec1df059493c "$GITHUB_SHA" -- . ':(exclude).github'
        gh api repos/crabbuild/crab/actions/runs/42649451866 > "$RUNNER_TEMP/original-run.json"
        gh api 'repos/crabbuild/crab/actions/runs/42649451866/jobs?per_page=100' > "$RUNNER_TEMP/original-jobs.json"
        python3 - <<'PYCODE'
        import json, os
        from pathlib import Path
        root = Path(os.environ['RUNNER_TEMP'])
        run = json.loads((root/'original-run.json').read_text())
        assert run['head_sha'] == '7553a760cc0f4b9b80667864ff23ec1df059493c'
        assert run['status'] == 'completed' and run['conclusion'] == 'failure'
        jobs = {job['id']: job for job in json.loads((root/'original-jobs.json').read_text())['jobs']}
        for job_id in [129271535865, 129271536312, 129271536245, 129271536364, 129271536702]:
            assert jobs[job_id]['conclusion'] == 'success', jobs[job_id]['name']
        mac = jobs[129271536528]
        assert mac['conclusion'] == 'failure'
        steps = {step['name']: step for step in mac['steps']}
        assert steps['Run complete Capsule push and pack contracts']['conclusion'] == 'success'
        assert steps['Verify actual linked TLS and certificate contracts']['conclusion'] == 'failure'
        assert [step['name'] for step in mac['steps'] if step['conclusion'] == 'failure'] == ['Verify actual linked TLS and certificate contracts']
        paired = [job for job in jobs.values() if job['name'].startswith('Paired existing-ref')]
        assert paired and all(job['conclusion'] == 'skipped' for job in paired)
        print('Original source, immutable build, upstream checks, platform core checks and skipped performance jobs verified')
        PYCODE
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: original-tls-gates-${{ github.run_id }}
        path: "${{ runner.temp }}/original-*.json\n"
        if-no-files-found: error
        retention-days: 3
  tls-contracts:
    name: Portable certificate contracts (${{ matrix.os }})
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          cargo_args: "--features gix-transport"
        - os: macos-15
          cargo_args: "--no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport,testing"
        - os: windows-2022
          cargo_args: "--no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport,testing"
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: 1.99.1
        components: rustfmt, clippy
    - name: Record platform Git and compiler
      run: |
        git --version
        rustc -Vv
        cargo fmt --version
        cargo clippy --version
    - name: Install existing Linux build dependencies
      run: sudo apt-get update -y && sudo apt-get install -y libfuse3-dev
      if: runner.os == 'Linux'
    - name: Build libraries and verify real TLS with owned certificate configuration
      run: |
        set -euo pipefail
        export CARGO_TARGET_DIR="$RUNNER_TEMP/crab-tls-portable-contracts"
        git --version > "$RUNNER_TEMP/tls-portable-toolchain.log"
        rustc -Vv >> "$RUNNER_TEMP/tls-portable-toolchain.log"
        openssl version >> "$RUNNER_TEMP/tls-portable-toolchain.log"
        cargo build -p crab --lib --locked ${{ matrix.cargo_args }} --message-format=json > "$RUNNER_TEMP/tls-portable-build.jsonl"
        python3 -B .github/profile/run_native_cert_contract.py --artifacts "$RUNNER_TEMP/tls-portable-build.jsonl" --root "$RUNNER_TEMP/tls-portable-contract"
        cargo fmt --all -- --check
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tls-portable-contracts-${{ matrix.os }}-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/tls-portable-contract/*.json
          ${{ runner.temp }}/tls-portable-contract/*.log
          ${{ runner.temp }}/tls-portable-build.jsonl
          ${{ runner.temp }}/tls-portable-toolchain.log
        if-no-files-found: error
        retention-days: 3
  paired-existing-ref-performance:
    name: Paired existing-ref throughput (${{ matrix.client }})
    if: github.event_name == 'workflow_dispatch'
    needs:
    - verify-original-contracts
    - tls-contracts
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        client:
        - native
        - git
    env:
      PAIR_CLIENT: "${{ matrix.client }}"
      PAIR_CONTROL_RUN: '42570788923'
      PAIR_CONTROL_SOURCE: 4a27de3de1757b716a1694c65a266c2afefc4412
      PAIR_CANDIDATE_SOURCE: 7553a760cc0f4b9b80667864ff23ec1df059493c
    steps:
    - uses: actions/checkout@v4
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
    - name: Install fixture dependencies
      run: |
        {
          echo "PAIR_ROOT=$RUNNER_TEMP/crab-paired-$PAIR_CLIENT"
          echo "PAIR_SOURCE=$RUNNER_TEMP/Github/curl/curl"
          echo "PAIR_CONTROL=$RUNNER_TEMP/paired-control/crab"
          echo "PAIR_CANDIDATE=$RUNNER_TEMP/paired-candidate/crab"
        } >> "$GITHUB_ENV"
        sudo apt-get update -y
        sudo apt-get install -y curl libfuse3-dev pipx
        pipx install awscli
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - uses: actions/download-artifact@v4
      with:
        name: "${{ env.CRAB_RELEASE_ARTIFACT }}"
        path: "${{ runner.temp }}/candidate-archive"
        run-id: 42649451866
        github-token: "${{ github.token }}"
    - uses: actions/download-artifact@v4
      with:
        name: crab-relr-normal-42570788923
        run-id: 42570788923
        github-token: "${{ github.token }}"
        path: "${{ runner.temp }}/control-archive"
    - name: Verify artifact sources and prepare pinned Git history
      env:
        GH_TOKEN: "${{ github.token }}"
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$PAIR_CONTROL")" "$(dirname "$PAIR_CANDIDATE")" "$(dirname "$PAIR_SOURCE")"
        tar -xzf "$RUNNER_TEMP/candidate-archive/${CRAB_RELEASE_ARCHIVE}" -C "$(dirname "$PAIR_CANDIDATE")"
        tar -xzf "$RUNNER_TEMP/control-archive/crab-relr-normal.tar.gz" -C "$(dirname "$PAIR_CONTROL")"
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAIR_CONTROL_RUN" \
          --jq '{head_sha: .head_sha, run_id: .id, path: .path, conclusion: .conclusion}' > "$RUNNER_TEMP/control-source.json"
        python3 - <<'PYCODE'
        import hashlib, json, os
        from pathlib import Path
        record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'control-source.json').read_text())
        assert record['head_sha'] == os.environ['PAIR_CONTROL_SOURCE'] and record['conclusion'] == 'success'
        control = json.loads((Path(os.environ['PAIR_CONTROL']).parent / 'candidate-build.json').read_text())
        candidate = json.loads((Path(os.environ['PAIR_CANDIDATE']).parent / 'candidate-build.json').read_text())
        assert control['source'] == record['head_sha'] and candidate['source'] == os.environ['PAIR_CANDIDATE_SOURCE']
        assert control['compiler'] == candidate['compiler'] and 'rustc 1.99.1 ' in control['compiler']
        assert control['features'] == candidate['features'] == 'default,gix-transport'
        assert control['rustflags'] == candidate['rustflags'] == ''
        assert control['sha256'] == '574e2a85b5397e5ad3711fe5908c23863e614224110911f67ba844be23aefa03'
        assert candidate['sha256'] == '22485f8ad48cb0cf68187dc6d1f4c28637f21f64800dde8269d928d0428a6b03'
        for build, variable in [(control, 'PAIR_CONTROL'), (candidate, 'PAIR_CANDIDATE')]:
            assert build['sha256'] == hashlib.file_digest(Path(os.environ[variable]).open('rb'), 'sha256').hexdigest()
        PYCODE
        "$PAIR_CONTROL" version | grep -F "$PAIR_CONTROL_SOURCE"
        "$PAIR_CANDIDATE" version | grep -F "$PAIR_CANDIDATE_SOURCE"
        git clone --no-checkout https://github.com/curl/curl.git "$PAIR_SOURCE"
        git -C "$PAIR_SOURCE" checkout --detach 70c084a0123b468fe7078e3fc72c78e1b66394b6
    - name: Compare identical 1, 10 and 50-client workloads in ABBA order
      run: python3 -B crab/scripts/e2e/run_paired_existing_ref_push_rustfs.py
    - name: Enforce the original native median budget in both candidate trials
      if: matrix.client == 'native'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        rows = json.loads((Path(os.environ['PAIR_ROOT']) / 'results.json').read_text())
        candidates = [row for row in rows if row['variant'] == 'candidate']
        assert len(candidates) == 6
        assert all(row['p50_ms'] < 500 for row in candidates), candidates
        PY
    - name: Stop only this comparison's fixtures
      if: always()
      run: |
        docker ps -aq --filter "label=crab-paired=$GITHUB_RUN_ID-$PAIR_CLIENT" \
          | xargs -r docker rm -f
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: paired-push-${{ matrix.client }}-${{ github.run_id }}
        path: |
          ${{ env.PAIR_ROOT }}/*.json
          ${{ env.PAIR_ROOT }}/*.log
          ${{ env.PAIR_ROOT }}/*/paired-writers-*/artifacts/**
          ${{ env.PAIR_ROOT }}/*/paired-writers-*/logs/**
          ${{ runner.temp }}/control-source.json
          ${{ runner.temp }}/paired-candidate/candidate-build.json
          ${{ runner.temp }}/paired-control/candidate-build.json
        if-no-files-found: error
