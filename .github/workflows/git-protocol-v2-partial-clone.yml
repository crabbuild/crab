name: Temporary native push Git child inventory
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: git-child-inventory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: crab
      AWS_SECRET_ACCESS_KEY: crab
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:19280
      NO_PROXY: 127.0.0.1,localhost
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Prepare isolated fixture dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl libfuse3-dev pipx
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "INVENTORY_ROOT=$RUNNER_TEMP/git-child-inventory" >> "$GITHUB_ENV"
          echo "TRACE_CRAB_REAL_BIN=$RUNNER_TEMP/git-child-binary/crab" >> "$GITHUB_ENV"
          echo "TRACE_CRAB_OUTPUT=$RUNNER_TEMP/git-child-inventory/traces" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: crab-relr-normal-42570788923
          run-id: 42570788923
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/git-child-archive
      - name: Verify frozen normal artifact and pinned source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$TRACE_CRAB_REAL_BIN")" "$INVENTORY_ROOT"
          tar -xzf "$RUNNER_TEMP/git-child-archive/crab-relr-normal.tar.gz" -C "$(dirname "$TRACE_CRAB_REAL_BIN")"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          binary = Path(os.environ['TRACE_CRAB_REAL_BIN'])
          build = json.loads((binary.parent / 'candidate-build.json').read_text())
          assert build['source'] == '4a27de3de1757b716a1694c65a266c2afefc4412'
          assert build['variant'] == 'normal' and build['rustflags'] == ''
          assert build['features'] == 'default,gix-transport'
          assert build['sha256'] == '574e2a85b5397e5ad3711fe5908c23863e614224110911f67ba844be23aefa03'
          assert build['sha256'] == hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest()
          proof = {'purpose': 'Untimed diagnostic only', 'build': build,
              'diagnostic_source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'git': subprocess.check_output(['git', '--version'], text=True).strip(),
              'launcher_sha256': hashlib.sha256(Path('.github/profile/trace_native_git.py').read_bytes()).hexdigest()}
          (Path(os.environ['INVENTORY_ROOT']) / 'inventory-build.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY
          "$TRACE_CRAB_REAL_BIN" version | grep -F 4a27de3de1757b716a1694c65a266c2afefc4412
          chmod +x .github/profile/trace_native_git.py
          mkdir -p "$RUNNER_TEMP/Github/curl"
          git clone --no-checkout https://github.com/curl/curl.git "$RUNNER_TEMP/Github/curl/curl"
          git -C "$RUNNER_TEMP/Github/curl/curl" checkout --detach 70c084a0123b468fe7078e3fc72c78e1b66394b6
      - name: Start private pinned RustFS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$INVENTORY_ROOT/data"
          sudo chown 10001:10001 "$INVENTORY_ROOT/data"
          image=rustfs/rustfs@sha256:040304b66e029a5cde4bed140b41513e925909839a9b912a40a98340610d1f66
          docker run -d --name crab-git-child-inventory --label "crab-git-child=$GITHUB_RUN_ID" \
            -p 127.0.0.1:19280:9000 -e RUSTFS_ACCESS_KEY=crab -e RUSTFS_SECRET_KEY=crab \
            -v "$INVENTORY_ROOT/data:/data" "$image" server /data --address :9000
          docker image inspect "$image" > "$INVENTORY_ROOT/rustfs-image.json"
          for _ in $(seq 1 120); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:19280/health/ready || true)"
            if [ "$status" = 200 ]; then exit 0; fi
            sleep 0.5
          done
          exit 1
      - name: Inventory Git children of real native pushes
        run: |
          python3 -B crab/scripts/e2e/run_existing_ref_push_rustfs.py \
            --root "$INVENTORY_ROOT/fixture" --run-id git-child-writers-1 \
            --bucket crab-git-child-inventory --endpoint-url "$AWS_ENDPOINT_URL" \
            --crab-bin "$GITHUB_WORKSPACE/.github/profile/trace_native_git.py" \
            --source "$RUNNER_TEMP/Github/curl/curl" --push-client native \
            --agents 1 --branch-update-rounds 1 --max-parallel-pushes 1 \
            --consumer-mode cold-final --skip-same-branch --no-request-capture \
            --timeout 600 --push-timeout 600
      - name: Capture and stop this fixture
        if: always()
        run: |
          mkdir -p "$INVENTORY_ROOT"
          docker logs crab-git-child-inventory > "$INVENTORY_ROOT/rustfs.log" 2>&1 || true
          docker ps -aq --filter "label=crab-git-child=$GITHUB_RUN_ID" | xargs -r docker rm -f
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-git-child-inventory-${{ github.run_id }}
          path: |
            ${{ env.INVENTORY_ROOT }}/inventory-build.json
            ${{ env.INVENTORY_ROOT }}/traces/**
            ${{ env.INVENTORY_ROOT }}/fixture/**/artifacts/**
            ${{ env.INVENTORY_ROOT }}/fixture/**/logs/**
            ${{ env.INVENTORY_ROOT }}/rustfs-image.json
            ${{ env.INVENTORY_ROOT }}/rustfs.log
          if-no-files-found: error
          retention-days: 3
