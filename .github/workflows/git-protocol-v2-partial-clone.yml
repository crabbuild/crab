name: Linux CLI startup diagnostic

on:
  workflow_dispatch:
    inputs:
      control_run:
        description: Verified protocol release artifact run to diagnose
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: startup-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostic tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libfuse3-dev binutils strace time
      - uses: actions/download-artifact@v4
        with:
          name: crab-protocol-v2-linux-x86_64-${{ inputs.control_run }}
          run-id: ${{ inputs.control_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/startup-archive
      - name: Verify artifact and prepare isolated repository
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_RUN: ${{ inputs.control_run }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_RUN" =~ ^[0-9]+$ ]]
          root="$RUNNER_TEMP/crab-startup"
          mkdir -p "$root/bin" "$root/evidence" "$root/repo" "$root/tmp"
          tar -xzf "$RUNNER_TEMP/startup-archive/crab-protocol-v2-linux-x86_64.tar.gz" -C "$root/bin"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN" --jq .head_sha > "$root/evidence/source.sha"
          ROOT="$root" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          build=json.loads((root/'bin/candidate-build.json').read_text())
          assert build['source']==(root/'evidence/source.sha').read_text().strip()
          assert hashlib.file_digest((root/'bin/crab').open('rb'),'sha256').hexdigest()==build['sha256']
          (root/'evidence/build.json').write_text(json.dumps(build,indent=2)+'\n')
          PY
          git -C "$root/repo" init -b main
          git -C "$root/repo" -c user.name=Qualification -c user.email=qualification@example.invalid commit --allow-empty -m seed
          git -C "$root/repo" remote add origin crab://startup-diagnostic/repository
          echo "STARTUP_ROOT=$root" >> "$GITHUB_ENV"
      - name: Measure unchanged release startup at 1, 10 and 50 clients
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,math,os,resource,subprocess,threading,time
          from pathlib import Path
          root=Path(os.environ['STARTUP_ROOT']);binary=root/'bin/crab';repo=root/'repo'
          env=os.environ|{'GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':os.devnull,'CRAB_CACHE_DIR':str(root/'cache'),'TMPDIR':str(root/'tmp')}
          commands={'launch':['/usr/bin/true'],'version':[str(binary),'version'],'version-flag':[str(binary),'--version'],'root-help':[str(binary),'--help'],'dry-run':[str(binary),'push','--dry-run','--json','origin','HEAD:refs/heads/main']}
          def cpu(who):
              r=resource.getrusage(who);return r.ru_utime+r.ru_stime
          rows=[]
          for argv in commands.values():subprocess.run(argv,cwd=repo,env=env,capture_output=True,check=True)
          for actors in [1,10,50]:
              values={k:[] for k in commands};costs={k:{'child_cpu_seconds':0,'parent_cpu_seconds':0} for k in commands}
              for wave in range(100//actors):
                  names=list(commands);names=names[wave%len(names):]+names[:wave%len(names)]
                  for name in names:
                      barrier=threading.Barrier(actors)
                      def run(_):
                          barrier.wait(timeout=30);start=time.perf_counter_ns()
                          result=subprocess.run(commands[name],cwd=repo,env=env,capture_output=True,timeout=60)
                          elapsed=(time.perf_counter_ns()-start)/1e6
                          assert result.returncode==0,(name,result.returncode)
                          return elapsed
                      c,p=cpu(resource.RUSAGE_CHILDREN),cpu(resource.RUSAGE_SELF)
                      with concurrent.futures.ThreadPoolExecutor(max_workers=actors) as pool:values[name].extend(pool.map(run,range(actors)))
                      costs[name]['child_cpu_seconds']+=cpu(resource.RUSAGE_CHILDREN)-c
                      costs[name]['parent_cpu_seconds']+=cpu(resource.RUSAGE_SELF)-p
              for name,v in values.items():
                  v.sort();assert len(v)==100
                  row={'actors':actors,'probe':name,'samples':len(v),'p50_ms':v[49],'p95_ms':v[94],'max_ms':v[-1],**costs[name]}
                  rows.append(row);print(json.dumps(row),flush=True)
          output={'scope':'startup diagnostic only; no push performance qualification or storage operations','binary_sha256':hashlib.file_digest(binary.open('rb'),'sha256').hexdigest(),'cohorts':rows}
          (root/'evidence/startup.json').write_text(json.dumps(output,indent=2)+'\n')
          PY
      - name: Inspect ELF loader and system-call work
        run: |
          set -euo pipefail
          cd "$STARTUP_ROOT/repo"
          lscpu > "$STARTUP_ROOT/evidence/cpu.txt"
          readelf -W -d "$STARTUP_ROOT/bin/crab" > "$STARTUP_ROOT/evidence/elf-dynamic.txt"
          readelf -W -S "$STARTUP_ROOT/bin/crab" > "$STARTUP_ROOT/evidence/elf-sections.txt"
          LD_DEBUG=statistics "$STARTUP_ROOT/bin/crab" version > "$STARTUP_ROOT/evidence/version.txt" 2> "$STARTUP_ROOT/evidence/loader-statistics.txt"
          /usr/bin/time -v "$STARTUP_ROOT/bin/crab" version > /dev/null 2> "$STARTUP_ROOT/evidence/time.txt"
          strace -f -c -o "$STARTUP_ROOT/evidence/syscalls.txt" "$STARTUP_ROOT/bin/crab" version > /dev/null
          cat "$STARTUP_ROOT/evidence/loader-statistics.txt"
          cat "$STARTUP_ROOT/evidence/time.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-startup-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/crab-startup/evidence/**
          if-no-files-found: error
          retention-days: 14
