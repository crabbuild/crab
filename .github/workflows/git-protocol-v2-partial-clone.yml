---
name: Temporary paired RELR push qualification
'on':
  workflow_dispatch:
    inputs:
      component_run:
        description: Successful matching normal and RELR component run
        required: true
        default: '42570788923'
        type: string
permissions:
  contents: read
concurrency:
  group: relr-paired-${{ github.ref }}
  cancel-in-progress: false
jobs:
  paired-existing-ref-performance:
    name: Paired existing-ref throughput (${{ matrix.client }})
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        client:
        - native
        - git
    env:
      PAIR_CLIENT: "${{ matrix.client }}"
      PAIR_COMPONENT_RUN: "${{ inputs.component_run }}"
      PAIR_COMPONENT_SOURCE: 4a27de3de1757b716a1694c65a266c2afefc4412
    steps:
    - uses: actions/checkout@v4
      with:
        ref: 4a27de3de1757b716a1694c65a266c2afefc4412
        fetch-depth: 0
    - name: Install fixture dependencies
      run: |
        {
          echo "PAIR_ROOT=$RUNNER_TEMP/crab-paired-$PAIR_CLIENT"
          echo "PAIR_SOURCE=$RUNNER_TEMP/Github/curl/curl"
          echo "PAIR_CONTROL=$RUNNER_TEMP/paired-control/crab"
          echo "PAIR_CANDIDATE=$RUNNER_TEMP/paired-candidate/crab"
        } >> "$GITHUB_ENV"
        sudo apt-get update -y
        sudo apt-get install -y curl libfuse3-dev pipx
        pipx install awscli
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - uses: actions/download-artifact@v4
      with:
        name: crab-relr-relr-${{ inputs.component_run }}
        run-id: "${{ inputs.component_run }}"
        github-token: "${{ github.token }}"
        path: "${{ runner.temp }}/candidate-archive"
    - uses: actions/download-artifact@v4
      with:
        name: crab-relr-normal-${{ inputs.component_run }}
        run-id: "${{ inputs.component_run }}"
        github-token: "${{ github.token }}"
        path: "${{ runner.temp }}/control-archive"
    - uses: actions/download-artifact@v4
      with:
        name: crab-relr-component-proof-${{ inputs.component_run }}
        run-id: "${{ inputs.component_run }}"
        github-token: "${{ github.token }}"
        path: "${{ runner.temp }}/component-proof"
    - name: Verify artifact sources and prepare pinned Git history
      env:
        GH_TOKEN: "${{ github.token }}"
      run: |
        [[ "$PAIR_COMPONENT_RUN" =~ ^[0-9]+$ ]]
        mkdir -p "$(dirname "$PAIR_CONTROL")" "$(dirname "$PAIR_CANDIDATE")" "$(dirname "$PAIR_SOURCE")"
        tar -xzf "$RUNNER_TEMP/candidate-archive/crab-relr-relr.tar.gz" -C "$(dirname "$PAIR_CANDIDATE")"
        tar -xzf "$RUNNER_TEMP/control-archive/crab-relr-normal.tar.gz" -C "$(dirname "$PAIR_CONTROL")"
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAIR_COMPONENT_RUN" \
          --jq '{head_sha: .head_sha, run_id: .id, path: .path, conclusion: .conclusion}' > "$RUNNER_TEMP/component-source.json"
        python3 - <<'PYCODE'
        import hashlib, json, os
        from pathlib import Path
        record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'component-source.json').read_text())
        assert record['head_sha'] == os.environ['PAIR_COMPONENT_SOURCE'] and record['conclusion'] == 'success'
        proof = json.loads((Path(os.environ['RUNNER_TEMP']) / 'component-proof/component-proof.json').read_text())
        for label, key, variable in [('control', 'normal', 'PAIR_CONTROL'), ('candidate', 'relr', 'PAIR_CANDIDATE')]:
            binary = Path(os.environ[variable])
            build = json.loads((binary.parent / 'candidate-build.json').read_text())
            assert build['source'] == record['head_sha'] and build['variant'] == key
            assert build['sha256'] == proof[key]['sha256'] == hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest()
            assert build['compiler'] == proof[key]['compiler'] and build['features'] == proof[key]['features']
        PYCODE
        "$PAIR_CONTROL" version | grep -F "$PAIR_COMPONENT_SOURCE"
        "$PAIR_CANDIDATE" version | grep -F "$PAIR_COMPONENT_SOURCE"
        git clone --no-checkout https://github.com/curl/curl.git "$PAIR_SOURCE"
        git -C "$PAIR_SOURCE" checkout --detach 70c084a0123b468fe7078e3fc72c78e1b66394b6
    - name: Compare identical 1, 10 and 50-client workloads in ABBA order
      run: python3 -B crab/scripts/e2e/run_paired_existing_ref_push_rustfs.py
    - name: Enforce the original native median budget in both candidate trials
      if: matrix.client == 'native'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        rows = json.loads((Path(os.environ['PAIR_ROOT']) / 'results.json').read_text())
        candidates = [row for row in rows if row['variant'] == 'candidate']
        assert len(candidates) == 6
        assert all(row['p50_ms'] < 500 for row in candidates), candidates
        PY
    - name: Stop only this comparison's fixtures
      if: always()
      run: |
        docker ps -aq --filter "label=crab-paired=$GITHUB_RUN_ID-$PAIR_CLIENT" \
          | xargs -r docker rm -f
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: paired-push-${{ matrix.client }}-${{ github.run_id }}
        path: |
          ${{ env.PAIR_ROOT }}/*.json
          ${{ env.PAIR_ROOT }}/*.log
          ${{ env.PAIR_ROOT }}/*/paired-writers-*/artifacts/**
          ${{ env.PAIR_ROOT }}/*/paired-writers-*/logs/**
          ${{ runner.temp }}/component-source.json
          ${{ runner.temp }}/component-proof/component-proof.json
          ${{ runner.temp }}/paired-control/candidate-build.json
          ${{ runner.temp }}/paired-candidate/candidate-build.json
        if-no-files-found: error
