name: Linux CLI startup diagnostic

on:
  workflow_dispatch:
    inputs:
      control_run:
        description: Verified protocol release artifact run to diagnose
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: startup-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install diagnostic tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libfuse3-dev binutils strace time gdb
      - name: Verify pinned rollback release through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rollback="$RUNNER_TEMP/rollback-download"
          mkdir -p "$rollback"
          asset_id="$(gh api repos/crabbuild/crab/releases/tags/v1.0.1 \
            --jq '.assets[] | select(.name == "crab-linux-x86_64.tar.gz") | .id')"
          [[ "$asset_id" =~ ^[0-9]+$ ]]
          gh api -H 'Accept: application/octet-stream' \
            "repos/crabbuild/crab/releases/assets/$asset_id" \
            > "$rollback/crab-linux-x86_64.tar.gz"
          (cd "$rollback" && echo 'd36ef7c1939b40bf700cf7679a3579646b73e50ecc96021a11fa474060acf79f  crab-linux-x86_64.tar.gz' | sha256sum --check --strict)
          tar -xzf "$rollback/crab-linux-x86_64.tar.gz" -C "$rollback"
          "$rollback/crab" version
      - uses: actions/download-artifact@v4
        with:
          name: crab-protocol-v2-linux-x86_64-${{ inputs.control_run }}
          run-id: ${{ inputs.control_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/startup-archive
      - name: Verify artifact and prepare isolated repository
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_RUN: ${{ inputs.control_run }}
        run: |
          set -euo pipefail
          [[ "$CONTROL_RUN" =~ ^[0-9]+$ ]]
          root="$RUNNER_TEMP/crab-startup"
          mkdir -p "$root/bin" "$root/evidence" "$root/repo" "$root/tmp"
          tar -xzf "$RUNNER_TEMP/startup-archive/crab-protocol-v2-linux-x86_64.tar.gz" -C "$root/bin"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN" --jq .head_sha > "$root/evidence/source.sha"
          ROOT="$root" python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['ROOT'])
          build=json.loads((root/'bin/candidate-build.json').read_text())
          assert build['source']==(root/'evidence/source.sha').read_text().strip()
          assert hashlib.file_digest((root/'bin/crab').open('rb'),'sha256').hexdigest()==build['sha256']
          (root/'evidence/build.json').write_text(json.dumps(build,indent=2)+'\n')
          PY
          git -C "$root/repo" init -b main
          git -C "$root/repo" -c user.name=Qualification -c user.email=qualification@example.invalid commit --allow-empty -m seed
          git -C "$root/repo" remote add origin crab://startup-diagnostic/repository
          echo "STARTUP_ROOT=$root" >> "$GITHUB_ENV"
      - name: Measure unchanged release startup at 1, 10 and 50 clients
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,json,math,os,resource,subprocess,threading,time
          from pathlib import Path
          root=Path(os.environ['STARTUP_ROOT']);binary=root/'bin/crab';repo=root/'repo'
          env=os.environ|{'GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':os.devnull,'CRAB_CACHE_DIR':str(root/'cache'),'TMPDIR':str(root/'tmp')}
          commands={'launch':['/usr/bin/true'],'version':[str(binary),'version'],'version-flag':[str(binary),'--version'],'root-help':[str(binary),'--help'],'dry-run':[str(binary),'push','--dry-run','--json','origin','HEAD:refs/heads/main']}
          def cpu(who):
              r=resource.getrusage(who);return r.ru_utime+r.ru_stime
          rows=[]
          for argv in commands.values():subprocess.run(argv,cwd=repo,env=env,capture_output=True,check=True)
          for actors in [1,10,50]:
              values={k:[] for k in commands};costs={k:{'child_cpu_seconds':0,'parent_cpu_seconds':0} for k in commands}
              for wave in range(100//actors):
                  names=list(commands);names=names[wave%len(names):]+names[:wave%len(names)]
                  for name in names:
                      barrier=threading.Barrier(actors)
                      def run(_):
                          barrier.wait(timeout=30);start=time.perf_counter_ns()
                          result=subprocess.run(commands[name],cwd=repo,env=env,capture_output=True,timeout=60)
                          elapsed=(time.perf_counter_ns()-start)/1e6
                          assert result.returncode==0,(name,result.returncode)
                          return elapsed
                      c,p=cpu(resource.RUSAGE_CHILDREN),cpu(resource.RUSAGE_SELF)
                      with concurrent.futures.ThreadPoolExecutor(max_workers=actors) as pool:values[name].extend(pool.map(run,range(actors)))
                      costs[name]['child_cpu_seconds']+=cpu(resource.RUSAGE_CHILDREN)-c
                      costs[name]['parent_cpu_seconds']+=cpu(resource.RUSAGE_SELF)-p
              for name,v in values.items():
                  v.sort();assert len(v)==100
                  row={'actors':actors,'probe':name,'samples':len(v),'p50_ms':v[49],'p95_ms':v[94],'max_ms':v[-1],**costs[name]}
                  rows.append(row);print(json.dumps(row),flush=True)
          output={'scope':'startup diagnostic only; no push performance qualification or storage operations','binary_sha256':hashlib.file_digest(binary.open('rb'),'sha256').hexdigest(),'cohorts':rows}
          (root/'evidence/startup.json').write_text(json.dumps(output,indent=2)+'\n')
          PY
      - name: Separate pre-main and application time with loader auditing
        run: |
          set -euo pipefail
          cat > "$STARTUP_ROOT/evidence/startup-audit.c" <<'C'
          #define _GNU_SOURCE
          #include <link.h>
          #include <stdio.h>
          #include <time.h>
          #include <unistd.h>
          static void emit(const char *phase) {
              struct timespec now;
              if (clock_gettime(CLOCK_MONOTONIC, &now)) _exit(126);
              unsigned long long ns = (unsigned long long)now.tv_sec * 1000000000ULL + (unsigned long long)now.tv_nsec;
              dprintf(2, "[startup-audit] pid=%ld phase=%s ns=%llu\n", (long)getpid(), phase, ns);
          }
          unsigned int la_version(unsigned int version) {
              emit("loader");
              return version >= LAV_CURRENT ? LAV_CURRENT : 0;
          }
          void la_preinit(uintptr_t *cookie) {
              (void)cookie;
              emit("preinit");
          }
          C
          gcc -shared -fPIC -O2 -Wall -Wextra -Werror "$STARTUP_ROOT/evidence/startup-audit.c" -o "$STARTUP_ROOT/bin/startup-audit.so"
          python3 - <<'PY'
          import concurrent.futures,json,os,re,subprocess,threading,time
          from pathlib import Path
          root=Path(os.environ['STARTUP_ROOT']);binary=root/'bin/crab'
          clock=time.get_clock_info('perf_counter')
          assert 'CLOCK_MONOTONIC' in clock.implementation,clock
          env=os.environ|{'LD_AUDIT':str(root/'bin/startup-audit.so'),'GIT_CONFIG_NOSYSTEM':'1','GIT_CONFIG_GLOBAL':os.devnull}
          cases={'version':[str(binary),'version'],'version-flag':[str(binary),'--version'],'root-help':[str(binary),'--help']}
          summary=[];raw=[]
          for actors in [1,50]:
              for name,argv in cases.items():
                  values=[]
                  for _ in range(100//actors):
                      barrier=threading.Barrier(actors)
                      def run(_):
                          barrier.wait(timeout=30);start=time.perf_counter_ns()
                          child=subprocess.Popen(argv,cwd=root/'repo',env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                          _,stderr=child.communicate(timeout=60);end=time.perf_counter_ns()
                          assert child.returncode==0
                          phases={phase.decode():int(ns) for pid,phase,ns in re.findall(rb'\[startup-audit\] pid=(\d+) phase=(loader|preinit) ns=(\d+)',stderr) if int(pid)==child.pid}
                          assert set(phases)=={'loader','preinit'}
                          assert start<=phases['loader']<=phases['preinit']<=end
                          return {'start_to_preinit_ms':(phases['preinit']-start)/1e6,'loader_to_preinit_ms':(phases['preinit']-phases['loader'])/1e6,'preinit_to_exit_ms':(end-phases['preinit'])/1e6,'total_ms':(end-start)/1e6}
                      with concurrent.futures.ThreadPoolExecutor(max_workers=actors) as pool:values.extend(pool.map(run,range(actors)))
                  assert len(values)==100
                  stats={}
                  for key in values[0]:
                      v=sorted(row[key] for row in values);stats[key]={'p50_ms':v[49],'p95_ms':v[94],'max_ms':v[-1]}
                  row={'actors':actors,'probe':name,'samples':100,'phases':stats};summary.append(row);raw.append({'actors':actors,'probe':name,'values':values});print(json.dumps(row),flush=True)
          output={'scope':'LD_AUDIT diagnostic only; not a push benchmark; phase medians are not additive','clock':clock.implementation,'cohorts':summary,'raw':raw}
          (root/'evidence/startup-audit.json').write_text(json.dumps(output,indent=2)+'\n')
          PY
      - name: Time executable initializers without changing the binary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          root=Path(os.environ['STARTUP_ROOT']);binary=root/'bin/crab'
          sections=subprocess.check_output(['readelf','-SW',str(binary)],text=True)
          match=re.search(r'\[\s*\d+\]\s+\.init_array\s+\S+\s+([0-9a-f]+)\s+([0-9a-f]+)\s+([0-9a-f]+)',sections)
          assert match
          address,offset,size=[int(v,16) for v in match.groups()]
          relocations=subprocess.check_output(['readelf','-rW',str(binary)],text=True)
          pointers={}
          for line in relocations.splitlines():
              fields=line.split()
              if len(fields)<4 or not re.fullmatch('[0-9a-f]+',fields[0]):continue
              target=int(fields[0],16)
              if address<=target<address+size:
                  assert fields[2]=='R_X86_64_RELATIVE',fields
                  pointers[target]=int(fields[3],16)
          assert len(pointers)==size//8 and pointers
          entries=[pointers[address+i] for i in range(0,size,8)]
          (root/'evidence/initializers.json').write_text(json.dumps({'binary':str(binary),'entries':entries},indent=2)+'\n')
          PY
          cat > "$STARTUP_ROOT/evidence/time-initializers.py" <<'PY'
          import gdb,json,os,time
          from pathlib import Path
          root=Path(os.environ['STARTUP_ROOT'])
          spec=json.loads((root/'evidence/initializers.json').read_text())
          gdb.execute('set pagination off')
          gdb.execute('set confirm off')
          gdb.execute('set disable-randomization off')
          gdb.execute('set startup-with-shell off')
          gdb.execute('starti',to_string=True)
          pid=gdb.selected_inferior().pid
          mappings=Path(f'/proc/{pid}/maps').read_text().splitlines()
          bases=[int(line.split()[0].split('-')[0],16) for line in mappings if line.split()[-1]==spec['binary'] and int(line.split()[2],16)==0]
          assert len(bases)==1,bases
          base=bases[0]
          addresses=[base+entry for entry in spec['entries']]
          breakpoints=[gdb.Breakpoint('*'+hex(address),internal=True) for address in dict.fromkeys(addresses)]
          rows=[];before=time.perf_counter_ns()
          for index,address in enumerate(addresses):
              gdb.execute('continue',to_string=True)
              arrived=time.perf_counter_ns();assert int(gdb.parse_and_eval('$pc'))==address
              return_address=int(gdb.parse_and_eval('*(unsigned long*)$rsp'))
              for bp in breakpoints:bp.enabled=False
              gdb.Breakpoint('*'+hex(return_address),temporary=True,internal=True)
              started=time.perf_counter_ns();gdb.execute('continue',to_string=True);finished=time.perf_counter_ns()
              assert int(gdb.parse_and_eval('$pc'))==return_address
              rows.append({'index':index,'offset':hex(address-base),'gap_before_ms':(arrived-before)/1e6,'duration_including_debugger_ms':(finished-started)/1e6,'instructions':gdb.execute('x/32i '+hex(address),to_string=True)})
              for bp in breakpoints:bp.enabled=True
              before=time.perf_counter_ns()
          for bp in breakpoints:bp.delete()
          exits=[]
          gdb.events.exited.connect(lambda event:exits.append(event.exit_code))
          gdb.execute('continue',to_string=True)
          assert exits==[0],exits
          result={'scope':'debugger diagnostic only; per-initializer durations include debugger overhead, ASLR preserved, binary unchanged','initializers':rows}
          (root/'evidence/initializer-timings.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps([{k:v for k,v in row.items() if k!='instructions'} for row in rows]))
          PY
          cd "$STARTUP_ROOT/repo"
          gdb --batch -q -nx -nh -x "$STARTUP_ROOT/evidence/time-initializers.py" --args "$STARTUP_ROOT/bin/crab" version > "$STARTUP_ROOT/evidence/gdb.txt" 2>&1
          cat "$STARTUP_ROOT/evidence/gdb.txt"
      - name: Inspect ELF loader and system-call work
        run: |
          set -euo pipefail
          cd "$STARTUP_ROOT/repo"
          lscpu > "$STARTUP_ROOT/evidence/cpu.txt"
          readelf -W -d "$STARTUP_ROOT/bin/crab" > "$STARTUP_ROOT/evidence/elf-dynamic.txt"
          readelf -W -S "$STARTUP_ROOT/bin/crab" > "$STARTUP_ROOT/evidence/elf-sections.txt"
          LD_DEBUG=statistics "$STARTUP_ROOT/bin/crab" version > "$STARTUP_ROOT/evidence/version.txt" 2> "$STARTUP_ROOT/evidence/loader-statistics.txt"
          /usr/bin/time -v "$STARTUP_ROOT/bin/crab" version > /dev/null 2> "$STARTUP_ROOT/evidence/time.txt"
          strace -f -c -o "$STARTUP_ROOT/evidence/syscalls.txt" "$STARTUP_ROOT/bin/crab" version > /dev/null
          cat "$STARTUP_ROOT/evidence/loader-statistics.txt"
          cat "$STARTUP_ROOT/evidence/time.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-startup-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/crab-startup/evidence/**
          if-no-files-found: error
          retention-days: 14
