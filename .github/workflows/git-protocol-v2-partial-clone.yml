name: Git protocol v2 partial-clone qualification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/git-protocol-v2-partial-clone.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crab/Cargo.toml"
      - "crab/src/git/**"
      - "crab/src/cmd/lfs/**"
      - "crab/src/cmd/mirror.rs"
      - "crab/src/cmd/mirror/**"
      - "crab/src/cmd/cache.rs"
      - "crab/src/main.rs"
      - "crates/crab-cache/**"
      - "crab/src/lfs/**"
      - "crab/src/core/error.rs"
      - "crab/src/core/config.rs"
      - "crab/src/cmd/fsck*.rs"
      - "crab/src/cmd/history_recovery.rs"
      - "crab/src/cmd/metadb.rs"
      - "crab/src/cmd/repack.rs"
      - "crab/src/cmd/gc/**"
      - "crab/src/replication/**"
      - "crab/src/metadata/**"
      - "crab/src/coordination/**"
      - "crates/crab-coordination/**"
      - "crab/src/storage/**"
      - "crab/scripts/e2e/run_concurrent_push_smoke.py"
      - "crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py"
      - "crab/scripts/verify_git_capability_matrix.py"
      - "crab/scripts/tests/test_verify_git_capability_matrix.py"
      - "crab/scripts/tests/test_protocol_qualification_logs.py"
      - "crab/tests/**"
      - "crates/crab-git/**"
      - "crates/crab-auth-server/**"
      - "crates/crab-metadata/**"
      - "crates/crab-read/**"
      - "crates/crab-remote-git/**"
      - "crates/crab-storage/**"
      - "crates/crab-vfs/**"
      - "crab/docs/architecture/git-protocol-v2.md"
      - "crab/docs/architecture/git-capability-matrix.json"
      - "crab/docs/architecture/git-capability-matrix.md"
      - "crab/docs/design/adr-git-protocol-v2-local-helper.md"
      - "plans/013-add-git-protocol-v2-and-partial-clone.md"
      - "plans/designs/client-side-git-v2-partial-clone.md"
  pull_request:
    paths:
      - ".github/workflows/git-protocol-v2-partial-clone.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crab/Cargo.toml"
      - "crab/src/git/**"
      - "crab/src/cmd/lfs/**"
      - "crab/src/cmd/mirror.rs"
      - "crab/src/cmd/mirror/**"
      - "crab/src/cmd/cache.rs"
      - "crab/src/main.rs"
      - "crates/crab-cache/**"
      - "crab/src/lfs/**"
      - "crab/src/core/error.rs"
      - "crab/src/core/config.rs"
      - "crab/src/cmd/fsck*.rs"
      - "crab/src/cmd/history_recovery.rs"
      - "crab/src/cmd/metadb.rs"
      - "crab/src/cmd/repack.rs"
      - "crab/src/cmd/gc/**"
      - "crab/src/replication/**"
      - "crab/src/metadata/**"
      - "crab/src/coordination/**"
      - "crates/crab-coordination/**"
      - "crab/src/storage/**"
      - "crab/scripts/e2e/run_concurrent_push_smoke.py"
      - "crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py"
      - "crab/scripts/verify_git_capability_matrix.py"
      - "crab/scripts/tests/test_verify_git_capability_matrix.py"
      - "crab/scripts/tests/test_protocol_qualification_logs.py"
      - "crab/tests/**"
      - "crates/crab-git/**"
      - "crates/crab-auth-server/**"
      - "crates/crab-metadata/**"
      - "crates/crab-read/**"
      - "crates/crab-remote-git/**"
      - "crates/crab-storage/**"
      - "crates/crab-vfs/**"
      - "crab/docs/architecture/git-protocol-v2.md"
      - "crab/docs/architecture/git-capability-matrix.json"
      - "crab/docs/architecture/git-capability-matrix.md"
      - "crab/docs/design/adr-git-protocol-v2-local-helper.md"
      - "plans/013-add-git-protocol-v2-and-partial-clone.md"
      - "plans/designs/client-side-git-v2-partial-clone.md"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/crab-protocol-v2
  CRAB_RELEASE_ARCHIVE: crab-protocol-v2-linux-x86_64.tar.gz
  CRAB_RELEASE_ARTIFACT: crab-protocol-v2-linux-x86_64-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  unit-and-transcript:
    name: Protocol unit and transcript tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libfuse3-dev

      - name: Run protocol and reader tests
        env:
          # The Linux test runner's default worker stack is too small for
          # the largest async protocol fixtures; keep valid coverage from
          # becoming a stack-overflow false negative.
          RUST_MIN_STACK: "8388608"
        run: |
          cargo test -p crab-cache --features local-cache --locked
          cargo test -p crab --lib cmd::mirror --locked --features gix-transport
          cargo test -p crab --lib git::process::tests --locked --features gix-transport
          cargo test -p crab --lib lfs::publication::tests --locked --features gix-transport
          cargo test -p crab --lib lfs::coordinator::tests --locked --features gix-transport
          cargo test -p crab --lib lfs::discovery::tests --locked --features gix-transport
          cargo test -p crab --lib lfs::recent::tests --locked --features gix-transport
          cargo test -p crab --lib lfs::prune::tests --locked --features gix-transport
          cargo test -p crab --lib lfs::batch::tests --locked --features gix-transport
          cargo test -p crab --lib lfs::transfer_agent::tests --locked --features gix-transport
          cargo test -p crab --lib cmd::install::tests --locked --features gix-transport
          cargo test -p crab --lib cmd::lfs::install::tests --locked --features gix-transport
          cargo test -p crab --lib cmd::lfs::push::tests --locked --features gix-transport
          cargo test -p crab --lib cmd::lfs::fetch::tests --locked --features gix-transport
          cargo test -p crab --lib cmd::lfs::clone::tests --locked --features gix-transport
          cargo test -p crab --lib cmd::clone::tests::clone_project_remote --locked --features gix-transport
          cargo test -p crab --lib cmd::hydrate::tests::hydration_owner --locked --features gix-transport
          cargo test -p crab --lib git::push_native::tests --locked --features gix-transport
          cargo test -p crab --lib git::push_staging::tests --locked --features gix-transport
          cargo test -p crab --lib git::remote_helper::tests::list_session_does_not_open_a_damaged_staging_index --locked --features gix-transport
          cargo test -p crab-metadata --lib git_visibility::tests --locked --features remote-index
          cargo test -p crab-metadata --lib ref_journal::tests --locked --features remote-index
          cargo test -p crab-coordination --lib push_lock::tests --locked --features object-store-lock
          cargo check -p crab-coordination --locked --no-default-features
          cargo test -p crab --lib coordination::heartbeat::tests --locked --features gix-transport
          cargo test -p crab-git -p crab-metadata -p crab-read -p crab-remote-git -p crab-vfs --locked
          cargo test -p crab --locked --features gix-transport \
            --test v2_fetch_transport --test remote_helper_transcript --test pre_push_input

      - name: Verify executable compatibility matrix
        run: |
          python3 crab/scripts/verify_git_capability_matrix.py
          python3 crab/scripts/tests/test_verify_git_capability_matrix.py
          python3 crab/scripts/tests/test_protocol_qualification_logs.py

      - name: Check protocol formatting
        run: |
          rustfmt --edition 2024 --check \
            crab/src/git/remote_helper.rs \
            crab/src/git/upload_pack_wire.rs \
            crates/crab-git/src/walk.rs \
            crates/crab-metadata/src/git_visibility.rs \
            crates/crab-read/src/upload_pack.rs \
            crates/crab-remote-git/src/pack.rs \
            crates/crab-remote-git/src/operation.rs \
            crates/crab-remote-git/src/reader.rs \
            crates/crab-remote-git/src/repository.rs

  cross-platform-contract:
    name: Protocol contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Record native Git version
        run: git --version

      - name: Run native cache lifecycle contracts
        run: cargo test -p crab-cache --features local-cache --locked

      - name: Run native mirror and subprocess contracts
        run: >-
          cargo test -p crab --lib cmd::mirror --locked --no-default-features
          --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport

      - name: Run complete pre-push batch decoder contracts
        run: |
          cargo test -p crab-git --locked pre_push
          cargo test -p crab-git --locked tag::tests

      - name: Run visibility deletion contracts
        run: cargo test -p crab-metadata --lib git_visibility::tests --locked --features remote-index

      - name: Run ref-journal rollback contracts
        run: cargo test -p crab-metadata --lib ref_journal::tests --locked --features remote-index

      - name: Run lease renewal contracts
        run: |
          cargo test -p crab-coordination --lib push_lock::tests --locked --features object-store-lock
          cargo test -p crab --lib coordination::heartbeat::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport

      - name: Run hook composition and frozen-ref discovery contracts
        run: |
          cargo test -p crab --lib cmd::install::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib cmd::lfs::install::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib git::push_native::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib git::push_staging::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib git::remote_helper::tests::list_session_does_not_open_a_damaged_staging_index --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport

      - name: Run LFS pre-push contracts
        run: >-
          cargo test -p crab --lib cmd::lfs::push::tests --locked --no-default-features
          --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport

      - name: Run shared subprocess and LFS publication contracts
        run: |
          cargo test -p crab --lib cmd::mirror::process::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib git::process::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib lfs::publication::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib lfs::coordinator::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib lfs::discovery::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib lfs::recent::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib lfs::prune::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib lfs::batch::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib lfs::transfer_agent::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib cmd::lfs::fetch::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib cmd::lfs::clone::tests --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib cmd::clone::tests::clone_project_remote --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          cargo test -p crab --lib cmd::hydrate::tests::hydration_owner --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport

      - name: Run protocol and transcript contracts
        run: >-
          cargo test -p crab --locked --no-default-features
          --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport
          --test v2_fetch_transport --test remote_helper_transcript --test pre_push_input

  release-build:
    name: Build shared protocol release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libfuse3-dev

      - name: Build release artifact with source provenance
        run: |
          GIT_SHA="$(git rev-parse HEAD)" \
            cargo build -p crab --release --locked --features gix-transport
          test -x "${CARGO_TARGET_DIR}/release/crab"
          # Artifact upload normalizes file modes, so tar preserves the executable bit.
          tar -C "${CARGO_TARGET_DIR}/release" \
            -czf "${RUNNER_TEMP}/${CRAB_RELEASE_ARCHIVE}" crab

      - name: Upload shared release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CRAB_RELEASE_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.CRAB_RELEASE_ARCHIVE }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  real-git-version-matrix:
    name: Real Git compatibility (${{ matrix.label }})
    runs-on: ubuntu-latest
    needs: [unit-and-transcript, release-build]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: git-2-30
            git_version: 2.30.9
          - label: git-2-40
            git_version: 2.40.4
          - label: git-2-45
            git_version: 2.45.4
          - label: git-current
            git_version: current
    env:
      CRAB_E2E_BUCKET: crab
      CRAB_E2E_ROOT: ${{ github.workspace }}/.ci/crab-protocol-v2-git-${{ matrix.label }}
      CRAB_E2E_RUN_ID: gha-${{ github.run_id }}-${{ matrix.label }}
      AWS_ACCESS_KEY_ID: crab
      AWS_SECRET_ACCESS_KEY: crab
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      RUSTFS_IMAGE: rustfs/rustfs:1.0.0-beta.8-glibc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install compatibility dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential ca-certificates curl gettext libcurl4-gnutls-dev \
            libexpat1-dev libfuse3-dev libpcre2-dev libssl-dev pipx xz-utils \
            zlib1g-dev
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download shared release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CRAB_RELEASE_ARTIFACT }}
          path: ${{ runner.temp }}/crab-protocol-v2-release

      - name: Extract shared release artifact
        run: |
          mkdir -p "${CARGO_TARGET_DIR}/release"
          tar -xzf "${RUNNER_TEMP}/crab-protocol-v2-release/${CRAB_RELEASE_ARCHIVE}" \
            -C "${CARGO_TARGET_DIR}/release"
          test -x "${CARGO_TARGET_DIR}/release/crab"
          "${CARGO_TARGET_DIR}/release/crab" version | grep -F "$(git rev-parse HEAD)"

      - name: Install selected Git
        shell: bash
        run: |
          set -euo pipefail
          version="${{ matrix.git_version }}"
          if [ "$version" = "current" ]; then
            git_bin="$(command -v git)"
          else
            archive="$RUNNER_TEMP/git-${version}.tar.xz"
            source_dir="$RUNNER_TEMP/git-${version}"
            prefix="$RUNNER_TEMP/git-install-${version}"
            curl --fail --location --silent --show-error \
              "https://www.kernel.org/pub/software/scm/git/git-${version}.tar.xz" \
              --output "$archive"
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            (
              cd "$source_dir"
              make configure
              ./configure --prefix="$prefix" --without-tcltk
              make -j"$(nproc)" all
              make install
            )
            git_bin="$prefix/bin/git"
          fi
          "$git_bin" --version
          echo "GIT_BIN=$git_bin" >> "$GITHUB_ENV"

      - name: Start RustFS
        run: |
          mkdir -p "${CRAB_E2E_ROOT}/rustfs-data"
          sudo chown 10001:10001 "${CRAB_E2E_ROOT}/rustfs-data"
          docker run -d \
            --name "crab-protocol-v2-${{ matrix.label }}" \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=crab \
            -e RUSTFS_SECRET_KEY=crab \
            -v "${CRAB_E2E_ROOT}/rustfs-data:/data" \
            "${RUSTFS_IMAGE}" server /data --address :9000
          for _ in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/health/ready || true)"
            if [ "${status:-000}" = "200" ]; then exit 0; fi
            sleep 1
          done
          docker logs "crab-protocol-v2-${{ matrix.label }}" >&2 || true
          exit 1

      - name: Run real-Git RustFS lifecycle
        run: |
          python3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
            --crab-bin "${CARGO_TARGET_DIR}/release/crab" \
            --git-bin "$GIT_BIN" \
            --bucket "${CRAB_E2E_BUCKET}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --mirror-reconciliation \
            --root "${CRAB_E2E_ROOT}" \
            --run-id "${CRAB_E2E_RUN_ID}" \
            --source-root "${GITHUB_WORKSPACE}"

      - name: Capture RustFS logs
        if: always()
        run: |
          mkdir -p "${CRAB_E2E_ROOT}"
          docker logs "crab-protocol-v2-${{ matrix.label }}" > "${CRAB_E2E_ROOT}/rustfs.log" 2>&1 || true
          docker rm -f "crab-protocol-v2-${{ matrix.label }}" >/dev/null 2>&1 || true

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-protocol-v2-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/artifacts/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/logs/**
            ${{ env.CRAB_E2E_ROOT }}/rustfs.log
          if-no-files-found: warn
          retention-days: 14

  rustfs-lifecycle:
    name: Released-shape RustFS partial-clone lifecycle
    runs-on: ubuntu-latest
    needs: [unit-and-transcript, release-build]
    timeout-minutes: 45
    env:
      CRAB_E2E_BUCKET: crab
      CRAB_E2E_ROOT: ${{ github.workspace }}/.ci/crab-protocol-v2-smoke
      CRAB_E2E_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ACCESS_KEY_ID: crab
      AWS_SECRET_ACCESS_KEY: crab
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      RUSTFS_IMAGE: rustfs/rustfs:1.0.0-beta.8-glibc

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install smoke dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl libfuse3-dev pipx
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download shared release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CRAB_RELEASE_ARTIFACT }}
          path: ${{ runner.temp }}/crab-protocol-v2-release

      - name: Extract shared release artifact
        run: |
          mkdir -p "${CARGO_TARGET_DIR}/release"
          tar -xzf "${RUNNER_TEMP}/crab-protocol-v2-release/${CRAB_RELEASE_ARCHIVE}" \
            -C "${CARGO_TARGET_DIR}/release"
          test -x "${CARGO_TARGET_DIR}/release/crab"
          "${CARGO_TARGET_DIR}/release/crab" version | grep -F "$(git rev-parse HEAD)"

      - name: Start RustFS
        run: |
          mkdir -p "${CRAB_E2E_ROOT}/rustfs-data"
          sudo chown 10001:10001 "${CRAB_E2E_ROOT}/rustfs-data"
          docker run -d \
            --name crab-protocol-v2-rustfs \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=crab \
            -e RUSTFS_SECRET_KEY=crab \
            -v "${CRAB_E2E_ROOT}/rustfs-data:/data" \
            "${RUSTFS_IMAGE}" server /data --address :9000
          for _ in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/health/ready || true)"
            if [ "${status:-000}" = "200" ]; then exit 0; fi
            sleep 1
          done
          docker logs crab-protocol-v2-rustfs >&2 || true
          exit 1

      - name: Run real-Git RustFS lifecycle
        run: |
          python3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
            --crab-bin "${CARGO_TARGET_DIR}/release/crab" \
            --bucket "${CRAB_E2E_BUCKET}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --root "${CRAB_E2E_ROOT}" \
            --run-id "${CRAB_E2E_RUN_ID}" \
            --source-root "${GITHUB_WORKSPACE}"

      # The four-agent cohort follows branch fan-out and recovery phases, so
      # its bounded locator baseline includes the resulting compaction state.
      - name: Run concurrent-push visibility and crash-recovery lifecycle
        run: |
          python3 crab/scripts/e2e/run_concurrent_push_smoke.py \
            --crab-bin "${CARGO_TARGET_DIR}/release/crab" \
            --bucket "${CRAB_E2E_BUCKET}" \
            --endpoint-url "${AWS_ENDPOINT_URL}" \
            --root "${CRAB_E2E_ROOT}" \
            --run-id "${CRAB_E2E_RUN_ID}-concurrent" \
            --agents 8 \
            --same-branch-agents 4 \
            --max-parallel-pushes 8 \
            --upload-concurrency 2 \
            --rebase-on-non-fast-forward \
            --omit-lock-wait-secs \
            --rebase-retry-limit 64 \
            --max-locator-requests-per-success 500 \
            --crash-boundary \
            --marker-faults \
            --crash-lock-ttl-secs 21 \
            --lock-wait-secs 30 \
            --manifest-cas-retries 64

      - name: Capture RustFS logs
        if: always()
        run: |
          mkdir -p "${CRAB_E2E_ROOT}"
          docker logs crab-protocol-v2-rustfs > "${CRAB_E2E_ROOT}/rustfs.log" 2>&1 || true
          docker rm -f crab-protocol-v2-rustfs >/dev/null 2>&1 || true

      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-protocol-v2-partial-clone-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/artifacts/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/logs/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}-concurrent/artifacts/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}-concurrent/logs/**
            ${{ env.CRAB_E2E_ROOT }}/rustfs.log
          if-no-files-found: warn
          retention-days: 14
