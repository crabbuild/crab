name: Temporary RELR component qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relr-component-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-build:
    name: Build normal release (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [normal, relr]
    env:
      CARGO_INCREMENTAL: 0
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.99.1
      - name: Install existing Linux build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libfuse3-dev binutils
      - name: Build and record normal release provenance
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$RUNNER_TEMP/crab-relr-$VARIANT"
          test -z "${RUSTFLAGS:-}"
          if [ "$VARIANT" = relr ]; then
            # Same flag proposed for official GNU x64 archives. Keep all
            # runtime code, CPU targets and release-profile settings equal.
            export RUSTFLAGS="-C link-arg=-Wl,-z,pack-relative-relocs"
          fi
          GIT_SHA="$(git rev-parse HEAD)" \
            cargo build -p crab --release --locked --features gix-transport
          binary="$CARGO_TARGET_DIR/release/crab"
          proof="$RUNNER_TEMP/proof"
          mkdir -p "$proof"
          "$binary" version | tee "$proof/version.txt"
          "$binary" --help > "$proof/help.txt"
          "$binary" push --help > "$proof/push-help.txt"
          readelf -hW "$binary" > "$proof/elf-header.txt"
          readelf -lW "$binary" > "$proof/elf-program.txt"
          readelf -dW "$binary" > "$proof/elf-dynamic.txt"
          readelf -SW "$binary" > "$proof/elf-sections.txt"
          readelf -VW "$binary" > "$proof/elf-versions.txt"
          readelf -rW "$binary" > "$proof/elf-relocations.txt"
          python3 - <<'PYCODE'
          import hashlib, json, os, platform, subprocess
          from pathlib import Path
          binary = Path(os.environ['CARGO_TARGET_DIR']) / 'release/crab'
          record = {
              'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'compiler': subprocess.check_output(['rustc', '-Vv'], text=True),
              'features': 'default,gix-transport',
              'variant': os.environ['VARIANT'],
              'rustflags': os.environ.get('RUSTFLAGS', ''),
              'sha256': hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest(),
              'file_bytes': binary.stat().st_size,
              'cc': subprocess.check_output(['cc', '--version'], text=True),
              'ld': subprocess.check_output(['ld', '--version'], text=True),
              'host': platform.platform(),
          }
          (Path(os.environ['RUNNER_TEMP']) / 'proof/candidate-build.json').write_text(json.dumps(record, indent=2) + '\n')
          PYCODE
          tar -czf "$RUNNER_TEMP/crab-relr-$VARIANT.tar.gz" \
            -C "$CARGO_TARGET_DIR/release" crab -C "$proof" .
      - uses: actions/upload-artifact@v4
        with:
          name: crab-relr-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/crab-relr-${{ matrix.variant }}.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  compare:
    name: Verify ELF and CLI contracts
    needs: release-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: crab-relr-*-${{ github.run_id }}
          path: ${{ runner.temp }}/relr-components
          merge-multiple: true
      - name: Require matching runtime and unchanged security properties
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/relr-components"
          mkdir normal relr
          tar -xzf crab-relr-normal.tar.gz -C normal
          tar -xzf crab-relr-relr.tar.gz -C relr
          python3 - <<'PYCODE'
          import hashlib, json, re
          from pathlib import Path
          records = {}
          for name in ['normal', 'relr']:
              root = Path(name)
              manifest = json.loads((root / 'candidate-build.json').read_text())
              assert manifest['sha256'] == hashlib.file_digest((root / 'crab').open('rb'), 'sha256').hexdigest()
              header = (root / 'elf-header.txt').read_text()
              program = (root / 'elf-program.txt').read_text()
              dynamic = (root / 'elf-dynamic.txt').read_text()
              versions = (root / 'elf-versions.txt').read_text()
              relocs = (root / 'elf-relocations.txt').read_text()
              assert re.search(r'Type:\s+DYN', header), header
              assert 'GNU_RELRO' in program
              stack = next(line for line in program.splitlines() if 'GNU_STACK' in line)
              assert re.search(r'\sRW\s', stack) and not re.search(r'\sRWE\s', stack), stack
              assert 'BIND_NOW' in dynamic and re.search(r'FLAGS_1.*PIE', dynamic)
              glibc = sorted({tuple(map(int, v.split('.'))) for v in re.findall(r'GLIBC_(\d+\.\d+)', versions)})
              needed = sorted(re.findall(r'\(NEEDED\).*\[(.*?)\]', dynamic))
              records[name] = dict(manifest, glibc_versions=glibc, needed=needed,
                  relative_rela=relocs.count('R_X86_64_RELATIVE'),
                  relr_tags=all(re.search(r'\(' + tag + r'\)', dynamic) for tag in ['RELR', 'RELRSZ', 'RELRENT']),
                  relr_abi='GLIBC_ABI_DT_RELR' in versions)
              assert manifest['source'] in (root / 'version.txt').read_text()
          a, b = records['normal'], records['relr']
          for key in ['source', 'compiler', 'features', 'cc', 'ld', 'glibc_versions', 'needed']:
              assert a[key] == b[key], (key, a[key], b[key])
          assert a['rustflags'] == '' and b['rustflags'] == '-C link-arg=-Wl,-z,pack-relative-relocs'
          assert not a['relr_tags'] and not a['relr_abi']
          assert b['relr_tags'] and b['relr_abi']
          assert b['relative_rela'] < a['relative_rela']
          for command in ['help.txt', 'push-help.txt']:
              assert (Path('normal') / command).read_bytes() == (Path('relr') / command).read_bytes(), command
          records['verdict'] = 'Component contracts pass. No performance claim; RustFS correctness and uninstrumented paired measurements remain required.'
          Path('component-proof.json').write_text(json.dumps(records, indent=2) + '\n')
          print(json.dumps(records, indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crab-relr-component-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/relr-components/component-proof.json
          if-no-files-found: error
          retention-days: 3
