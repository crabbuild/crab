name: Temporary safe ICF component qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-icf-component-${{ github.ref }}
  cancel-in-progress: false

jobs:
  component:
    name: Compare default and safe ICF links
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.99.1
      - name: Install existing Linux build dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libfuse3-dev binutils
      - name: Verify linker contracts and compare isolated release links
        run: python3 .github/profile/qualify_safe_icf.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crab-safe-icf-component-${{ github.run_id }}
          path: ${{ runner.temp }}/crab-safe-icf-proof
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
