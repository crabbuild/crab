---
name: Combined TLS startup push qualification
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tls-startup-combined-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  CRAB_RELEASE_ARCHIVE: crab-protocol-v2-linux-x86_64.tar.gz
  CRAB_RELEASE_ARTIFACT: crab-protocol-v2-linux-x86_64-${{ github.run_id }}
jobs:
  push-contracts:
    name: TLS and push contracts (${{ matrix.os }})
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          cargo_args: "--features gix-transport"
        - os: macos-15
          cargo_args: "--no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport,testing"
        - os: windows-2022
          cargo_args: "--no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch,gix-transport,testing"
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: 1.99.1
        components: rustfmt, clippy
    - name: Record platform Git and compiler
      run: |
        git --version
        rustc -Vv
        cargo fmt --version
        cargo clippy --version
    - name: Install existing Linux build dependencies
      run: sudo apt-get update -y && sudo apt-get install -y libfuse3-dev
      if: runner.os == 'Linux'
    - name: Run complete Capsule push and pack contracts
      run: |
        set -euo pipefail
        export CARGO_TARGET_DIR="$RUNNER_TEMP/crab-tls-combined-contracts"
        cargo test -p crab --lib --locked ${{ matrix.cargo_args }} git::capsule_push::tests 2>&1 | tee "$RUNNER_TEMP/tls-combined-capsule-tests.log"
        cargo test -p crab --lib --locked ${{ matrix.cargo_args }} git::pack:: 2>&1 | tee "$RUNNER_TEMP/tls-combined-pack-tests.log"
        cargo fmt --all -- --check
        cargo clippy -p crab --no-deps --locked ${{ matrix.cargo_args }} -- -A clippy::style -A clippy::complexity -A clippy::perf -A clippy::pedantic -A clippy::nursery -A clippy::cargo -A clippy::restriction -D clippy::correctness -D clippy::suspicious -A unfulfilled_lint_expectations 2>&1 | tee "$RUNNER_TEMP/tls-combined-clippy.log"
    - name: Verify actual linked TLS and certificate contracts
      run: |
        set -euo pipefail
        export CARGO_TARGET_DIR="$RUNNER_TEMP/crab-tls-combined-contracts"
        cargo build -p crab --lib --locked ${{ matrix.cargo_args }} --message-format=json > "$RUNNER_TEMP/tls-combined-platform-build.jsonl"
        python3 -B .github/profile/run_native_cert_contract.py --artifacts "$RUNNER_TEMP/tls-combined-platform-build.jsonl" --root "$RUNNER_TEMP/tls-combined-contract"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tls-combined-contracts-${{ matrix.os }}-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/tls-combined-*.log
          ${{ runner.temp }}/tls-combined-contract/*.json
          ${{ runner.temp }}/tls-combined-contract/*.log
          ${{ runner.temp }}/tls-combined-platform-build.jsonl
        if-no-files-found: error
        retention-days: 3
  release-build:
    name: Build shared protocol release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      with:
        fetch-depth: 0
    - name: Set up pinned Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: 1.99.1
    - name: Install Linux system dependencies
      run: sudo apt-get update -y && sudo apt-get install -y libfuse3-dev
    - name: Build release artifact with source provenance
      run: |
        set -euo pipefail
        export CARGO_TARGET_DIR="$RUNNER_TEMP/crab-tls-combined-release"
        test -z "${RUSTFLAGS:-}"
        test -z "${CARGO_ENCODED_RUSTFLAGS:-}"
        GIT_SHA="$(git rev-parse HEAD)" \
          cargo build -p crab --release --locked --features gix-transport \
            --message-format=json > "$RUNNER_TEMP/candidate-build-artifacts.jsonl"
        test -x "${CARGO_TARGET_DIR}/release/crab"
        python3 - <<'PY'
        import hashlib, json, os, subprocess
        from pathlib import Path
        binary = Path(os.environ['CARGO_TARGET_DIR']) / 'release/crab'
        record = {
            'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'compiler': subprocess.check_output(['rustc', '-Vv'], text=True),
            'features': 'default,gix-transport',
            'rustflags': os.environ.get('RUSTFLAGS', ''),
            'sha256': hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest(),
        }
        (binary.parent / 'candidate-build.json').write_text(json.dumps(record, indent=2) + '\n')
        PY
        # Artifact upload normalizes file modes, so tar preserves the executable bit.
        tar -C "${CARGO_TARGET_DIR}/release" \
          -czf "${RUNNER_TEMP}/${CRAB_RELEASE_ARCHIVE}" crab candidate-build.json
        "$CARGO_TARGET_DIR/release/crab" version | grep -F "$(git rev-parse HEAD)"
        "$CARGO_TARGET_DIR/release/crab" push --help > "$RUNNER_TEMP/push-help.txt"
    - name: Verify native certificate loading and real TLS contracts
      run: |
        python3 -B .github/profile/run_native_cert_contract.py \
          --artifacts "$RUNNER_TEMP/candidate-build-artifacts.jsonl" \
          --root "$RUNNER_TEMP/native-cert-contract"
    - name: Preserve certificate qualification receipts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: native-certificate-contract-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/native-cert-contract/*.json
          ${{ runner.temp }}/native-cert-contract/*.log
          ${{ runner.temp }}/candidate-build-artifacts.jsonl
        if-no-files-found: warn
        retention-days: 3
    - name: Upload shared release artifact
      uses: actions/upload-artifact@v4
      with:
        name: "${{ env.CRAB_RELEASE_ARTIFACT }}"
        path: "${{ runner.temp }}/${{ env.CRAB_RELEASE_ARCHIVE }}"
        if-no-files-found: error
        retention-days: 3
        compression-level: 0
  paired-existing-ref-performance:
    name: Paired existing-ref throughput (${{ matrix.client }})
    if: github.event_name == 'workflow_dispatch'
    needs:
    - release-build
    - push-contracts
    - pki-decoder-experiment
    - native-certificate-upstream
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        client:
        - native
        - git
    env:
      PAIR_CLIENT: "${{ matrix.client }}"
      PAIR_CONTROL_RUN: '42570788923'
      PAIR_CONTROL_SOURCE: 4a27de3de1757b716a1694c65a266c2afefc4412
      PAIR_CANDIDATE_SOURCE: "${{ github.sha }}"
    steps:
    - uses: actions/checkout@v4
      with:
        ref: "${{ github.sha }}"
        fetch-depth: 0
    - name: Install fixture dependencies
      run: |
        {
          echo "PAIR_ROOT=$RUNNER_TEMP/crab-paired-$PAIR_CLIENT"
          echo "PAIR_SOURCE=$RUNNER_TEMP/Github/curl/curl"
          echo "PAIR_CONTROL=$RUNNER_TEMP/paired-control/crab"
          echo "PAIR_CANDIDATE=$RUNNER_TEMP/paired-candidate/crab"
        } >> "$GITHUB_ENV"
        sudo apt-get update -y
        sudo apt-get install -y curl libfuse3-dev pipx
        pipx install awscli
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - uses: actions/download-artifact@v4
      with:
        name: "${{ env.CRAB_RELEASE_ARTIFACT }}"
        path: "${{ runner.temp }}/candidate-archive"
    - uses: actions/download-artifact@v4
      with:
        name: crab-relr-normal-42570788923
        run-id: 42570788923
        github-token: "${{ github.token }}"
        path: "${{ runner.temp }}/control-archive"
    - name: Verify artifact sources and prepare pinned Git history
      env:
        GH_TOKEN: "${{ github.token }}"
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$PAIR_CONTROL")" "$(dirname "$PAIR_CANDIDATE")" "$(dirname "$PAIR_SOURCE")"
        tar -xzf "$RUNNER_TEMP/candidate-archive/${CRAB_RELEASE_ARCHIVE}" -C "$(dirname "$PAIR_CANDIDATE")"
        tar -xzf "$RUNNER_TEMP/control-archive/crab-relr-normal.tar.gz" -C "$(dirname "$PAIR_CONTROL")"
        gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PAIR_CONTROL_RUN" \
          --jq '{head_sha: .head_sha, run_id: .id, path: .path, conclusion: .conclusion}' > "$RUNNER_TEMP/control-source.json"
        python3 - <<'PYCODE'
        import hashlib, json, os
        from pathlib import Path
        record = json.loads((Path(os.environ['RUNNER_TEMP']) / 'control-source.json').read_text())
        assert record['head_sha'] == os.environ['PAIR_CONTROL_SOURCE'] and record['conclusion'] == 'success'
        control = json.loads((Path(os.environ['PAIR_CONTROL']).parent / 'candidate-build.json').read_text())
        candidate = json.loads((Path(os.environ['PAIR_CANDIDATE']).parent / 'candidate-build.json').read_text())
        assert control['source'] == record['head_sha'] and candidate['source'] == os.environ['PAIR_CANDIDATE_SOURCE']
        assert control['compiler'] == candidate['compiler'] and 'rustc 1.99.1 ' in control['compiler']
        assert control['features'] == candidate['features'] == 'default,gix-transport'
        assert control['rustflags'] == candidate['rustflags'] == ''
        assert control['sha256'] == '574e2a85b5397e5ad3711fe5908c23863e614224110911f67ba844be23aefa03'
        for build, variable in [(control, 'PAIR_CONTROL'), (candidate, 'PAIR_CANDIDATE')]:
            assert build['sha256'] == hashlib.file_digest(Path(os.environ[variable]).open('rb'), 'sha256').hexdigest()
        PYCODE
        "$PAIR_CONTROL" version | grep -F "$PAIR_CONTROL_SOURCE"
        "$PAIR_CANDIDATE" version | grep -F "$PAIR_CANDIDATE_SOURCE"
        git clone --no-checkout https://github.com/curl/curl.git "$PAIR_SOURCE"
        git -C "$PAIR_SOURCE" checkout --detach 70c084a0123b468fe7078e3fc72c78e1b66394b6
    - name: Compare identical 1, 10 and 50-client workloads in ABBA order
      run: python3 -B crab/scripts/e2e/run_paired_existing_ref_push_rustfs.py
    - name: Enforce the original native median budget in both candidate trials
      if: matrix.client == 'native'
      run: |
        python3 - <<'PY'
        import json, os
        from pathlib import Path
        rows = json.loads((Path(os.environ['PAIR_ROOT']) / 'results.json').read_text())
        candidates = [row for row in rows if row['variant'] == 'candidate']
        assert len(candidates) == 6
        assert all(row['p50_ms'] < 500 for row in candidates), candidates
        PY
    - name: Stop only this comparison's fixtures
      if: always()
      run: |
        docker ps -aq --filter "label=crab-paired=$GITHUB_RUN_ID-$PAIR_CLIENT" \
          | xargs -r docker rm -f
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: paired-push-${{ matrix.client }}-${{ github.run_id }}
        path: |
          ${{ env.PAIR_ROOT }}/*.json
          ${{ env.PAIR_ROOT }}/*.log
          ${{ env.PAIR_ROOT }}/*/paired-writers-*/artifacts/**
          ${{ env.PAIR_ROOT }}/*/paired-writers-*/logs/**
          ${{ runner.temp }}/control-source.json
          ${{ runner.temp }}/paired-candidate/candidate-build.json
          ${{ runner.temp }}/paired-control/candidate-build.json
        if-no-files-found: error
  pki-decoder-experiment:
    name: Isolated PKI decoder qualification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up pinned Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: 1.99.1
        components: clippy
    - name: Set qualification paths
      run: |
        {
          echo "PKI_SOURCE=$RUNNER_TEMP/Github/rustls/pki-types"
          echo "PKI_PROOF=$RUNNER_TEMP/pki-proof"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target/pki-decoder"
        } >> "$GITHUB_ENV"
    - name: Install Valgrind and MSRV
      run: |
        sudo apt-get update -y
        sudo apt-get install -y valgrind
        rustup toolchain install 1.60.0 --profile minimal --no-self-update
    - name: Restore pinned upstream tests and fixtures
      run: |
        mkdir -p "$(dirname "$PKI_SOURCE")" "$PKI_PROOF"
        git clone --no-checkout https://github.com/rustls/pki-types.git "$PKI_SOURCE"
        git -C "$PKI_SOURCE" checkout --detach bb3c1da0e69e8ee3dcdfb16c245f974d636ed481
        cp vendor/rustls-pki-types/src/base64.rs "$PKI_SOURCE/src/base64.rs"
        sha256sum vendor/rustls-pki-types/src/base64.rs "$PKI_SOURCE/src/base64.rs" > "$PKI_PROOF/decoder-hashes.log"
    - name: Run upstream unit, integration and documentation tests
      shell: bash
      run: |
        set -o pipefail
        cd "$PKI_SOURCE"
        cargo test --locked 2>&1 | tee "$PKI_PROOF/default.log"
        cargo test --locked --all-features 2>&1 | tee "$PKI_PROOF/all-features.log"
        cargo test --locked --no-default-features 2>&1 | tee "$PKI_PROOF/no-default.log"
        cargo clippy --locked --all-features -- -D warnings 2>&1 | tee "$PKI_PROOF/clippy.log"
    - name: Check full crate with Rust 1.60
      shell: bash
      run: |
        set -o pipefail
        cd "$PKI_SOURCE"
        # Old Cargo uses the Git registry index. A local source directory
        # avoids that unrelated download while preserving the upstream lock.
        mkdir -p .cargo
        cargo vendor --locked "$RUNNER_TEMP/pki-msrv-deps" > .cargo/config.toml
        cargo +1.60.0 check --locked --offline --lib --all-features 2>&1 | tee "$PKI_PROOF/msrv-all.log"
        cargo +1.60.0 check --locked --offline --lib --no-default-features 2>&1 | tee "$PKI_PROOF/msrv-no-default.log"
    - name: Run secret codepoint check under Valgrind
      shell: bash
      run: |
        set -o pipefail
        cd "$PKI_SOURCE"
        cargo test --locked --all-features --lib --no-run --message-format json > "$PKI_PROOF/test-build.jsonl"
        exe="$(python3 -c 'import json,os; print(next(x["executable"] for line in open(os.environ["PKI_PROOF"]+"/test-build.jsonl") if (x:=json.loads(line)).get("reason")=="compiler-artifact" and x.get("executable") and x["profile"]["test"]))')"
        valgrind --error-exitcode=99 --exit-on-first-error=yes "$exe" \
          --exact base64::tests::codepoint_decode_secret_does_not_branch_or_index_on_secret_input \
          --nocapture 2>&1 | tee "$PKI_PROOF/valgrind.log"
        if grep -F 'SKIPPED' "$PKI_PROOF/valgrind.log"; then exit 1; fi
        grep -F '1 passed; 0 failed' "$PKI_PROOF/valgrind.log"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pki-decoder-proof-${{ github.run_id }}
        path: "${{ env.PKI_PROOF }}/"
        if-no-files-found: error
        retention-days: 14
  native-certificate-upstream:
    name: Released native certificate loader contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Set up pinned Rust
      uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
      with:
        toolchain: 1.99.1
    - name: Test exact published upstream source
      run: |
        set -euo pipefail
        source="$RUNNER_TEMP/Github/rustls/rustls-native-certs"
        mkdir -p "$(dirname "$source")"
        git clone --branch v/0.8.5 --depth 1 \
          https://github.com/rustls/rustls-native-certs.git "$source"
        test "$(git -C "$source" rev-parse HEAD)" = 4bcc4bb91d0b0bdffa49a9b3c85bb0fc03d49899
        CARGO_TARGET_DIR="$RUNNER_TEMP/native-certs-upstream-target" \
          cargo test --manifest-path "$source/Cargo.toml" --lib --locked
        test -z "$(git -C "$source" status --porcelain)"
