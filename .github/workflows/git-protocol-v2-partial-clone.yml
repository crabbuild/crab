name: Linux independent push userspace CPU diagnostic

on:
  workflow_dispatch:
    inputs:
      control_run:
        description: Frozen normal executable and matching linker-map run
        required: true
        default: "42676127980"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: push-userspace-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  AWS_ACCESS_KEY_ID: crab
  AWS_SECRET_ACCESS_KEY: crab
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://127.0.0.1:9000
  RUSTFS_IMAGE: rustfs/rustfs@sha256:040304b66e029a5cde4bed140b41513e925909839a9b912a40a98340610d1f66

jobs:
  push-userspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install fixture tools and initialize evidence
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/crab-push-userspace"
          mkdir -p "$root/evidence"
          {
            echo "DIAGNOSTIC_ROOT=$root"
            echo "PROFILE_ROOT=$root/evidence/profiles"
            echo "PROBE_ROOT=$root/evidence/permission"
            echo "DIAGNOSTIC_CRAB=$RUNNER_TEMP/control-archive/normal/crab"
            echo "LINK_MAP=$RUNNER_TEMP/control-archive/safe.map"
          } >> "$GITHUB_ENV"
          sudo apt-get update -y
          sudo apt-get install -y curl libfuse3-dev pipx binutils linux-tools-common linux-tools-generic libcap2-bin
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          lscpu > "$root/evidence/host.txt"
          uname -a >> "$root/evidence/host.txt"
          git --version >> "$root/evidence/host.txt"
          cp .github/profile/*.py "$root/evidence/"
          perf_bin="$(find -L /usr/lib/linux-tools -mindepth 2 -type f -name perf | sort -V | tail -1)"
          test -x "$perf_bin"
          echo "PERF_BIN=$perf_bin" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: crab-safe-icf-component-42676127980
          run-id: ${{ inputs.control_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/control-archive
      - name: Verify exact normal bytes, source, and map
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_RUN: ${{ inputs.control_run }}
        run: |
          set -euo pipefail
          test "$CONTROL_RUN" = 42676127980
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CONTROL_RUN" \
            --jq '{head_sha: .head_sha, run_id: .id, path: .path}' \
            > "$DIAGNOSTIC_ROOT/evidence/control-source.json"
          PYTHONPATH=.github/profile python3 -B - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from user_cpu_symbols import Symbols, digest, NORMAL_SHA256
          root = Path(os.environ['DIAGNOSTIC_ROOT'])
          binary = Path(os.environ['DIAGNOSTIC_CRAB'])
          archive = binary.parent.parent
          manifest = json.loads(binary.with_name('candidate-build.json').read_text())
          source = '40d4bc0d745a2e1405bf5d5004d05a295b1c0245'
          assert manifest['source'] == source
          assert json.loads((root/'evidence/control-source.json').read_text())['head_sha'] == source
          assert manifest['sha256'] == digest(binary) == NORMAL_SHA256
          assert digest(archive/'safe/crab') == NORMAL_SHA256
          assert manifest['features'] == 'default,gix-transport'
          assert manifest['profile'] == {'opt-level':3, 'lto':False, 'debug':0, 'strip':'symbols'}
          assert 'rustc 1.99.1 ' in manifest['compiler'] and 'LLVM version: 23.1.1' in manifest['compiler']
          assert manifest['rustflags'] == '' and manifest['extra_rustc_arguments'] == []
          objects = [line for line in (archive/'logs/archive-members.out').read_text().splitlines() if line.endswith('.o')]
          assert len(objects) == 16
          changed = subprocess.check_output(['git','diff','--name-only',source,'HEAD'],text=True).splitlines()
          assert all(path.startswith('.github/') for path in changed), changed
          binary.chmod(0o755)
          version = json.loads(subprocess.check_output([str(binary),'version','--json'],text=True))
          assert version['data'] == manifest['version']['data']
          sections = subprocess.check_output(['readelf','-SW',str(binary)],text=True)
          assert '.symtab' not in sections
          (root/'evidence/elf-sections.txt').write_text(sections)
          symbols = Symbols(binary, Path(os.environ['LINK_MAP']))
          proof = {'diagnostic_source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                   'product_base':'4b72a973a4ce3b25f005ea9842578a7dd76c6698',
                   'release':manifest, 'version':version, 'symbol_index':symbols.proof,
                   'normal_library_objects':objects,
                   'scope':'Unmodified normal binary and exact map; CPU attribution only'}
          (root/'evidence/identity.json').write_text(json.dumps(proof,indent=2)+'\n')
          PY
      - name: Check real symbol boundaries and malformed records
        run: python3 -B .github/profile/test_user_cpu_symbols.py "$RUNNER_TEMP/control-archive"
      - name: Require escaped descendant cleanup before profiling
        run: |
          set -euo pipefail
          sleep 120 &
          external_pid=$!
          trap 'kill "$external_pid" 2>/dev/null || true; wait "$external_pid" || true' EXIT
          EXTERNAL_PID="$external_pid" python3 -B .github/profile/test_profile_process_ownership.py \
            "$DIAGNOSTIC_ROOT/evidence/process-ownership"
          kill -0 "$external_pid"
      - name: Require actual leaf offsets before preparing the workload
        run: |
          python3 -B .github/profile/probe_user_perf.py \
            --perf-bin "$PERF_BIN" --output "$PROBE_ROOT" \
            --normal-bin "$DIAGNOSTIC_CRAB" --link-map "$LINK_MAP"
      - name: Prepare pinned real Git history
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/Github/curl/curl"
          mkdir -p "$(dirname "$source")"
          git clone --no-checkout https://github.com/curl/curl.git "$source"
          git -C "$source" checkout --detach 70c084a0123b468fe7078e3fc72c78e1b66394b6
          test -z "$(git -C "$source" status --porcelain)"
      - name: Start owned disk-backed RustFS
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTIC_ROOT/data"
          sudo chown 10001:10001 "$DIAGNOSTIC_ROOT/data"
          docker run -d --name "crab-userspace-$GITHUB_RUN_ID" \
            --label "crab-userspace=$GITHUB_RUN_ID" -p 127.0.0.1:9000:9000 \
            -v "$DIAGNOSTIC_ROOT/data:/data" \
            -e RUSTFS_ACCESS_KEY=crab -e RUSTFS_SECRET_KEY=crab \
            "$RUSTFS_IMAGE" server /data --address :9000
          docker image inspect "$RUSTFS_IMAGE" --format '{{json .RepoDigests}}' \
            > "$DIAGNOSTIC_ROOT/evidence/rustfs-image.json"
          for _ in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/health/ready || true)"
            if [ "${status:-000}" = 200 ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Profile 400 real updates and require cold integrity checks
        run: |
          python3 -B .github/profile/diagnose_push_user.py \
            --crab-bin "$DIAGNOSTIC_CRAB" \
            --source "$RUNNER_TEMP/Github/curl/curl" \
            --root "$DIAGNOSTIC_ROOT/workload" --run-id userspace-writers-50 \
            --bucket crab --endpoint-url "$AWS_ENDPOINT_URL" --push-client native \
            --agents 50 --branch-update-rounds 8 --max-parallel-pushes 50 \
            --consumer-mode cold-final --skip-same-branch --no-request-capture \
            --timeout 600 --push-timeout 600
      - name: Require complete samples, raw receipts and restored permissions
        run: |
          python3 -B - <<'PYPROOF'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['DIAGNOSTIC_ROOT'])
          report=json.loads((root/'workload/userspace-writers-50/artifacts/report.json').read_text())
          profiles=Path(os.environ['PROFILE_ROOT'])
          ownership=json.loads((root/'evidence/process-ownership/proof.json').read_text())
          assert ownership['status']=='passed' and ownership['uid']==os.getuid()!=0
          assert all(ownership[key] is True for key in (
              'timeout_reaps_escaped_child_and_grandchild','signal_reaps_two_escaped_process_trees',
              'signal_during_popen_registration_reaped','already_orphaned_child_reaped',
              'unrelated_sibling_survived'))
          assert report['status']=='ok' and len(report['branch_updates'])==400
          assert all(check['ok'] for check in report['checks'])
          rows=[json.loads(line) for line in (profiles/'receipts.jsonl').read_text().splitlines()]
          assert len(rows)==400 and all(row['exit_code']==0 for row in rows)
          summary=json.loads((profiles/'summary.json').read_text())
          assert summary['updates']==summary['profiles']==400
          assert summary['samples']>=1000 and summary['lost_records']==0
          assert summary['normal_mapped_samples']>=100
          assert summary['normal_mmap_crosschecked_samples']>=summary['normal_mapped_samples']
          for key in ('comm_weights','dso_weights','leaf_categories'):
              assert sum(summary[key].values())==summary['total_period_weight']
          assert sum(summary['normal_function_weights'].values())==summary['leaf_categories']['normal-resolved']
          for row in rows:
              data=profiles/row['profile']
              with data.open('rb') as handle:
                  assert hashlib.file_digest(handle,'sha256').hexdigest()==row['data_sha256']
              assert data.with_suffix('.script').is_file() and data.with_suffix('.json').is_file()
          for directory in (profiles,Path(os.environ['PROBE_ROOT'])):
              proof=json.loads((directory/'probe.json').read_text())
              assert proof['status']=='passed' and proof['capabilities_restored'] is True
              assert proof['initial_capabilities']=='' and not (directory/'owned-perf.txt').exists()
          PYPROOF
      - name: Restore only owned perf capabilities
        if: always()
        run: |
          python3 -B - <<'PYCLEAN'
          import os
          from pathlib import Path
          import subprocess
          for key in ('PROBE_ROOT','PROFILE_ROOT'):
              root=os.environ.get(key)
              marker=Path(root)/'owned-perf.txt' if root else None
              if marker and marker.is_file():
                  perf=Path(marker.read_text().strip()).resolve(strict=True)
                  assert perf.name=='perf' and perf.is_relative_to(Path('/usr/lib'))
                  subprocess.run(['sudo','-n','setcap','-r',str(perf)],check=True)
                  assert not subprocess.check_output(['getcap',str(perf)],text=True).strip()
                  marker.unlink()
          PYCLEAN
      - name: Stop only the owned fixture
        if: always()
        run: |
          if test -n "${DIAGNOSTIC_ROOT:-}"; then
            docker logs "crab-userspace-$GITHUB_RUN_ID" > "$DIAGNOSTIC_ROOT/evidence/rustfs.log" 2>&1 || true
          fi
          docker ps -aq --filter "label=crab-userspace=$GITHUB_RUN_ID" | xargs -r docker rm -f
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: push-userspace-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/crab-push-userspace/evidence/**
            ${{ runner.temp }}/crab-push-userspace/workload/userspace-writers-50/artifacts/**
            ${{ runner.temp }}/crab-push-userspace/workload/userspace-writers-50/logs/**
            ${{ runner.temp }}/control-archive/normal/crab
            ${{ runner.temp }}/control-archive/normal/candidate-build.json
            ${{ runner.temp }}/control-archive/safe.map
          if-no-files-found: warn
          retention-days: 14
