name: Kernel profiling permission probe

# Temporary qualification branch only; never promote this workflow replacement.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-permission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kernel-permission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Scope proof compares against the fixed base after follow-up commits.
          fetch-depth: 0
          persist-credentials: false
      - name: Require unchanged product source
        run: |
          python3 -B - <<'PY'
          import subprocess

          changed = subprocess.check_output([
              'git', 'diff', '--name-only',
              '3a4d425ab823c0d4da140a98eaeb6e4caee49c13', 'HEAD',
          ], text=True).splitlines()
          assert changed == [
              '.github/profile/probe_kernel_perf.py',
              '.github/workflows/git-protocol-v2-partial-clone.yml',
          ], changed
          PY
      - name: Install and select the actual perf executable
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y linux-tools-common linux-tools-generic libcap2-bin
          perf_bin="$(find -L /usr/lib/linux-tools -mindepth 2 -type f -name perf | sort -V | tail -1)"
          test -x "${perf_bin}"
          printf 'PERF_BIN=%s\nPROBE_ROOT=%s\n' "${perf_bin}" \
            "${RUNNER_TEMP}/crab-kernel-permission" >> "${GITHUB_ENV}"
      - name: Require real symbolized kernel samples and restore capabilities
        run: |
          python3 -B .github/profile/probe_kernel_perf.py \
            --perf-bin "${PERF_BIN}" --output "${PROBE_ROOT}"
      - name: Restore only the capability set owned by this probe
        if: always()
        run: |
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          root = os.environ.get('PROBE_ROOT')
          marker = Path(root) / 'owned-perf.txt' if root else None
          if marker and marker.is_file():
              perf = Path(marker.read_text().strip()).resolve(strict=True)
              assert perf.name == 'perf' and perf.is_relative_to(Path('/usr/lib'))
              subprocess.run(['sudo', '-n', 'setcap', '-r', str(perf)], check=True)
              assert not subprocess.check_output(['getcap', str(perf)], text=True).strip()
              marker.unlink()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-permission-${{ github.run_id }}
          path: ${{ runner.temp }}/crab-kernel-permission/**
          if-no-files-found: warn
          retention-days: 7
