name: Linux independent push CPU diagnostic

# Temporary diagnostic branch. Retained symbols support attribution only;
# profiler timings cannot qualify a product performance improvement.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: push-cpu-diagnostic-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  AWS_ACCESS_KEY_ID: crab
  AWS_SECRET_ACCESS_KEY: crab
  AWS_REGION: us-east-1
  AWS_ENDPOINT_URL: http://127.0.0.1:9000
  RUSTFS_IMAGE: rustfs/rustfs@sha256:040304b66e029a5cde4bed140b41513e925909839a9b912a40a98340610d1f66

jobs:
  push-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install and prove software CPU sampling before compiling
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y libfuse3-dev pipx linux-tools-common linux-tools-generic binutils
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-push-cpu-target" >> "$GITHUB_ENV"
          # Ubuntu's versioned perf entries link into a separate package directory.
          perf_bin="$(find -L /usr/lib/linux-tools -mindepth 2 -type f -name perf | sort -V | tail -1)"
          test -x "$perf_bin"
          "$perf_bin" version
          echo "PERF_BIN=$perf_bin" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.perf_event_paranoid=-1
          "$perf_bin" record --quiet -e cpu-clock:u -F 99 --call-graph dwarf,16384 \
            -o "$RUNNER_TEMP/perf-smoke.data" -- python3 -c 'sum(i*i for i in range(1000000))'
          "$perf_bin" report -i "$RUNNER_TEMP/perf-smoke.data" --stdio --header \
            > "$RUNNER_TEMP/perf-smoke.txt"
          grep -Eq '# Samples: [1-9]' "$RUNNER_TEMP/perf-smoke.txt"
      - name: Build diagnostic release with symbols retained
        env:
          CARGO_PROFILE_RELEASE_STRIP: none
        run: |
          set -euo pipefail
          GIT_SHA="$(git rev-parse HEAD)" \
            cargo build -p crab --release --locked --features gix-transport
          root="$RUNNER_TEMP/crab-push-cpu"
          mkdir -p "$root/evidence/profiles" "$root/bin"
          echo "CPU_ROOT=$root" >> "$GITHUB_ENV"
          echo "CRAB_REAL_BIN=$CARGO_TARGET_DIR/release/crab" >> "$GITHUB_ENV"
          echo "PROFILE_ROOT=$root/evidence/profiles" >> "$GITHUB_ENV"
          readelf --sections "$CARGO_TARGET_DIR/release/crab" > "$root/evidence/elf-sections.txt"
          grep -F '.symtab' "$root/evidence/elf-sections.txt"
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          binary=Path(os.environ['CARGO_TARGET_DIR'])/'release/crab'
          record={
              'source':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'product_base':'3a4d425ab823c0d4da140a98eaeb6e4caee49c13',
              'compiler':subprocess.check_output(['rustc','-Vv'],text=True),
              'features':'default,gix-transport','profile':'release, strip=none; diagnostic only',
              'sha256':hashlib.file_digest(binary.open('rb'),'sha256').hexdigest(),
          }
          changed=subprocess.check_output(['git','diff','--name-only',record['product_base'],'HEAD'],text=True).splitlines()
          assert changed==['.github/workflows/git-protocol-v2-partial-clone.yml'],changed
          root=Path(os.environ['RUNNER_TEMP'])/'crab-push-cpu'
          (root/'evidence/build.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          tar -C "$CARGO_TARGET_DIR/release" -czf "$root/evidence/diagnostic-crab.tar.gz" crab
      - name: Prepare the pinned workload and profiler wrapper
        run: |
          set -euo pipefail
          curl_source="$RUNNER_TEMP/Github/curl/curl"
          mkdir -p "$(dirname "$curl_source")"
          git clone --no-checkout https://github.com/curl/curl.git "$curl_source"
          git -C "$curl_source" checkout --detach 70c084a0123b468fe7078e3fc72c78e1b66394b6
          test -z "$(git -C "$curl_source" status --porcelain)"
          cat > "$CPU_ROOT/bin/crab-profile" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${1:-}" == push && "$PWD" == */branch-agents/branch-agent-* ]]; then
            stem="$PROFILE_ROOT/${PWD##*/}.$$"
            printf '%s\n' "$PWD" > "$stem.cwd"
            exec "$PERF_BIN" record --quiet -e cpu-clock:u -F 499 --call-graph dwarf,16384 \
              -o "$stem.data" -- "$CRAB_REAL_BIN" "$@"
          fi
          # Cold Git readers invoke this wrapper through git-remote-crab.
          if [[ "${0##*/}" == git-remote-crab ]]; then
            exec -a git-remote-crab "$CRAB_REAL_BIN" "$@"
          fi
          exec "$CRAB_REAL_BIN" "$@"
          SH
          chmod +x "$CPU_ROOT/bin/crab-profile"
          sha256sum "$CPU_ROOT/bin/crab-profile" > "$CPU_ROOT/evidence/wrapper.sha256"
          lscpu > "$CPU_ROOT/evidence/host.txt"
          "$PERF_BIN" version >> "$CPU_ROOT/evidence/host.txt"
          git --version >> "$CPU_ROOT/evidence/host.txt"
      - name: Start pinned RustFS
        id: store
        run: |
          set -euo pipefail
          docker run -d --name crab-push-cpu-rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=crab -e RUSTFS_SECRET_KEY=crab \
            "$RUSTFS_IMAGE" server /data --address :9000
          docker image inspect "$RUSTFS_IMAGE" --format '{{json .RepoDigests}}' \
            > "$CPU_ROOT/evidence/rustfs-image.json"
          for _ in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/health/ready || true)"
            if [ "${status:-000}" = 200 ]; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Sample 50 independent writers and require cold integrity checks
        env:
          GIT_TRACE2_EVENT: ${{ runner.temp }}/crab-push-cpu/evidence/git-trace.jsonl
        run: |
          python3 -B crab/scripts/e2e/run_existing_ref_push_rustfs.py \
            --crab-bin "$CPU_ROOT/bin/crab-profile" \
            --source "$RUNNER_TEMP/Github/curl/curl" \
            --root "$CPU_ROOT/workload" --run-id profile-writers-50 \
            --bucket crab --endpoint-url "$AWS_ENDPOINT_URL" --push-client native \
            --agents 50 --branch-update-rounds 2 --max-parallel-pushes 50 \
            --consumer-mode cold-final --skip-same-branch --no-request-capture \
            --timeout 600 --push-timeout 600
      - name: Decode sampled stacks and preserve command receipts
        if: ${{ !cancelled() && steps.store.outcome == 'success' }}
        run: |
          set -euo pipefail
          for data in "$PROFILE_ROOT"/*.data; do
            "$PERF_BIN" report -i "$data" --stdio --no-children --percent-limit 0.1 \
              --sort comm,dso,symbol --header > "${data%.data}.report.txt"
            "$PERF_BIN" script -i "$data" --ns | gzip -1 > "${data%.data}.stacks.gz"
          done
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['CPU_ROOT'])
          report=json.loads((root/'workload/profile-writers-50/artifacts/report.json').read_text())
          assert report['status']=='ok',report['status']
          assert len(report['branch_updates'])==100
          assert report['workload']['update_payload_bytes']==4096
          profiles=list((root/'evidence/profiles').glob('*.report.txt'))
          assert len(profiles)>=100,len(profiles)
          (root/'evidence/diagnostic.json').write_text(json.dumps({
              'scope':'CPU attribution only; timings include profiler overhead',
              'updates':100,'profiles':len(profiles),'integrity_report_status':report['status'],
          },indent=2)+'\n')
          PY
      - name: Stop fixture
        if: always()
        run: |
          if test -n "${CPU_ROOT:-}"; then
            docker logs crab-push-cpu-rustfs > "$CPU_ROOT/evidence/rustfs.log" 2>&1 || true
          fi
          docker stop crab-push-cpu-rustfs || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: push-cpu-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/crab-push-cpu/evidence/**
            ${{ runner.temp }}/crab-push-cpu/workload/profile-writers-50/artifacts/**
            ${{ runner.temp }}/crab-push-cpu/workload/profile-writers-50/logs/**
            ${{ runner.temp }}/crab-push-cpu/bin/crab-profile
            ${{ runner.temp }}/perf-smoke.txt
          if-no-files-found: warn
          retention-days: 14
