name: HTTP server Kubernetes live qualification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Provider-specific protected environment containing its cluster identity and Git token
        required: true
        type: environment
      provider:
        description: Existing Kubernetes platform to qualify
        required: true
        type: choice
        options:
          - eks
          - gke
          - aks
      runner:
        description: Hosted runner name or dedicated self-hosted runner label
        required: true
        default: ubuntu-latest
        type: string
      gke_endpoint:
        description: GKE control-plane endpoint mode; ignored for EKS and AKS
        required: true
        default: public
        type: choice
        options:
          - public
          - internal
          - connect-gateway
      namespace:
        description: Namespace containing the Crab release
        required: true
        default: crab
        type: string
      deployment:
        description: Crab Deployment and Service name
        required: true
        default: crab-http-server
        type: string
      origin:
        description: Public HTTPS origin without a trailing slash
        required: true
        type: string
      owner:
        description: Dedicated qualification repository owner
        required: true
        type: string
      repository:
        description: Dedicated qualification repository name
        required: true
        type: string
      node_profile:
        description: Resource profile every qualified Pod must match
        required: true
        type: choice
        options:
          - small
          - medium
          - large
      approve_rollout:
        description: I approve a write and rolling restart of this deployment
        required: true
        default: false
        type: boolean
      approve_owner_loss:
        description: I approve forced deletion of the current Cell owner Pod
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: http-server-kubernetes-live-${{ inputs.environment }}-${{ inputs.provider }}
  cancel-in-progress: false

jobs:
  qualify:
    name: Qualify ${{ inputs.provider }} deployment
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: read
    env:
      AWS_ROLE_ARN: ${{ vars.CRAB_HTTP_SERVER_EKS_GITHUB_ROLE_ARN }}
      AWS_REGION: ${{ vars.CRAB_HTTP_SERVER_EKS_REGION }}
      EKS_CLUSTER: ${{ vars.CRAB_HTTP_SERVER_EKS_CLUSTER }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CRAB_HTTP_SERVER_GKE_GITHUB_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.CRAB_HTTP_SERVER_GKE_GITHUB_SERVICE_ACCOUNT }}
      GCP_PROJECT: ${{ vars.CRAB_HTTP_SERVER_GKE_PROJECT }}
      GKE_CLUSTER: ${{ vars.CRAB_HTTP_SERVER_GKE_CLUSTER }}
      GKE_LOCATION: ${{ vars.CRAB_HTTP_SERVER_GKE_LOCATION }}
      AZURE_CLIENT_ID: ${{ vars.CRAB_HTTP_SERVER_AKS_GITHUB_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.CRAB_HTTP_SERVER_AKS_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.CRAB_HTTP_SERVER_AKS_SUBSCRIPTION_ID }}
      AKS_RESOURCE_GROUP: ${{ vars.CRAB_HTTP_SERVER_AKS_RESOURCE_GROUP }}
      AKS_CLUSTER: ${{ vars.CRAB_HTTP_SERVER_AKS_CLUSTER }}
    steps:
      - name: Require explicit mutation approval
        shell: bash
        env:
          ROLLOUT_APPROVED: ${{ inputs.approve_rollout }}
          OWNER_LOSS_APPROVED: ${{ inputs.approve_owner_loss }}
        run: |
          set -euo pipefail
          test "$ROLLOUT_APPROVED" = true || {
            echo "::error::Approve the qualification write and rolling restart."
            exit 1
          }
          test "$OWNER_LOSS_APPROVED" = true || {
            echo "::error::Approve forced deletion of the current Cell owner Pod."
            exit 1
          }

      - name: Check out qualification source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require an annotated server release tag
        id: release
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != tag ] ||
            [[ ! "$REF_NAME" =~ ^crab-http-server-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Dispatch this workflow from an annotated crab-http-server-vX.Y.Z tag."
            exit 1
          fi
          version="${REF_NAME#crab-http-server-v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/crab-http-server/Cargo.toml | head -1)"
          chart_version="$(sed -n 's/^version: *//p' crates/crab-http-server/deploy/helm/crab-http-server/Chart.yaml | head -1)"
          app_version="$(sed -n 's/^appVersion: *"\(.*\)"/\1/p' crates/crab-http-server/deploy/helm/crab-http-server/Chart.yaml | head -1)"
          if [ "$manifest_version" != "$version" ] ||
            [ "$chart_version" != "$version" ] ||
            [ "$app_version" != "$version" ]; then
            echo "::error::$REF_NAME does not match the server and chart versions."
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$REF_NAME" 2>/dev/null || true)" != tag ]; then
            echo "::error::$REF_NAME must be an annotated tag."
            exit 1
          fi
          source_sha="$(git rev-list -n 1 "$REF_NAME")"
          if [ "$source_sha" != "$(git rev-parse HEAD)" ]; then
            echo "::error::The checkout does not match $REF_NAME."
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::$REF_NAME is not reachable from origin/main."
            exit 1
          }
          {
            echo "tag=$REF_NAME"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify the release record
        id: release-record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail

          release_dir="${RUNNER_TEMP}/crab-http-server-release"
          manifest="$release_dir/crab-http-server-release.json"
          bundle="$release_dir/crab-http-server-release.attestation.json"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'crab-http-server-release*' \
            --dir "$release_dir"
          test -s "$manifest"
          test -s "$bundle"

          gh attestation verify "$manifest" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/http-server-release.yml" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners

          owner="${GITHUB_REPOSITORY_OWNER,,}"
          official_image="ghcr.io/${owner}/crab-http-server"
          official_chart="oci://ghcr.io/${owner}/charts/crab-http-server"
          version="${RELEASE_TAG#crab-http-server-v}"
          jq --exit-status \
            --arg tag "$RELEASE_TAG" \
            --arg version "$version" \
            --arg source_sha "$SOURCE_SHA" \
            --arg image "$official_image" \
            --arg chart "$official_chart" \
            '.schema == 1 and .tag == $tag and .version == $version and
             .source_commit == $source_sha and
             .image.repository == $image and
             (.image.digest | test("^sha256:[0-9a-f]{64}$")) and
             .image.reference == ($image + "@" + .image.digest) and
             .image.platforms == ["linux/amd64", "linux/arm64"] and
             .chart.repository == $chart and
             (.chart.digest | test("^sha256:[0-9a-f]{64}$")) and
             .chart.reference == ($chart + "@" + .chart.digest) and
             .chart.package == ("crab-http-server-" + $version + ".tgz") and
             (.chart.package_digest | test("^sha256:[0-9a-f]{64}$"))' \
            "$manifest" >/dev/null
          {
            echo "expected_image=$(jq --raw-output .image.reference "$manifest")"
            echo "expected_chart=$(jq --raw-output .chart.reference "$manifest")"
          } >> "$GITHUB_OUTPUT"

      - name: Validate selected provider inputs
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
          GIT_TOKEN: ${{ secrets.CRAB_HTTP_SERVER_QUALIFICATION_GIT_TOKEN }}
        run: |
          set -euo pipefail
          require_value() {
            local name="$1"
            local value="$2"
            test -n "$value" || {
              echo "::error::Protected environment value $name is required."
              exit 1
            }
          }

          require_value CRAB_HTTP_SERVER_QUALIFICATION_GIT_TOKEN "$GIT_TOKEN"
          case "$PROVIDER" in
            eks)
              require_value CRAB_HTTP_SERVER_EKS_GITHUB_ROLE_ARN "$AWS_ROLE_ARN"
              require_value CRAB_HTTP_SERVER_EKS_REGION "$AWS_REGION"
              require_value CRAB_HTTP_SERVER_EKS_CLUSTER "$EKS_CLUSTER"
              ;;
            gke)
              require_value CRAB_HTTP_SERVER_GKE_GITHUB_IDENTITY_PROVIDER "$GCP_WORKLOAD_IDENTITY_PROVIDER"
              require_value CRAB_HTTP_SERVER_GKE_GITHUB_SERVICE_ACCOUNT "$GCP_SERVICE_ACCOUNT"
              require_value CRAB_HTTP_SERVER_GKE_PROJECT "$GCP_PROJECT"
              require_value CRAB_HTTP_SERVER_GKE_CLUSTER "$GKE_CLUSTER"
              require_value CRAB_HTTP_SERVER_GKE_LOCATION "$GKE_LOCATION"
              ;;
            aks)
              require_value CRAB_HTTP_SERVER_AKS_GITHUB_CLIENT_ID "$AZURE_CLIENT_ID"
              require_value CRAB_HTTP_SERVER_AKS_TENANT_ID "$AZURE_TENANT_ID"
              require_value CRAB_HTTP_SERVER_AKS_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
              require_value CRAB_HTTP_SERVER_AKS_RESOURCE_GROUP "$AKS_RESOURCE_GROUP"
              require_value CRAB_HTTP_SERVER_AKS_CLUSTER "$AKS_CLUSTER"
              ;;
            *)
              echo "::error::Unsupported provider $PROVIDER."
              exit 1
              ;;
          esac

      - name: Verify the release artifact provenance
        shell: bash
        env:
          EXPECTED_CHART: ${{ steps.release-record.outputs.expected_chart }}
          EXPECTED_IMAGE: ${{ steps.release-record.outputs.expected_image }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh attestation verify "oci://${EXPECTED_IMAGE}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/http-server-release.yml" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners
          gh attestation verify "$EXPECTED_CHART" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/http-server-release.yml" \
            --source-ref "refs/tags/${RELEASE_TAG}" \
            --source-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners

      - name: Authenticate to AWS with GitHub OIDC
        if: inputs.provider == 'eks'
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: crab-http-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Select the EKS cluster
        if: inputs.provider == 'eks'
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER" --region "$AWS_REGION" \
            --alias crab-http-live

      - name: Authenticate to Google Cloud with GitHub OIDC
        if: inputs.provider == 'gke'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT }}

      - name: Select the GKE cluster
        if: inputs.provider == 'gke'
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.GCP_PROJECT }}
          use_internal_ip: ${{ inputs.gke_endpoint == 'internal' }}
          use_connect_gateway: ${{ inputs.gke_endpoint == 'connect-gateway' }}

      - name: Authenticate to Azure with GitHub OIDC
        if: inputs.provider == 'aks'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubelogin for non-admin AKS access
        if: inputs.provider == 'aks'
        uses: azure/use-kubelogin@76597ae0fcbaace21b05e13a2cbf8daee2c6e820 # v1.3
        with:
          kubelogin-version: v0.2.19

      - name: Select the AKS cluster
        if: inputs.provider == 'aks'
        uses: azure/aks-set-context@60623acbdcbbdcf799ad50a1adf8703874339f8b # v5.0.0
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          subscription: ${{ env.AZURE_SUBSCRIPTION_ID }}
          admin: false
          use-kubelogin: true

      - name: Run cross-replica qualification
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
          NAMESPACE: ${{ inputs.namespace }}
          DEPLOYMENT: ${{ inputs.deployment }}
          ORIGIN: ${{ inputs.origin }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          CRAB_HTTP_SERVER_GIT_TOKEN: ${{ secrets.CRAB_HTTP_SERVER_QUALIFICATION_GIT_TOKEN }}
          CRAB_HTTP_SERVER_EXPECTED_CHART: ${{ steps.release-record.outputs.expected_chart }}
          CRAB_HTTP_SERVER_EXPECTED_IMAGE: ${{ steps.release-record.outputs.expected_image }}
          CRAB_HTTP_SERVER_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CRAB_HTTP_SERVER_SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          CRAB_HTTP_SERVER_NODE_PROFILE: ${{ inputs.node_profile }}
          CRAB_HTTP_SERVER_APPROVE_ROLLOUT: "true"
          CRAB_HTTP_SERVER_APPROVE_OWNER_LOSS: "true"
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/crab-http-server-live-evidence"
          mkdir -p "$evidence_dir"
          bash crates/crab-http-server/deploy/helm/crab-http-server/qualification/qualify-kubernetes.sh \
            "$PROVIDER" "$NAMESPACE" "$DEPLOYMENT" "$ORIGIN" \
            "$OWNER" "$REPOSITORY" "$evidence_dir/receipt.json"

      - name: Verify evidence binds the selected deployment
        shell: bash
        env:
          PROVIDER: ${{ inputs.provider }}
          NAMESPACE: ${{ inputs.namespace }}
          DEPLOYMENT: ${{ inputs.deployment }}
          ORIGIN: ${{ inputs.origin }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          NODE_PROFILE: ${{ inputs.node_profile }}
          EXPECTED_CHART: ${{ steps.release-record.outputs.expected_chart }}
          EXPECTED_IMAGE: ${{ steps.release-record.outputs.expected_image }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          receipt="${RUNNER_TEMP}/crab-http-server-live-evidence/receipt.json"
          jq --exit-status \
            --arg provider "$PROVIDER" \
            --arg namespace "$NAMESPACE" \
            --arg deployment "$DEPLOYMENT" \
            --arg origin "${ORIGIN%/}" \
            --arg repository "${OWNER}/${REPOSITORY}" \
            --arg chart "$EXPECTED_CHART" \
            --arg image "$EXPECTED_IMAGE" \
            --arg release_tag "$RELEASE_TAG" \
            --arg source_sha "$SOURCE_SHA" \
            --arg node_profile "$NODE_PROFILE" \
            '.schema == 10 and .provider == $provider and
             .namespace == $namespace and .deployment == $deployment and
             .origin == $origin and .repository == $repository and
             .node_profile == $node_profile and
             (.scratch_limit_bytes | type) == "number" and
             .scratch_limit_bytes > 0 and
             .image == $image and .chart == $chart and
             .qualification_source.release_tag == $release_tag and
             .qualification_source.commit == $source_sha and
             (.workload_identity.service_account | length) > 0 and
             .workload_identity.mechanism ==
               (if $provider == "eks" then "eks-pod-identity"
                elif $provider == "gke" then "gke-workload-identity-federation"
                else "aks-workload-identity" end) and
             .replica_count >= 3 and .zone_count >= 2 and
             .rollout_probes >= 1 and .rollout_probe_failures == 0 and
             .checks.oidc_login_redirect == true and
             .checks.oidc_secure_flow_cookie == true and
             .checks.restricted_namespace == true and
             .checks.release_chart_version == true and
             .checks.workload_identity_only == true and
             .checks.management_network_isolation == true and
             .checks.capacity_envelopes == true and
             .checks.node_profile_resources == true and
             .checks.cross_replica_git == true and
             .checks.cross_replica_lfs == true and
             .checks.durable_lfs_lock == true and
             .checks.cross_replica_cell == true and
             .checks.zero_unavailable_rollout == true and
             .checks.post_rollout_clone == true and
             .checks.post_rollout_cell_restore == true and
             .checks.abrupt_owner_loss == true and
             .checks.owner_loss_exact_root_restore == true and
             .checks.owner_loss_publication_continues == true and
             (.continuation_context | length) > 0 and
             (.owner_loss.deleted_pod_uid | length) > 0 and
             (.owner_loss.session_before | test("^[0-9a-f]{32}$")) and
             (.owner_loss.session_after | test("^[0-9a-f]{32}$")) and
             .owner_loss.session_after != .owner_loss.session_before and
             .owner_loss.epoch_after > .owner_loss.epoch_before and
             (.owner_loss.root_before | keys | sort) ==
               ["checksum", "commit_sequence", "digest", "txid"] and
             (.owner_loss.root_before.digest | test("^[0-9a-f]{64}$")) and
             (.owner_loss.root_before.txid | type) == "number" and
             .owner_loss.root_before.txid > 0 and
             (.owner_loss.root_before.checksum | type) == "number" and
             (.owner_loss.root_before.commit_sequence | type) == "number" and
             .owner_loss.root_before.commit_sequence > 0 and
             .owner_loss.root_after == .owner_loss.root_before and
             (.owner_loss.root_final | keys | sort) ==
               ["checksum", "commit_sequence", "digest", "txid"] and
             (.owner_loss.root_final.digest | test("^[0-9a-f]{64}$")) and
             (.owner_loss.root_final.checksum | type) == "number" and
             .owner_loss.root_final.digest != .owner_loss.root_after.digest and
             .owner_loss.root_final.txid > .owner_loss.root_after.txid and
             .owner_loss.root_final.commit_sequence >
               .owner_loss.root_after.commit_sequence and
             (.commit | test("^[0-9a-f]{40}$")) and
             (.status_context | length) > 0 and
             (.check_run_id | type) == "number" and .check_run_id > 0 and
             (.payload_sha256 | test("^[0-9a-f]{64}$"))' \
            "$receipt" >/dev/null
          capacity_validator=crates/crab-http-server/deploy/helm/crab-http-server/qualification/validate-capacity-envelope.jq
          profile_validator=crates/crab-http-server/deploy/helm/crab-http-server/qualification/validate-node-profile.jq
          for phase in before_traffic after_rollout after_owner_loss; do
            phase_label="${phase//_/-}"
            jq --arg phase "$phase" '.capacity[$phase]' "$receipt" \
              | jq --exit-status --arg phase "$phase_label" \
                  --from-file "$capacity_validator" >/dev/null
            jq --arg phase "$phase" '.capacity[$phase]' "$receipt" \
              | jq --exit-status --arg profile "$NODE_PROFILE" \
                  --argjson disk_limit_bytes "$(jq '.scratch_limit_bytes' "$receipt")" \
                  --from-file "$profile_validator" >/dev/null
          done

      - name: Attest the qualification receipt
        id: receipt-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/crab-http-server-live-evidence/receipt.json

      - name: Preserve the offline attestation bundle
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.receipt-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" \
            "${RUNNER_TEMP}/crab-http-server-live-evidence/receipt.attestation.json"

      - name: Retain qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crab-http-server-${{ inputs.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crab-http-server-live-evidence/
          if-no-files-found: error
          retention-days: 90
