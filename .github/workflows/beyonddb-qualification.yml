name: BeyondDB SDK qualification

on:
  pull_request:
    paths:
      - ".github/workflows/beyonddb-qualification.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/beyonddb/**"
      - "crates/crab-cell-*/**"
      - "crates/crab-ltx/**"
      - "crates/crab-storage/**"
      - "crates/crab-types/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/beyonddb-qualification.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/beyonddb/**"
      - "crates/crab-cell-*/**"
      - "crates/crab-ltx/**"
      - "crates/crab-storage/**"
      - "crates/crab-types/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beyonddb-sdk-${{ github.event.pull_request.number || github.ref }}
  # Let expensive process qualification finish; newer pushes replace the pending
  # run, so continued development cannot repeatedly discard all test evidence.
  cancel-in-progress: false

jobs:
  sdk:
    name: Signed SDK and process recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Prepare isolated build and fixture paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/beyonddb-target" "$RUNNER_TEMP/beyonddb-fixtures" "$RUNNER_TEMP/beyonddb-logs"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/beyonddb-target" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/beyonddb-fixtures" >> "$GITHUB_ENV"
      - name: Install qualification tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y pipx openssl
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          docker info
      - name: Verify signed SDK requests and owner recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p beyonddb --locked --lib server::capacity \
            2>&1 | tee "$RUNNER_TEMP/beyonddb-logs/capacity.log"
          # The directory cutover changes native fixtures as well as SDK paths.
          # Run all capability suites serially to keep fixture storage workloads
          # from distorting one another's unchanged readiness deadlines.
          qualification_status=0
          # Large debug native futures require the measured 16-MiB test stack.
          # Keep this out of the peer/server command and its child processes.
          RUST_MIN_STACK=16777216 cargo test -p beyonddb --locked --test elastic_cells \
            -- --include-ignored --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/beyonddb-logs/native.log" || qualification_status=$?
          cargo test -p beyonddb --locked --no-fail-fast \
            --test peer_network --test server_binary \
            -- --include-ignored --test-threads=1 --nocapture \
            2>&1 | tee "$RUNNER_TEMP/beyonddb-logs/sdk.log" || qualification_status=$?
          exit "$qualification_status"
      - name: Retain qualification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beyonddb-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beyonddb-logs/
          if-no-files-found: warn
          retention-days: 7
