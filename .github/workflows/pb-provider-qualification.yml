      - "crates/crab-server/src/repository/tests/cdn.rs"
      - "crates/crab-server/src/server/capacity.rs"
      - "crates/crab-server/src/server/mod.rs"
      - "crates/crab-s3-gateway/Cargo.toml"
      - "crates/crab-s3-gateway/build.rs"
      - "crates/crab-s3-gateway/src/main.rs"
      - "crates/crab-s3-gateway/src/gateway.rs"
      - "crates/crab-s3-gateway/src/gateway/cdn_tests.rs"
      - "packages/desktop/agent/Cargo.toml"
      - "crates/crab-metadata/src/pack_origin.rs"
      - "crates/crab-metadata/src/receipts.rs"
      - "crab/docs/guides/provider-qualification.md"
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
    inputs:
      provider:
        description: Provider contract to qualify
        required: true
        default: all
        type: choice
        options:
          - all
          - s3
          - gcs
          - azure
      cdn_transport:
        description: Check the selected providers' approved CDN fixtures
        type: boolean
        default: false
      publish_cdn_evidence:
        description: Assemble and publish measured CDN release evidence for this attempt
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  # RustFS 1.0.0 GA; this immutable index covers Linux amd64 and arm64.
  RUSTFS_IMAGE: ghcr.io/rustfs/rustfs@sha256:bffcab0c9d647aab0055d1c69d340b202d0909966b385932d4ead1aeb7602858

jobs:
  evidence-contract:
    name: Evidence contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify evidence schema tests
        run: |
          python3 -m unittest crab/scripts/e2e/test_verify_provider_qualification_report.py
          python3 -m unittest discover -s crab/scripts/e2e -p 'test_cdn*qualification.py'
          python3 -m unittest discover -s crab/scripts/e2e -p test_add_commit_push_source.py
          python3 -m py_compile \
            crab/scripts/verify-provider-qualification-report.py \
            crab/scripts/e2e/test_verify_provider_qualification_report.py

      - name: Verify CDN fixture policy and public publishers
        run: |
          node crab/deploy/cdn/aws/check_fixture.mjs
          python3 -m venv "$RUNNER_TEMP/cdn-publisher-python"
          publisher_python="$RUNNER_TEMP/cdn-publisher-python/bin/python"
          "$publisher_python" -m pip install --disable-pip-version-check 'google-cloud-storage==3.17.1'
          for provider in aws gcp/public-export azure/public-export; do
            "$publisher_python" -B "crab/deploy/cdn/$provider/test_publish_export.py"
          done

      - name: Check default and qualification CDN builds
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/provider-cdn-features
        run: |
          set -euo pipefail
          for package in crab crab-sdk crab-desktop-agent crab-server crab-s3-gateway; do
            feature_args=()
            case "$package" in
              crab-sdk) feature_args=(--features service) ;;
              crab-server|crab-s3-gateway) feature_args=(--features provider-cdn) ;;
            esac
            baseline=$(cargo tree --locked -p "$package" -i crab-storage -e features "${feature_args[@]}")
            qualification=$(cargo tree --locked -p "$package" -i crab-storage -e features \
              --features provider-cdn-qualification)
            feature='crab-storage feature "provider-cdn-qualification"'
            [[ "$baseline" != *"$feature"* ]]
            [[ "$qualification" == *"$feature"* ]]
          done
          cargo test --locked -p crab-storage --lib 'cdn::'
          cargo test --locked -p crab-storage --lib --features provider-cdn-qualification 'cdn::'
          cargo test --locked -p crab-sdk --features local,service --example cdn-sdk-read
          cargo test --locked -p crab-lfs --test cdn_observation
          cargo test --locked -p crab-lfs --test cdn_observation --features crab-storage/provider-cdn-qualification
          cargo test --locked -p crab-cache --lib --features local-cache \
            lfs_read_and_reservation_report_the_same_physical_root

      - name: Set up repository frontend toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Build embedded repository frontend
        run: |
          npm ci --prefix packages/ui
          npm run build --prefix packages/ui

      - name: Exercise CDN delivery through both service interfaces
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/provider-cdn-features
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          smoke() {
            cargo test --locked -p "$1" --lib --features provider-cdn-qualification "$2" -- --exact \
              | tee "$RUNNER_TEMP/cdn-service-smoke.log"
            grep -Eq 'test result: ok\. 1 passed; 0 failed;' "$RUNNER_TEMP/cdn-service-smoke.log"
          }
          cargo check --locked -p crab-server -p crab-s3-gateway \
            --features crab-server/provider-cdn-qualification,crab-s3-gateway/provider-cdn-qualification --bins
          smoke crab-server repository::tests::cdn::ordinary_http_reads_use_verified_edge_bodies_and_keep_native_controls
          smoke crab-s3-gateway gateway::cdn_tests::authorized_gateway_reads_verified_git_and_lfs_from_the_edge

  rustfs:
    name: S3-compatible RustFS
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.provider == 'all' || inputs.provider == 's3'))
    needs: evidence-contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AWS_ACCESS_KEY_ID: crab
      AWS_SECRET_ACCESS_KEY: crab
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_ALLOW_HTTP: "true"
      CRAB_S3_FORCE_PATH_STYLE: "true"
      CRAB_PROVIDER_QUALIFICATION_PROVIDER: s3
      CRAB_PROVIDER_QUALIFICATION_BUCKET: crab-provider-qualification
      CRAB_PROVIDER_QUALIFICATION_SERVICE: rustfs-1.0.0-ga
      CRAB_PROVIDER_QUALIFICATION_REGION: local
      CRAB_PROVIDER_QUALIFICATION_SOURCE_SHA: ${{ github.sha }}
      CRAB_PROVIDER_QUALIFICATION_WORKFLOW_RUN_ID: ${{ github.run_id }}
      CRAB_PROVIDER_QUALIFICATION_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      CRAB_PROVIDER_QUALIFICATION_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-s3
      CRAB_PROVIDER_QUALIFICATION_REPORT: ${{ github.workspace }}/provider-qualification-evidence/rustfs/report.json
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/cargo-target-provider-qualification-s3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start pinned RustFS
        run: |
          set -euo pipefail
          data_root="${RUNNER_TEMP}/rustfs-data"
          mkdir -p "$data_root"
          sudo chown 10001:10001 "$data_root"
          docker pull "$RUSTFS_IMAGE"
          docker run -d \
            --name crab-provider-rustfs \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=crab \
            -e RUSTFS_SECRET_KEY=crab \
            -v "$data_root:/data" \
            "$RUSTFS_IMAGE" server /data --address :9000
          for _ in $(seq 1 90); do
            if aws --endpoint-url "$AWS_ENDPOINT_URL" s3api list-buckets >/dev/null 2>&1; then
              aws --endpoint-url "$AWS_ENDPOINT_URL" s3api create-bucket \
                --bucket "$CRAB_PROVIDER_QUALIFICATION_BUCKET"
              exit 0
            fi
            sleep 1
          done
          docker logs crab-provider-rustfs >&2 || true
          exit 1

      - name: Verify and retain RustFS version
        run: |
          set -euo pipefail
          version_report="$(dirname "$CRAB_PROVIDER_QUALIFICATION_REPORT")/service-version.txt"
          mkdir -p "$(dirname "$version_report")"
          docker exec crab-provider-rustfs rustfs --version | tee "$version_report"
          test "$(head -n 1 "$version_report")" = "rustfs 1.0.0"

      - name: Run provider contract
        run: |
          cargo test -p crab --test provider_qualification --locked \
            -- --ignored --exact provider_contracts --nocapture

      - name: Build release canary binary
        run: cargo build -p crab --release --locked

      - name: Run canonical v1 cutover and add-push-clone canary
        id: canary
        run: |
          python3 crab/scripts/e2e/run_add_commit_push_rustfs_smoke.py \
            --bucket "$CRAB_PROVIDER_QUALIFICATION_BUCKET" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --crab-bin "$CARGO_TARGET_DIR/release/crab" \
            --root "$RUNNER_TEMP/provider-qualification/s3/canary" \
            --run-id "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --size-mib 4

      - name: Verify retained evidence
        run: |
          python3 crab/scripts/verify-provider-qualification-report.py \
            "$CRAB_PROVIDER_QUALIFICATION_REPORT" \
            --provider s3 \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Capture service log
        if: always()
        run: |
          mkdir -p "$(dirname "$CRAB_PROVIDER_QUALIFICATION_REPORT")"
          docker logs crab-provider-rustfs \
            > "$(dirname "$CRAB_PROVIDER_QUALIFICATION_REPORT")/service.log" 2>&1 || true
          docker rm -f crab-provider-rustfs >/dev/null 2>&1 || true

      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-qualification-s3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/provider-qualification-evidence/rustfs/**
          if-no-files-found: error
          retention-days: 90

      # The canary writes under runner.temp, outside the provider report tree.
      # Keep failure diagnostics without changing the existing artifact layout.
      - name: Upload canary diagnostics
        if: always() && (steps.canary.outcome == 'success' || steps.canary.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: provider-canary-s3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/provider-qualification/s3/canary/gha-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/report.json
            ${{ runner.temp }}/provider-qualification/s3/canary/gha-${{ github.run_id }}-${{ github.run_attempt }}/logs/*.log
          if-no-files-found: error
          retention-days: 90

  s3:
    name: Amazon S3
    if: >-
      vars.CRAB_PROVIDER_S3_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.provider == 'all' || inputs.provider == 's3')))
    needs: evidence-contract
    runs-on: ubuntu-latest
    environment: provider-qualification-s3
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      CRAB_PROVIDER_QUALIFICATION_PROVIDER: s3
      CRAB_PROVIDER_QUALIFICATION_BUCKET: ${{ vars.CRAB_PROVIDER_S3_BUCKET }}
      CRAB_PROVIDER_QUALIFICATION_SERVICE: amazon-s3
      CRAB_PROVIDER_QUALIFICATION_REGION: ${{ vars.CRAB_PROVIDER_S3_REGION }}
      CRAB_PROVIDER_QUALIFICATION_SOURCE_SHA: ${{ github.sha }}
      CRAB_PROVIDER_QUALIFICATION_WORKFLOW_RUN_ID: ${{ github.run_id }}
      CRAB_PROVIDER_QUALIFICATION_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      CRAB_PROVIDER_QUALIFICATION_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-amazon-s3
      CRAB_PROVIDER_QUALIFICATION_REPORT: ${{ github.workspace }}/provider-qualification-evidence/amazon-s3/report.json
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/cargo-target-provider-qualification-amazon-s3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build provider contract
        run: cargo test -p crab --test provider_qualification --locked --no-run

      - name: Request credentials for the qualification bucket
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.CRAB_PROVIDER_S3_ROLE_ARN }}
          aws-region: ${{ vars.CRAB_PROVIDER_S3_REGION }}
          allowed-account-ids: ${{ vars.CRAB_PROVIDER_S3_ACCOUNT_ID }}
          role-session-name: crab-provider-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Run provider contract
        env:
          EXPECTED_BUCKET_OWNER: ${{ vars.CRAB_PROVIDER_S3_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_BUCKET_OWNER"
          test -n "$CRAB_PROVIDER_QUALIFICATION_BUCKET"
          prefix="crab-provider-qualification/$CRAB_PROVIDER_QUALIFICATION_RUN_ID/"
          count="$(aws s3api list-objects-v2 --bucket "$CRAB_PROVIDER_QUALIFICATION_BUCKET" \
            --expected-bucket-owner "$EXPECTED_BUCKET_OWNER" --prefix "$prefix" \
            --cli-input-json '{"MaxKeys":1}' --no-paginate --query KeyCount --output text --no-cli-pager)"
          test "$count" = 0
          cargo test -p crab --test provider_qualification --locked \
            -- --ignored --exact provider_contracts --nocapture

      - name: Verify retained evidence
        run: |
          python3 crab/scripts/verify-provider-qualification-report.py \
            "$CRAB_PROVIDER_QUALIFICATION_REPORT" \
            --provider s3 \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload retained evidence
        uses: actions/upload-artifact@v4
        with:
          name: provider-qualification-amazon-s3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CRAB_PROVIDER_QUALIFICATION_REPORT }}
          if-no-files-found: error
          retention-days: 90

  gcs:
    name: Google Cloud Storage
    if: >-
      vars.CRAB_PROVIDER_GCS_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.provider == 'all' || inputs.provider == 'gcs')))
    needs: evidence-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.CRAB_PROVIDER_GCS_SERVICE_ACCOUNT_KEY }}
      CRAB_PROVIDER_QUALIFICATION_PROVIDER: gcs
      CRAB_PROVIDER_QUALIFICATION_BUCKET: ${{ vars.CRAB_PROVIDER_GCS_BUCKET }}
      CRAB_PROVIDER_QUALIFICATION_SERVICE: google-cloud-storage
      CRAB_PROVIDER_QUALIFICATION_REGION: ${{ vars.CRAB_PROVIDER_GCS_REGION }}
      CRAB_PROVIDER_QUALIFICATION_SOURCE_SHA: ${{ github.sha }}
      CRAB_PROVIDER_QUALIFICATION_WORKFLOW_RUN_ID: ${{ github.run_id }}
      CRAB_PROVIDER_QUALIFICATION_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      CRAB_PROVIDER_QUALIFICATION_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-gcs
      CRAB_PROVIDER_QUALIFICATION_REPORT: ${{ github.workspace }}/provider-qualification-evidence/gcs/report.json
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/cargo-target-provider-qualification-gcs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run provider contract
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_KEY"
          test -n "$CRAB_PROVIDER_QUALIFICATION_BUCKET"
          test -n "$CRAB_PROVIDER_QUALIFICATION_REGION"
          cargo test -p crab --test provider_qualification --locked \
            -- --ignored --exact provider_contracts --nocapture

      - name: Verify retained evidence
        run: |
          python3 crab/scripts/verify-provider-qualification-report.py \
            "$CRAB_PROVIDER_QUALIFICATION_REPORT" \
            --provider gcs \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-qualification-gcs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CRAB_PROVIDER_QUALIFICATION_REPORT }}
          if-no-files-found: error
          retention-days: 90

  azure:
    name: Azure Blob Storage
    if: >-
      vars.CRAB_PROVIDER_AZURE_ENABLED == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' &&
        (inputs.provider == 'all' || inputs.provider == 'azure')))
    needs: evidence-contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.CRAB_PROVIDER_AZURE_ACCOUNT }}
      AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.CRAB_PROVIDER_AZURE_ACCOUNT_KEY }}
      CRAB_PROVIDER_QUALIFICATION_PROVIDER: azure
      CRAB_PROVIDER_QUALIFICATION_BUCKET: ${{ vars.CRAB_PROVIDER_AZURE_CONTAINER }}
      CRAB_PROVIDER_QUALIFICATION_SERVICE: azure-blob-storage
      CRAB_PROVIDER_QUALIFICATION_REGION: ${{ vars.CRAB_PROVIDER_AZURE_REGION }}
      CRAB_PROVIDER_QUALIFICATION_SOURCE_SHA: ${{ github.sha }}
      CRAB_PROVIDER_QUALIFICATION_WORKFLOW_RUN_ID: ${{ github.run_id }}
      CRAB_PROVIDER_QUALIFICATION_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      CRAB_PROVIDER_QUALIFICATION_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-azure
      CRAB_PROVIDER_QUALIFICATION_REPORT: ${{ github.workspace }}/provider-qualification-evidence/azure/report.json
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci/cargo-target-provider-qualification-azure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run provider contract
        run: |
          test -n "$AZURE_STORAGE_ACCOUNT_NAME"
          test -n "$AZURE_STORAGE_ACCOUNT_KEY"
          test -n "$CRAB_PROVIDER_QUALIFICATION_BUCKET"
          test -n "$CRAB_PROVIDER_QUALIFICATION_REGION"
          cargo test -p crab --test provider_qualification --locked \
            -- --ignored --exact provider_contracts --nocapture

      - name: Verify retained evidence
        run: |
          python3 crab/scripts/verify-provider-qualification-report.py \
            "$CRAB_PROVIDER_QUALIFICATION_REPORT" \
            --provider azure \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-qualification-azure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CRAB_PROVIDER_QUALIFICATION_REPORT }}
          if-no-files-found: error
          retention-days: 90

  cdn-s3:
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.cdn_transport &&
      (inputs.provider == 'all' || inputs.provider == 's3')
    needs: s3
    uses: ./.github/workflows/provider-cdn-transport.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      CRAB_CDN_TRANSPORT_VIEWER: ${{ secrets.CRAB_CDN_TRANSPORT_VIEWER }}
      CRAB_CDN_TRANSPORT_UNRELATED_VIEWER: ${{ secrets.CRAB_CDN_TRANSPORT_UNRELATED_VIEWER }}
    with:
      provider: s3
      native_artifact: amazon-s3
      native_result: ${{ needs.s3.result }}

  cdn-gcs:
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.cdn_transport &&
      (inputs.provider == 'all' || inputs.provider == 'gcs')
    needs: gcs
    uses: ./.github/workflows/provider-cdn-transport.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      CRAB_CDN_TRANSPORT_VIEWER: ${{ secrets.CRAB_CDN_TRANSPORT_VIEWER }}
      CRAB_CDN_TRANSPORT_UNRELATED_VIEWER: ${{ secrets.CRAB_CDN_TRANSPORT_UNRELATED_VIEWER }}
    with:
      provider: gcs
      native_artifact: gcs
      native_result: ${{ needs.gcs.result }}

  cdn-azure:
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.cdn_transport &&
      (inputs.provider == 'all' || inputs.provider == 'azure')
    needs: azure
    uses: ./.github/workflows/provider-cdn-transport.yml
    permissions:
      contents: read
      id-token: write
    secrets:
      CRAB_CDN_TRANSPORT_VIEWER: ${{ secrets.CRAB_CDN_TRANSPORT_VIEWER }}
      CRAB_CDN_TRANSPORT_UNRELATED_VIEWER: ${{ secrets.CRAB_CDN_TRANSPORT_UNRELATED_VIEWER }}
    with:
      provider: azure
      native_artifact: azure
      native_result: ${{ needs.azure.result }}

  publish-cdn-evidence:
    name: Publish CDN release evidence
    if: >-
      !cancelled() && github.event_name == 'workflow_dispatch' && inputs.publish_cdn_evidence &&
      needs.evidence-contract.result == 'success' && !contains(needs.*.result, 'failure') &&
      (!inputs.cdn_transport || (
        ((inputs.provider != 'all' && inputs.provider != 's3') || needs.cdn-s3.result == 'success') &&
        ((inputs.provider != 'all' && inputs.provider != 'gcs') || needs.cdn-gcs.result == 'success') &&
        ((inputs.provider != 'all' && inputs.provider != 'azure') || needs.cdn-azure.result == 'success')
      ))
    needs: [evidence-contract, s3, gcs, azure, cdn-s3, cdn-gcs, cdn-azure]
    runs-on:
      group: provider-cdn-qualification
      labels: linux
    environment: provider-cdn-release-qualification
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Prepare evidence scratch directory
        id: scratch
        shell: bash
        run: |
          evidence=$(mktemp -d "$RUNNER_TEMP/crab-cdn-evidence.XXXXXX")
          printf 'path=%s\n' "$evidence" >> "$GITHUB_OUTPUT"

      - name: Download same-attempt Amazon S3 evidence
        if: needs.s3.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: provider-qualification-amazon-s3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scratch.outputs.path }}/native/s3

      - name: Download same-attempt Google Cloud Storage evidence
        if: needs.gcs.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: provider-qualification-gcs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scratch.outputs.path }}/native/gcs

      - name: Download same-attempt Azure Blob evidence
        if: needs.azure.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: provider-qualification-azure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scratch.outputs.path }}/native/azure

      - name: Download same-attempt CloudFront canary
        if: needs.cdn-s3.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: provider-cdn-transport-s3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scratch.outputs.path }}/transport/s3

      - name: Download same-attempt Cloud CDN canary
        if: needs.cdn-gcs.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: provider-cdn-transport-gcs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scratch.outputs.path }}/transport/gcs

      - name: Download same-attempt Front Door canary
        if: needs.cdn-azure.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: provider-cdn-transport-azure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scratch.outputs.path }}/transport/azure

      - name: Assemble and verify the release bundle
        shell: bash
        env:
          SCRATCH: ${{ steps.scratch.outputs.path }}
          MEASURED_INPUTS_ROOT: ${{ vars.CRAB_CDN_MEASURED_INPUTS_ROOT }}
          BENCHMARKS_SHA256: ${{ vars.CRAB_CDN_BENCHMARKS_SHA256 }}
        run: |
          : "${MEASURED_INPUTS_ROOT:?Set CRAB_CDN_MEASURED_INPUTS_ROOT in the release qualification environment.}"
          : "${BENCHMARKS_SHA256:?Set CRAB_CDN_BENCHMARKS_SHA256 in the release qualification environment.}"
          measured="$MEASURED_INPUTS_ROOT/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
          if [[ ! -d "$measured" ]]; then
            echo '::error::The runner has no CDN measurements for this workflow attempt.'
            exit 1
          fi
          args=(--inputs "$measured" --native-reports "$SCRATCH/native" --output "$SCRATCH/artifact")
          if [[ -d "$SCRATCH/transport" ]]; then
            args+=(--transport-traces "$SCRATCH/transport")
          fi
          python3 -B crab/scripts/e2e/assemble_cdn_qualification.py "${args[@]}" \
            --benchmarks-sha256 "$BENCHMARKS_SHA256" --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload verified CDN release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cdn-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.scratch.outputs.path }}/artifact
          if-no-files-found: error
          retention-days: 90
