name: Cell runtime protected qualification

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Exact 40-character source commit to qualify"
        required: true
        type: string
      image_digest:
        description: "Immutable candidate image digest (sha256:... )"
        required: true
        type: string
      environment:
        description: "Protected environment containing provider and fault-injection access"
        required: true
        default: crab-cell-runtime-protected
        type: environment

permissions:
  contents: read

concurrency:
  group: cell-runtime-protected-${{ inputs.source_ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  QUALIFICATION_SIGNER: ${{ vars.CRAB_CELL_RUNTIME_QUALIFICATION_SIGNER }}
  QUALIFICATION_KEY_FILE: /run/secrets/crab-cell-runtime-qualification-signing-key
  QUALIFICATION_HARNESS: /opt/crab/bin/crab-cell-runtime-protected-qualifier

jobs:
  protected:
    name: Protected provider, scale, and fault matrix
    runs-on: [self-hosted, linux, crab-cell-runtime-protected]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 2880
    steps:
      - name: Check out the exact candidate source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the protected runner and candidate identity
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail

          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_ref must be a full lowercase commit SHA." >&2
            exit 1
          }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::image_digest must be an immutable sha256 digest." >&2
            exit 1
          }
          test "$GITHUB_SHA" = "$SOURCE_REF" || {
            echo "::error::The manual workflow dispatch ref must resolve to source_ref." >&2
            exit 1
          }
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_REF" origin/main || {
            echo "::error::Protected evidence source must be reachable from origin/main." >&2
            exit 1
          }
          test -z "$(git status --porcelain)"
          cargo_target_dir="$RUNNER_TEMP/crab-cell-runtime-protected-target"
          mkdir -p "$cargo_target_dir"
          test -d "$cargo_target_dir"
          test -w "$(dirname "$cargo_target_dir")"
          test -x "$QUALIFICATION_HARNESS" || {
            echo "::error::Protected harness is missing: $QUALIFICATION_HARNESS" >&2
            echo "Install the provider/Kubernetes harness on the protected runner; no local or synthetic fallback is accepted." >&2
            exit 1
          }
          test -f "$QUALIFICATION_KEY_FILE"
          test ! -L "$QUALIFICATION_KEY_FILE"
          test "$(stat -c '%a' "$QUALIFICATION_KEY_FILE")" = 600
          [[ "$QUALIFICATION_SIGNER" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::CRAB_CELL_RUNTIME_QUALIFICATION_SIGNER must be a pinned 32-byte lowercase Ed25519 public key." >&2
            exit 1
          }

      - name: Install the release toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Generate and execute the protected workload matrix
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/crab-cell-runtime-protected"
          rm -rf "$evidence_root"
          mkdir -p "$evidence_root"
          "$QUALIFICATION_HARNESS" \
            --source-sha "$SOURCE_SHA" \
            --image-digest "$IMAGE_DIGEST" \
            --signing-key-file "$QUALIFICATION_KEY_FILE" \
            --output "$evidence_root/protected"
          test -d "$evidence_root/protected"
          if find "$evidence_root" -type l -print -quit | grep --quiet .; then
            echo "::error::Protected evidence must not contain symlinks." >&2
            exit 1
          fi
          mapfile -t protected_dirs < <(find "$evidence_root" -type d -name protected -print)
          test "${#protected_dirs[@]}" -eq 1
          test "${protected_dirs[0]}" = "$evidence_root/protected"

      - name: Verify every protected matrix in a fresh process
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_ref }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/crab-cell-runtime-protected"
          protected_dir="$evidence_root/protected"
          test -d "$protected_dir"
          if find "$evidence_root" -type l -print -quit | grep --quiet .; then
            echo "::error::Protected evidence must not contain symlinks." >&2
            exit 1
          fi
          mapfile -t protected_dirs < <(find "$evidence_root" -type d -name protected -print)
          test "${#protected_dirs[@]}" -eq 1
          test "${protected_dirs[0]}" = "$protected_dir"
          required_profiles=(
            "local-provider-v1|qualification-matrix-local-provider.json"
            "scale-v1|qualification-matrix.json"
            "compatibility-v1|qualification-matrix-compatibility.json"
            "provider-s3-v1|qualification-matrix-provider-s3.json"
            "provider-gcs-v1|qualification-matrix-provider-gcs.json"
            "provider-azure-v1|qualification-matrix-provider-azure.json"
            "fault-s3-v1|qualification-matrix-fault-s3.json"
            "fault-gcs-v1|qualification-matrix-fault-gcs.json"
            "fault-azure-v1|qualification-matrix-fault-azure.json"
          )
          export CARGO_TARGET_DIR="$RUNNER_TEMP/crab-cell-runtime-protected-target"
          for requirement in "${required_profiles[@]}"; do
            IFS='|' read -r profile_name matrix_name <<< "$requirement"
            profile="$protected_dir/$profile_name.json"
            tracked="crates/crab-cell-runtime/qualification/profiles/$profile_name.json"
            test -f "$profile" && test ! -L "$profile"
            cmp -- "$profile" "$tracked"
          done
          cargo run --quiet --locked -p crab-cell-runtime --bin qualification_receipt -- \
            verify-protected-bundle "$protected_dir" "$SOURCE_SHA" "$IMAGE_DIGEST" \
            "$QUALIFICATION_SIGNER"
          printf '%s\n' "$SOURCE_SHA" > "$evidence_root/source-revision"
          printf '%s\n' "$IMAGE_DIGEST" > "$evidence_root/image-digest"

      - name: Upload the exact protected evidence bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cell-runtime-protected-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crab-cell-runtime-protected/
          if-no-files-found: error
          retention-days: 90
