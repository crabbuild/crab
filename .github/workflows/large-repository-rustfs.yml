name: Native meter qualification probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrated-counter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QUAL_ROOT: ${{ github.workspace }}-meter-probe
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_ACCESS_KEY_ID: crab
      AWS_SECRET_ACCESS_KEY: crab
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      RUSTFS_IMAGE: ghcr.io/rustfs/rustfs@sha256:bffcab0c9d647aab0055d1c69d340b202d0909966b385932d4ead1aeb7602858
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4938b757f45b5f2763c0ea8279056938935214c5
          fetch-depth: 0
      - name: Prepare disposable native counter
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo apt-get update -y
          sudo apt-get install -y nginx
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$QUAL_ROOT/provenance" "$QUAL_ROOT/drivers" "$QUAL_ROOT/data"
          sudo chown 10001:10001 "$QUAL_ROOT/data"
          git fetch --no-tags origin "$GITHUB_SHA"
          for name in native_meter.py setup_native_meter.py calibrate_native_meter.py; do
            git show "$GITHUB_SHA:.github/qualification/$name" > "$QUAL_ROOT/drivers/$name"
          done
          sha256sum "$QUAL_ROOT"/drivers/*.py > "$QUAL_ROOT/provenance/drivers-sha256.txt"
      - name: Start isolated RustFS and prove all thirteen HTTP attempts
        run: |
          set -euo pipefail
          docker run -d --name native-meter-rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=crab -e RUSTFS_SECRET_KEY=crab \
            -v "$QUAL_ROOT/data:/data" "$RUSTFS_IMAGE" server /data --address :9000
          ready=false
          for _ in $(seq 1 90); do
            if aws --endpoint-url http://127.0.0.1:9000 s3api list-buckets >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          python3 "$QUAL_ROOT/drivers/setup_native_meter.py"
          python3 "$QUAL_ROOT/drivers/calibrate_native_meter.py"
          test "$(git rev-parse HEAD)" = 4938b757f45b5f2763c0ea8279056938935214c5
          test -z "$(git status --porcelain)"
      - name: Retain raw diagnostics
        if: always()
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p "$QUAL_ROOT/provenance"
          docker logs native-meter-rustfs > "$QUAL_ROOT/provenance/rustfs.log" 2>&1 || true
          if test -f "$QUAL_ROOT/metrics/nginx.pid"; then nginx -p "$QUAL_ROOT/metrics" -c "$QUAL_ROOT/metrics/nginx.conf" -s quit || true; fi
          docker rm -f native-meter-rustfs >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-meter-calibration-${{ github.run_id }}
          path: |
            ${{ env.QUAL_ROOT }}/provenance/**
            ${{ env.QUAL_ROOT }}/drivers/**
            ${{ env.QUAL_ROOT }}/metrics/*.json*
            ${{ env.QUAL_ROOT }}/metrics/*.conf
            ${{ env.QUAL_ROOT }}/metrics/*.log
          if-no-files-found: error
          retention-days: 30
