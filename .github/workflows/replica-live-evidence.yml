name: Replica Live Evidence

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Protected GitHub environment containing live replica credentials"
        required: true
        default: replica-live
        type: environment
      suite:
        description: "Live evidence suite; enterprise runs control-plane, hydrate, and cross-region with all providers"
        required: true
        default: control-plane
        type: choice
        options:
          - control-plane
          - hydrate
          - cross-region
          - enterprise
      storage_provider:
        description: "Storage control-plane provider; enterprise requires all"
        required: true
        default: none
        type: choice
        options:
          - none
          - s3
          - gcs
          - azure
          - all
      coordinator:
        description: "Managed coordinator provider; enterprise requires all"
        required: true
        default: none
        type: choice
        options:
          - none
          - dynamodb
          - spanner
          - cosmosdb
          - all
      hydrate_provider:
        description: "Provider-backed binary hydrate proof; enterprise requires all"
        required: true
        default: none
        type: choice
        options:
          - none
          - s3
          - gcs
          - azure
          - all
      mutate:
        description: "Allow live mutations against disposable resources"
        required: true
        default: false
        type: boolean
      evidence_profile:
        description: "Evidence verifier profile"
        required: true
        default: control-plane-status
        type: choice
        options:
          - control-plane-status
          - control-plane-mutate
          - provider-hydrate
          - active-active-smoke
          - enterprise

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CRAB_REPLICA_LIVE: "1"
  CRAB_REPLICA_LIVE_MUTATE: ${{ inputs.mutate && '1' || '0' }}
  CRAB_REPLICA_LIVE_CROSS_REGION: ${{ (inputs.suite == 'cross-region' || inputs.suite == 'enterprise') && '1' || '0' }}
  CRAB_REPLICA_LIVE_PRODUCTION_LOAD: ${{ inputs.suite == 'enterprise' && '1' || '0' }}
  CRAB_REPLICA_LIVE_EVIDENCE_DIR: ${{ github.workspace }}/replica-live-evidence
  CRAB_REPLICA_LIVE_EVIDENCE_REDACT: "1"
  CRAB_REPLICA_LIVE_RUN_ID: replica-live-${{ github.run_id }}-${{ github.run_attempt }}
  CRAB_REPLICA_LIVE_REPAIR_SERVICE_TEMPLATE: ${{ vars.CRAB_REPLICA_LIVE_REPAIR_SERVICE_TEMPLATE }}
  CRAB_REPLICA_LIVE_REPAIR_WORKER_DEPLOYMENT_EVIDENCE: ${{ vars.CRAB_REPLICA_LIVE_REPAIR_WORKER_DEPLOYMENT_EVIDENCE }}
  CRAB_REPLICA_LIVE_S3_PROVIDER_LOG_EVIDENCE: ${{ vars.CRAB_REPLICA_LIVE_S3_PROVIDER_LOG_EVIDENCE }}
  CRAB_REPLICA_LIVE_GCS_PROVIDER_LOG_EVIDENCE: ${{ vars.CRAB_REPLICA_LIVE_GCS_PROVIDER_LOG_EVIDENCE }}
  CRAB_REPLICA_LIVE_AZURE_PROVIDER_LOG_EVIDENCE: ${{ vars.CRAB_REPLICA_LIVE_AZURE_PROVIDER_LOG_EVIDENCE }}
  CRAB_REPLICA_LIVE_DYNAMODB_PROVIDER_LOG_EVIDENCE: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_PROVIDER_LOG_EVIDENCE }}
  CRAB_REPLICA_LIVE_SPANNER_PROVIDER_LOG_EVIDENCE: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_PROVIDER_LOG_EVIDENCE }}
  CRAB_REPLICA_LIVE_COSMOSDB_PROVIDER_LOG_EVIDENCE: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_PROVIDER_LOG_EVIDENCE }}

  CRAB_REPLICA_LIVE_S3: ${{ (inputs.storage_provider == 's3' || inputs.storage_provider == 'all') && '1' || '0' }}
  CRAB_REPLICA_LIVE_GCS: ${{ (inputs.storage_provider == 'gcs' || inputs.storage_provider == 'all') && '1' || '0' }}
  CRAB_REPLICA_LIVE_AZURE: ${{ (inputs.storage_provider == 'azure' || inputs.storage_provider == 'all') && '1' || '0' }}
  CRAB_REPLICA_LIVE_DYNAMODB: ${{ (inputs.coordinator == 'dynamodb' || inputs.coordinator == 'all') && '1' || '0' }}
  CRAB_REPLICA_LIVE_SPANNER: ${{ (inputs.coordinator == 'spanner' || inputs.coordinator == 'all') && '1' || '0' }}
  CRAB_REPLICA_LIVE_COSMOSDB: ${{ (inputs.coordinator == 'cosmosdb' || inputs.coordinator == 'all') && '1' || '0' }}
  CRAB_REPLICA_LIVE_S3_HYDRATE: ${{ (inputs.hydrate_provider == 's3' || inputs.hydrate_provider == 'all') && '1' || '0' }}
  CRAB_REPLICA_LIVE_GCS_HYDRATE: ${{ (inputs.hydrate_provider == 'gcs' || inputs.hydrate_provider == 'all') && '1' || '0' }}
  CRAB_REPLICA_LIVE_AZURE_HYDRATE: ${{ (inputs.hydrate_provider == 'azure' || inputs.hydrate_provider == 'all') && '1' || '0' }}

