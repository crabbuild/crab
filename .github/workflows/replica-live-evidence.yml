  CRAB_REPLICA_LIVE_GCS_HYDRATE_PRIMARY_BUCKET: ${{ vars.CRAB_REPLICA_LIVE_GCS_HYDRATE_PRIMARY_BUCKET }}
  CRAB_REPLICA_LIVE_GCS_HYDRATE_REPLICA_BUCKET: ${{ vars.CRAB_REPLICA_LIVE_GCS_HYDRATE_REPLICA_BUCKET }}
  CRAB_REPLICA_LIVE_GCS_HYDRATE_REGION: ${{ vars.CRAB_REPLICA_LIVE_GCS_HYDRATE_REGION }}
  CRAB_REPLICA_LIVE_AZURE_HYDRATE_PRIMARY_ACCOUNT: ${{ vars.CRAB_REPLICA_LIVE_AZURE_HYDRATE_PRIMARY_ACCOUNT }}
  CRAB_REPLICA_LIVE_AZURE_HYDRATE_PRIMARY_CONTAINER: ${{ vars.CRAB_REPLICA_LIVE_AZURE_HYDRATE_PRIMARY_CONTAINER }}
  CRAB_REPLICA_LIVE_AZURE_HYDRATE_PRIMARY_BUCKET: ${{ vars.CRAB_REPLICA_LIVE_AZURE_HYDRATE_PRIMARY_BUCKET }}
  CRAB_REPLICA_LIVE_AZURE_HYDRATE_REPLICA_ACCOUNT: ${{ vars.CRAB_REPLICA_LIVE_AZURE_HYDRATE_REPLICA_ACCOUNT }}
  CRAB_REPLICA_LIVE_AZURE_HYDRATE_REPLICA_CONTAINER: ${{ vars.CRAB_REPLICA_LIVE_AZURE_HYDRATE_REPLICA_CONTAINER }}
  CRAB_REPLICA_LIVE_AZURE_HYDRATE_REPLICA_BUCKET: ${{ vars.CRAB_REPLICA_LIVE_AZURE_HYDRATE_REPLICA_BUCKET }}
  CRAB_REPLICA_LIVE_AZURE_HYDRATE_REGION: ${{ vars.CRAB_REPLICA_LIVE_AZURE_HYDRATE_REGION }}

  CRAB_REPLICA_LIVE_SMOKE_WRITER_A_NAME: ${{ vars.CRAB_REPLICA_LIVE_SMOKE_WRITER_A_NAME }}
  CRAB_REPLICA_LIVE_SMOKE_WRITER_A_URL: ${{ vars.CRAB_REPLICA_LIVE_SMOKE_WRITER_A_URL }}
  CRAB_REPLICA_LIVE_SMOKE_WRITER_A_REGION: ${{ vars.CRAB_REPLICA_LIVE_SMOKE_WRITER_A_REGION }}
  CRAB_REPLICA_LIVE_SMOKE_WRITER_B_NAME: ${{ vars.CRAB_REPLICA_LIVE_SMOKE_WRITER_B_NAME }}
  CRAB_REPLICA_LIVE_SMOKE_WRITER_B_URL: ${{ vars.CRAB_REPLICA_LIVE_SMOKE_WRITER_B_URL }}
  CRAB_REPLICA_LIVE_SMOKE_WRITER_B_REGION: ${{ vars.CRAB_REPLICA_LIVE_SMOKE_WRITER_B_REGION }}
  CRAB_REPLICA_LIVE_SMOKE_COORDINATOR_URL: ${{ vars.CRAB_REPLICA_LIVE_SMOKE_COORDINATOR_URL }}
  CRAB_REPLICA_LIVE_SMOKE_COORDINATOR_REGION: ${{ vars.CRAB_REPLICA_LIVE_SMOKE_COORDINATOR_REGION }}
