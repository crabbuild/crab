  CRAB_REPLICA_LIVE_DYNAMODB_REGION: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_REGION }}
  CRAB_REPLICA_LIVE_DYNAMODB_FAILOVER_REGION: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_FAILOVER_REGION }}
  CRAB_REPLICA_LIVE_SPANNER_NAME: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_NAME }}
  CRAB_REPLICA_LIVE_SPANNER_REGION: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_REGION }}
