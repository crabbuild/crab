  CRAB_REPLICA_LIVE_COSMOSDB_NAME: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_NAME }}
  CRAB_REPLICA_LIVE_COSMOSDB_REGION: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_REGION }}
  CRAB_REPLICA_LIVE_COSMOSDB_FAILOVER_REGION: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_FAILOVER_REGION }}

  CRAB_REPLICA_LIVE_S3_HYDRATE_PRIMARY_BUCKET: ${{ vars.CRAB_REPLICA_LIVE_S3_HYDRATE_PRIMARY_BUCKET }}
  CRAB_REPLICA_LIVE_S3_HYDRATE_REPLICA_BUCKET: ${{ vars.CRAB_REPLICA_LIVE_S3_HYDRATE_REPLICA_BUCKET }}
