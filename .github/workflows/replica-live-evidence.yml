  CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_WRITER_A_URL: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_WRITER_A_URL }}
  CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_WRITER_A_REGION: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_WRITER_A_REGION }}
  CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_WRITER_B_NAME: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_WRITER_B_NAME }}
  CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_WRITER_B_URL: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_WRITER_B_URL }}
  CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_WRITER_B_REGION: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_WRITER_B_REGION }}
  CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_COORDINATOR_URL: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_COORDINATOR_URL }}
  CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_COORDINATOR_REGION: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_COORDINATOR_REGION }}
  CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_COORDINATOR_FAILOVER_REGION: ${{ vars.CRAB_REPLICA_LIVE_DYNAMODB_SMOKE_COORDINATOR_FAILOVER_REGION }}
  CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_A_NAME: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_A_NAME }}
  CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_A_URL: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_A_URL }}
  CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_A_REGION: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_A_REGION }}
  CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_B_NAME: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_B_NAME }}
  CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_B_URL: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_B_URL }}
  CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_B_REGION: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_SMOKE_WRITER_B_REGION }}
  CRAB_REPLICA_LIVE_SPANNER_SMOKE_COORDINATOR_URL: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_SMOKE_COORDINATOR_URL }}
  CRAB_REPLICA_LIVE_SPANNER_SMOKE_COORDINATOR_REGION: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_SMOKE_COORDINATOR_REGION }}
  CRAB_REPLICA_LIVE_SPANNER_SMOKE_COORDINATOR_FAILOVER_REGION: ${{ vars.CRAB_REPLICA_LIVE_SPANNER_SMOKE_COORDINATOR_FAILOVER_REGION }}
  CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_A_NAME: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_A_NAME }}
  CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_A_URL: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_A_URL }}
  CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_A_REGION: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_A_REGION }}
  CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_B_NAME: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_B_NAME }}
  CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_B_URL: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_B_URL }}
  CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_B_REGION: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_WRITER_B_REGION }}
  CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_COORDINATOR_URL: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_COORDINATOR_URL }}
  CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_COORDINATOR_REGION: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_COORDINATOR_REGION }}
  CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_COORDINATOR_FAILOVER_REGION: ${{ vars.CRAB_REPLICA_LIVE_COSMOSDB_SMOKE_COORDINATOR_FAILOVER_REGION }}

  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
  GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
  GOOGLE_CLOUD_REGION: ${{ vars.GOOGLE_CLOUD_REGION }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_STORAGE_ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT }}
  AZURE_REGION: ${{ vars.AZURE_REGION }}

jobs:
  live-evidence:
    name: Live replica evidence
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Configure Google credentials
        shell: bash
        run: |
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]; then
            umask 077
            printf '%s' "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > "$RUNNER_TEMP/google-credentials.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/google-credentials.json" >> "$GITHUB_ENV"
          fi

      - name: Preflight selected live evidence inputs
        working-directory: crab
        shell: bash
        run: |
          args=(
            --suite "${{ inputs.suite }}"
            --storage-provider "${{ inputs.storage_provider }}"
            --coordinator "${{ inputs.coordinator }}"
            --hydrate-provider "${{ inputs.hydrate_provider }}"
            --evidence-profile "${{ inputs.evidence_profile }}"
            --require-evidence
            --require-redacted
            --require-cloud-credentials
          )
          if [ "${{ inputs.mutate }}" = "true" ]; then
            args+=(--mutate)
          fi
          ./scripts/check-replica-live-env.sh "${args[@]}"

      - name: Run live control-plane evidence
        if: inputs.suite == 'control-plane' || inputs.suite == 'enterprise'
        run: cargo test --manifest-path crab/Cargo.toml --test replica_live_control_plane -- --ignored

      - name: Run provider-backed hydrate evidence
        if: inputs.suite == 'hydrate' || inputs.suite == 'enterprise'
        run: cargo test --manifest-path crab/Cargo.toml --test replica_binary_hydrate_live -- --ignored

      - name: Run active-active cross-region evidence
        if: inputs.suite == 'cross-region' || inputs.suite == 'enterprise'
        run: crab/scripts/run-replica-cross-region-matrix.sh

      - name: Verify retained evidence
        shell: bash
        run: |
          cargo run --manifest-path crab/Cargo.toml --bin crab -- \
            replica evidence verify "$CRAB_REPLICA_LIVE_EVIDENCE_DIR" \
            --profile "${{ inputs.evidence_profile }}" \
            --require-redacted \
            --expected-run-id "$CRAB_REPLICA_LIVE_RUN_ID" \
            --json | tee replica-evidence-verify.json

      - name: Upload retained evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replica-live-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            replica-live-evidence/
            replica-evidence-verify.json
          retention-days: 90
