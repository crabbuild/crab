  CRAB_REPLICA_LIVE_S3_REPLICA: ${{ vars.CRAB_REPLICA_LIVE_S3_REPLICA }}
  CRAB_REPLICA_LIVE_S3_REGION: ${{ vars.CRAB_REPLICA_LIVE_S3_REGION }}
  CRAB_REPLICA_LIVE_S3_RPO: ${{ vars.CRAB_REPLICA_LIVE_S3_RPO }}
  CRAB_REPLICA_LIVE_S3_BACKFILL: ${{ vars.CRAB_REPLICA_LIVE_S3_BACKFILL }}
  CRAB_REPLICA_LIVE_GCS_NAME: ${{ vars.CRAB_REPLICA_LIVE_GCS_NAME }}
  CRAB_REPLICA_LIVE_GCS_PRIMARY: ${{ vars.CRAB_REPLICA_LIVE_GCS_PRIMARY }}
  CRAB_REPLICA_LIVE_GCS_REPLICA: ${{ vars.CRAB_REPLICA_LIVE_GCS_REPLICA }}
  CRAB_REPLICA_LIVE_GCS_REGION: ${{ vars.CRAB_REPLICA_LIVE_GCS_REGION }}
  CRAB_REPLICA_LIVE_GCS_RPO: ${{ vars.CRAB_REPLICA_LIVE_GCS_RPO }}
  CRAB_REPLICA_LIVE_GCS_BACKFILL: ${{ vars.CRAB_REPLICA_LIVE_GCS_BACKFILL }}
  CRAB_REPLICA_LIVE_AZURE_NAME: ${{ vars.CRAB_REPLICA_LIVE_AZURE_NAME }}
  CRAB_REPLICA_LIVE_AZURE_PRIMARY: ${{ vars.CRAB_REPLICA_LIVE_AZURE_PRIMARY }}
  CRAB_REPLICA_LIVE_AZURE_REPLICA: ${{ vars.CRAB_REPLICA_LIVE_AZURE_REPLICA }}
  CRAB_REPLICA_LIVE_AZURE_REGION: ${{ vars.CRAB_REPLICA_LIVE_AZURE_REGION }}
  CRAB_REPLICA_LIVE_AZURE_RPO: ${{ vars.CRAB_REPLICA_LIVE_AZURE_RPO }}
  CRAB_REPLICA_LIVE_AZURE_BACKFILL: ${{ vars.CRAB_REPLICA_LIVE_AZURE_BACKFILL }}

