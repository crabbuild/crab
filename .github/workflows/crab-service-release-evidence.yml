name: Crab service release evidence

on:
  workflow_dispatch:
    inputs:
      candidate_digest:
        description: Exact signed crab-service sha256 digest
        required: true
        type: string
      source_revision:
        description: Full source commit recorded by the candidate image
        required: true
        type: string
      release_version:
        description: Semantic version recorded by the candidate image
        required: true
        type: string
      require_retirement:
        description: Require rollback-window and Python-retirement evidence
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/crabbuild/crab-service

jobs:
  verify:
    name: Verify protected retained evidence
    runs-on: [self-hosted, crab-service-release]
    environment: crab-service-production
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_revision }}

      - name: Verify release bundle and signed candidate
        env:
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          REQUIRE_RETIREMENT: ${{ inputs.require_retirement }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
        shell: bash
        run: |
          set -euo pipefail
          for command in cosign jq python3; do
            command -v "${command}" >/dev/null || {
              echo "::error::protected release runner is missing ${command}"
              exit 1
            }
          done
          if [[ ! "${CANDIDATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::candidate_digest must be one immutable sha256 digest"
            exit 1
          fi
          if [[ ! "${SOURCE_REVISION}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_revision must be one full Git commit"
            exit 1
          fi
          if [[ ! "${RELEASE_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_version must be a semantic version without build metadata"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "${SOURCE_REVISION}" ]]; then
            echo "::error::checkout does not match the candidate source revision"
            exit 1
          fi

          digest_hex=${CANDIDATE_DIGEST#sha256:}
          retained="/var/lib/crab-service/release-evidence/${digest_hex}"
          if [[ ! -d "${retained}" ]]; then
            echo "::error::protected runner lacks retained evidence for ${CANDIDATE_DIGEST}"
            exit 1
          fi
          bundle="${RUNNER_TEMP}/crab-service-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "${bundle}"
          cp -R "${retained}/." "${bundle}/"
          for file in compatibility.json release-evidence.json; do
            if [[ ! -f "${bundle}/${file}" || -L "${bundle}/${file}" ]]; then
              echo "::error::retained bundle lacks regular ${file}"
              exit 1
            fi
          done

          jq -e \
            --arg digest "${CANDIDATE_DIGEST}" \
            --arg revision "${SOURCE_REVISION}" \
            --arg version "${RELEASE_VERSION}" \
            '.image.digest == $digest
             and .image.source_revision == $revision
             and .image.service_version == $version
             and .operational.promotion_status == "ready"
             and .operational.service_level_objectives.measurement_status
               == "measured_hosted_environment"
             and (.operational.blocking_conditions | length == 0)' \
            "${bundle}/compatibility.json" >/dev/null

          arguments=(
            "${bundle}/release-evidence.json"
            --expected-digest "${CANDIDATE_DIGEST}"
            --expected-revision "${SOURCE_REVISION}"
            --expected-version "${RELEASE_VERSION}"
          )
          if [[ "${REQUIRE_RETIREMENT}" == true ]]; then
            arguments+=(--require-retirement)
          fi
          python3 deploy/crab-service/scripts/validate-release-evidence.py \
            "${arguments[@]}"
          cosign verify \
            --certificate-identity-regexp \
              "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/crab-service-image.yml@refs/(heads|tags)/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${CANDIDATE_DIGEST}" >/dev/null

          jq -n \
            --arg candidate_digest "${CANDIDATE_DIGEST}" \
            --arg source_revision "${SOURCE_REVISION}" \
            --arg release_version "${RELEASE_VERSION}" \
            --argjson require_retirement "${REQUIRE_RETIREMENT}" \
            --argjson run_id "${GITHUB_RUN_ID}" \
            --argjson run_attempt "${GITHUB_RUN_ATTEMPT}" \
            '{schema_version:1,status:"passed",candidate_digest:$candidate_digest,
              source_revision:$source_revision,release_version:$release_version,
              require_retirement:$require_retirement,
              workflow_run_id:$run_id,workflow_run_attempt:$run_attempt}' \
            >"${bundle}/verification.json"

      - name: Upload verified release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: crab-service-release-evidence-${{ inputs.source_revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crab-service-release-${{ github.run_id }}-${{ github.run_attempt }}/
          retention-days: 90
