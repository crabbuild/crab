name: Crab Cellule integration contract

on:
  pull_request:
    paths:
      - "crates/crab-http-server/**"
      - "crates/crab-storage/**"
      - "crab/docs/architecture/cells/**"
      - "packages/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crab/scripts/check-architecture-gates.py"
      - ".github/workflows/http-server-container.yml"
      - ".github/workflows/http-server-release.yml"
      - ".github/workflows/cell-runtime-qualification-contract.yml"
  push:
    branches: [main]
    paths:
      - "crates/crab-http-server/**"
      - "crates/crab-storage/**"
      - "crab/docs/architecture/cells/**"
      - "packages/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crab/scripts/check-architecture-gates.py"
      - ".github/workflows/http-server-container.yml"
      - ".github/workflows/http-server-release.yml"
      - ".github/workflows/cell-runtime-qualification-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install contract validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler sqlite3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - name: Build embedded repository frontend
        run: |
          npm ci --prefix packages/ui
          npm run build --prefix packages/ui
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Validate Crab architecture boundary
        run: python3 crab/scripts/check-architecture-gates.py
      - name: Validate Crab application design contracts
        run: node crab/docs/architecture/cells/validate.mjs
      - name: Verify public CellNode typed primitive workload
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crab-cellule-integration-target
        run: cargo test -p crab-http-server --test public_cell_host_application --test public_cell_qualification --test public_cell_response_loss --test public_cell_retry --test public_cell_activity_retry --test public_cell_cancellation --test public_cell_data_cancellation --test public_cell_activity_cancellation --test public_cell_effect_delivery_cancellation --test public_cell_lease_expiry --locked
      - name: Keep Compose receipt schema gate synchronized
        shell: bash
        run: |
          set -euo pipefail
          harness_version="$(sed -n \
            's/^[[:space:]]*version:[[:space:]]*\([0-9][0-9]*\),$/\1/p' \
            crates/crab-http-server/tests/qualify_compose_cluster.sh | head -1)"
          test -n "$harness_version"
          test "$harness_version" = 6
          grep -F 'server-d' crates/crab-http-server/tests/qualify_compose_cluster.sh
          grep -F 'fallback:' crates/crab-http-server/tests/qualify_compose_cluster.sh
          grep -F -- "validate-cluster \"\${RUNNER_TEMP}/crab-http-server-cluster-receipt.json\"" \
            .github/workflows/http-server-container.yml
      - name: Keep release qualification bound to the promoted image
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'image_ref:' .github/workflows/http-server-container.yml
          grep -F 'image_digest:' .github/workflows/http-server-container.yml
          grep -F "docker pull \"\$INPUT_IMAGE_REF\"" .github/workflows/http-server-container.yml
          grep -F 'needs.candidate.outputs.image_ref' .github/workflows/http-server-release.yml
          grep -F 'needs.candidate.outputs.image_digest' .github/workflows/http-server-release.yml
          grep -F 'needs: [prepare, candidate]' .github/workflows/http-server-release.yml
          grep -F 'docker buildx imagetools create' .github/workflows/http-server-release.yml
          grep -F "test \"\$(cat \"\$evidence_dir/image-digest\")\" = \"\$IMAGE_DIGEST\"" \
            .github/workflows/http-server-release.yml
          if grep -F 'Build and publish the image' .github/workflows/http-server-release.yml; then
            echo "release workflow must not rebuild after qualification" >&2
            exit 1
          fi
      - name: Keep protected evidence handoff explicit and exact-source bound
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'cell_runtime_evidence_run_id:' .github/workflows/http-server-release.yml
          grep -F 'cell_runtime_evidence_artifact:' .github/workflows/http-server-release.yml
          grep -F 'actions: read' .github/workflows/http-server-release.yml
          grep -F 'Cell runtime protected qualification' .github/workflows/http-server-release.yml
          grep -F 'if [ "$event" != "workflow_dispatch" ]' .github/workflows/http-server-release.yml
          grep -F 'if [ "$evidence_sha" != "$SOURCE_SHA" ]' .github/workflows/http-server-release.yml
          grep -F 'cell-runtime-protected-${run_id}-${attempt}' .github/workflows/http-server-release.yml
          grep -F 'exactly one protected/' .github/workflows/http-server-release.yml
