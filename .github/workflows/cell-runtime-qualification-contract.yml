name: Cell runtime qualification contract

on:
  pull_request:
    paths:
      - "crates/crab-cell-runtime/**"
      - "crates/crab-cell-app/**"
      - "crates/crab-cell-host/**"
      - "crates/crab-http-server/**"
      - "crates/crab-ltx/**"
      - "packages/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crab/scripts/check-architecture-gates.py"
      - "crates/crab-http-server/tests/qualify_compose_cluster.sh"
      - ".github/workflows/http-server-container.yml"
      - ".github/workflows/http-server-release.yml"
      - ".github/workflows/cell-runtime-qualification-contract.yml"
  push:
    branches: [main]
    paths:
      - "crates/crab-cell-runtime/**"
      - "crates/crab-cell-app/**"
      - "crates/crab-cell-host/**"
      - "crates/crab-http-server/**"
      - "crates/crab-ltx/**"
      - "packages/ui/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crab/scripts/check-architecture-gates.py"
      - "crates/crab-http-server/tests/qualify_compose_cluster.sh"
      - ".github/workflows/http-server-container.yml"
      - ".github/workflows/http-server-release.yml"
      - ".github/workflows/cell-runtime-qualification-contract.yml"

jobs:
  contract:
    name: Signed receipt and canonical contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install contract validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y protobuf-compiler sqlite3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - name: Build embedded repository frontend
        run: |
          npm ci --prefix packages/ui
          npm run build --prefix packages/ui
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Validate architecture boundary
        run: python3 crab/scripts/check-architecture-gates.py
      - name: Validate executable design contracts
        run: node crates/crab-cell-runtime/docs/validate.mjs
      - name: Verify tracked qualification profiles
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crab-cell-runtime-qualification-target
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/qualification-profiles"
          mkdir -p "$root"
          for profile in \
            pr-contract local-provider scale fault fault-s3 fault-gcs fault-azure \
            provider provider-s3 provider-gcs provider-azure compatibility; do
            generated="$root/${profile}.json"
            cargo run --quiet --locked -p crab-cell-runtime --bin qualification_receipt -- \
              profile "$generated" "$profile"
            jq -S . "$generated" > "$root/${profile}.generated"
            jq -S . "crates/crab-cell-runtime/qualification/profiles/${profile}-v1.json" \
              > "$root/${profile}.tracked"
            cmp "$root/${profile}.generated" "$root/${profile}.tracked"
          done
      - name: Run production hot-path preflight guards
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crab-cell-runtime-qualification-target
        run: cargo test -p crab-cell-runtime --test qualification_preflight --locked
      - name: Verify application and host boundaries
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crab-cell-runtime-qualification-target
        run: cargo test -p crab-cell-app -p crab-cell-host --locked
      - name: Verify public CellNode typed primitive workload
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crab-cell-runtime-qualification-target
        run: cargo test -p crab-http-server --test public_cell_host_application --test public_cell_qualification --test public_cell_response_loss --test public_cell_retry --test public_cell_activity_retry --test public_cell_cancellation --locked
      - name: Keep Compose receipt schema gate synchronized
        shell: bash
        run: |
          set -euo pipefail
          harness_version="$(sed -n \
            's/^[[:space:]]*version:[[:space:]]*\([0-9][0-9]*\),$/\1/p' \
            crates/crab-http-server/tests/qualify_compose_cluster.sh | head -1)"
          test -n "$harness_version"
          test "$harness_version" = 6
          grep -F 'server-d' crates/crab-http-server/tests/qualify_compose_cluster.sh
          grep -F 'fallback:' crates/crab-http-server/tests/qualify_compose_cluster.sh
          grep -F -- "validate-cluster \"\${RUNNER_TEMP}/crab-http-server-cluster-receipt.json\"" \
            .github/workflows/http-server-container.yml
      - name: Keep release qualification bound to the promoted image
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'image_ref:' .github/workflows/http-server-container.yml
          grep -F 'image_digest:' .github/workflows/http-server-container.yml
          grep -F "docker pull \"\$INPUT_IMAGE_REF\"" .github/workflows/http-server-container.yml
          grep -F 'needs.candidate.outputs.image_ref' \
            .github/workflows/http-server-release.yml
          grep -F 'needs.candidate.outputs.image_digest' \
            .github/workflows/http-server-release.yml
          grep -F 'needs: [prepare, candidate]' .github/workflows/http-server-release.yml
          grep -F 'docker buildx imagetools create' .github/workflows/http-server-release.yml
          grep -F "test \"\$(cat \"\$evidence_dir/image-digest\")\" = \"\$IMAGE_DIGEST\"" \
            .github/workflows/http-server-release.yml
          if grep -F 'Build and publish the image' .github/workflows/http-server-release.yml; then
            echo "release workflow must not rebuild after qualification" >&2
            exit 1
          fi
      - name: Verify receipt, placement, pressure, and resource contracts
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crab-cell-runtime-qualification-target
        run: |
          set -euo pipefail
          for filter in qualification placement pressure resource; do
            cargo test -p crab-cell-runtime "${filter}" --locked
          done
          cargo test -p crab-cell-runtime --bin qualification_receipt --locked
      - name: Verify canonical LTX contracts
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crab-cell-runtime-qualification-target
        run: cargo test -p crab-ltx --features replica --locked
      - name: Smoke-test the complete qualification matrix in a fresh process
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crab-cell-runtime-qualification-target
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/qualification-matrix-contract"
          mkdir -p "$root/receipts" "$root/artifacts"
          source_revision=0123456789abcdef0123456789abcdef01234567
          image_digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          fixture="$root/fixture.json"
          profile="$root/pr-contract-profile.json"
          jq -cn '{schema: 1, kind: "qualification-matrix-contract-fixture"}' > "$fixture"
          cargo run --quiet --locked -p crab-cell-runtime --bin qualification_receipt -- \
            profile "$profile" pr-contract
          canonical_workload="$root/pr-contract-workload.json"
          cargo run --quiet --locked -p crab-cell-runtime --bin qualification_receipt -- \
            workload "$canonical_workload" "$profile" 7
          cargo run --quiet --locked -p crab-cell-runtime --bin qualification_receipt -- \
            verify-workload "$canonical_workload" "$profile"
          for workload in protocol storage publication warm-path churn fleet failover primitives accounting compatibility; do
            artifact_dir="$root/artifacts/$workload"
            mkdir -p "$artifact_dir"
            artifact="$artifact_dir/primary.json"
            receipt="$root/receipts/${workload}.json"
            if [ "$workload" = primitives ]; then
              cp "$canonical_workload" "$artifact"
            else
              cp "$fixture" "$artifact"
            fi
            cargo run --quiet --locked -p crab-cell-runtime --bin qualification_receipt -- \
              emit "$receipt" "$source_revision" "$image_digest" "$artifact" \
              github-actions "$workload" none "$profile"
          done
          cargo run --quiet --locked -p crab-cell-runtime --bin qualification_receipt -- \
            manifest "$root/qualification-matrix.json" "$root"
          (
            cd "$root"
            cargo run --quiet --locked --manifest-path "${GITHUB_WORKSPACE}/Cargo.toml" \
              -p crab-cell-runtime --bin qualification_receipt -- \
              verify-matrix qualification-matrix.json "$source_revision" "$image_digest" \
              pr-contract-profile.json
          )
