name: Crab service image

on:
  push:
    branches: [main]
    tags: ["crab-service-v*"]
    paths:
      - ".github/workflows/crab-service-image.yml"
      - ".github/workflows/crab-service-release-evidence.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/crab-service/**"
      - "deploy/crab-service/**"
  pull_request:
    paths:
      - ".github/workflows/crab-service-image.yml"
      - ".github/workflows/crab-service-release-evidence.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/crab-service/**"
      - "deploy/crab-service/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: Semantic version baked into the immutable candidate image
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/crabbuild/crab-service
  RUNTIME_IMAGE: gcr.io/distroless/cc-debian12:nonroot@sha256:adcd20c7b4c988b73cbfbddb26d2eee574571e6d7c9ffea29b3821e0690efb77
  RUST_IMAGE: rust:1.94.0-bookworm@sha256:365468470075493dc4583f47387001854321c5a8583ea9604b297e67f01c5a4f

jobs:
  validate:
    name: Build, harden, and scan
    if: ${{ !startsWith(github.ref, 'refs/tags/crab-service-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validate hosted SLO and alert contracts
        run: python3 deploy/crab-service/scripts/validate-observability.py

      - name: Validate managed-service security review
        run: python3 deploy/crab-service/scripts/validate-security-review.py

      - name: Validate release evidence contract
        run: |
          python3 deploy/crab-service/scripts/validate-release-evidence.py --contract-only
          python3 -m unittest deploy/crab-service/scripts/test_validate_release_evidence.py

      - name: Validate deployment qualification contracts
        run: |
          python3 -m unittest \
            deploy/crab-service/scripts/test_run_aws_capacity_test.py \
            deploy/crab-service/scripts/test_run_aws_to_onprem_restore.py \
            deploy/crab-service/scripts/test_run_eks_qualification.py

      - name: Lint managed-service feature matrix
        run: cargo clippy -p crab-service --all-targets --all-features --locked -- -D warnings

      - name: Resolve reproducible build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/crab-service-v* ]]; then
            version="${GITHUB_REF_NAME#crab-service-v}"
          else
            version="0.0.0-${GITHUB_SHA:0:12}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::service release tag must be crab-service-v<semantic-version>"
            exit 1
          fi
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.metadata.outputs.version }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            RUST_IMAGE=${{ env.RUST_IMAGE }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}
          cache-from: type=gha,scope=crab-service-image
          cache-to: type=gha,mode=max,scope=crab-service-image
          context: .
          file: deploy/crab-service/image/Dockerfile
          load: true
          tags: crab-service:ci

      - name: Validate runtime hardening
        run: deploy/crab-service/scripts/test-image.sh crab-service:ci

      - name: Generate compatibility metadata
        run: deploy/crab-service/scripts/image-metadata.sh crab-service:ci supply-chain/compatibility.json

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: true
          format: cyclonedx
          image-ref: crab-service:ci
          output: supply-chain/sbom.cdx.json
          scan-type: image
          version: v0.73.0

      - name: Generate vulnerability results
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: true
          exit-code: 0
          format: json
          ignore-unfixed: true
          image-ref: crab-service:ci
          output: supply-chain/vulnerabilities.json
          scan-type: image
          severity: HIGH,CRITICAL
          version: v0.73.0

      - name: Enforce vulnerability policy
        run: |
          jq -e '
            [
              .Results[]?.Vulnerabilities[]?
              | select(.Severity == "CRITICAL")
            ] | length == 0
          ' supply-chain/vulnerabilities.json

      - name: Upload validation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: crab-service-supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: supply-chain/
          retention-days: 30

  candidate:
    name: Publish signed candidate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download validation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crab-service-supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: supply-chain

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Resolve candidate metadata
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::release_version must be a semantic version without build metadata"
            exit 1
          fi
          echo "build_date=$(git show -s --format=%cI HEAD)" >> "${GITHUB_OUTPUT}"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish immutable candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
            IMAGE_REVISION=${{ github.sha }}
            IMAGE_VERSION=${{ steps.metadata.outputs.version }}
            RUNTIME_IMAGE=${{ env.RUNTIME_IMAGE }}
            RUST_IMAGE=${{ env.RUST_IMAGE }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}
          cache-from: type=gha,scope=crab-service-image
          context: .
          file: deploy/crab-service/image/Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ env.IMAGE }}:candidate-sha-${{ github.sha }}

      - name: Bind evidence to published digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SERVICE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          jq \
            --arg digest "${DIGEST}" \
            --arg reference "${IMAGE}@${DIGEST}" \
            --arg service_version "${SERVICE_VERSION}" \
            '.image.digest = $digest
             | .image.reference = $reference
             | .image.service_version = $service_version' \
            supply-chain/compatibility.json > supply-chain/compatibility.release.json
          mv supply-chain/compatibility.release.json supply-chain/compatibility.json

      - name: Scan published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: true
          exit-code: 0
          format: json
          ignore-unfixed: true
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          output: supply-chain/vulnerabilities.json
          scan-type: image
          severity: HIGH,CRITICAL
          version: v0.73.0

      - name: Generate published SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: true
          format: cyclonedx
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          output: supply-chain/sbom.cdx.json
          scan-type: image
          version: v0.73.0

      - name: Enforce candidate vulnerability policy
        run: |
          jq -e '
            [
              .Results[]?.Vulnerabilities[]?
              | select(.Severity == "CRITICAL")
            ] | length == 0
          ' supply-chain/vulnerabilities.json

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-name: ${{ env.IMAGE }}

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          push-to-registry: true
          sbom-path: supply-chain/sbom.cdx.json
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-name: ${{ env.IMAGE }}

      - name: Attest compatibility contract
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          predicate-path: supply-chain/compatibility.json
          predicate-type: https://crab.build/attestations/image-compatibility/v1
          push-to-registry: true
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-name: ${{ env.IMAGE }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify published digest
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/crab-service-image.yml@${{ github.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity "${CERTIFICATE_IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}"

      - name: Upload candidate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: crab-service-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: supply-chain/
          retention-days: 90

  promote:
    name: Promote exact qualified digest
    if: ${{ startsWith(github.ref, 'refs/tags/crab-service-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      RELEASE_DIGEST: ${{ vars.CRAB_SERVICE_RELEASE_DIGEST }}
      RELEASE_EVIDENCE_RUN_ID: ${{ vars.CRAB_SERVICE_RELEASE_EVIDENCE_RUN_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate immutable promotion inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::CRAB_SERVICE_RELEASE_DIGEST must be one immutable sha256 digest"
            exit 1
          fi
          if [[ ! "${RELEASE_EVIDENCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::CRAB_SERVICE_RELEASE_EVIDENCE_RUN_ID must identify a protected evidence run"
            exit 1
          fi
          version="${GITHUB_REF_NAME#crab-service-v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::service release tag must be crab-service-v<semantic-version>"
            exit 1
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Download protected release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_EVIDENCE_RUN_ID}" \
            --jq '[.name,.status,.conclusion,.event,.head_sha,.run_attempt] | @tsv')
          IFS=$'\t' read -r workflow status conclusion event head_sha attempt <<< "${metadata}"
          if [[ "${workflow}" != "Crab service release evidence" ]]; then
            echo "::error::release evidence came from unexpected workflow '${workflow}'"
            exit 1
          fi
          if [[ "${status}" != completed || "${conclusion}" != success ]]; then
            echo "::error::release evidence run did not complete successfully"
            exit 1
          fi
          if [[ "${event}" != workflow_dispatch || "${head_sha}" != "${GITHUB_SHA}" ]]; then
            echo "::error::release evidence must be manually collected from the exact tagged commit"
            exit 1
          fi
          artifact="crab-service-release-evidence-${GITHUB_SHA}-${RELEASE_EVIDENCE_RUN_ID}-${attempt}"
          mkdir -p release-evidence
          gh run download "${RELEASE_EVIDENCE_RUN_ID}" \
            --name "${artifact}" \
            --dir release-evidence

      - name: Enforce production readiness evidence
        run: |
          jq -e '
            .operational.promotion_status == "ready"
            and .operational.service_level_objectives.measurement_status == "measured_hosted_environment"
            and .operational.service_level_objectives.latency_evidence != null
            and (.operational.blocking_conditions | length == 0)
          ' release-evidence/compatibility.json
          jq -e \
            --arg digest "${RELEASE_DIGEST}" \
            --arg revision "${GITHUB_SHA}" \
            --arg version "${RELEASE_VERSION}" \
            '.image.digest == $digest
             and .image.source_revision == $revision
             and .image.service_version == $version' \
            release-evidence/compatibility.json
          python3 deploy/crab-service/scripts/validate-release-evidence.py \
            release-evidence/release-evidence.json \
            --expected-digest "${RELEASE_DIGEST}" \
            --expected-revision "${GITHUB_SHA}" \
            --expected-version "${RELEASE_VERSION}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify candidate signature
        run: |
          cosign verify \
            --certificate-identity-regexp \
              "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/crab-service-image.yml@refs/(heads|tags)/.+$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${RELEASE_DIGEST}"

      - name: Promote without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          tags=(
            "${IMAGE}:${RELEASE_VERSION}"
            "${IMAGE}:sha-${GITHUB_SHA}"
            "${IMAGE}:development"
            "${IMAGE}:staging"
            "${IMAGE}:canary"
            "${IMAGE}:hosted-ecs"
            "${IMAGE}:hosted-eks"
            "${IMAGE}:portable"
          )
          arguments=()
          for tag in "${tags[@]}"; do
            arguments+=(--tag "${tag}")
          done
          docker buildx imagetools create \
            "${arguments[@]}" \
            "${IMAGE}@${RELEASE_DIGEST}"
          for tag in "${tags[@]}"; do
            resolved=$(docker buildx imagetools inspect "${tag}" \
              --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [[ "${resolved}" != "${RELEASE_DIGEST}" ]]; then
              echo "::error::${tag} resolved to ${resolved}, expected ${RELEASE_DIGEST}"
              exit 1
            fi
          done

      - name: Attest release qualification
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          predicate-path: release-evidence/release-evidence.json
          predicate-type: https://crab.build/attestations/release-qualification/v1
          push-to-registry: true
          subject-digest: ${{ env.RELEASE_DIGEST }}
          subject-name: ${{ env.IMAGE }}

      - name: Upload promoted release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: crab-service-promoted-${{ github.ref_name }}-${{ github.run_attempt }}
          path: release-evidence/
          retention-days: 90
