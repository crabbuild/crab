name: Cell reference Compose smoke

on:
  pull_request:
    paths:
      - ".github/workflows/cell-reference-compose.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "crates/crab-cell-app/Cargo.toml"
      - "crates/crab-cell-app/src/**"
      - "crates/crab-cell-host/Cargo.toml"
      - "crates/crab-cell-host/src/**"
      - "crates/crab-cell-runtime/Cargo.toml"
      - "crates/crab-cell-runtime/build.rs"
      - "crates/crab-cell-runtime/docs/contracts/peer.proto"
      - "crates/crab-cell-runtime/src/**"
      - "crates/crab-ltx/Cargo.toml"
      - "crates/crab-ltx/src/**"
      - "crates/crab-storage/Cargo.toml"
      - "crates/crab-storage/src/**"
      - "crates/crab-cell-app/tests/reference_application/**"
      - "crates/crab-cell-app/tests/reference_application.rs"
      - "crates/crab-cell-app/qualification/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cell-reference-compose-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CRAB_REFERENCE_PROJECT: cell-reference
      CRAB_CELL_PERF_ITERATIONS: "30"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Pin qualification source and host profile
        run: |
          set -euo pipefail
          CRAB_REFERENCE_STATE="$RUNNER_TEMP/cell-reference"
          printf 'CRAB_REFERENCE_STATE=%s\n' "$CRAB_REFERENCE_STATE" >> "$GITHUB_ENV"
          mkdir -p "$CRAB_REFERENCE_STATE/source" "$CRAB_REFERENCE_STATE/target-linux" "$CRAB_REFERENCE_STATE/evidence"
          # Capability-free container root needs write permission on this runner-owned mount.
          chmod 1777 "$CRAB_REFERENCE_STATE/evidence"
          git archive HEAD | tar -x -C "$CRAB_REFERENCE_STATE/source"
          git rev-parse HEAD > "$CRAB_REFERENCE_STATE/evidence/source-revision.txt"
          uname -a > "$CRAB_REFERENCE_STATE/evidence/host.txt"
          docker info --format '{{json .}}' > "$CRAB_REFERENCE_STATE/evidence/docker-info.json"
      - name: Build release test binary
        run: |
          set -euo pipefail
          docker compose -p "$CRAB_REFERENCE_PROJECT" \
            -f "$CRAB_REFERENCE_STATE/source/crates/crab-cell-app/qualification/compose.yaml" \
            run --name cell-reference-build build \
            2>&1 | tee "$CRAB_REFERENCE_STATE/evidence/build.log"
      - name: Exercise three constrained nodes and real object storage
        run: |
          set -euo pipefail
          compose() {
            docker compose -p "$CRAB_REFERENCE_PROJECT" \
              -f "$CRAB_REFERENCE_STATE/source/crates/crab-cell-app/qualification/compose.yaml" "$@"
          }
          compose up -d node-0 node-1 node-2
          compose run --name cell-reference-driver driver
          for node in node-0 node-1 node-2; do
            container=$(compose ps -aq "$node")
            test -n "$container"
            test "$(docker wait "$container")" = 0
          done
          compose stop
      - name: Scale readers across 3, 5, 10 and 20 constrained nodes
        run: |
          python3 "$CRAB_REFERENCE_STATE/source/crates/crab-cell-app/qualification/scale.py" \
            --state "$CRAB_REFERENCE_STATE" --project "$CRAB_REFERENCE_PROJECT-scale"
      - name: Retain reports and container resource proof
        if: always()
        run: |
          set -euo pipefail
          compose() {
            docker compose -p "$CRAB_REFERENCE_PROJECT" \
              -f "$CRAB_REFERENCE_STATE/source/crates/crab-cell-app/qualification/compose.yaml" "$@"
          }
          compose logs --no-color > "$CRAB_REFERENCE_STATE/evidence/compose.log"
          containers=$(compose ps -aq)
          if [ -n "$containers" ]; then
            docker inspect $containers > "$CRAB_REFERENCE_STATE/evidence/containers.json"
          fi
          docker image ls -a --digests --no-trunc > "$CRAB_REFERENCE_STATE/evidence/images.txt"
          compose stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cell-reference-compose-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cell-reference/evidence/
          if-no-files-found: error
          retention-days: 7
