name: S3 gateway

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/s3-gateway.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crab/**"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-gateway-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTFS_IMAGE: rustfs/rustfs:1.0.0-beta.8-glibc
  RUSTFS_ACCESS_KEY: crab
  RUSTFS_SECRET_KEY: crab
  GATEWAY_ACCESS_KEY: gateway-qualification
  GATEWAY_SECRET_KEY: gateway-qualification-secret
  GATEWAY_SESSION_ACCESS_KEY: gateway-session-qualification
  GATEWAY_SESSION_SECRET_KEY: gateway-session-qualification-secret
  GATEWAY_SESSION_TOKEN: gateway-session-qualification-token

jobs:
  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Lint, render, and validate Kubernetes resources
        run: |
          set -euo pipefail
          chart=crates/crab-s3-gateway/deploy/helm/crab-s3-gateway
          values="${chart}/eks-values.example.yaml"
          helm_image=alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          kubeconform_image=ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          prometheus_image=prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996

          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" lint --strict "${chart}" >/dev/null 2>&1; then
            echo "chart accepted mutable or missing deployment inputs" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" lint --strict "${chart}" --values "${values}" \
              --set serviceAccount.automountServiceAccountToken=true \
              >/dev/null 2>&1; then
            echo "chart accepted automatic Kubernetes API credentials" >&2
            exit 1
          fi
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" lint --strict "${chart}" --values "${values}"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab-s3-gateway --values "${values}" \
              > "${RUNNER_TEMP}/crab-s3-gateway.yaml"
          docker run --rm \
            --volume "${RUNNER_TEMP}/crab-s3-gateway.yaml:/manifests/gateway.yaml:ro" \
            "${kubeconform_image}" -strict -summary -kubernetes-version 1.29.0 \
              /manifests/gateway.yaml
          if grep -Eq '^kind: (PodMonitor|PrometheusRule)$' \
            "${RUNNER_TEMP}/crab-s3-gateway.yaml"; then
            echo "monitoring CRDs were rendered without explicit enablement" >&2
            exit 1
          fi

          rules="${chart}/monitoring"
          docker run --rm --volume "${PWD}/${rules}:/monitoring:ro" \
            --entrypoint /bin/promtool "${prometheus_image}" \
            check rules /monitoring/prometheus-rules.yaml
          docker run --rm --volume "${PWD}/${rules}:/monitoring:ro" \
            --workdir /monitoring --entrypoint /bin/promtool \
            "${prometheus_image}" test rules prometheus-rules.test.yaml
          runbook=crates/crab-s3-gateway/deploy/operations.md
          test "$(grep -c 'runbook_url: https://github.com/crabbuild/crab/blob/main/crates/crab-s3-gateway/deploy/operations.md#' \
            "${rules}/prometheus-rules.yaml")" = 14
          for invariant in \
            '## Availability and publication' \
            '## Credential and backend authentication' \
            '## Admission and scratch pressure' \
            '## Cache degradation' \
            '## Backend degradation'; do
            grep -Fq "${invariant}" "${runbook}"
          done
          for anchor in \
            availability-and-publication \
            credential-and-backend-authentication \
            admission-and-scratch-pressure \
            cache-degradation \
            backend-degradation; do
            grep -Fq "operations.md#${anchor}" \
              "${rules}/prometheus-rules.yaml"
          done

          monitoring="$(docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab-s3-gateway --values "${values}" \
              --set monitoring.podMonitor.enabled=true \
              --set monitoring.prometheusRule.enabled=true \
              --set monitoring.labels.release=kube-prometheus-stack \
              --show-only templates/podmonitor.yaml \
              --show-only templates/prometheusrule.yaml)"
          for invariant in \
            'kind: PodMonitor' \
            'kind: PrometheusRule' \
            'release: kube-prometheus-stack' \
            'port: management' \
            'path: /metrics'; do
            grep -Fq "${invariant}" <<< "${monitoring}"
          done
          test "$(grep -Ec '^[[:space:]]+- alert: CrabS3Gateway' \
            <<< "${monitoring}")" = 14

          service="$(docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab-s3-gateway --values "${values}" \
              --show-only templates/service.yaml)"
          grep -Fq 'name: s3' <<< "${service}"
          if grep -Fq 'management' <<< "${service}"; then
            echo "management port was exposed through the S3 Service" >&2
            exit 1
          fi
          deployment="$(docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab-s3-gateway --values "${values}" \
              --show-only templates/deployment.yaml)"
          for invariant in \
            'automountServiceAccountToken: false' \
            'enableServiceLinks: false' \
            'runAsNonRoot: true' \
            'runAsUser: 10001' \
            'runAsGroup: 10001' \
            'fsGroup: 10001' \
            'allowPrivilegeEscalation: false' \
            'readOnlyRootFilesystem: true' \
            'mountPath: /var/lib/crab/cache-volume' \
            'minDomains: 2' \
            'defaultMode: 0400'; do
            grep -Fq "${invariant}" <<< "${deployment}"
          done

  image:
    name: Build and qualify image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Record qualification start
        run: |
          install -d "${RUNNER_TEMP}/crab-s3-gateway-evidence"
          date +%s%3N > "${RUNNER_TEMP}/crab-s3-gateway-evidence/started-unix-ms"

      - name: Verify qualification evidence contract
        run: python3 -m unittest crab/scripts/e2e/test_s3_gateway_qualification_report.py

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.0

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crab-s3-gateway-publisher-target
        with:
          shared-key: s3-gateway-xet-publisher

      - name: Build minimal Crab fixture publisher
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/crab-s3-gateway-publisher-target
        run: >-
          cargo build --release --locked -p crab --bin crab
          --no-default-features --features simd-accel,gix-pathmatch

      - name: Build locked gateway image
        id: build
        run: >-
          docker build
          --file crates/crab-s3-gateway/deploy/Dockerfile
          --tag crab-s3-gateway:test
          .

      - name: Verify runtime contract
        id: runtime
        run: |
          set -euo pipefail
          test "$(docker image inspect crab-s3-gateway:test --format '{{.Config.User}}')" = "crab:crab"
          test "$(docker image inspect crab-s3-gateway:test --format '{{.Config.StopSignal}}')" = "SIGTERM"
          docker image inspect crab-s3-gateway:test --format '{{json .Config.Healthcheck.Test}}' | grep -F -- '"--healthcheck"'
          test "$(docker run --rm --entrypoint /usr/bin/id crab-s3-gateway:test -u)" = "10001"
          test "$(docker run --rm --entrypoint /usr/bin/id crab-s3-gateway:test -g)" = "10001"
          docker run --rm crab-s3-gateway:test --help | grep -F -- "--healthcheck"
          docker run --rm crab-s3-gateway:test --help | grep -F -- "--readiness-check"

      - name: Start RustFS and initialize repository
        id: initialize
        run: |
          set -euo pipefail
          docker network create crab-s3-gateway-qualification
          docker run --detach \
            --name crab-s3-gateway-rustfs \
            --network crab-s3-gateway-qualification \
            --publish 19000:9000 \
            --env RUSTFS_ACCESS_KEY \
            --env RUSTFS_SECRET_KEY \
            "${RUSTFS_IMAGE}" /data

          for attempt in $(seq 1 60); do
            if AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
              AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
              AWS_DEFAULT_REGION=us-east-1 \
              aws --endpoint-url http://127.0.0.1:19000 s3api list-buckets >/dev/null 2>&1; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "RustFS did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
            AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:19000 \
            s3api create-bucket --bucket crab-s3-gateway-qualification >/dev/null

          config_root="${RUNNER_TEMP}/crab-s3-gateway"
          install -d "${config_root}"
          printf '%s' "${GATEWAY_SECRET_KEY}" > "${config_root}/gateway-secret"
          printf '%s' "${GATEWAY_SESSION_SECRET_KEY}" > "${config_root}/gateway-session-secret"
          printf '%s' "${GATEWAY_SESSION_TOKEN}" > "${config_root}/gateway-session-token"
          chmod 0440 "${config_root}/gateway-secret" \
            "${config_root}/gateway-session-secret" \
            "${config_root}/gateway-session-token"
          sudo chown 0:10001 "${config_root}/gateway-secret" \
            "${config_root}/gateway-session-secret" \
            "${config_root}/gateway-session-token"
          session_expiry="$(date --utc --date='+1 hour' '+%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' \
            'listen = "0.0.0.0:8080"' \
            'management_listen = "0.0.0.0:8081"' \
            'region = "us-east-1"' \
            'max_in_flight_requests = 32' \
            '' \
            '[cache]' \
            'directory = "/var/lib/crab/cache-volume/cache"' \
            'max_bytes = 134217728' \
            '' \
            '[[credentials]]' \
            "access_key = \"${GATEWAY_ACCESS_KEY}\"" \
            'secret_key_file = "/run/secrets/crab-s3-secret"' \
            'principal = "service-account:qualification"' \
            '' \
            '[[credentials]]' \
            "access_key = \"${GATEWAY_SESSION_ACCESS_KEY}\"" \
            'secret_key_file = "/run/secrets/crab-s3-session-secret"' \
            'session_token_file = "/run/secrets/crab-s3-session-token"' \
            "expires_at = \"${session_expiry}\"" \
            'principal = "service-account:qualification"' \
            '' \
            '[[repositories]]' \
            'name = "gateway-repository"' \
            'provider = "s3"' \
            'bucket = "crab-s3-gateway-qualification"' \
            'prefix = "repositories/qualification"' \
            'default_branch = "main"' \
            'max_active_multipart_uploads = 16' \
            'multipart_staging_bytes_per_upload = 5368709120' \
            'multipart_upload_ttl_seconds = 3600' \
            '' \
            '[[repositories.members]]' \
            'principal = "service-account:qualification"' \
            'access = "write"' \
            > "${config_root}/gateway.toml"

          if docker run --rm \
            --read-only \
            --tmpfs /var/lib/crab/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --volume "${config_root}/gateway.toml:/etc/crab/s3-gateway.toml:ro" \
            --volume "${config_root}/gateway-secret:/run/secrets/crab-s3-secret:ro" \
            --volume "${config_root}/gateway-session-secret:/run/secrets/crab-s3-session-secret:ro" \
            --volume "${config_root}/gateway-session-token:/run/secrets/crab-s3-session-token:ro" \
            crab-s3-gateway:test \
            --config /etc/crab/s3-gateway.toml --initialize \
            >"${config_root}/missing-cache.stdout" \
            2>"${config_root}/missing-cache.stderr"; then
            echo "gateway unexpectedly started without its writable cache volume" >&2
            exit 1
          fi
          grep -Fq 'LocalCache' \
            "${config_root}/missing-cache.stderr"

          docker run --detach \
            --name crab-s3-gateway-unready \
            --network crab-s3-gateway-qualification \
            --read-only \
            --tmpfs /var/lib/crab/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /var/lib/crab/cache-volume:rw,noexec,nosuid,nodev,size=160m,uid=10001,gid=10001,mode=0700 \
            --publish 127.0.0.1:18081:8081 \
            --env AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            --env AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
            --env AWS_DEFAULT_REGION=us-east-1 \
            --env AWS_ENDPOINT_URL_S3=http://crab-s3-gateway-rustfs:9000 \
            --env AWS_ALLOW_HTTP=true \
            --env AWS_VIRTUAL_HOSTED_STYLE_REQUEST=false \
            --volume "${config_root}/gateway.toml:/etc/crab/s3-gateway.toml:ro" \
            --volume "${config_root}/gateway-secret:/run/secrets/crab-s3-secret:ro" \
            --volume "${config_root}/gateway-session-secret:/run/secrets/crab-s3-session-secret:ro" \
            --volume "${config_root}/gateway-session-token:/run/secrets/crab-s3-session-token:ro" \
            crab-s3-gateway:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/livez >/dev/null; then
              break
            fi
            if [[ "${attempt}" == 30 ]]; then
              echo "uninitialized gateway liveness did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          readiness_headers="$(curl --silent --show-error --dump-header - \
            --output /dev/null http://127.0.0.1:18081/readyz)"
          grep -Fq '503 Service Unavailable' <<< "${readiness_headers}"
          grep -Eiq '^retry-after: 5' <<< "${readiness_headers}"
          docker stop --time 35 crab-s3-gateway-unready >/dev/null
          docker rm crab-s3-gateway-unready >/dev/null

          docker run --rm \
            --network crab-s3-gateway-qualification \
            --read-only \
            --tmpfs /var/lib/crab/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /var/lib/crab/cache-volume:rw,noexec,nosuid,nodev,size=160m,uid=10001,gid=10001,mode=0700 \
            --env AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            --env AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
            --env AWS_DEFAULT_REGION=us-east-1 \
            --env AWS_ENDPOINT_URL_S3=http://crab-s3-gateway-rustfs:9000 \
            --env AWS_ALLOW_HTTP=true \
            --env AWS_VIRTUAL_HOSTED_STYLE_REQUEST=false \
            --volume "${config_root}/gateway.toml:/etc/crab/s3-gateway.toml:ro" \
            --volume "${config_root}/gateway-secret:/run/secrets/crab-s3-secret:ro" \
            --volume "${config_root}/gateway-session-secret:/run/secrets/crab-s3-session-secret:ro" \
            --volume "${config_root}/gateway-session-token:/run/secrets/crab-s3-session-token:ro" \
            crab-s3-gateway:test \
            --config /etc/crab/s3-gateway.toml --initialize

          xet_root="${RUNNER_TEMP}/crab-s3-gateway-xet"
          source_root="${xet_root}/source"
          install -d "${source_root}/qualification" "${xet_root}/publisher-cache"
          XET_FIXTURE="${source_root}/qualification/xet-large.bin" python3 - <<'PY'
          import os
          import random
          from pathlib import Path

          output = Path(os.environ["XET_FIXTURE"])
          source = random.Random(0xC2AB53)
          with output.open("wb") as stream:
              for _ in range(64):
                  stream.write(source.randbytes(1024 * 1024))
          PY
          cp "${source_root}/qualification/xet-large.bin" \
            "${source_root}/qualification/xet-duplicate.bin"
          git -C "${source_root}" init -q -b main
          git -C "${source_root}" config user.name 'S3 Xet qualification'
          git -C "${source_root}" config user.email 'qualification@example.invalid'
          export AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}"
          export AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}"
          export AWS_DEFAULT_REGION=us-east-1
          export AWS_REGION=us-east-1
          export AWS_ENDPOINT_URL=http://127.0.0.1:19000
          export AWS_ENDPOINT_URL_S3=http://127.0.0.1:19000
          export AWS_ALLOW_HTTP=true
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_VIRTUAL_HOSTED_STYLE_REQUEST=false
          export CRAB_CACHE_DIR="${xet_root}/publisher-cache"
          crab_bin="${RUNNER_TEMP}/crab-s3-gateway-publisher-target/release/crab"
          (
            cd "${source_root}"
            "${crab_bin}" init --storage-provider s3 \
              crab://crab-s3-gateway-qualification/repositories/qualification
            "${crab_bin}" track '*.bin'
            "${crab_bin}" add qualification/xet-large.bin \
              qualification/xet-duplicate.bin
            git show :qualification/xet-large.bin > "${xet_root}/xet-pointer-staged"
            LISTING_ROOT="${source_root}/qualification/listing" \
            XET_POINTER="${xet_root}/xet-pointer-staged" python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["LISTING_ROOT"])
          pointer = Path(os.environ["XET_POINTER"]).read_bytes()
          root.mkdir(parents=True)
          for index in range(10_000):
              (root / f"flat-{index:05}.pointer").write_bytes(pointer)
          for group in ("group-a", "group-b"):
              directory = root / group
              directory.mkdir()
              for index in range(16):
                  (directory / f"item-{index:02}.pointer").write_bytes(pointer)
          PY
            aws s3api create-bucket \
              --bucket crab-s3-gateway-listing-baseline >/dev/null
            aws s3 cp qualification/listing \
              s3://crab-s3-gateway-listing-baseline/main/qualification/listing/ \
              --recursive --only-show-errors --no-progress
            git add crab.toml .gitattributes qualification/listing
            git commit -q -m 'add Xet range qualification fixture'
            "${crab_bin}" push --upload-concurrency 0 \
              origin HEAD:refs/heads/main
            git show HEAD:qualification/xet-large.bin > "${xet_root}/xet-pointer"
            git show HEAD:qualification/xet-duplicate.bin \
              > "${xet_root}/xet-duplicate-pointer"
          )
          grep -Eq '^version https://crab.build/spec/v1$' \
            "${xet_root}/xet-pointer"
          grep -Fx 'size 67108864' "${xet_root}/xet-pointer"
          test "$(sed -n 's/^file-hash //p' "${xet_root}/xet-pointer")" = \
            "$(sed -n 's/^file-hash //p' "${xet_root}/xet-duplicate-pointer")"
          git -C "${source_root}" ls-tree -r --name-only HEAD \
            qualification/listing | wc -l | tr -d ' ' \
            > "${xet_root}/listing-object-count"
          test "$(cat "${xet_root}/listing-object-count")" = 10032
          git -C "${source_root}" ls-tree -r HEAD qualification/listing | \
            awk '{print $3}' | sort -u | wc -l | tr -d ' ' \
            > "${xet_root}/listing-blob-count"
          test "$(cat "${xet_root}/listing-blob-count")" = 1
          aws --endpoint-url http://127.0.0.1:19000 s3api list-objects-v2 \
            --bucket crab-s3-gateway-qualification --prefix .crab/xorbs/ \
            --query 'length(Contents)' --output text > "${xet_root}/xorb-count"
          test "$(cat "${xet_root}/xorb-count")" -gt 0

      - name: Start constrained gateway
        id: gateway
        run: |
          set -euo pipefail
          config_root="${RUNNER_TEMP}/crab-s3-gateway"
          docker run --detach \
            --name crab-s3-gateway \
            --network crab-s3-gateway-qualification \
            --read-only \
            --tmpfs /var/lib/crab/tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /var/lib/crab/cache-volume:rw,noexec,nosuid,nodev,size=160m,uid=10001,gid=10001,mode=0700 \
            --publish 18080:8080 \
            --publish 127.0.0.1:18081:8081 \
            --env AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            --env AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
            --env AWS_DEFAULT_REGION=us-east-1 \
            --env AWS_ENDPOINT_URL_S3=http://crab-s3-gateway-rustfs:9000 \
            --env AWS_ALLOW_HTTP=true \
            --env AWS_VIRTUAL_HOSTED_STYLE_REQUEST=false \
            --env RUST_LOG=trace \
            --volume "${config_root}/gateway.toml:/etc/crab/s3-gateway.toml:ro" \
            --volume "${config_root}/gateway-secret:/run/secrets/crab-s3-secret:ro" \
            --volume "${config_root}/gateway-session-secret:/run/secrets/crab-s3-session-secret:ro" \
            --volume "${config_root}/gateway-session-token:/run/secrets/crab-s3-session-token:ro" \
            crab-s3-gateway:test

          for attempt in $(seq 1 60); do
            if docker exec crab-s3-gateway \
              crab-s3-gateway --config /etc/crab/s3-gateway.toml --readiness-check; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "gateway did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          docker exec crab-s3-gateway \
            crab-s3-gateway --config /etc/crab/s3-gateway.toml --healthcheck
          test "$(docker exec crab-s3-gateway stat --format '%u:%g %a' \
            /var/lib/crab/cache-volume/cache)" = '10001:10001 700'
          for attempt in $(seq 1 60); do
            health="$(docker inspect crab-s3-gateway --format '{{.State.Health.Status}}')"
            if [[ "${health}" == healthy ]]; then
              break
            fi
            if [[ "${health}" == unhealthy || "${attempt}" == 60 ]]; then
              echo "container healthcheck failed with status ${health}" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Verify signed S3 traffic and range reads
        id: traffic
        run: |
          set -euo pipefail
          qualification_root="${RUNNER_TEMP}/crab-s3-gateway-client"
          install -d "${qualification_root}"
          printf '%s\n' \
            '[default]' \
            'region = us-east-1' \
            's3 =' \
            '    signature_version = s3v4' \
            > "${qualification_root}/aws-config"
          head -c 2097152 /dev/zero > "${qualification_root}/input.bin"

          export AWS_ACCESS_KEY_ID="${GATEWAY_ACCESS_KEY}"
          export AWS_SECRET_ACCESS_KEY="${GATEWAY_SECRET_KEY}"
          export AWS_DEFAULT_REGION=us-east-1
          export AWS_CONFIG_FILE="${qualification_root}/aws-config"
