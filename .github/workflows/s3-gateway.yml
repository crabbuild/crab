            aws --endpoint-url "${endpoint}" s3api list-buckets \
              >"${qualification_root}/missing-session.stdout" \
              2>"${qualification_root}/missing-session.stderr"; then
            echo "session credential without its token was accepted" >&2
            exit 1
          fi
          grep -Fq 'InvalidToken' "${qualification_root}/missing-session.stderr"
          export AWS_ACCESS_KEY_ID="${GATEWAY_ACCESS_KEY}"
          export AWS_SECRET_ACCESS_KEY="${GATEWAY_SECRET_KEY}"
          unset AWS_SESSION_TOKEN

          PRESIGNED_URL="${presigned_url}" python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          url = os.environ["PRESIGNED_URL"]
          marker = "X-Amz-Signature="
          prefix, remainder = url.split(marker, 1)
          signature, separator, suffix = remainder.partition("&")
          replacement = "0" if signature[-1] != "0" else "1"
          tampered = prefix + marker + signature[:-1] + replacement
          if separator:
              tampered += separator + suffix
          try:
              urllib.request.urlopen(tampered, timeout=10)
          except urllib.error.HTTPError as error:
              if error.code == 403:
                  raise SystemExit(0)
              raise
          raise SystemExit("tampered signature was accepted")
          PY

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "${endpoint}/${bucket}/${key}")" = 403
          if AWS_SECRET_ACCESS_KEY=wrong-qualification-secret \
            aws --endpoint-url "${endpoint}" s3api head-object \
              --bucket "${bucket}" --key "${key}" >/dev/null 2>&1; then
            echo "incorrect signing secret was accepted" >&2
            exit 1
          fi
          aws --endpoint-url "${endpoint}" s3api delete-object \
            --bucket "${bucket}" --key "${key}" >/dev/null

          oversized_key=main/qualification/scratch-capacity.bin
          truncate --size 500M "${qualification_root}/oversized.bin"
          if AWS_MAX_ATTEMPTS=1 aws --endpoint-url "${endpoint}" s3api put-object \
            --bucket "${bucket}" --key "${oversized_key}" \
            --body "${qualification_root}/oversized.bin" \
            >"${qualification_root}/oversized.stdout" \
            2>"${qualification_root}/oversized.stderr"; then
            echo "oversized scratch reservation unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fq 'SlowDown' "${qualification_root}/oversized.stderr"
          if aws --endpoint-url "${endpoint}" s3api head-object \
            --bucket "${bucket}" --key "${oversized_key}" >/dev/null 2>&1; then
            echo "scratch-rejected upload published an object" >&2
            exit 1
          fi

          metrics_root="${qualification_root}/metrics"
          maintenance_ready=false
          for _ in $(seq 1 30); do
            curl --fail --silent --show-error --dump-header "${metrics_root}.headers" \
              http://127.0.0.1:18081/metrics --output "${metrics_root}.txt"
            if grep -Eq '^crab_s3_gateway_multipart_maintenance_cycles_total\{outcome="success"\} [1-9][0-9]*$' \
              "${metrics_root}.txt" && \
              grep -Eq '^crab_s3_gateway_multipart_maintenance_last_success_timestamp_seconds [1-9][0-9]*$' \
              "${metrics_root}.txt"; then
              maintenance_ready=true
              break
            fi
            sleep 1
          done
          test "${maintenance_ready}" = true
          grep -Eiq '^content-type: text/plain; version=0\.0\.4; charset=utf-8' \
            "${metrics_root}.headers"
          grep -Eq '^crab_s3_gateway_http_requests_total\{method="(get|put|delete)",outcome="2xx"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_admission_events_total\{class="(read|transfer)",outcome="admitted_immediate"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Fq 'crab_s3_gateway_http_request_duration_seconds_bucket' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_bytes_written_total\{purpose="content_spool"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_filesystem_size_bytes [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_filesystem_free_bytes [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_filesystem_available_bytes [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_headroom_bytes [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_scratch_pending_bytes 0' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_scratch_filesystem_probe_success 1' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_scratch_filesystem_probe_failures_total 0' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_capacity_rejections_total\{reason="exhausted"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_scratch_capacity_rejections_total{reason="probe_error"} 0' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_cache_limit_bytes 134217728' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_cache_(retained|reserved|temporary)_bytes [0-9]+(\.[0-9]+)?$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_cache_entries [0-9]+(\.[0-9]+)?$' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_cache_catalog_probe_success 1' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_cache_catalog_probe_failures_total 0' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_cache_catalog_last_success_timestamp_seconds [1-9][0-9]*(\.[0-9]+)?$' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_cache_local_write_failures_total 0' \
            "${metrics_root}.txt"
          test "$(grep -Ec '^crab_s3_gateway_cache_read_attempts_total\{source="(memory|local|service)",outcome="(hit|miss|failure)"\} [0-9]+$' \
            "${metrics_root}.txt")" = 9
          test "$(grep -Ec '^crab_s3_gateway_cache_bytes_read_total\{source="(memory|local|service)"\} [0-9]+$' \
            "${metrics_root}.txt")" = 3
          grep -Eq '^crab_s3_gateway_backend_requests_total\{operation="(get|head|range|put|list)",outcome="success"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_backend_bytes_read_total\{operation="(get|range)"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_backend_bytes_written_total\{operation="(put|multipart_part)"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          backend_idle=false
          for _ in $(seq 1 30); do
            if test "$(grep -Ec '^crab_s3_gateway_backend_in_flight_requests\{operation="(get|head|range|put|delete|list|copy|multipart_start|multipart_part|multipart_complete|multipart_abort)"\} 0$' \
              "${metrics_root}.txt")" = 11; then
              backend_idle=true
              break
            fi
            sleep 1
            curl --fail --silent --show-error http://127.0.0.1:18081/metrics \
              --output "${metrics_root}.txt"
          done
          test "${backend_idle}" = true
          test "$(grep -Ec '^crab_s3_gateway_scratch_(bytes|files)\{purpose="(content_spool|xet_reconstruction|git_pack)"\} 0$' \
            "${metrics_root}.txt")" = 6
          test "$(grep -Ec '^crab_s3_gateway_scratch_io_failures_total\{purpose="(content_spool|xet_reconstruction|git_pack)",operation="(create|write|flush|read)"\} 0$' \
            "${metrics_root}.txt")" = 12
          if grep -Fq \
            -e "${GATEWAY_ACCESS_KEY}" \
            -e "${GATEWAY_SECRET_KEY}" \
            -e "${GATEWAY_SESSION_ACCESS_KEY}" \
            -e "${GATEWAY_SESSION_SECRET_KEY}" \
            -e "${GATEWAY_SESSION_TOKEN}" \
            -e "${bucket}" \
            -e "${key}" \
            -e 'service-account:qualification' \
            "${metrics_root}.txt"; then
            echo "metrics exposed request or credential identity" >&2
            exit 1
          fi
          docker logs crab-s3-gateway > "${qualification_root}/gateway.stdout" \
            2> "${qualification_root}/gateway.stderr"
          if grep -Fq \
            -e "${GATEWAY_SECRET_KEY}" \
            -e "${GATEWAY_SESSION_SECRET_KEY}" \
            -e "${GATEWAY_SESSION_TOKEN}" \
            -e "Credential=${GATEWAY_ACCESS_KEY}" \
            -e "Credential=${GATEWAY_SESSION_ACCESS_KEY}" \
            -e "AWS ${GATEWAY_ACCESS_KEY}:" \
            -e "AWSAccessKeyId=${GATEWAY_ACCESS_KEY}" \
            -e 'X-Amz-Signature=' \
            -e 'Authorization: AWS' \
            -e 'Authorization: AWS4-' \
            "${qualification_root}/gateway.stdout" \
            "${qualification_root}/gateway.stderr"; then
            echo "gateway logs exposed signed-request credentials" >&2
            exit 1
          fi
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:18081/metrics)" = 405
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/metrics)" = 403


      - name: Capture runtime measurements
        id: measurements
        run: |
          set -euo pipefail
          qualification_root="${RUNNER_TEMP}/crab-s3-gateway-client"
          docker stats --no-stream --format '{{.MemUsage}}' crab-s3-gateway \
            > "${qualification_root}/resident-memory"
          grep -Eq '^[0-9]+([.][0-9]+)?([KMGT]i)?B / ' \
            "${qualification_root}/resident-memory"
          docker inspect --size crab-s3-gateway --format '{{.SizeRw}}' \
            > "${qualification_root}/container-writable-bytes"
          grep -Eq '^[0-9]+$' \
            "${qualification_root}/container-writable-bytes"

      - name: Verify graceful termination
        id: graceful
        run: |
          set -euo pipefail
          docker stop --time 35 crab-s3-gateway >/dev/null
          test "$(docker inspect crab-s3-gateway --format '{{.State.ExitCode}}')" = "0"

      - name: Qualify Docker Compose asset
        id: compose
        env:
          CRAB_S3_GATEWAY_CONFIG: ${{ github.workspace }}/crates/crab-s3-gateway/deploy/compose.gateway.toml
          CRAB_S3_GATEWAY_IMAGE: crab-s3-gateway:test
          CRAB_S3_GATEWAY_MANAGEMENT_PORT: "18181"
          CRAB_S3_GATEWAY_PORT: "18180"
          CRAB_S3_GATEWAY_SCRATCH_SIZE: 128m
          CRAB_S3_GATEWAY_SECRET_FILE: ${{ runner.temp }}/crab-s3-gateway/gateway-secret
          RUSTFS_PORT: "19100"
        run: |
          set -euo pipefail
          compose=crates/crab-s3-gateway/deploy/compose.yaml
          docker compose -f "${compose}" config --quiet
          docker compose -f "${compose}" up --detach rustfs
          for attempt in $(seq 1 60); do
            if AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
              AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
              AWS_DEFAULT_REGION=us-east-1 \
              aws --endpoint-url http://127.0.0.1:19100 s3api list-buckets >/dev/null 2>&1; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "Compose RustFS did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
            AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:19100 \
            s3api create-bucket --bucket crab-s3-gateway-qualification >/dev/null
          docker compose -f "${compose}" --profile initialize run --rm gateway-init
          docker compose -f "${compose}" up --detach gateway
          for attempt in $(seq 1 60); do
            if docker compose -f "${compose}" exec --no-TTY gateway \
              crab-s3-gateway --config /etc/crab/s3-gateway.toml --readiness-check; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "Compose gateway did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          # JMESPath backticks are literals inside this single-quoted query.
          # shellcheck disable=SC2016
          AWS_ACCESS_KEY_ID="${GATEWAY_ACCESS_KEY}" \
            AWS_SECRET_ACCESS_KEY="${GATEWAY_SECRET_KEY}" \
            AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:18180 s3api list-buckets \
              --query 'Buckets[?Name==`gateway-repository`].Name | [0]' \
              --output text | grep -Fx gateway-repository

          compose_client="${RUNNER_TEMP}/crab-s3-gateway-compose-client"
          install -d "${compose_client}"
          head -c 6291456 /dev/zero > "${compose_client}/part-1.bin"
          head -c 1048576 /dev/zero > "${compose_client}/part-2.bin"
          compose_endpoint=http://127.0.0.1:18180
          compose_bucket=gateway-repository
          compose_key=main/qualification/compose-restart.bin
          export AWS_ACCESS_KEY_ID="${GATEWAY_ACCESS_KEY}"
          export AWS_SECRET_ACCESS_KEY="${GATEWAY_SECRET_KEY}"
          export AWS_DEFAULT_REGION=us-east-1
          compose_upload_id="$(aws --endpoint-url "${compose_endpoint}" \
            s3api create-multipart-upload --bucket "${compose_bucket}" \
            --key "${compose_key}" --query UploadId --output text)"
          aws --endpoint-url "${compose_endpoint}" s3api upload-part \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            --upload-id "${compose_upload_id}" --part-number 1 \
            --body "${compose_client}/part-1.bin" >/dev/null

          docker compose -f "${compose}" up --detach --force-recreate --no-deps gateway
          for attempt in $(seq 1 60); do
            if docker compose -f "${compose}" exec --no-TTY gateway \
              crab-s3-gateway --config /etc/crab/s3-gateway.toml --readiness-check; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "replacement Compose gateway did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          test "$(aws --endpoint-url "${compose_endpoint}" s3api list-parts \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            --upload-id "${compose_upload_id}" --query 'length(Parts)' --output text)" = 1
          aws --endpoint-url "${compose_endpoint}" s3api upload-part \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            --upload-id "${compose_upload_id}" --part-number 2 \
            --body "${compose_client}/part-2.bin" >/dev/null
          aws --endpoint-url "${compose_endpoint}" s3api list-parts \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            --upload-id "${compose_upload_id}" \
            --query '{Parts: Parts[].{ETag: ETag, PartNumber: PartNumber}}' \
            > "${compose_client}/completion.json"
          aws --endpoint-url "${compose_endpoint}" s3api complete-multipart-upload \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            --upload-id "${compose_upload_id}" \
            --multipart-upload "file://${compose_client}/completion.json" >/dev/null
          aws --endpoint-url "${compose_endpoint}" s3api get-object \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            "${compose_client}/result.bin" >/dev/null
          cmp <(cat "${compose_client}/part-1.bin" "${compose_client}/part-2.bin") \
            "${compose_client}/result.bin"
          aws --endpoint-url "${compose_endpoint}" s3api delete-object \
            --bucket "${compose_bucket}" --key "${compose_key}" >/dev/null
          docker compose -f "${compose}" stop gateway

      - name: Print service logs after failure
        if: failure()
        run: |
          docker logs crab-s3-gateway 2>&1 || true
          docker logs crab-s3-gateway-rustfs 2>&1 || true

      - name: Clean up services
        if: always()
        env:
          CRAB_S3_GATEWAY_CONFIG: ${{ github.workspace }}/crates/crab-s3-gateway/deploy/compose.gateway.toml
          CRAB_S3_GATEWAY_IMAGE: crab-s3-gateway:test
          CRAB_S3_GATEWAY_SECRET_FILE: ${{ runner.temp }}/crab-s3-gateway/gateway-secret
        run: |
          docker compose -f crates/crab-s3-gateway/deploy/compose.yaml \
            down --volumes >/dev/null 2>&1 || true
          docker rm --force \
            crab-s3-gateway crab-s3-gateway-unready crab-s3-gateway-rustfs \
            >/dev/null 2>&1 || true
          docker network rm crab-s3-gateway-qualification >/dev/null 2>&1 || true

      - name: Produce retained qualification report
        id: report
        if: always()
        env:
          STEP_BUILD: ${{ steps.build.outcome }}
          STEP_RUNTIME: ${{ steps.runtime.outcome }}
          STEP_INITIALIZE: ${{ steps.initialize.outcome }}
          STEP_GATEWAY: ${{ steps.gateway.outcome }}
          STEP_TRAFFIC: ${{ steps.traffic.outcome }}
          STEP_MEASUREMENTS: ${{ steps.measurements.outcome }}
          STEP_GRACEFUL: ${{ steps.graceful.outcome }}
          STEP_COMPOSE: ${{ steps.compose.outcome }}
        run: |
          set -euo pipefail
          report_root="${RUNNER_TEMP}/crab-s3-gateway-evidence"
          qualification_root="${RUNNER_TEMP}/crab-s3-gateway-client"
          gateway_image_id="$(docker image inspect crab-s3-gateway:test \
            --format '{{.Id}}' 2>/dev/null || printf unavailable)"
          python3 crab/scripts/e2e/s3_gateway_qualification_report.py produce \
            --report "${report_root}/report.json" \
            --repository "${GITHUB_WORKSPACE}" \
            --metrics "${qualification_root}/metrics.txt" \
            --fixture "${qualification_root}/input.bin" \
            --xet-fixture \
              "${RUNNER_TEMP}/crab-s3-gateway-xet/source/qualification/xet-large.bin" \
            --xet-range "${RUNNER_TEMP}/crab-s3-gateway-xet/xet-range.bin" \
            --xet-proof "${RUNNER_TEMP}/crab-s3-gateway-xet/xet-proof.json" \
            --listing-proof "${qualification_root}/listing-proof.json" \
            --multipart-registration-proof \
              "${qualification_root}/multipart-registration-proof.json" \
            --resident-memory "${qualification_root}/resident-memory" \
            --container-writable \
              "${qualification_root}/container-writable-bytes" \
            --started "${report_root}/started-unix-ms" \
            --source-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --gateway-image-id "${gateway_image_id}" \
            --aws-cli-version "$(aws --version 2>&1)" \
            --curl-version "$(curl --version | head -n 1)" \
            --platform "$(uname -srm)" \
            --step "build=${STEP_BUILD}" \
            --step "runtime=${STEP_RUNTIME}" \
            --step "initialize=${STEP_INITIALIZE}" \
            --step "gateway=${STEP_GATEWAY}" \
            --step "traffic=${STEP_TRAFFIC}" \
            --step "measurements=${STEP_MEASUREMENTS}" \
            --step "graceful=${STEP_GRACEFUL}" \
            --step "compose=${STEP_COMPOSE}"

      - name: Verify retained qualification report
        if: >-
          ${{ !cancelled() &&
              steps.build.outcome == 'success' &&
              steps.runtime.outcome == 'success' &&
              steps.initialize.outcome == 'success' &&
              steps.gateway.outcome == 'success' &&
              steps.traffic.outcome == 'success' &&
              steps.measurements.outcome == 'success' &&
              steps.graceful.outcome == 'success' &&
              steps.compose.outcome == 'success' &&
              steps.report.outcome == 'success' }}
        run: |
          report="${RUNNER_TEMP}/crab-s3-gateway-evidence/report.json"
          if grep -Fq \
            -e "${GATEWAY_ACCESS_KEY}" \
            -e "${GATEWAY_SECRET_KEY}" \
            -e "${GATEWAY_SESSION_ACCESS_KEY}" \
            -e "${GATEWAY_SESSION_SECRET_KEY}" \
            -e "${GATEWAY_SESSION_TOKEN}" \
            "${report}"; then
            echo "qualification report exposed credential material" >&2
            exit 1
          fi
          python3 crab/scripts/e2e/s3_gateway_qualification_report.py verify \
            --report "${report}" \
            --source-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"

      - name: Upload retained qualification report
        if: always() && steps.report.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: s3-gateway-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crab-s3-gateway-evidence/report.json
          if-no-files-found: error
          retention-days: 90
