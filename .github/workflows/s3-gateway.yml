name: S3 gateway

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/s3-gateway.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crab/**"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s3-gateway-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUSTFS_IMAGE: rustfs/rustfs:1.0.0-beta.8-glibc
  RUSTFS_ACCESS_KEY: crab
  RUSTFS_SECRET_KEY: crab
  GATEWAY_ACCESS_KEY: gateway-qualification
  GATEWAY_SECRET_KEY: gateway-qualification-secret

jobs:
  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Lint, render, and validate Kubernetes resources
        run: |
          set -euo pipefail
          chart=crates/crab-s3-gateway/deploy/helm/crab-s3-gateway
          values="${chart}/eks-values.example.yaml"
          helm_image=alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          kubeconform_image=ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          prometheus_image=prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996

          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" lint --strict "${chart}" >/dev/null 2>&1; then
            echo "chart accepted mutable or missing deployment inputs" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" lint --strict "${chart}" --values "${values}" \
              --set serviceAccount.automountServiceAccountToken=true \
              >/dev/null 2>&1; then
            echo "chart accepted automatic Kubernetes API credentials" >&2
            exit 1
          fi
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" lint --strict "${chart}" --values "${values}"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab-s3-gateway --values "${values}" \
              > "${RUNNER_TEMP}/crab-s3-gateway.yaml"
          docker run --rm \
            --volume "${RUNNER_TEMP}/crab-s3-gateway.yaml:/manifests/gateway.yaml:ro" \
            "${kubeconform_image}" -strict -summary -kubernetes-version 1.29.0 \
              /manifests/gateway.yaml
          if grep -Eq '^kind: (PodMonitor|PrometheusRule)$' \
            "${RUNNER_TEMP}/crab-s3-gateway.yaml"; then
            echo "monitoring CRDs were rendered without explicit enablement" >&2
            exit 1
          fi

          rules="${chart}/monitoring"
          docker run --rm --volume "${PWD}/${rules}:/monitoring:ro" \
            --entrypoint /bin/promtool "${prometheus_image}" \
            check rules /monitoring/prometheus-rules.yaml
          docker run --rm --volume "${PWD}/${rules}:/monitoring:ro" \
            --workdir /monitoring --entrypoint /bin/promtool \
            "${prometheus_image}" test rules prometheus-rules.test.yaml
          runbook=crates/crab-s3-gateway/deploy/operations.md
          test "$(grep -c 'runbook_url: https://github.com/crabbuild/crab/blob/main/crates/crab-s3-gateway/deploy/operations.md#' \
            "${rules}/prometheus-rules.yaml")" = 14
          for invariant in \
            '## Availability and publication' \
            '## Credential and backend authentication' \
            '## Admission and scratch pressure' \
            '## Cache degradation' \
            '## Backend degradation'; do
            grep -Fq "${invariant}" "${runbook}"
          done
          for anchor in \
            availability-and-publication \
            credential-and-backend-authentication \
            admission-and-scratch-pressure \
            cache-degradation \
            backend-degradation; do
            grep -Fq "operations.md#${anchor}" \
              "${rules}/prometheus-rules.yaml"
          done

          monitoring="$(docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab-s3-gateway --values "${values}" \
              --set monitoring.podMonitor.enabled=true \
              --set monitoring.prometheusRule.enabled=true \
              --set monitoring.labels.release=kube-prometheus-stack \
              --show-only templates/podmonitor.yaml \
              --show-only templates/prometheusrule.yaml)"
          for invariant in \
            'kind: PodMonitor' \
            'kind: PrometheusRule' \
            'release: kube-prometheus-stack' \
            'port: management' \
            'path: /metrics'; do
            grep -Fq "${invariant}" <<< "${monitoring}"
          done
          test "$(grep -Ec '^[[:space:]]+- alert: CrabS3Gateway' \
            <<< "${monitoring}")" = 14

          service="$(docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab-s3-gateway --values "${values}" \
              --show-only templates/service.yaml)"
          grep -Fq 'name: s3' <<< "${service}"
          if grep -Fq 'management' <<< "${service}"; then
            echo "management port was exposed through the S3 Service" >&2
            exit 1
          fi
          deployment="$(docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab-s3-gateway --values "${values}" \
              --show-only templates/deployment.yaml)"
          for invariant in \
            'automountServiceAccountToken: false' \
            'enableServiceLinks: false' \
            'runAsNonRoot: true' \
            'runAsUser: 10001' \
            'runAsGroup: 10001' \
            'fsGroup: 10001' \
            'allowPrivilegeEscalation: false' \
            'readOnlyRootFilesystem: true' \
            'mountPath: /var/lib/crab/cache-volume' \
            'minDomains: 2' \
            'defaultMode: 0400'; do
            grep -Fq "${invariant}" <<< "${deployment}"
          done

  image:
    name: Build and qualify image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Build locked gateway image
        run: >-
          docker build
          --file crates/crab-s3-gateway/deploy/Dockerfile
          --tag crab-s3-gateway:test
          .

      - name: Verify runtime contract
        run: |
          set -euo pipefail
          test "$(docker image inspect crab-s3-gateway:test --format '{{.Config.User}}')" = "crab:crab"
          test "$(docker image inspect crab-s3-gateway:test --format '{{.Config.StopSignal}}')" = "SIGTERM"
          docker image inspect crab-s3-gateway:test --format '{{json .Config.Healthcheck.Test}}' | grep -F -- '"--healthcheck"'
          test "$(docker run --rm --entrypoint /usr/bin/id crab-s3-gateway:test -u)" = "10001"
          test "$(docker run --rm --entrypoint /usr/bin/id crab-s3-gateway:test -g)" = "10001"
          docker run --rm crab-s3-gateway:test --help | grep -F -- "--healthcheck"
          docker run --rm crab-s3-gateway:test --help | grep -F -- "--readiness-check"

      - name: Start RustFS and initialize repository
        run: |
          set -euo pipefail
          docker network create crab-s3-gateway-qualification
          docker run --detach \
            --name crab-s3-gateway-rustfs \
            --network crab-s3-gateway-qualification \
            --publish 19000:9000 \
            --env RUSTFS_ACCESS_KEY \
            --env RUSTFS_SECRET_KEY \
            "${RUSTFS_IMAGE}" /data

          for attempt in $(seq 1 60); do
            if AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
              AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
              AWS_DEFAULT_REGION=us-east-1 \
              aws --endpoint-url http://127.0.0.1:19000 s3api list-buckets >/dev/null 2>&1; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "RustFS did not become ready" >&2
              exit 1
            fi
            sleep 1
          done

          AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
            AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:19000 \
            s3api create-bucket --bucket crab-s3-gateway-qualification >/dev/null

          config_root="${RUNNER_TEMP}/crab-s3-gateway"
          install -d "${config_root}"
          printf '%s' "${GATEWAY_SECRET_KEY}" > "${config_root}/gateway-secret"
          chmod 0440 "${config_root}/gateway-secret"
          sudo chown 0:10001 "${config_root}/gateway-secret"
          printf '%s\n' \
            'listen = "0.0.0.0:8080"' \
            'management_listen = "0.0.0.0:8081"' \
            'region = "us-east-1"' \
            'max_in_flight_requests = 32' \
            '' \
            '[cache]' \
            'directory = "/var/lib/crab/cache-volume/cache"' \
            'max_bytes = 134217728' \
            '' \
            '[[credentials]]' \
            "access_key = \"${GATEWAY_ACCESS_KEY}\"" \
            'secret_key_file = "/run/secrets/crab-s3-secret"' \
            'principal = "service-account:qualification"' \
            '' \
            '[[repositories]]' \
            'name = "gateway-repository"' \
            'provider = "s3"' \
            'bucket = "crab-s3-gateway-qualification"' \
            'prefix = "repositories/qualification"' \
            'default_branch = "main"' \
            'max_active_multipart_uploads = 16' \
            'multipart_staging_bytes_per_upload = 5368709120' \
            'multipart_upload_ttl_seconds = 3600' \
            '' \
            '[[repositories.members]]' \
            'principal = "service-account:qualification"' \
            'access = "write"' \
            > "${config_root}/gateway.toml"

          if docker run --rm \
            --read-only \
            --tmpfs /var/lib/crab/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --volume "${config_root}/gateway.toml:/etc/crab/s3-gateway.toml:ro" \
            --volume "${config_root}/gateway-secret:/run/secrets/crab-s3-secret:ro" \
            crab-s3-gateway:test \
            --config /etc/crab/s3-gateway.toml --initialize \
            >"${config_root}/missing-cache.stdout" \
            2>"${config_root}/missing-cache.stderr"; then
            echo "gateway unexpectedly started without its writable cache volume" >&2
            exit 1
          fi
          grep -Fq 'LocalCache' \
            "${config_root}/missing-cache.stderr"

          docker run --detach \
            --name crab-s3-gateway-unready \
            --network crab-s3-gateway-qualification \
            --read-only \
            --tmpfs /var/lib/crab/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /var/lib/crab/cache-volume:rw,noexec,nosuid,nodev,size=160m,uid=10001,gid=10001,mode=0700 \
            --publish 127.0.0.1:18081:8081 \
            --env AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            --env AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
            --env AWS_DEFAULT_REGION=us-east-1 \
            --env AWS_ENDPOINT_URL_S3=http://crab-s3-gateway-rustfs:9000 \
            --env AWS_ALLOW_HTTP=true \
            --env AWS_VIRTUAL_HOSTED_STYLE_REQUEST=false \
            --volume "${config_root}/gateway.toml:/etc/crab/s3-gateway.toml:ro" \
            --volume "${config_root}/gateway-secret:/run/secrets/crab-s3-secret:ro" \
            crab-s3-gateway:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/livez >/dev/null; then
              break
            fi
            if [[ "${attempt}" == 30 ]]; then
              echo "uninitialized gateway liveness did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          readiness_headers="$(curl --silent --show-error --dump-header - \
            --output /dev/null http://127.0.0.1:18081/readyz)"
          grep -Fq '503 Service Unavailable' <<< "${readiness_headers}"
          grep -Eiq '^retry-after: 5' <<< "${readiness_headers}"
          docker stop --time 35 crab-s3-gateway-unready >/dev/null
          docker rm crab-s3-gateway-unready >/dev/null

          docker run --rm \
            --network crab-s3-gateway-qualification \
            --read-only \
            --tmpfs /var/lib/crab/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /var/lib/crab/cache-volume:rw,noexec,nosuid,nodev,size=160m,uid=10001,gid=10001,mode=0700 \
            --env AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            --env AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
            --env AWS_DEFAULT_REGION=us-east-1 \
            --env AWS_ENDPOINT_URL_S3=http://crab-s3-gateway-rustfs:9000 \
            --env AWS_ALLOW_HTTP=true \
            --env AWS_VIRTUAL_HOSTED_STYLE_REQUEST=false \
            --volume "${config_root}/gateway.toml:/etc/crab/s3-gateway.toml:ro" \
            --volume "${config_root}/gateway-secret:/run/secrets/crab-s3-secret:ro" \
            crab-s3-gateway:test \
            --config /etc/crab/s3-gateway.toml --initialize

      - name: Start constrained gateway
        run: |
          set -euo pipefail
          config_root="${RUNNER_TEMP}/crab-s3-gateway"
          docker run --detach \
            --name crab-s3-gateway \
            --network crab-s3-gateway-qualification \
            --read-only \
            --tmpfs /var/lib/crab/tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0700 \
            --tmpfs /var/lib/crab/cache-volume:rw,noexec,nosuid,nodev,size=160m,uid=10001,gid=10001,mode=0700 \
            --publish 18080:8080 \
            --publish 127.0.0.1:18081:8081 \
            --env AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            --env AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
            --env AWS_DEFAULT_REGION=us-east-1 \
            --env AWS_ENDPOINT_URL_S3=http://crab-s3-gateway-rustfs:9000 \
            --env AWS_ALLOW_HTTP=true \
            --env AWS_VIRTUAL_HOSTED_STYLE_REQUEST=false \
            --env RUST_LOG=trace \
            --volume "${config_root}/gateway.toml:/etc/crab/s3-gateway.toml:ro" \
            --volume "${config_root}/gateway-secret:/run/secrets/crab-s3-secret:ro" \
            crab-s3-gateway:test

          for attempt in $(seq 1 60); do
            if docker exec crab-s3-gateway \
              crab-s3-gateway --config /etc/crab/s3-gateway.toml --readiness-check; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "gateway did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          docker exec crab-s3-gateway \
            crab-s3-gateway --config /etc/crab/s3-gateway.toml --healthcheck
          test "$(docker exec crab-s3-gateway stat --format '%u:%g %a' \
            /var/lib/crab/cache-volume/cache)" = '10001:10001 700'
          for attempt in $(seq 1 60); do
            health="$(docker inspect crab-s3-gateway --format '{{.State.Health.Status}}')"
            if [[ "${health}" == healthy ]]; then
              break
            fi
            if [[ "${health}" == unhealthy || "${attempt}" == 60 ]]; then
              echo "container healthcheck failed with status ${health}" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Verify signed S3 traffic and range reads
        run: |
          set -euo pipefail
          qualification_root="${RUNNER_TEMP}/crab-s3-gateway-client"
          install -d "${qualification_root}"
          printf '%s\n' \
            '[default]' \
            'region = us-east-1' \
            's3 =' \
            '    signature_version = s3v4' \
            > "${qualification_root}/aws-config"
          head -c 2097152 /dev/zero > "${qualification_root}/input.bin"

          export AWS_ACCESS_KEY_ID="${GATEWAY_ACCESS_KEY}"
          export AWS_SECRET_ACCESS_KEY="${GATEWAY_SECRET_KEY}"
          export AWS_DEFAULT_REGION=us-east-1
          export AWS_CONFIG_FILE="${qualification_root}/aws-config"
          endpoint=http://127.0.0.1:18080
          bucket=gateway-repository
          key=main/qualification/signed.bin

          # JMESPath backticks are literals inside this single-quoted query.
          # shellcheck disable=SC2016
          aws --endpoint-url "${endpoint}" s3api list-buckets \
            --query 'Buckets[?Name==`gateway-repository`].Name | [0]' \
            --output text | grep -Fx gateway-repository
          aws --endpoint-url "${endpoint}" s3api put-object \
            --bucket "${bucket}" --key "${key}" \
            --body "${qualification_root}/input.bin" >/dev/null
          aws --endpoint-url "${endpoint}" s3api get-object \
            --bucket "${bucket}" --key "${key}" \
            "${qualification_root}/output.bin" >/dev/null
          cmp "${qualification_root}/input.bin" "${qualification_root}/output.bin"
          aws --endpoint-url "${endpoint}" s3api get-object \
            --bucket "${bucket}" --key "${key}" \
            --range bytes=1048576-1114111 \
            "${qualification_root}/range.bin" >/dev/null
          test "$(wc -c < "${qualification_root}/range.bin" | tr -d ' ')" = 65536

          presigned_url="$(aws --endpoint-url "${endpoint}" s3 presign \
            "s3://${bucket}/${key}" --expires-in 60)"
          grep -Fq 'X-Amz-Signature=' <<< "${presigned_url}"
          curl --fail --silent --show-error "${presigned_url}" \
            --output "${qualification_root}/presigned.bin"
          cmp "${qualification_root}/input.bin" "${qualification_root}/presigned.bin"

          PRESIGNED_URL="${presigned_url}" python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          url = os.environ["PRESIGNED_URL"]
          marker = "X-Amz-Signature="
          prefix, remainder = url.split(marker, 1)
          signature, separator, suffix = remainder.partition("&")
          replacement = "0" if signature[-1] != "0" else "1"
          tampered = prefix + marker + signature[:-1] + replacement
          if separator:
              tampered += separator + suffix
          try:
              urllib.request.urlopen(tampered, timeout=10)
          except urllib.error.HTTPError as error:
              if error.code == 403:
                  raise SystemExit(0)
              raise
          raise SystemExit("tampered signature was accepted")
          PY

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            "${endpoint}/${bucket}/${key}")" = 403
          if AWS_SECRET_ACCESS_KEY=wrong-qualification-secret \
            aws --endpoint-url "${endpoint}" s3api head-object \
              --bucket "${bucket}" --key "${key}" >/dev/null 2>&1; then
            echo "incorrect signing secret was accepted" >&2
            exit 1
          fi
          aws --endpoint-url "${endpoint}" s3api delete-object \
            --bucket "${bucket}" --key "${key}" >/dev/null

          oversized_key=main/qualification/scratch-capacity.bin
          truncate --size 500M "${qualification_root}/oversized.bin"
          if AWS_MAX_ATTEMPTS=1 aws --endpoint-url "${endpoint}" s3api put-object \
            --bucket "${bucket}" --key "${oversized_key}" \
            --body "${qualification_root}/oversized.bin" \
            >"${qualification_root}/oversized.stdout" \
            2>"${qualification_root}/oversized.stderr"; then
            echo "oversized scratch reservation unexpectedly succeeded" >&2
            exit 1
          fi
          grep -Fq 'SlowDown' "${qualification_root}/oversized.stderr"
          if aws --endpoint-url "${endpoint}" s3api head-object \
            --bucket "${bucket}" --key "${oversized_key}" >/dev/null 2>&1; then
            echo "scratch-rejected upload published an object" >&2
            exit 1
          fi

          metrics_root="${qualification_root}/metrics"
          maintenance_ready=false
          for _ in $(seq 1 30); do
            curl --fail --silent --show-error --dump-header "${metrics_root}.headers" \
              http://127.0.0.1:18081/metrics --output "${metrics_root}.txt"
            if grep -Eq '^crab_s3_gateway_multipart_maintenance_cycles_total\{outcome="success"\} [1-9][0-9]*$' \
              "${metrics_root}.txt" && \
              grep -Eq '^crab_s3_gateway_multipart_maintenance_last_success_timestamp_seconds [1-9][0-9]*$' \
              "${metrics_root}.txt"; then
              maintenance_ready=true
              break
            fi
            sleep 1
          done
          test "${maintenance_ready}" = true
          grep -Eiq '^content-type: text/plain; version=0\.0\.4; charset=utf-8' \
            "${metrics_root}.headers"
          grep -Eq '^crab_s3_gateway_http_requests_total\{method="(get|put|delete)",outcome="2xx"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_admission_events_total\{class="(read|transfer)",outcome="admitted_immediate"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Fq 'crab_s3_gateway_http_request_duration_seconds_bucket' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_bytes_written_total\{purpose="content_spool"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_filesystem_size_bytes [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_filesystem_free_bytes [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_filesystem_available_bytes [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_headroom_bytes [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_scratch_pending_bytes 0' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_scratch_filesystem_probe_success 1' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_scratch_filesystem_probe_failures_total 0' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_scratch_capacity_rejections_total\{reason="exhausted"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_scratch_capacity_rejections_total{reason="probe_error"} 0' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_cache_limit_bytes 134217728' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_cache_(retained|reserved|temporary)_bytes [0-9]+(\.[0-9]+)?$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_cache_entries [0-9]+(\.[0-9]+)?$' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_cache_catalog_probe_success 1' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_cache_catalog_probe_failures_total 0' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_cache_catalog_last_success_timestamp_seconds [1-9][0-9]*(\.[0-9]+)?$' \
            "${metrics_root}.txt"
          grep -Fqx 'crab_s3_gateway_cache_local_write_failures_total 0' \
            "${metrics_root}.txt"
          test "$(grep -Ec '^crab_s3_gateway_cache_read_attempts_total\{source="(memory|local|service)",outcome="(hit|miss|failure)"\} [0-9]+$' \
            "${metrics_root}.txt")" = 9
          test "$(grep -Ec '^crab_s3_gateway_cache_bytes_read_total\{source="(memory|local|service)"\} [0-9]+$' \
            "${metrics_root}.txt")" = 3
          grep -Eq '^crab_s3_gateway_backend_requests_total\{operation="(get|head|range|put|list)",outcome="success"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_backend_bytes_read_total\{operation="(get|range)"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          grep -Eq '^crab_s3_gateway_backend_bytes_written_total\{operation="(put|multipart_part)"\} [1-9][0-9]*$' \
            "${metrics_root}.txt"
          backend_idle=false
          for _ in $(seq 1 30); do
            if test "$(grep -Ec '^crab_s3_gateway_backend_in_flight_requests\{operation="(get|head|range|put|delete|list|copy|multipart_start|multipart_part|multipart_complete|multipart_abort)"\} 0$' \
              "${metrics_root}.txt")" = 11; then
              backend_idle=true
              break
            fi
            sleep 1
            curl --fail --silent --show-error http://127.0.0.1:18081/metrics \
              --output "${metrics_root}.txt"
          done
          test "${backend_idle}" = true
          test "$(grep -Ec '^crab_s3_gateway_scratch_(bytes|files)\{purpose="(content_spool|xet_reconstruction|git_pack)"\} 0$' \
            "${metrics_root}.txt")" = 6
          test "$(grep -Ec '^crab_s3_gateway_scratch_io_failures_total\{purpose="(content_spool|xet_reconstruction|git_pack)",operation="(create|write|flush|read)"\} 0$' \
            "${metrics_root}.txt")" = 12
          if grep -Fq \
            -e "${GATEWAY_ACCESS_KEY}" \
            -e "${GATEWAY_SECRET_KEY}" \
            -e "${bucket}" \
            -e "${key}" \
            -e 'service-account:qualification' \
            "${metrics_root}.txt"; then
            echo "metrics exposed request or credential identity" >&2
            exit 1
          fi
          docker logs crab-s3-gateway > "${qualification_root}/gateway.stdout" \
            2> "${qualification_root}/gateway.stderr"
          if grep -Fq \
            -e "${GATEWAY_SECRET_KEY}" \
            -e "Credential=${GATEWAY_ACCESS_KEY}" \
            -e "AWS ${GATEWAY_ACCESS_KEY}:" \
            -e "AWSAccessKeyId=${GATEWAY_ACCESS_KEY}" \
            -e 'X-Amz-Signature=' \
            -e 'Authorization: AWS' \
            -e 'Authorization: AWS4-' \
            "${qualification_root}/gateway.stdout" \
            "${qualification_root}/gateway.stderr"; then
            echo "gateway logs exposed signed-request credentials" >&2
            exit 1
          fi
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST http://127.0.0.1:18081/metrics)" = 405
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:18080/metrics)" = 403

      - name: Verify graceful termination
        run: |
          set -euo pipefail
          docker stop --time 35 crab-s3-gateway >/dev/null
          test "$(docker inspect crab-s3-gateway --format '{{.State.ExitCode}}')" = "0"

      - name: Qualify Docker Compose asset
        env:
          CRAB_S3_GATEWAY_CONFIG: ${{ github.workspace }}/crates/crab-s3-gateway/deploy/compose.gateway.toml
          CRAB_S3_GATEWAY_IMAGE: crab-s3-gateway:test
          CRAB_S3_GATEWAY_MANAGEMENT_PORT: "18181"
          CRAB_S3_GATEWAY_PORT: "18180"
          CRAB_S3_GATEWAY_SCRATCH_SIZE: 128m
          CRAB_S3_GATEWAY_SECRET_FILE: ${{ runner.temp }}/crab-s3-gateway/gateway-secret
          RUSTFS_PORT: "19100"
        run: |
          set -euo pipefail
          compose=crates/crab-s3-gateway/deploy/compose.yaml
          docker compose -f "${compose}" config --quiet
          docker compose -f "${compose}" up --detach rustfs
          for attempt in $(seq 1 60); do
            if AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
              AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
              AWS_DEFAULT_REGION=us-east-1 \
              aws --endpoint-url http://127.0.0.1:19100 s3api list-buckets >/dev/null 2>&1; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "Compose RustFS did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          AWS_ACCESS_KEY_ID="${RUSTFS_ACCESS_KEY}" \
            AWS_SECRET_ACCESS_KEY="${RUSTFS_SECRET_KEY}" \
            AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:19100 \
            s3api create-bucket --bucket crab-s3-gateway-qualification >/dev/null
          docker compose -f "${compose}" --profile initialize run --rm gateway-init
          docker compose -f "${compose}" up --detach gateway
          for attempt in $(seq 1 60); do
            if docker compose -f "${compose}" exec --no-TTY gateway \
              crab-s3-gateway --config /etc/crab/s3-gateway.toml --readiness-check; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "Compose gateway did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          # JMESPath backticks are literals inside this single-quoted query.
          # shellcheck disable=SC2016
          AWS_ACCESS_KEY_ID="${GATEWAY_ACCESS_KEY}" \
            AWS_SECRET_ACCESS_KEY="${GATEWAY_SECRET_KEY}" \
            AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:18180 s3api list-buckets \
              --query 'Buckets[?Name==`gateway-repository`].Name | [0]' \
              --output text | grep -Fx gateway-repository

          compose_client="${RUNNER_TEMP}/crab-s3-gateway-compose-client"
          install -d "${compose_client}"
          head -c 6291456 /dev/zero > "${compose_client}/part-1.bin"
          head -c 1048576 /dev/zero > "${compose_client}/part-2.bin"
          compose_endpoint=http://127.0.0.1:18180
          compose_bucket=gateway-repository
          compose_key=main/qualification/compose-restart.bin
          export AWS_ACCESS_KEY_ID="${GATEWAY_ACCESS_KEY}"
          export AWS_SECRET_ACCESS_KEY="${GATEWAY_SECRET_KEY}"
          export AWS_DEFAULT_REGION=us-east-1
          compose_upload_id="$(aws --endpoint-url "${compose_endpoint}" \
            s3api create-multipart-upload --bucket "${compose_bucket}" \
            --key "${compose_key}" --query UploadId --output text)"
          aws --endpoint-url "${compose_endpoint}" s3api upload-part \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            --upload-id "${compose_upload_id}" --part-number 1 \
            --body "${compose_client}/part-1.bin" >/dev/null

          docker compose -f "${compose}" up --detach --force-recreate --no-deps gateway
          for attempt in $(seq 1 60); do
            if docker compose -f "${compose}" exec --no-TTY gateway \
              crab-s3-gateway --config /etc/crab/s3-gateway.toml --readiness-check; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "replacement Compose gateway did not become ready" >&2
              exit 1
            fi
            sleep 1
          done
          test "$(aws --endpoint-url "${compose_endpoint}" s3api list-parts \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            --upload-id "${compose_upload_id}" --query 'length(Parts)' --output text)" = 1
          aws --endpoint-url "${compose_endpoint}" s3api upload-part \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            --upload-id "${compose_upload_id}" --part-number 2 \
            --body "${compose_client}/part-2.bin" >/dev/null
          aws --endpoint-url "${compose_endpoint}" s3api list-parts \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            --upload-id "${compose_upload_id}" \
            --query '{Parts: Parts[].{ETag: ETag, PartNumber: PartNumber}}' \
            > "${compose_client}/completion.json"
          aws --endpoint-url "${compose_endpoint}" s3api complete-multipart-upload \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            --upload-id "${compose_upload_id}" \
            --multipart-upload "file://${compose_client}/completion.json" >/dev/null
          aws --endpoint-url "${compose_endpoint}" s3api get-object \
            --bucket "${compose_bucket}" --key "${compose_key}" \
            "${compose_client}/result.bin" >/dev/null
          cmp <(cat "${compose_client}/part-1.bin" "${compose_client}/part-2.bin") \
            "${compose_client}/result.bin"
          aws --endpoint-url "${compose_endpoint}" s3api delete-object \
            --bucket "${compose_bucket}" --key "${compose_key}" >/dev/null
          docker compose -f "${compose}" stop gateway

      - name: Print service logs after failure
        if: failure()
        run: |
          docker logs crab-s3-gateway 2>&1 || true
          docker logs crab-s3-gateway-rustfs 2>&1 || true

      - name: Clean up services
        if: always()
        env:
          CRAB_S3_GATEWAY_CONFIG: ${{ github.workspace }}/crates/crab-s3-gateway/deploy/compose.gateway.toml
          CRAB_S3_GATEWAY_IMAGE: crab-s3-gateway:test
          CRAB_S3_GATEWAY_SECRET_FILE: ${{ runner.temp }}/crab-s3-gateway/gateway-secret
        run: |
          docker compose -f crates/crab-s3-gateway/deploy/compose.yaml \
            down --volumes >/dev/null 2>&1 || true
          docker rm --force \
            crab-s3-gateway crab-s3-gateway-unready crab-s3-gateway-rustfs \
            >/dev/null 2>&1 || true
          docker network rm crab-s3-gateway-qualification >/dev/null 2>&1 || true
