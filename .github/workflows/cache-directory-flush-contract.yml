name: Cache durable directory recovery
on:
  push:
    branches: [codex/cache-directory-flush-contract]
permissions:
  contents: read
concurrency:
  group: cache-directory-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    name: Directory recovery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated test directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-directory-recovery-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Test durable cache ownership
        run: |
          for filter in catalog:: local_cache::tests xet_chunk_cache::tests clean:: private_fs::platform:: health:: cache_client::completed_body::tests; do
            cargo test --locked -p crab-cache --lib --features local-cache,xet-chunk-cache,remote-client "$filter"
          done
