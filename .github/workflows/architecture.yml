name: Architecture Gates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/architecture.yml"
      - ".github/workflows/nfs-mount.yml"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crab/Cargo.toml"
      - "crab/Makefile"
      - "crab/deploy/auth-service/**"
      - "crab/docs/architecture/multi-crate-transition.md"
      - "crab/scripts/check-architecture-gates.py"
      - "crab/scripts/test_check_architecture_gates.py"
      - "crab/scripts/release/check-auth-helper-packaging.py"
      - "crab/scripts/check-crate-behavior.py"
      - "crab/scripts/check-crab-types-admission.py"
      - "crab/scripts/check-crate-interface-builds.py"
      - "crab/scripts/check-sdk-features.py"
      - "crab/scripts/tests/test_check_sdk_features.py"
      - "crab/scripts/check-final-integration.py"
      - "crab/scripts/release/check-install-layout.py"
      - "crab/scripts/release/check-release-archive-contents.py"
      - "crab/scripts/release/generate-release-manifest.py"
      - "crab/scripts/release/check-shipped-binary-versions.py"
      - "crab/scripts/release/dispatch-nfs-release-evidence.sh"
      - "crab/scripts/release/docker/Dockerfile.linux-aarch64"
      - "crab/scripts/release/docker/Dockerfile.linux-x86_64"
      - "crab/scripts/docker/run-mount-nfs-linux-smoke.sh"
      - "crab/scripts/release/install-binaries.py"
      - "crab/scripts/nfs-evidence-summary.py"
      - "crab/scripts/nfs-read-path-bench-report.py"
      - "crab/scripts/release/release.sh"
      - "crab/scripts/run-mount-nfs-macos-smoke.sh"
      - "crab/scripts/run-mount-nfs-windows-smoke.ps1"
      - "crab/scripts/release/seed-homebrew-tap.sh"
      - "crab/scripts/release/update-homebrew.sh"
      - "crab/scripts/verify-nfs-smoke-report.py"
      - "crates/**"
  pull_request:
    paths:
      - ".github/workflows/architecture.yml"
      - ".github/workflows/nfs-mount.yml"
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crab/Cargo.toml"
      - "crab/Makefile"
      - "crab/deploy/auth-service/**"
      - "crab/docs/architecture/multi-crate-transition.md"
      - "crab/scripts/check-architecture-gates.py"
      - "crab/scripts/test_check_architecture_gates.py"
      - "crab/scripts/release/check-auth-helper-packaging.py"
      - "crab/scripts/check-crate-behavior.py"
      - "crab/scripts/check-crab-types-admission.py"
      - "crab/scripts/check-crate-interface-builds.py"
      - "crab/scripts/check-sdk-features.py"
      - "crab/scripts/tests/test_check_sdk_features.py"
      - "crab/scripts/check-final-integration.py"
      - "crab/scripts/release/check-install-layout.py"
      - "crab/scripts/release/check-release-archive-contents.py"
      - "crab/scripts/release/generate-release-manifest.py"
      - "crab/scripts/release/check-shipped-binary-versions.py"
      - "crab/scripts/release/dispatch-nfs-release-evidence.sh"
      - "crab/scripts/release/docker/Dockerfile.linux-aarch64"
      - "crab/scripts/release/docker/Dockerfile.linux-x86_64"
      - "crab/scripts/docker/run-mount-nfs-linux-smoke.sh"
      - "crab/scripts/release/install-binaries.py"
      - "crab/scripts/nfs-evidence-summary.py"
      - "crab/scripts/nfs-read-path-bench-report.py"
      - "crab/scripts/release/release.sh"
      - "crab/scripts/run-mount-nfs-macos-smoke.sh"
      - "crab/scripts/run-mount-nfs-windows-smoke.ps1"
      - "crab/scripts/release/seed-homebrew-tap.sh"
      - "crab/scripts/release/update-homebrew.sh"
      - "crab/scripts/verify-nfs-smoke-report.py"
      - "crates/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  architecture:
    name: Multi-crate guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run architecture checks
        working-directory: crab
        run: make architecture-check

      - name: Check SDK dependency boundaries
        run: |
          python3 -m unittest discover -s crab/scripts/tests -p test_check_sdk_features.py
          python3 crab/scripts/check-sdk-features.py

  # Split-crate checks reuse library artifacts; binary and integration checks share
  # executable builds. Two cohorts retain parallel feedback without duplicate targets.
  split-crate-contracts:
    name: Split-crate contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libfuse3-dev

      - name: Run split-crate interface checks
        id: crate_interfaces
        continue-on-error: true
        working-directory: crab
        run: make crate-interface-check

      - name: Run split-crate behavior checks
        id: crate_behavior
        continue-on-error: true
        working-directory: crab
        run: make crate-behavior-check

      - name: Run split-crate clippy checks
        id: split_crate_clippy
        continue-on-error: true
        working-directory: crab
        run: make split-crate-clippy-check

      - name: Run split-crate test checks
        id: split_crate_tests
        continue-on-error: true
        working-directory: crab
        run: make split-crate-test-check

      - name: Fail when a split-crate contract failed
        if: >-
          always() &&
          (steps.crate_interfaces.outcome != 'success' ||
           steps.crate_behavior.outcome != 'success' ||
           steps.split_crate_clippy.outcome != 'success' ||
           steps.split_crate_tests.outcome != 'success')
        run: exit 1

  cell-runtime-rustfs:
    name: Server, Cell and LTX RustFS recovery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: crab
      AWS_SECRET_ACCESS_KEY: crab
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: true
      CRAB_LTX_TEST_BUCKET: crab-cell-runtime
      CRAB_LTX_TEST_ENDPOINT: http://127.0.0.1:9000
      CRAB_CELL_TEST_BUCKET: crab-cell-runtime
      CRAB_CELL_TEST_ENDPOINT: http://127.0.0.1:9000
      CRAB_CELL_TEST_PREFIX: cell-${{ github.run_id }}-${{ github.run_attempt }}
      CRAB_HTTP_CELL_TEST_BUCKET: crab-cell-runtime
      CRAB_HTTP_CELL_TEST_ENDPOINT: http://127.0.0.1:9000
      CRAB_HTTP_CELL_TEST_PREFIX: server-${{ github.run_id }}-${{ github.run_attempt }}
      RUSTFS_IMAGE: rustfs/rustfs:1.0.0-beta.8-glibc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up repository frontend toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Build embedded repository frontend
        run: |
          npm ci --prefix packages/ui
          npm run build --prefix packages/ui

      - name: Install AWS CLI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pipx
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: cell-runtime-rustfs

      - name: Start isolated RustFS
        run: |
          set -euo pipefail
          data_root="${RUNNER_TEMP}/cell-runtime-rustfs"
          mkdir -p "$data_root"
          sudo chown 10001:10001 "$data_root"
          docker run -d --name cell-runtime-rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=crab -e RUSTFS_SECRET_KEY=crab \
            -v "$data_root:/data" \
            "$RUSTFS_IMAGE" server /data --address :9000
          for _ in $(seq 1 90); do
            if aws --endpoint-url "$CRAB_CELL_TEST_ENDPOINT" \
              s3api list-buckets >/dev/null 2>&1; then
              aws --endpoint-url "$CRAB_CELL_TEST_ENDPOINT" \
                s3api create-bucket --bucket "$CRAB_CELL_TEST_BUCKET"
              exit 0
            fi
            sleep 1
          done
          docker logs cell-runtime-rustfs >&2 || true
          exit 1

      - name: Verify canonical LTX and Cell source-loss recovery
        run: |
          cargo test -p crab-ltx --locked --features replica --test cell \
            cell::roots::exact_root_inventory_verifies_every_remote_dependency \
            -- --exact --nocapture
          cargo test -p crab-cell-runtime --locked --test runtime \
            runtime::lifecycle::rustfs_source_loss_takeover_restores_exact_root_and_continues_publication \
            -- --ignored --exact --nocapture
          cargo test -p crab-cell-runtime --locked --lib \
            retention::tests::rustfs_maintenance_collection_preserves_live_and_pinned_graphs \
            -- --ignored --exact --nocapture
          cargo test -p crab-http-server --locked --lib \
            server::peer_e2e_tests::rustfs_public_collaboration_reaches_remote_owner_and_publishes_ltx \
            -- --ignored --exact --nocapture
          cargo test -p crab-http-server --release --locked --test public_cell_qualification \
            rustfs_public_cell_node_runs_typed_primitive_workload \
            -- --ignored --exact --nocapture
          cargo test -p crab-http-server --locked --test public_cell_process_fault \
            -- --ignored --nocapture
          cargo test -p crab-http-server --locked \
            --test public_cell_response_loss --test public_cell_retry \
            -- --ignored --nocapture
          cargo test -p crab-http-server --locked --test public_cell_activity_retry \
            -- --ignored --nocapture
          cargo test -p crab-http-server --locked --test public_cell_cancellation \
            -- --ignored --nocapture
          cargo test -p crab-http-server --locked --test public_cell_data_cancellation \
            -- --ignored --nocapture
          cargo test -p crab-http-server --locked --test public_cell_activity_cancellation \
            -- --ignored --nocapture
          cargo test -p crab-http-server --locked --test public_cell_effect_delivery_cancellation \
            -- --ignored --nocapture
          cargo test -p crab-http-server --locked --test public_cell_lease_expiry \
            -- --ignored --nocapture

  binary-contracts:
    name: Binary and integration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y libfuse3-dev

      - name: Run shipped binary version checks
        id: shipped_binary_versions
        continue-on-error: true
        working-directory: crab
        run: make shipped-binary-version-check

      - name: Run install layout check
        id: install_layout
        continue-on-error: true
        working-directory: crab
        run: make install-layout-check

      - name: Run final integration checks
        id: final_integration
        continue-on-error: true
        working-directory: crab
        run: make final-integration-check

      - name: Fail when a binary or integration contract failed
        if: >-
          always() &&
          (steps.shipped_binary_versions.outcome != 'success' ||
           steps.install_layout.outcome != 'success' ||
           steps.final_integration.outcome != 'success')
        run: exit 1

  auth-helper-packaging:
    name: Auth helper packaging check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run auth helper packaging check
        working-directory: crab
        run: make auth-helper-packaging-check

  auth-python-tests:
    name: Auth Python service tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install auth service dependencies
        working-directory: crab/deploy/auth-service
        run: python -m pip install -r requirements.txt

      - name: Run auth service tests
        working-directory: crab/deploy/auth-service
        run: python -m pytest tests/ -q

  release-archive-contents:
    name: Release archive contents check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release archive contents check
        working-directory: crab
        run: make release-archive-contents-check
