name: Desktop shared cache ownership probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-cache-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    name: Cache ownership (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated test directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-cache-recovery-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Test shared root cache ownership
        run: |
          for filter in catalog:: local_cache::tests xet_chunk_cache::tests clean:: private_fs::platform:: health:: cache_client::completed_body::tests; do
            cargo test --locked -p crab-cache --lib --features local-cache,xet-chunk-cache,remote-client "$filter"
          done
