name: Desktop v2
on:
  pull_request:
    branches: [main, crab-v2]
    paths: ['packages/desktop/**', 'crab/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/desktop.yml']
  push:
    branches: [main, crab-v2]
    paths: ['packages/desktop/**', 'crab/**', 'crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/desktop.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      source_ref:
        type: string
      version:
        type: string
    secrets:
      MAC_CSC_LINK:
        required: false
      MAC_CSC_KEY_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WIN_CSC_LINK:
        required: false
      WIN_CSC_KEY_PASSWORD:
        required: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Native runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: mac-arm64 }
          - { os: macos-15-intel, target: mac-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-2022, target: win-x64 }
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Set isolated Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-native-runtime-target" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build the matching native CLI and sidecar
        run: node scripts/build-native.mjs
      - name: Test native desktop integration
        # Compilation, real CLI tests and Linux tests share the producer toolchain.
        run: node scripts/build-native.mjs --test
      - name: Test workflow execution contracts
        run: |
          cargo test --release -p crab-workflow --locked --lib
          cargo test --release -p crab --locked --no-default-features --lib cmd::run::tests::sole_workflow_file_keeps_discovery_target_identity
      - name: Qualify Linux runtime ABI and repository operations
        if: runner.os == 'Linux'
        run: node scripts/qualify-linux-runtime.mjs
      - name: Install SSH runtime qualification dependencies
        if: runner.os != 'Windows'
        run: npm ci --ignore-scripts
      - name: Qualify native SSH runtime download, upload and startup
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/crab-ssh-runtime"
          CRAB_AGENT_LIVE_ROOT="$RUNNER_TEMP/crab-ssh-runtime" npx vitest run tests/ssh-deployer.spec.ts --maxWorkers 1
      - uses: actions/upload-artifact@v4
        with:
          name: Crab-native-${{ matrix.target }}
          path: packages/desktop/resources/native/${{ matrix.target }}/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: Crab-remote-runtime-${{ runner.os }}-${{ runner.arch }}
          path: packages/desktop/release/remote-runtime/*
          if-no-files-found: error
  build:
    needs: runtime
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Electron's node-gyp recognizes Visual Studio 2022, not the 2026 toolset.
        include:
          - { os: macos-15, target: mac-arm64 }
          - { os: macos-15-intel, target: mac-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: windows-2022, target: win-x64 }
    env:
      CARGO_INCREMENTAL: 0
      # Every release channel needs a stable signing identity for auto-updates.
      SIGN_RELEASE: ${{ inputs.release }}
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.release && 'true' || 'false' }}
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Set isolated Cargo target directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-desktop-target" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Install Linux build and Electron dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 xvfb tmux
      - name: Install macOS SSH terminal test dependency
        if: runner.os == 'macOS'
        run: command -v tmux || brew install tmux
      - name: Install desktop dependencies
        # Electron's install script downloads its runtime outside npm's cache.
        run: npm ci || npm ci
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-${{ matrix.target }}
          path: packages/desktop/resources/native/${{ matrix.target }}/
      - uses: actions/download-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: Crab-remote-runtime-${{ runner.os }}-${{ runner.arch }}
          path: packages/desktop/release/remote-runtime/
      - name: Restore native executable permissions
        if: runner.os != 'Windows'
        run: chmod +x resources/native/${{ matrix.target }}/{crab,crab-nfs-mount,crab-desktop-agent,git-remote-crab}
      - name: Validate release version
        if: ${{ inputs.release }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const p = require("./package.json"); if (!process.env.RELEASE_VERSION || p.version !== process.env.RELEASE_VERSION) { throw new Error("Desktop version does not match release tag"); }'
      - name: Require macOS signing and notarization credentials
        if: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'macOS' }}
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then echo "::error::$name is required for desktop release signing."; exit 1; fi
          done
      - name: Require Windows signing credentials
        if: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'Windows' }}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          for name in WIN_CSC_LINK WIN_CSC_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "::error::$name is required for desktop release signing."; exit 1; fi
          done
      - run: npm run typecheck
      - run: npm run test:build
      - name: Qualify repository sidebar scroll persistence
        run: |
          mkdir -p "$RUNNER_TEMP/crab-sidebar-scroll"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a env CRAB_AGENT_LIVE_ROOT="$RUNNER_TEMP/crab-sidebar-scroll" npm test -- tests/sidebar-scroll-live.spec.ts --maxWorkers 1
          else
            CRAB_AGENT_LIVE_ROOT="$RUNNER_TEMP/crab-sidebar-scroll" npm test -- tests/sidebar-scroll-live.spec.ts --maxWorkers 1
          fi
      - name: Qualify local native process group ownership
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/crab-native-owner"
          CRAB_AGENT_LIVE_ROOT="$RUNNER_TEMP/crab-native-owner" npm test -- tests/agent-process-live.spec.ts
      - name: Build desktop application
        run: npm run build:renderer && npm run build:electron
      - name: Qualify terminal rendering and recovery
        # The recovery fixture uses POSIX shells and process probes.
        if: runner.os != 'Windows'
        run: |
          export E2E_SMOKE=1
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npx playwright test tests/e2e/terminal-recovery.spec.ts --project=e2e-smoke --workers=1
          else
            npx playwright test tests/e2e/terminal-recovery.spec.ts --project=e2e-smoke --workers=1
          fi
      - name: Qualify selected Apply through the task view
        run: |
          mkdir -p "$RUNNER_TEMP/crab-selected-apply"
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a env CRAB_AGENT_LIVE_ROOT="$RUNNER_TEMP/crab-selected-apply" npm test -- tests/selected-apply-live.spec.ts --maxWorkers 1
          else
            CRAB_AGENT_LIVE_ROOT="$RUNNER_TEMP/crab-selected-apply" npm test -- tests/selected-apply-live.spec.ts --maxWorkers 1
          fi
      - name: Qualify checkpoint ownership and remote availability
        if: runner.os != 'Windows'
        run: |
          mkdir -p "$RUNNER_TEMP/crab-native-task"
          CRAB_AGENT_LIVE_ROOT="$RUNNER_TEMP/crab-native-task" npm test -- tests/remote-native-task-live.spec.ts -t 'checkpoint|availability|apply-source|apply-target|apply-eof|apply-sidecar-kill'
          CRAB_AGENT_LIVE_ROOT="$RUNNER_TEMP/crab-native-task" npm test -- tests/remote-endpoint-live.spec.ts --maxWorkers 1
      - name: Build installers and unpacked application
        env:
          CSC_LINK: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'Windows' && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          RELEASE_BUILD: ${{ env.SIGN_RELEASE }}
        run: |
          if [ "$RELEASE_BUILD" = true ] && [ "$RUNNER_OS" != Linux ]; then
            node scripts/package.mjs --config.forceCodeSigning=true
          else
            # Empty certificate links are imported as the working directory.
            # Unsigned builds must omit signing inputs entirely.
            unset CSC_LINK CSC_KEY_PASSWORD WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            # Installer tools are downloaded separately from the npm dependencies.
            node scripts/package.mjs || node scripts/package.mjs
          fi
      - name: Verify signed and notarized macOS application
        if: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'macOS' }}
        run: |
          app="release/mac${{ runner.arch == 'ARM64' && '-arm64' || '' }}/Crab.app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
      - name: Verify signed Windows installer and updater publisher
        if: ${{ env.SIGN_RELEASE == 'true' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/Crab-*-win-x64.exe | Select-Object -First 1
          if (-not $installer -or (Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') {
            throw 'Desktop installer is missing a valid Authenticode signature.'
          }
          node -e "const fs=require('fs'), yaml=require('yaml'); const config=yaml.parse(fs.readFileSync('release/win-unpacked/resources/app-update.yml','utf8')); if (!config.publisherName || !config.publisherName.length) throw Error('Updater publisher identity is missing');"
      - name: Smoke packaged Electron and the real sidecar
        if: matrix.os == 'macos-15-intel'
        run: npm run test:e2e-smoke
      - name: Smoke packaged Electron under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e-smoke
      - name: Qualify complex workflows in packaged Electron
        run: |
          export E2E_SMOKE=1
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npx playwright test tests/e2e/workflow-complex.spec.ts --project=e2e-smoke --workers=1
          else
            npx playwright test tests/e2e/workflow-complex.spec.ts --project=e2e-smoke --workers=1
          fi
      - name: Qualify captured database queries in packaged Electron
        run: |
          export E2E_SMOKE=1
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npx playwright test tests/e2e/file-query.spec.ts --project=e2e-smoke --workers=1
          else
            npx playwright test tests/e2e/file-query.spec.ts --project=e2e-smoke --workers=1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install kernel qualification runtime
        run: python -m pip install jupyter_client==8.6.3 ipykernel==6.29.5 jupyter_server==2.17.0
      - name: Qualify packaged notebook execution and cleanup
        run: |
          CRAB_TEST_JUPYTER_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export CRAB_TEST_JUPYTER_PYTHON
          export E2E_SMOKE=1
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a npx playwright test tests/e2e/notebook-kernel.spec.ts tests/e2e/notebook-remote-kernel.spec.ts --project=e2e-smoke --workers=1
          else
            npx playwright test tests/e2e/notebook-kernel.spec.ts tests/e2e/notebook-remote-kernel.spec.ts --project=e2e-smoke --workers=1
          fi
      - name: Install isolated storage qualification tools
        if: matrix.os == 'macos-15' || runner.os == 'Windows'
        run: python -m pip install awscli
      - name: Qualify native v2 storage through the packaged app
        if: matrix.os == 'macos-15' || runner.os == 'Windows'
        run: python scripts/qualify-v2.py
      - uses: actions/upload-artifact@v4
        with:
          name: Crab-desktop-${{ runner.os }}-${{ runner.arch }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.zip
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb
            packages/desktop/release/*.exe
            packages/desktop/release/*.blockmap
            packages/desktop/release/latest*.yml
            packages/desktop/release/alpha*.yml
            packages/desktop/release/beta*.yml
            packages/desktop/release/rc*.yml
          if-no-files-found: error
      - name: Broad desktop regression suite
        run: CRAB_TEST_JUPYTER_PYTHON="$(python -c 'import sys; print(sys.executable)')" npm test -- --maxWorkers 2 --minWorkers 1
      - name: Retain packaged app failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Crab-desktop-failure-${{ runner.os }}-${{ runner.arch }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            packages/desktop/test-results/**/error-context.md
            packages/desktop/test-results/**/*.png
