name: Desktop v2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-publication-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication:
    name: Windows publication probe
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated probe directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-publication-probe-target" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Prepare probe directory
        run: mkdir -p "$CARGO_TARGET_DIR"
      - name: Qualify publication semantics
        run: node scripts/qualify-publication.mjs
