name: Desktop v2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-publication-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication:
    name: Windows restoration and scratch ownership
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
      - name: Set isolated test directory
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-restoration-test-target" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Test captured index restoration
        run: cargo test --release --locked -p crab-desktop-agent repository::content::restore::tests -- --test-threads=1
      - name: Test publication workspace ownership
        run: cargo test --release --locked -p crab-desktop-agent repository::content::workspace::tests -- --test-threads=1
