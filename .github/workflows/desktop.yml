name: Desktop v2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-intel-sftp-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sftp:
    name: Intel SFTP transport qualification
    runs-on: macos-15-intel
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - name: Install locked transport dependencies
        run: npm ci --ignore-scripts
      - name: Qualify real SFTP transport
        run: npx vitest run tests/ssh-deployer.spec.ts --maxWorkers 1
