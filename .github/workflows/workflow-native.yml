name: Alpha Windows storage qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  notebook:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e77cd860de6ab3bf934ba04f3100d9e959ea6f2a
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - name: Set private qualification paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-notebook-target" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/crab-notebook-target"
      - uses: actions/download-artifact@v4
        with:
          name: alpha2-windows-quoted-native
          path: packages/desktop/resources/native/win-x64
          run-id: 44543250890
          github-token: ${{ github.token }}
      - name: Install desktop dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned notebook runtime
        run: |
          python -m pip install awscli jupyter_client==8.6.3 ipykernel==6.29.5 jupyter_server==2.17.0
          echo "CRAB_TEST_JUPYTER_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Build exact current application
        run: |
          npm run build:renderer
          npm run build:electron
          node scripts/package.mjs --dir --publish never
      - name: Verify actual Electron PID and save permissions
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const { _electron: electron } = require('@playwright/test');
          (async () => {
            const root = fs.mkdtempSync(path.join(process.env.CARGO_TARGET_DIR, 'platform-contract-'));
            const source = path.join(root, 'source');
            fs.mkdirSync(source);
            const target = path.join(source, 'note.md');
            fs.writeFileSync(target, 'original');
            let app;
            try {
              app = await electron.launch({ executablePath: path.resolve('release/win-unpacked/Crab.exe'), args: [`--user-data-dir=${path.join(root, 'profile')}`] });
              const mainPid = await app.evaluate(() => process.pid);
              const launcherPid = app.process().pid;
              const write = text => app.evaluate(async ({ app }, { target, text }) => {
                const load = process.getBuiltinModule('module').createRequire(app.getAppPath() + '/package.json');
                try { return { bytes: await load('./dist-electron/file-write.cjs').writeTextAtomically(target, text) }; }
                catch (error) { return { code: error.code, message: error.message }; }
              }, { target, text });
              fs.chmodSync(source, 0o500);
              const directoryMode = await write('directory mode does not deny Windows writes');
              assert.equal(directoryMode.bytes, 43);
              fs.chmodSync(source, 0o700);
              fs.chmodSync(target, 0o444);
              const readOnlyFile = await write('must fail');
              assert.equal(readOnlyFile.code, 'EACCES');
              assert.equal(fs.readFileSync(target, 'utf8'), 'directory mode does not deny Windows writes');
              fs.chmodSync(target, 0o644);
              const retry = await write('retry saved');
              assert.equal(retry.bytes, 11);
              assert.equal(fs.readFileSync(target, 'utf8'), 'retry saved');
              assert.notEqual(mainPid, launcherPid);
              const closed = app.waitForEvent('close');
              process.kill(mainPid, 'SIGKILL');
              await closed;
              app = undefined;
              fs.writeFileSync('windows-platform-contracts.json', JSON.stringify({ mainPid, launcherPid, directoryMode, readOnlyFile, retry, closeAfterMainPidKill: true }, null, 2));
            } finally {
              fs.chmodSync(source, 0o700);
              fs.chmodSync(target, 0o644);
              await app?.close();
              fs.rmSync(root, { recursive: true, force: true });
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-windows-platform-contracts-proof
          path: |
            packages/desktop/windows-platform-contracts.json
            packages/desktop/windows-observation.log
            packages/desktop/test-results/**
