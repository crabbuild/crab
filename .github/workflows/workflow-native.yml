name: Alpha Windows canonical path contract
'on':
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: fbde2ccd9b5b5e9cea97675eb3cf33ce1b3b7702
    - uses: dtolnay/rust-toolchain@stable
    - name: Extract actual parent guard for a standard-library filesystem probe
      shell: bash
      run: 'python - <<''PYCODE''

        from pathlib import Path

        import os

        source = Path("crates/crab-workflow/src/atomic.rs").read_text()

        start = source.index("pub(crate) fn ensure_parent_not_symlink")

        guard = source[start:].split("\n}\n", 1)[0] + "\n}\n"

        needle = "        current.push(component.as_os_str());"

        assert guard.count(needle) == 1

        fixed = guard.replace(needle, needle + "\n        if matches!(component, Component::Prefix(_)) { continue; }")

        guards = "mod baseline { use super::*;\n" + guard + "}\nmod candidate { use super::*;\n" + fixed + "}\n"

        program = ''use std::{fs, path::{Component, Path, PathBuf}};\n#[derive(Debug)]\nenum WorkflowError { Io(std::io::Error), YamlInvalid { key: String, origin:
        String } }\ntype Result<T> = std::result::Result<T, WorkflowError>;\n__GUARDS__\n#[test]\nfn canonical_windows_parent_walk() {\n    let root = std::env::temp_dir().join(format!("crab-prefix-contract-{}",
        std::process::id()));\n    fs::create_dir(&root).unwrap();\n    let canonical = fs::canonicalize(&root).unwrap();\n    println!("canonical={canonical:?}");\n    let
        mut accumulated = PathBuf::new();\n    for component in canonical.components() {\n        accumulated.push(component.as_os_str());\n        println!("component={component:?}
        metadata={:?}", fs::symlink_metadata(&accumulated).map(|m| m.is_dir()).map_err(|e| e.raw_os_error()));\n    }\n    let destination = canonical.join(".crab").join("workflow").join("results").join("objects");\n    let
        before = baseline::ensure_parent_not_symlink(&destination);\n    println!("baseline={before:?}");\n    let after = candidate::ensure_parent_not_symlink(&destination);\n    println!("candidate={after:?}");\n    fs::remove_dir(&root).unwrap();\n    assert!(matches!(before,
        Err(WorkflowError::Io(error)) if error.raw_os_error() == Some(1)));\n    after.unwrap();\n}\n''

        Path(os.environ["RUNNER_TEMP"], "prefix-probe.rs").write_text(program.replace("__GUARDS__", guards))

        PYCODE

        '
    - name: Compare incomplete prefixes and complete rooted paths
      shell: pwsh
      run: 'rustc --test (Join-Path $env:RUNNER_TEMP "prefix-probe.rs") -o (Join-Path $env:RUNNER_TEMP "prefix-probe.exe")

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        & (Join-Path $env:RUNNER_TEMP "prefix-probe.exe") --nocapture 2>&1 | Tee-Object -FilePath "windows-prefix-proof.txt"

        exit $LASTEXITCODE

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: alpha2-windows-canonical-path-proof
        path: 'windows-prefix-proof.txt

          ${{ runner.temp }}/prefix-probe.rs'
        if-no-files-found: error
