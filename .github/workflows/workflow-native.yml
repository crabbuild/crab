name: Workflow native execution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fs-proof:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8bbceef61a0772b880b5c9b4f80aea954db37d31
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - name: Install the exact Electron runtime without native modules
        run: npm install --ignore-scripts --prefix "$RUNNER_TEMP/crab-fs-probe" electron@45.2.3
      - name: Compare synchronous and asynchronous owned cleanup
        run: |
          mkdir -p "$RUNNER_TEMP/crab-fs-proof"
          export CRAB_FS_PROOF_ROOT="$RUNNER_TEMP/crab-fs-proof"
          cat > "$RUNNER_TEMP/crab-fs-contract.cjs" <<'JS'
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict'),{execFileSync}=require('node:child_process');
          (async()=>{
           for(const kind of ['readonly-file','git-repository']){
            const root=fs.mkdtempSync(path.join(process.env.CRAB_FS_PROOF_ROOT,kind+'-'));
            if(kind==='readonly-file'){const file=path.join(root,'owned.txt');fs.writeFileSync(file,'OWNED');fs.chmodSync(file,0o444);}
            else{
             const git=args=>execFileSync('git',args,{cwd:root,stdio:'pipe'});
             git(['init','--quiet','--template=','--initial-branch=main']);
             git(['-c','user.name=Fixture','-c','user.email=fixture@example.invalid','-c','commit.gpgSign=false','commit','--quiet','--allow-empty','-m','Owned fixture']);
            }
            let synchronousError;
            try{fs.rmSync(root,{recursive:true,force:true})}catch(error){synchronousError={code:error.code,message:error.message};}
            const remaining=[];
            const walk=file=>{if(!fs.existsSync(file))return;const st=fs.lstatSync(file);remaining.push({file:path.relative(root,file),mode:st.mode});if(st.isDirectory())for(const child of fs.readdirSync(file))walk(path.join(file,child));};
            walk(root);
            await fs.promises.rm(root,{recursive:true,force:true});
            assert.equal(fs.existsSync(root),false);
            const record={version:process.version,electron:process.versions.electron,kind,synchronousError,remaining,asynchronousCleanup:true};
            fs.appendFileSync(path.join(process.env.CRAB_FS_PROOF_ROOT,'results.jsonl'),JSON.stringify(record)+'\n');
            console.log('[FS-PROOF]',JSON.stringify(record));
           }
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
          node "$RUNNER_TEMP/crab-fs-contract.cjs"
          ELECTRON_RUN_AS_NODE=1 node -e 'const req=require("node:module").createRequire(require("node:path").join(process.argv[1],"package.json"));const child=require("node:child_process").spawnSync(req("electron"),[process.argv[2]],{env:process.env,stdio:"inherit"});if(child.error)throw child.error;process.exitCode=child.status??1' "$RUNNER_TEMP/crab-fs-probe" "$RUNNER_TEMP/crab-fs-contract.cjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-windows-filesystem-contract
          path: ${{ runner.temp }}/crab-fs-proof/results.jsonl
          retention-days: 7
