name: Workflow native execution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  broad:
    name: Windows native ownership diagnosis (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win-x64
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8bbceef61a0772b880b5c9b4f80aea954db37d31
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set private native fixture directory
        run: |
          mkdir -p "$RUNNER_TEMP/crab-broad-suite"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-broad-suite" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-${{ matrix.target }}
          run-id: 44249218814
          github-token: ${{ github.token }}
          path: packages/desktop/resources/native/${{ matrix.target }}
      - uses: actions/download-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: Crab-remote-runtime-${{ runner.os }}-${{ runner.arch }}
          run-id: 44249218814
          github-token: ${{ github.token }}
          path: packages/desktop/release/remote-runtime/
      - name: Restore producer permissions and terminal dependency
        if: runner.os != 'Windows'
        run: |
          chmod +x resources/native/${{ matrix.target }}/{crab,crab-nfs-mount,crab-desktop-agent,git-remote-crab}
          command -v tmux || brew install tmux
      - run: npm ci
      - name: Build Electron modules
        run: npm run build:electron
      - name: Observe file publication and SQLite handle ownership
        run: |
          cat > "$RUNNER_TEMP/crab-native-state.cjs" <<'JS'
          const fs=require('node:fs'), Module=require('node:module'), load=Module._load;
          const records=[];
          const tracked = file => /crab-(orch-ui-state-test|goal-contract)-/.test(String(file));
          const record = (db,args,kind) => {
            const file=String(args[0]); if(!tracked(file))return db;
            const entry={file,kind,db,closes:0,stack:new Error().stack};records.push(entry);
            const close=db.close;
            db.close=function(){entry.closes++;return close.apply(this,arguments)};
            return db;
          };
          const wrappers=new Map();
          Module._load=function(name,...args){
            const value=load.call(this,name,...args);
            if(name==='better-sqlite3'){
              if(!wrappers.has(value))wrappers.set(value,new Proxy(value,{construct(target,args,newTarget){try{return record(Reflect.construct(target,args,newTarget),args,'better-sqlite3')}catch(error){console.error('[DEBUG-db-constructor]',error.message);throw error}}}));
              return wrappers.get(value);
            }
            return value;
          };
          function snapshot(file,error){
           if(!tracked(file))return;
           const remaining=[];
           function walk(file,depth){if(remaining.length>=40)return;try{const st=fs.lstatSync(file);remaining.push({file,mode:st.mode,directory:st.isDirectory()});if(depth&&st.isDirectory()&&!st.isSymbolicLink())for(const child of fs.readdirSync(file))walk(require('node:path').join(file,child),depth-1)}catch(cause){remaining.push({file,error:cause.code})}}
           walk(String(file),5);
           console.error('[DEBUG-db-cleanup]',JSON.stringify({file,error:error.code,databases:records.filter(r=>r.file.startsWith(String(file))).map(r=>({file:r.file,kind:r.kind,open:r.db.open,closes:r.closes,stack:r.stack})),remaining,handles:process._getActiveHandles().map(x=>x.constructor.name)}));
          }
          const rmSync=fs.rmSync;fs.rmSync=function(file,...args){try{return rmSync.call(this,file,...args)}catch(error){snapshot(file,error);throw error}};
          const rm=fs.promises.rm;fs.promises.rm=async function(file,...args){try{return await rm.call(this,file,...args)}catch(error){snapshot(file,error);throw error}};
          JS
          cat > "$RUNNER_TEMP/crab-rename-contract.cjs" <<'JS'
          const fs=require('node:fs'), path=require('node:path');
          (async()=>{
           const root=fs.mkdtempSync(path.join(process.env.CARGO_TARGET_DIR,'node-publication-'));
           const target=path.join(root,'old.txt'),temporary=path.join(root,'new.txt');
           let reader;
           try{
            fs.writeFileSync(target,'ORIGINAL',{mode:0o751});fs.writeFileSync(temporary,'REPLACEMENT');
            reader=await fs.promises.open(target,'r');
            let error;
            try{await fs.promises.rename(temporary,target)}catch(cause){error=cause.code}
            console.log('[DEBUG-rename-contract]',JSON.stringify({version:process.version,uv:process.versions.uv,electron:process.versions.electron,error,captured:await reader.readFile('utf8'),target:fs.readFileSync(target,'utf8')}));
            await reader.close();reader=undefined;
            if(error){await fs.promises.rename(temporary,target);console.log('[DEBUG-rename-retry]',fs.readFileSync(target,'utf8'));}
           }finally{await reader?.close();fs.rmSync(root,{recursive:true,force:true})}
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
          node "$RUNNER_TEMP/crab-rename-contract.cjs"
          crab_probe_electron="$(node -p 'require("electron")')"
          ELECTRON_RUN_AS_NODE=1 "$crab_probe_electron" "$RUNNER_TEMP/crab-rename-contract.cjs"
      - name: Run unchanged Windows ownership tests
        continue-on-error: true
        run: NODE_OPTIONS="--require=$RUNNER_TEMP/crab-native-state.cjs" npm test -- tests/local-file-write.spec.ts tests/orchestrator-goals.spec.ts tests/orchestrator-ui-state.spec.ts tests/orchestrator-diff.spec.ts --maxWorkers 1 --reporter=json --outputFile=windows-contract-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-windows-ownership-diagnosis
          path: packages/desktop/windows-contract-report.json
          retention-days: 7
