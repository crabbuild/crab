      - name: Build application source
        run: npm run build:renderer && npm run build:electron
      - name: Install same kernel qualification runtime
        run: python -m pip install jupyter_client==8.6.3 ipykernel==6.29.5 jupyter_server==2.17.0
      - name: Run complete broad suite with supported worker argument
        run: CRAB_TEST_JUPYTER_PYTHON="$(python -c 'import sys; print(sys.executable)')" npm test -- --maxWorkers 2
