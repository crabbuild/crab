name: Alpha Windows storage qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  notebook:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd249ad5e42141269aa18041333cb703d7a32672
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - name: Set private qualification paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-notebook-target" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/crab-notebook-target"
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-win-x64
          path: packages/desktop/resources/native/win-x64
          run-id: 44455996465
          github-token: ${{ github.token }}
      - name: Install desktop dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned notebook runtime
        run: |
          python -m pip install awscli jupyter_client==8.6.3 ipykernel==6.29.5 jupyter_server==2.17.0
          echo "CRAB_TEST_JUPYTER_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Build exact current application
        run: |
          npm run build:renderer
          npm run build:electron
          node scripts/package.mjs --dir --publish never
      - name: Qualify all unchanged packaged storage scenarios
        run: |
          python -X utf8 - <<'PYCODE' > windows-storage.log 2>&1
          from pathlib import Path
          p = Path("scripts/qualify-v2.py").resolve()
          s = p.read_text()
          a = s.index('                subprocess.run(["cargo", "test"')
          z = s.index('                identity_spec =', a)
          # This diagnostic uses the previously qualified identical Rust source;
          # the current PR still performs its complete native rebuild and tests.
          s = s[:a] + s[z:]
          try:
              exec(compile(s, str(p), "exec"), {"__file__": str(p), "__name__": "__main__"})
          finally:
              import os, shutil
              logs = Path("storage-fixture-command-logs")
              logs.mkdir(exist_ok=True)
              for profile in ("alpha", "beta"):
                  for source in Path(os.environ["RUNNER_TEMP"]).glob(f"r*/{profile}/commands.log"):
                      shutil.copyfile(source, logs / f"{source.parent.parent.name}-{profile}.log")
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-windows-storage-commands-proof
          path: |
            packages/desktop/windows-storage.log
            packages/desktop/storage-fixture-command-logs/*.log
            packages/desktop/test-results/**
