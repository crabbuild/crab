name: Workflow native execution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-readiness:
    name: macOS workflow source readiness diagnosis
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      E2E_SMOKE: 1
      PLAYWRIGHT_JSON_OUTPUT_NAME: workflow-report.json
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 59eb8b383a37b17c5a2ae2679c468b976f5d6b35
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - name: Prepare isolated fixture target
        run: |
          mkdir -p "$RUNNER_TEMP/crab-source-readiness"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-source-readiness" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-mac-arm64
          run-id: 44196737874
          github-token: ${{ github.token }}
          path: packages/desktop/resources/native/mac-arm64
      - name: Restore producer permissions
        run: chmod +x resources/native/mac-arm64/{crab,crab-nfs-mount,crab-desktop-agent,git-remote-crab}
      - name: Install renderer and Electron dependencies
        run: npm ci
      - name: Build the same renderer and packaged application
        run: |
          npm run build:renderer
          npm run build:electron
          node scripts/package.mjs --dir --arm64
      - name: Repeat the unchanged complex workflow scenario
        run: npx playwright test tests/e2e/workflow-complex.spec.ts --project=e2e-smoke --workers=1 --grep "complex workflows preserve templates" --repeat-each=3 --trace retain-on-failure --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-workflow-readiness-diagnosis
          path: |
            packages/desktop/workflow-report.json
            packages/desktop/test-results/**/trace.zip
            packages/desktop/test-results/**/error-context.md
            packages/desktop/test-results/**/*.png
          retention-days: 7
