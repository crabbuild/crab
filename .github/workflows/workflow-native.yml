name: Workflow native execution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  media-readiness:
    name: Linux retained media readiness diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      E2E_SMOKE: 1
      PLAYWRIGHT_JSON_OUTPUT_NAME: media-report.json
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8bbceef61a0772b880b5c9b4f80aea954db37d31
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - name: Prepare Linux and isolated target
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 xvfb
          mkdir -p "$RUNNER_TEMP/crab-media-readiness"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-media-readiness" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-linux-x64
          run-id: 44249218814
          github-token: ${{ github.token }}
          path: packages/desktop/resources/native/linux-x64
      - name: Restore producer permissions
        run: chmod +x resources/native/linux-x64/{crab,crab-nfs-mount,crab-desktop-agent,git-remote-crab}
      - run: npm ci
      - name: Build and package exact source
        run: |
          npm run build:renderer
          npm run build:electron
          node scripts/package.mjs --dir --linux --x64
      - name: Observe media selection and browser state
        run: |
          cat > "$RUNNER_TEMP/media-state.cjs" <<'JS'
          const fs=require('node:fs');
          const req=require('node:module').createRequire(process.cwd()+'/package.json');
          const electron=req('playwright-core')._electron, launch=electron.launch.bind(electron);
          const file=process.env.CARGO_TARGET_DIR+'/media-events.jsonl';
          electron.launch=async function(options){
            const application=await launch(options);
            const page=await application.firstWindow();
            page.on('console',msg=>{if(msg.text().startsWith('[DEBUG-media]'))fs.appendFileSync(file,msg.text().slice(13)+'\n')});
            await page.evaluate(()=>{
              const report=(type,node)=>console.log('[DEBUG-media]'+JSON.stringify({time:Date.now(),type,tag:node.tagName,source:node.getAttribute('src'),current:node.currentSrc,connected:node.isConnected,duration:node.duration,ready:node.readyState,title:document.querySelector('section[aria-label$="preview"] p')?.textContent}));
              for(const type of ['loadedmetadata','durationchange','emptied','loadstart','error','seeked','pause','volumechange']){
                document.addEventListener(type,event=>{if(event.target instanceof HTMLMediaElement)report(type,event.target)},true);
              }
              const time=Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype,'currentTime');
              Object.defineProperty(HTMLMediaElement.prototype,'currentTime',{...time,set(value){report('seek '+String(value),this);return time.set.call(this,value)}});
              document.addEventListener('click',event=>{const row=event.composedPath().find(node=>node instanceof HTMLElement&&node.dataset.itemPath);if(row)console.log('[DEBUG-media]'+JSON.stringify({time:Date.now(),type:'click',file:row.dataset.itemPath}));},true);
              const descriptor=Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype,'duration');
              Object.defineProperty(HTMLMediaElement.prototype,'duration',{...descriptor,get(){const value=descriptor.get.call(this); console.log('[DEBUG-media]'+JSON.stringify({time:Date.now(),type:'duration-read',duration:String(value),source:this.getAttribute('src'),connected:this.isConnected,title:document.querySelector('section[aria-label$="preview"] p')?.textContent}));return value}});
            });
            return application;
          };
          JS
      - name: Repeat unchanged retained range and integrity scenario
        run: xvfb-run -a env NODE_OPTIONS="--require=$RUNNER_TEMP/media-state.cjs" npx playwright test tests/e2e/media.spec.ts --project=e2e-smoke --workers=1 --repeat-each=3 --trace retain-on-failure --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-linux-media-diagnosis
          path: |
            ${{ env.CARGO_TARGET_DIR }}/media-events.jsonl
            packages/desktop/media-report.json
            packages/desktop/test-results/**/trace.zip
            packages/desktop/test-results/**/error-context.md
          retention-days: 7
