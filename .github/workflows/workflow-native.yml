name: Alpha Windows publication contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publication:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Compare dependency and standard replacement semantics
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/alpha2-rename-contract"
          cd "$RUNNER_TEMP/alpha2-rename-contract"
          cat > contract.rs <<'RS'
          use std::{fs::{self, File}, io::{Read, Write}, os::windows::ffi::OsStrExt, path::Path};
          #[link(name = "kernel32")]
          unsafe extern "system" { fn MoveFileExW(old: *const u16, new: *const u16, flags: u32) -> i32; }
          fn wide(path: &Path) -> Vec<u16> { path.as_os_str().encode_wide().chain(Some(0)).collect() }
          fn main() -> std::io::Result<()> {
              let root = std::env::current_dir()?.join("owned");
              fs::create_dir(&root)?;
              let destination = root.join("content.bin");
              let temporary = root.join("temporary.bin");
              fs::write(&destination, b"captured preview")?;
              let mut preview = File::open(&destination)?;
              let mut file = File::create(&temporary)?;
              file.write_all(b"published content")?;
              file.flush()?;
              let old = wide(&temporary);
              let new = wide(&destination);
              // SAFETY: both paths are live nul-terminated UTF-16 allocations.
              let moved = unsafe { MoveFileExW(old.as_ptr(), new.as_ptr(), 1) };
              let dependency_error = std::io::Error::last_os_error();
              assert_eq!(moved, 0, "control unexpectedly replaced an open destination");
              assert_eq!(dependency_error.raw_os_error(), Some(5));
              assert_eq!(fs::read(&destination)?, b"captured preview");
              fs::rename(&temporary, &destination)?;
              let mut retained = Vec::new();
              preview.read_to_end(&mut retained)?;
              assert_eq!(retained, b"captured preview");
              assert_eq!(fs::read(&destination)?, b"published content");
              drop(file); drop(preview);
              fs::remove_dir_all(&root)?;
              println!("{{\"moveFileExError\":5,\"standardRename\":true,\"retainedPreview\":true,\"exactPublishedBytes\":true,\"cleanup\":true}}");
              Ok(())
          }
          RS
          rustc --edition=2024 contract.rs -o contract.exe
          ./contract.exe | tee publication-contract.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-windows-rename-contract
          path: ${{ runner.temp }}/alpha2-rename-contract/publication-contract.json
