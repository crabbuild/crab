name: Alpha Linux encrypted storage qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d1162a42ef332b257d1d18bfb32a15698aa660a
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Set private qualification paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-keyring-target" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/crab-keyring-target"
      - name: Install Linux and real Secret Service dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 xvfb tmux dbus-x11 gnome-keyring libsecret-1-0 pkg-config libssl-dev libfuse3-dev
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-linux-x64
          path: packages/desktop/resources/native/linux-x64
          run-id: 44455996465
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: Crab-remote-runtime-Linux-X64
          path: packages/desktop/release/remote-runtime
          run-id: 44455996465
          github-token: ${{ github.token }}
      - name: Install desktop dependencies and restore native permissions
        run: |
          npm ci
          chmod +x resources/native/linux-x64/{crab,crab-nfs-mount,crab-desktop-agent,git-remote-crab}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned notebook and storage runtime
        run: |
          python -m pip install awscli jupyter_client==8.6.3 ipykernel==6.29.5 jupyter_server==2.17.0
          echo "CRAB_TEST_JUPYTER_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Build exact packaged application
        run: |
          npm run build:renderer
          npm run build:electron
          node scripts/package.mjs --dir --publish never
      - name: Prepare actual Electron keyring probe
        run: |
          cat > "$RUNNER_TEMP/keyring-app.cjs" <<'JS'
          const { app, safeStorage } = require('electron');
          const fs = require('node:fs');
          app.whenReady().then(async () => {
            const available = await safeStorage.isAsyncEncryptionAvailable();
            const backend = safeStorage.getSelectedStorageBackend();
            const encrypted = available ? await safeStorage.encryptStringAsync('ephemeral qualification value') : null;
            const result = encrypted ? await safeStorage.decryptStringAsync(encrypted) : null;
            fs.writeFileSync(process.argv[2], JSON.stringify({ available, backend, roundTrip: result?.result === 'ephemeral qualification value', protected: encrypted ? !encrypted.includes(Buffer.from('ephemeral qualification value')) : false }));
            app.quit();
          }).catch(error => { console.error(error.message); app.exit(1); });
          JS
          cat > "$RUNNER_TEMP/keyring-driver.cjs" <<'JS'
          const { spawnSync } = require('node:child_process');
          const { createRequire } = require('node:module');
          const path = require('node:path');
          const requireDesktop = createRequire(path.join(process.cwd(), 'package.json'));
          const child = spawnSync(requireDesktop('electron'), [path.join(process.env.RUNNER_TEMP, 'keyring-app.cjs'), path.join(process.env.RUNNER_TEMP, process.argv[2] + '.json')], { env: { ...process.env, ELECTRON_RUN_AS_NODE: undefined }, stdio: 'inherit', timeout: 30000 });
          if (child.error) throw child.error;
          process.exitCode = child.status ?? 1;
          JS
      - name: Record keyring control
        continue-on-error: true
        run: xvfb-run -a node "$RUNNER_TEMP/keyring-driver.cjs" keyring-control
      - name: Qualify actual encryption and unchanged packaged storage suite
        run: |
          dbus-run-session -- bash -euo pipefail <<'KEYRING'
            export XDG_CURRENT_DESKTOP=GNOME
            export XDG_DATA_HOME="$RUNNER_TEMP/crab-desktop-keyring"
            mkdir -m 700 -p "$XDG_DATA_HOME"
            python -c "import secrets; print(secrets.token_hex(32), end=\"\")" | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a node "$RUNNER_TEMP/keyring-driver.cjs" keyring-candidate
            node - <<'JS'
          const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict');
          const result = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'keyring-candidate.json')));
          assert.deepEqual(result, { available: true, backend: 'gnome_libsecret', roundTrip: true, protected: true });
          console.log(JSON.stringify(result));
          JS
            xvfb-run -a python scripts/qualify-v2.py > keyring-storage.log 2>&1
          KEYRING
      - name: Qualify complete desktop regression suite
        run: npm test -- --maxWorkers 2 --reporter=json --outputFile=candidate-report.json > candidate-unit.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-linux-keyring-proof
          path: |
            ${{ runner.temp }}/keyring-*.json
            packages/desktop/keyring-storage.log
            packages/desktop/candidate-unit.log
            packages/desktop/candidate-report.json
            packages/desktop/test-results/**
