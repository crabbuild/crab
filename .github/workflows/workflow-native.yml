name: Alpha notebook Windows qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  notebook:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3d1162a42ef332b257d1d18bfb32a15698aa660a
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - name: Set private qualification paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-notebook-target" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/crab-notebook-target"
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-win-x64
          path: packages/desktop/resources/native/win-x64
          run-id: 44455996465
          github-token: ${{ github.token }}
      - name: Install desktop dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned notebook runtime
        run: |
          python -m pip install jupyter_client==8.6.3 ipykernel==6.29.5 jupyter_server==2.17.0
          echo "CRAB_TEST_JUPYTER_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Build exact control application
        run: |
          npm run build:renderer
          npm run build:electron
          node scripts/package.mjs --dir --publish never
      - name: Record unchanged notebook control
        continue-on-error: true
        run: E2E_SMOKE=1 npx playwright test tests/e2e/notebook-kernel.spec.ts --project=e2e-smoke --workers=1 > control-notebook.log 2>&1
      - name: Apply only production correction and new regression
        working-directory: .
        run: |
          python - <<'PYCODE'
          import base64, subprocess
          patch = base64.b64decode('')
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PYCODE
      - name: Rebuild candidate application
        run: |
          npm run build:electron
          node scripts/package.mjs --dir --publish never
      - name: Qualify unchanged packaged notebook scenarios
        run: E2E_SMOKE=1 npx playwright test tests/e2e/notebook-kernel.spec.ts tests/e2e/notebook-remote-kernel.spec.ts --project=e2e-smoke --workers=1 > candidate-notebook.log 2>&1
      - name: Qualify complete desktop regression suite
        run: npm test -- --maxWorkers 2 --reporter=json --outputFile=candidate-report.json > candidate-unit.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-windows-notebook-proof
          path: |
            packages/desktop/control-notebook.log
            packages/desktop/candidate-notebook.log
            packages/desktop/candidate-unit.log
            packages/desktop/candidate-report.json
            packages/desktop/test-results/**
