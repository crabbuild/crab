name: Workflow native execution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source-readiness:
    name: macOS LSP control and candidate diagnosis
    runs-on: macos-15
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      E2E_SMOKE: 1
      PLAYWRIGHT_JSON_OUTPUT_NAME: workflow-report.json
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8bbceef61a0772b880b5c9b4f80aea954db37d31
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - name: Prepare isolated fixture target
        run: |
          mkdir -p "$RUNNER_TEMP/crab-source-readiness"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-source-readiness" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-mac-arm64
          run-id: 44249218814
          github-token: ${{ github.token }}
          path: packages/desktop/resources/native/mac-arm64
      - name: Restore producer permissions
        run: chmod +x resources/native/mac-arm64/{crab,crab-nfs-mount,crab-desktop-agent,git-remote-crab}
      - name: Install renderer and Electron dependencies
        run: npm ci
      - name: Build the same renderer and packaged application
        run: |
          npm run build:renderer
          npm run build:electron
          node scripts/package.mjs --dir --arm64
      - name: Trace main-process version probes
        run: |
          cat > "$RUNNER_TEMP/workflow-lsp.cjs" <<'JS'
          const fs=require('node:fs');
          const req=require('node:module').createRequire(process.cwd()+'/package.json');
          const electron=req('playwright-core')._electron, launch=electron.launch.bind(electron);
          const file=process.env.CARGO_TARGET_DIR+'/lsp-'+process.env.PROBE_MODE+'.jsonl';
          electron.launch=async function(options){
            const application=await launch(options);
            await application.evaluate(({app},file)=>{
              const fs=process.getBuiltinModule('node:fs'), cp=process.getBuiltinModule('node:child_process');
              const log=(entry)=>fs.appendFileSync(file,JSON.stringify({time:Date.now(),...entry})+'\n');
              const sync=cp.execSync;
              cp.execSync=function(command,options){
                if(options?.timeout!==5000)return sync.apply(this,arguments);
                const started=Date.now();log({event:'sync-start',command});
                try{return sync.apply(this,arguments)}finally{log({event:'sync-close',command,elapsed:Date.now()-started})}
              };
              const async=cp.execFile;
              cp.execFile=function(command,args,options){
                const child=async.apply(this,arguments);
                if(options?.timeout===5000){const started=Date.now();log({event:'async-start',command,args});child.once('close',()=>log({event:'async-close',command,elapsed:Date.now()-started}));}
                return child;
              };
              setInterval(()=>log({event:'main-heartbeat'}),200).unref();
            },file);
            return application;
          };
          JS
      - name: Run unchanged workflow control three times
        continue-on-error: true
        env:
          PROBE_MODE: control
          PLAYWRIGHT_JSON_OUTPUT_NAME: workflow-control.json
        run: NODE_OPTIONS="--require=$RUNNER_TEMP/workflow-lsp.cjs" npx playwright test tests/e2e/workflow-complex.spec.ts --project=e2e-smoke --workers=1 --grep "complex workflows preserve templates" --repeat-each=3 --trace retain-on-failure --output=control-results --reporter=line,json
