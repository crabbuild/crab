name: Alpha Windows storage qualification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  notebook:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e77cd860de6ab3bf934ba04f3100d9e959ea6f2a
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Set private qualification paths
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-notebook-target" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/crab-notebook-target"
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-win-x64
          path: packages/desktop/resources/native/win-x64
          run-id: 44455996465
          github-token: ${{ github.token }}
      - name: Install desktop dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned notebook runtime
        run: |
          python -m pip install awscli jupyter_client==8.6.3 ipykernel==6.29.5 jupyter_server==2.17.0
          echo "CRAB_TEST_JUPYTER_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Build and bundle the corrected native CLI
        id: corrected_cli
        run: |
          cargo build --locked --no-default-features -p crab --bin crab
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { createRequire } from 'node:module';
          const require = createRequire(path.resolve('package.json'));
          const source = path.join(process.env.CARGO_TARGET_DIR, 'debug', 'crab.exe');
          for (const name of ['crab.exe', 'git-remote-crab.exe']) {
            const destination = path.join('resources', 'native', 'win-x64', name);
            fs.unlinkSync(destination);
            fs.linkSync(source, destination);
          }
          const directory = path.resolve('resources/native/win-x64');
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const hashes = {};
          for (const name of ['crab', 'crab-nfs-mount', 'crab-desktop-agent']) {
            hashes[name + '.exe'] = createHash('sha256').update(fs.readFileSync(path.join(directory, name + '.exe'))).digest('hex');
          }
          for (const name of ['crab', 'crab-desktop-agent']) {
            const actual = execFileSync(path.join(directory, name + '.exe'), ['--version'], { encoding: 'utf8' }).trim();
            if (actual !== `${name} ${version}`) throw Error('Diagnostic runtime version mismatch');
          }
          fs.writeFileSync(path.join(directory, 'runtime.json'), JSON.stringify({ version, platform: process.platform, arch: process.arch, hashes }, null, 2) + '\n');
          await require('./scripts/verify-native.cjs')({ arch: require('builder-util').Arch.x64, electronPlatformName: process.platform, packager: { projectDir: process.cwd(), appInfo: { version } } });
          JS
      - uses: actions/upload-artifact@v4
        if: steps.corrected_cli.outcome == 'success'
        with:
          name: alpha2-windows-quoted-native
          path: packages/desktop/resources/native/win-x64/
          if-no-files-found: error
      - name: Build exact current application
        run: |
          npm run build:renderer
          npm run build:electron
          node scripts/package.mjs --dir --publish never
      - name: Qualify all unchanged packaged storage scenarios
        run: |
          python -X utf8 - <<'PYCODE' > windows-storage.log 2>&1
          from pathlib import Path
          p = Path("scripts/qualify-v2.py").resolve()
          s = p.read_text()
          a = s.index('                subprocess.run(["cargo", "test"')
          z = s.index('                identity_spec =', a)
          # This diagnostic compiles the corrected CLI with minimal features;
          # the current PR retains the complete release-feature native gates.
          s = s[:a] + s[z:]
          try:
              exec(compile(s, str(p), "exec"), {"__file__": str(p), "__name__": "__main__"})
          finally:
              import os, shutil
              logs = Path("storage-fixture-command-logs")
              logs.mkdir(exist_ok=True)
              for profile in ("alpha", "beta"):
                  for source in Path(os.environ["RUNNER_TEMP"]).glob(f"r*/{profile}/commands.log"):
                      shutil.copyfile(source, logs / f"{source.parent.parent.name}-{profile}.log")
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-windows-quoted-cli-proof
          path: |
            packages/desktop/windows-storage.log
            packages/desktop/storage-fixture-command-logs/*.log
            packages/desktop/test-results/**
