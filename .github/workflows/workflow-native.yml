      - name: Rebuild and package candidate
        run: |
          npm run build:electron
          node scripts/package.mjs --dir --arm64
      - name: Run unchanged workflow candidate three times
        env:
          PROBE_MODE: candidate
          PLAYWRIGHT_JSON_OUTPUT_NAME: workflow-candidate.json
        run: NODE_OPTIONS="--require=$RUNNER_TEMP/workflow-lsp.cjs" npx playwright test tests/e2e/workflow-complex.spec.ts --project=e2e-smoke --workers=1 --grep "complex workflows preserve templates" --repeat-each=3 --trace retain-on-failure --output=candidate-results --reporter=line,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-workflow-lsp-diagnosis
          path: |
            ${{ env.CARGO_TARGET_DIR }}/lsp-*.jsonl
            packages/desktop/workflow-control.json
            packages/desktop/workflow-candidate.json
            packages/desktop/control-results/**/trace.zip
            packages/desktop/control-results/**/error-context.md
            packages/desktop/candidate-results/**/trace.zip
            packages/desktop/candidate-results/**/error-context.md
          retention-days: 7
