name: Workflow native execution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  broad:
    name: Approved desktop candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win-x64
          - os: macos-15-intel
            target: mac-x64
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8bbceef61a0772b880b5c9b4f80aea954db37d31
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set private native fixture directory
        run: |
          mkdir -p "$RUNNER_TEMP/crab-broad-suite"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-broad-suite" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-${{ matrix.target }}
          run-id: 44249218814
          github-token: ${{ github.token }}
          path: packages/desktop/resources/native/${{ matrix.target }}
      - uses: actions/download-artifact@v4
        if: runner.os != 'Windows'
        with:
          name: Crab-remote-runtime-${{ runner.os }}-${{ runner.arch }}
          run-id: 44249218814
          github-token: ${{ github.token }}
          path: packages/desktop/release/remote-runtime/
      - name: Restore producer permissions and terminal dependency
        if: runner.os != 'Windows'
        run: |
          chmod +x resources/native/${{ matrix.target }}/{crab,crab-nfs-mount,crab-desktop-agent,git-remote-crab}
          command -v tmux || brew install tmux
      - run: npm ci
      - name: Build Electron modules
        run: npm run build:electron
      - name: Apply exact local candidate
        run: |
          cat > "$RUNNER_TEMP/candidate.patch" <<'PATCH'
          diff --git a/.github/workflows/desktop.yml b/.github/workflows/desktop.yml
          index f0f7239dbb5..a1d8bf499e8 100644
          --- a/.github/workflows/desktop.yml
          +++ b/.github/workflows/desktop.yml
          @@ -392,7 +392,7 @@ jobs:
                       packages/desktop/release/rc*.yml
                     if-no-files-found: error
                 - name: Broad desktop regression suite
          -        run: CRAB_TEST_JUPYTER_PYTHON="$(python -c 'import sys; print(sys.executable)')" npm test -- --maxWorkers 2 --minWorkers 1
          +        run: CRAB_TEST_JUPYTER_PYTHON="$(python -c 'import sys; print(sys.executable)')" npm test -- --maxWorkers 2
                 - name: Retain packaged app failure context
                   if: failure()
                   uses: actions/upload-artifact@v4
          diff --git a/CHANGELOG.md b/CHANGELOG.md
          index dfc3ca4fd83..ac96fe363e3 100644
          --- a/CHANGELOG.md
          +++ b/CHANGELOG.md
          @@ -22,6 +22,8 @@ macOS automatic update installation requires a future signed release.
             durable child transcripts and full-text output access.
           - Added complex workflow editing and execution, resizable Workflow Studio
             panels, local runs, and restored workflow output.
          +- Kept editor controls responsive during language-server version discovery and
          +  cancelled pending probes during shutdown.
           - Simplified workspace, repository, Explorer, Search, and Git navigation;
             standardized controls, themes, and terminal font rendering.
           - Unified normal, durable daemon, and SSH terminal controls, preserving sessions
          @@ -48,6 +50,8 @@ macOS automatic update installation requires a future signed release.
           - Upgraded the embedded Cellar runtime to 0.1.1.
           - Added first-run Docker setup for the repository HTTP server and S3 gateway,
             including generated configuration and client identity.
          +- Patched Caddy's network dependency across server, Compose, and Cloudflare
          +  runtime images.
           
           ### Rust SDK
           
          diff --git a/packages/desktop/README.md b/packages/desktop/README.md
          index 4b7f8a9064f..9abd4644e72 100644
          --- a/packages/desktop/README.md
          +++ b/packages/desktop/README.md
          @@ -367,6 +367,9 @@ location; existing Unix addresses that fit the OS limit remain unchanged.
             until the native terminal response confirms cleanup. The UI reports Stopping
             while this work drains; it does not treat signal acknowledgement as completion.
           - Renderer RPC waits for the native startup ping and surfaces startup errors.
          +- Language-server discovery probes versions asynchronously, so a slow system
          +  executable cannot freeze editor controls. Shutdown cancels and joins version
          +  probes; stopping a language prevents a pending discovery from starting it later.
           - Dashboard and dataset metadata refresh after native repository recovery while
             retaining view controls and selection. The Datasets tab under Large Files
             supports read-only inspection before Crab storage setup; tracking and storage
          diff --git a/packages/desktop/docs/architecture/lsp-integration.md b/packages/desktop/docs/architecture/lsp-integration.md
          index fe90afe0e1f..37e8eb353b6 100644
          --- a/packages/desktop/docs/architecture/lsp-integration.md
          +++ b/packages/desktop/docs/architecture/lsp-integration.md
          @@ -39,8 +39,13 @@ lightweight IDE experience within the desktop client.
           The LSP manager discovers available language servers through:
           
           1. **Bundled servers** — `typescript-language-server` ships with the app
          -2. **PATH scanning** — looks for known server binaries in the user's PATH
          -3. **Configuration** — user-specified servers in settings
          +2. **Downloaded servers** — binaries installed under `~/.crab/lsp/`
          +3. **PATH scanning** — looks for known server binaries in the user's PATH
          +
          +Discovery shares an asynchronous scan across callers. Version probes retain
          +their five-second timeout without blocking Electron's main process or editor
          +controls. App shutdown aborts and joins active probes; a language stopped during
          +discovery cannot start when that pending scan completes.
           
