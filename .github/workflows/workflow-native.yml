name: Workflow native execution
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  windows-query:
    name: Windows captured query fixture diagnosis
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      E2E_SMOKE: 1
    defaults:
      run:
        shell: bash
        working-directory: packages/desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8bbceef61a0772b880b5c9b4f80aea954db37d31
      - uses: actions/setup-node@v4
        with:
          node-version-file: packages/desktop/.nvmrc
      - name: Prepare isolated target
        run: |
          mkdir -p "$RUNNER_TEMP/crab-query-fixture"
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/crab-query-fixture" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: Crab-native-win-x64
          run-id: 44249218814
          github-token: ${{ github.token }}
          path: packages/desktop/resources/native/win-x64
      - run: npm ci
      - name: Build the same Windows application
        run: |
          npm run build:renderer
          npm run build:electron
          node scripts/package.mjs --dir --win
      - name: Reproduce unchanged query fixture
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: query-control.json
        run: npx playwright test tests/e2e/file-query.spec.ts --project=e2e-smoke --workers=1 --reporter=line,json --output test-results/control
      - name: Apply candidate fixture exclusion in diagnostic checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/e2e/file-query.spec.ts')
          s=p.read_text()
          old='"/live.sqlite-wal\\n/live.sqlite-shm\\n"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'".crab/\\n/live.sqlite-wal\\n/live.sqlite-shm\\n"'))
          PY
      - name: Repeat complete query assertions after exclusion
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: query-candidate.json
        run: npx playwright test tests/e2e/file-query.spec.ts --project=e2e-smoke --workers=1 --repeat-each=3 --reporter=line,json --output test-results/candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alpha2-windows-query-fixture-diagnosis
          path: |
            packages/desktop/query-*.json
            packages/desktop/test-results/**/error-context.md
            packages/desktop/test-results/**/*.png
          retention-days: 7
