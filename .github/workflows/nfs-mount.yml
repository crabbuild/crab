name: Windows Git path diagnostics
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: nfs-windows-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-path:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Probe native Git with canonical Windows paths
        shell: pwsh
        working-directory: crab
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "crab-windows-git-path-probe"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $source = Join-Path $root "source"
          git init -b main $source
          if ($LASTEXITCODE -ne 0) { throw "Git init failed" }
          git -C $source -c user.name=PathProbe -c user.email=probe@example.invalid commit --allow-empty -m seed
          if ($LASTEXITCODE -ne 0) { throw "Git fixture commit failed" }
          $gitDir = Join-Path $source ".git"
          $code = @'
          use std::io;
          use std::path::{Path, PathBuf};
          use std::process::Command;

          fn report(label: &str, command: &mut Command) -> io::Result<()> {
              let output = command.output()?;
              println!("case={label} status={}", output.status);
              println!("stdout={}", String::from_utf8_lossy(&output.stdout).trim());
              println!("stderr={}", String::from_utf8_lossy(&output.stderr).trim());
              Ok(())
          }

          fn revision(command: &mut Command) -> &mut Command {
              command.args(["rev-parse", "--verify", "--end-of-options", "refs/heads/main^{commit}"])
                  .env_remove("GIT_WORK_TREE").env_remove("GIT_COMMON_DIR")
                  .stdin(std::process::Stdio::null())
          }

          fn main() -> io::Result<()> {
              let input = std::env::args_os().nth(1).ok_or_else(|| io::Error::other("missing fixture Git directory"))?;
              let ordinary = PathBuf::from(input);
              let canonical = ordinary.canonicalize()?;
              println!("ordinary={} canonical={}", ordinary.display(), canonical.display());
              println!("head={}", std::fs::read_to_string(canonical.join("HEAD"))?.trim());
              println!("branch={}", std::fs::read_to_string(canonical.join("refs/heads/main"))?.trim());
              for (label, path) in [("ordinary-env", ordinary.as_path()), ("canonical-env", canonical.as_path())] {
                  let mut command = Command::new("git");
                  revision(&mut command).env("GIT_DIR", path);
                  report(label, &mut command)?;
              }
              let mut argument = Command::new("git");
              argument.arg("--git-dir").arg(&canonical).env_remove("GIT_DIR");
              revision(&mut argument);
              report("canonical-argument", &mut argument)?;
              let mut current = Command::new("git");
              current.current_dir(&canonical).env("GIT_DIR", Path::new("."));
              revision(&mut current);
              report("canonical-current-dir", &mut current)?;
              Ok(())
          }
          '@
          $program = Join-Path $root "path-probe.rs"
          [System.IO.File]::WriteAllText($program, $code)
          $binary = Join-Path $root "path-probe.exe"
          rustc --edition=2024 $program -o $binary
          if ($LASTEXITCODE -ne 0) { throw "Path probe compile failed" }
          git --version | Tee-Object -FilePath (Join-Path $root "git-version.txt")
          & $binary $gitDir 2>&1 | Tee-Object -FilePath (Join-Path $root "results.log")
          if ($LASTEXITCODE -ne 0) { throw "Path probe failed" }
      - name: Retain path diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-git-path-${{ github.run_id }}
          path: |-
            ${{ runner.temp }}/crab-windows-git-path-probe/*.log
            ${{ runner.temp }}/crab-windows-git-path-probe/*.txt
            ${{ runner.temp }}/crab-windows-git-path-probe/*.rs
          retention-days: 14
