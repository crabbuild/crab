name: NFS Windows startup diagnostics
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: nfs-windows-diagnostic-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
jobs:
  windows:
    name: Windows NFS startup diagnostics
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CRAB_NFS_SMOKE_RUN_ID: mount-nfs-windows-${{ github.run_id }}-${{ github.run_attempt }}
      CRAB_NFS_SMOKE_DRIVE: "Z:"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: nfs-windows-smoke
          workspaces: . -> target
      - name: Enable Windows Client for NFS
        shell: pwsh
        run: |
          if (Get-Command Install-WindowsFeature -ErrorAction SilentlyContinue) {
            Install-WindowsFeature -Name NFS-Client -IncludeManagementTools
          } else {
            Enable-WindowsOptionalFeature `
              -Online `
              -FeatureName ServicesForNFS-ClientOnly `
              -All `
              -NoRestart
          }
          Get-Command "$env:WINDIR\System32\mount.exe" -ErrorAction Stop
          Get-Command "$env:WINDIR\System32\umount.exe" -ErrorAction Stop
      - name: Run native Windows NFS smoke
        shell: pwsh
        working-directory: crab
        env:
          CRAB_NFS_SMOKE_ROOT: ${{ runner.temp }}/crab-nfs-smoke
        run: |
          $logs = Join-Path (Join-Path $env:CRAB_NFS_SMOKE_ROOT $env:CRAB_NFS_SMOKE_RUN_ID) "logs"
          $privateRoot = Join-Path ([System.IO.Path]::GetTempPath()) "crab-nfs-windows-private-$env:CRAB_NFS_SMOKE_RUN_ID"
          $helperLogs = Join-Path $privateRoot "home\.crab\mounts\logs"
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $ready = Join-Path $logs "helper-log-collector.ready"
          $collector = Start-Job -ArgumentList $helperLogs, $logs, $ready -ScriptBlock {
              param($SourceLogs, $EvidenceLogs, $ReadyPath)
              $utf8 = [System.Text.UTF8Encoding]::new($false)
              $previous = @{}
              [System.IO.File]::WriteAllText($ReadyPath, "ready", $utf8)
              while ($true) {
                  if ([System.IO.Directory]::Exists($SourceLogs)) {
                      foreach ($file in [System.IO.Directory]::GetFiles($SourceLogs, "*.log")) {
                          try {
                              $share = [System.IO.FileShare]::ReadWrite -bor [System.IO.FileShare]::Delete
                              $stream = [System.IO.File]::Open($file, [System.IO.FileMode]::Open, [System.IO.FileAccess]::Read, $share)
                              $reader = [System.IO.StreamReader]::new($stream)
                              try { $text = $reader.ReadToEnd() } finally { $reader.Dispose() }
                              $safe = [regex]::Replace($text, '(tcp:[^\s"]*\?token=)[^\s"&]+', '$1<redacted>')
                              if ($previous[$file] -ne $safe) {
                                  $name = "helper-startup-" + [System.IO.Path]::GetFileName($file)
                                  [System.IO.File]::WriteAllText((Join-Path $EvidenceLogs $name), $safe, $utf8)
                                  $previous[$file] = $safe
                              }
                          } catch {
                              # The smoke owns deletion; a disappearing log does not change its result.
                          }
                      }
                  }
                  [System.Threading.Thread]::Sleep(10)
              }
          }
          try {
              for ($attempt = 0; $attempt -lt 100 -and -not (Test-Path -LiteralPath $ready); $attempt++) {
                  Start-Sleep -Milliseconds 50
              }
              if (-not (Test-Path -LiteralPath $ready)) { throw "Helper log collector did not start" }
              ./scripts/run-mount-nfs-windows-smoke.ps1
              if ($LASTEXITCODE -ne 0) { throw "Native NFS smoke exited with $LASTEXITCODE" }
          } finally {
              Stop-Job -Job $collector -ErrorAction SilentlyContinue
              Receive-Job -Job $collector -ErrorAction Continue | Out-Host
              Remove-Job -Job $collector -ErrorAction SilentlyContinue
          }
        timeout-minutes: 45
      - name: Upload Windows NFS smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        env:
          CRAB_NFS_SMOKE_ROOT: ${{ runner.temp }}/crab-nfs-smoke
        with:
          name: nfs-smoke-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CRAB_NFS_SMOKE_ROOT }}/${{ env.CRAB_NFS_SMOKE_RUN_ID }}
          if-no-files-found: warn
          retention-days: 14
