name: Windows background inheritance diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Reproduce captured-output lifetime with bounded descendants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .ci/background-probe | Out-Null
          @'
          use std::fs::File;
          use std::io::{self, Write};
          use std::os::windows::io::AsRawHandle;
          use std::os::windows::process::CommandExt;
          use std::process::{Command, Stdio};
          use std::time::Duration;
          #[link(name = "kernel32")]
          unsafe extern "system" {
              fn SetHandleInformation(handle: *mut std::ffi::c_void, mask: u32, flags: u32) -> i32;
          }
          fn main() -> io::Result<()> {
              let args: Vec<_> = std::env::args().collect();
              let exe = std::env::current_exe()?;
              if args[1] == "worker" {
                  println!("worker={}", std::process::id());
                  std::thread::sleep(Duration::from_secs(4));
                  return Ok(());
              }
              if args[1] == "wrapper" {
                  let status = Command::new(exe).arg("worker").status()?;
                  std::process::exit(status.code().unwrap_or(1));
              }
              let mode = &args[1];
              let log = File::create(&args[2])?;
              let stderr = log.try_clone()?;
              let mut command = Command::new(exe);
              command.arg("wrapper").stdin(Stdio::null()).stdout(log).stderr(stderr);
              if mode == "detached" { command.creation_flags(0x00000008 | 0x00000200); }
              if mode == "no_window" { command.creation_flags(0x08000000); }
              if mode == "stdio_no_inherit" {
                  let handles = [io::stdin().as_raw_handle(), io::stdout().as_raw_handle(), io::stderr().as_raw_handle()];
                  for handle in handles {
                      if handle.is_null() || handle as isize == -1 { continue; }
                      // SAFETY: these are borrowed live standard handles; only their inheritance flag changes.
                      if unsafe { SetHandleInformation(handle, 1, 0) } == 0 { return Err(io::Error::last_os_error()); }
                  }
              }
              let child = command.spawn()?;
              println!("parent={} helper={}", std::process::id(), child.id());
              io::stdout().flush()?;
              Ok(())
          }
          '@ | Set-Content .ci/background-probe/probe.rs
          rustc .ci/background-probe/probe.rs -o .ci/background-probe/crab-background-probe.exe
          if ($LASTEXITCODE -ne 0) { throw 'Probe compilation failed' }
          $results = @()
          foreach ($mode in @('plain', 'detached', 'no_window', 'stdio_no_inherit')) {
            $log = ".ci/background-probe/$mode-child.log"
            $watch = [Diagnostics.Stopwatch]::StartNew()
            $output = & .ci/background-probe/crab-background-probe.exe $mode $log 2>&1 | Tee-Object ".ci/background-probe/$mode-parent.log"
            $exit = $LASTEXITCODE
            $watch.Stop()
            if ($exit -ne 0) { throw "Probe $mode failed: $exit" }
            $match = [regex]::Match(($output -join "`n"), 'helper=(\d+)')
            if (-not $match.Success) { throw 'Missing helper identity' }
            $helperPid = [int]$match.Groups[1].Value
            $alive = $null -ne (Get-Process -Id $helperPid -ErrorAction SilentlyContinue)
            $results += [pscustomobject]@{ mode=$mode; elapsed_ms=$watch.ElapsedMilliseconds; helper_alive_after_pipeline=$alive }
          }
          $results | ConvertTo-Json | Set-Content .ci/background-probe/results.json
          $results | Format-Table
          Start-Sleep -Seconds 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-background-probe-${{ github.run_id }}
          path: .ci/background-probe
          if-no-files-found: error
          retention-days: 7
