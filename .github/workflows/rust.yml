name: CI

on:
  push:
    branches: [main, crab-v2]
  pull_request:
    branches: [main, crab-v2]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Workflow and change checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" || "${EVENT_NAME}" == "merge_group" ]]; then
            printf 'rust=true\nweb=true\ndocs=true\nrepo_docs=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          base="${BASE_SHA:-${EVENT_BEFORE:-}}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi
          if [[ -z "${base}" ]]; then
            printf 'rust=true\nweb=true\ndocs=true\nrepo_docs=true\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          files="$(git diff --name-only "${base}" "${HEAD_SHA}")"
          classify_files() {
            local changed_files="$1"
            local rust=false
            local web=false
            local docs=false
            local repo_docs=false
            while IFS= read -r file; do
              case "${file}" in
                Cargo.toml|Cargo.lock|crates/*|packages/ui/*|.github/workflows/*) rust=true ;;
                crab/docs/*) repo_docs=true ;;
                crab/*) rust=true ;;
                packages/web/content/*) docs=true ;;
                packages/web/*) web=true ;;
              esac
            done <<< "${changed_files}"
            if [[ "${rust}" == false && "${web}" == false && "${docs}" == false && "${repo_docs}" == false ]]; then
              rust=true
            fi
            printf '%s %s %s %s\n' "${rust}" "${web}" "${docs}" "${repo_docs}"
          }

          assert_classification() {
            local changed_files="$1"
            local expected="$2"
            local actual
            actual="$(classify_files "${changed_files}")"
            if [[ "${actual}" != "${expected}" ]]; then
              printf 'classification failed for %s: expected %s, got %s\n' \
                "${changed_files}" "${expected}" "${actual}" >&2
              exit 1
            fi
          }

          assert_classification 'crab/docs/design/layout.md' 'false false false true'
          assert_classification 'crab/src/main.rs' 'true false false false'
          assert_classification 'packages/web/content/docs/index.mdx' 'false false true false'
          assert_classification 'packages/web/app/page.tsx' 'false true false false'
          assert_classification 'packages/ui/src/App.tsx' 'true false false false'
          assert_classification $'crab/docs/design/layout.md\ncrab/src/main.rs' 'true false false true'
          assert_classification $'packages/web/content/docs/index.mdx\npackages/web/app/page.tsx' 'false true true false'
          assert_classification 'README.md' 'true false false false'

          read -r rust web docs repo_docs < <(classify_files "${files}")
          printf 'rust=%s\nweb=%s\ndocs=%s\nrepo_docs=%s\n' \
            "${rust}" "${web}" "${docs}" "${repo_docs}" >> "${GITHUB_OUTPUT}"

      - name: Lint GitHub Actions workflows
        run: GOTOOLCHAIN=local go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11

      - name: Check repository documentation
        if: steps.filter.outputs.repo_docs == 'true'
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-${EVENT_BEFORE:-}}"
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi
          if [[ -z "${base}" ]]; then
            echo "Unable to determine documentation diff base" >&2
            exit 1
          fi
          git diff --check "${base}" "${HEAD_SHA}" -- crab/docs/
          while IFS= read -r -d '' file; do
            python3 -m json.tool "${file}" >/dev/null
          done < <(find crab/docs -type f -name '*.json' -print0)

  rust:
    name: Rust quality and tests
    runs-on: ubuntu-latest
    # Cold workspace compilation and the serialized reconstruction corpus need
    # time for the complete suite and cache upload; retain every test.
    timeout-minutes: 150
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    env:
      # Workspace test linking exhausted runner disk. Retain file/line
      # backtraces without type/variable debug data; runtime checks stay on.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Publication fixtures use the same explicit root as the build cache.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          # PR-scoped build caches evict the base caches other PRs can restore.
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/crab-v2' }}

      - name: Set up repository frontend toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json

      - name: Build and verify embedded repository frontend
        run: |
          npm ci --prefix packages/ui
          npm run format:check --prefix packages/ui
          npm test --prefix packages/ui
          npm run build --prefix packages/ui

      - name: Check HTTP server
        run: |
          cargo clippy -p crab-server --all-targets --locked -- -D warnings
          cargo test -p crab-server --example qualify_http_load --locked

      - name: Run Clippy
        run: >-
          cargo clippy --package crab --no-deps --locked --
          -A clippy::style
          -A clippy::complexity
          -A clippy::perf
          -A clippy::pedantic
          -A clippy::nursery
          -A clippy::cargo
          -A clippy::restriction
          -D clippy::correctness
          -D clippy::suspicious
          -A unfulfilled_lint_expectations

      - name: Run tests
        env:
          CRAB_BIN: ${{ github.workspace }}/target/debug/crab
          # The Linux test runner's default worker stack is too small for
          # the largest async protocol fixtures; keep the test harness from
          # converting valid coverage into a stack-overflow false negative.
          RUST_MIN_STACK: "8388608"
        # Report later executable failures too; Cargo still fails the job if any test fails.
        run: |
          # Desktop worktree integration tests invoke the real CLI. Cargo's
          # binary test harness is not the executable required by that contract.
          cargo build -p crab --locked
          # Bound independent VFS fixtures to hosted memory; each test retains
          # its concurrent workers. Stream assertions before runner termination
          # and report resources for the complete workspace suite.
          /usr/bin/time -v cargo test --workspace --locked --no-fail-fast -- --nocapture --test-threads=2

      - name: Check managed OpenAPI contract
        run: cargo run -p crab-auth --example generate_managed_openapi --locked -- --check

      - name: Reject breaking managed OpenAPI changes
        shell: bash
        run: |
          set -euo pipefail
          baseline="$(mktemp)"
          trap 'rm -f "${baseline}"' EXIT
          base_ref="${GITHUB_BASE_REF:-main}"
          if git show "origin/${base_ref}:crates/crab-auth/openapi/managed-v1.json" > "${baseline}"; then
            cargo run -p crab-auth --example check_managed_openapi_compatibility --locked -- \
              "${baseline}" crates/crab-auth/openapi/managed-v1.json
          else
            echo "No managed OpenAPI baseline exists on ${base_ref}; accepting the initial contract."
          fi

  repository-ui:
    name: Repository browser interactions (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    # Each shard runs about 180 tests on two workers, roughly nine minutes on
    # hosted runners before setup.
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/2
      - name: Retain failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repository-browser-failures-${{ matrix.shard }}
          path: packages/ui/node_modules/.cache/browser-tests
          include-hidden-files: true

  web:
    name: Web and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.docs == 'true'
    defaults:
      run:
        working-directory: packages/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        if: needs.changes.outputs.web == 'true'
        run: npm run typecheck

      - name: Lint
        if: needs.changes.outputs.web == 'true'
        run: npm run lint

      - name: Test
        if: needs.changes.outputs.web == 'true'
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check documentation links
        run: npm run check:links

  status:
    name: Required CI status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, rust, repository-ui, web]
    if: always()
    steps:
      - name: Fail when a selected gate failed
        if: >-
          needs.changes.result != 'success' ||
          (needs.rust.result != 'success' && needs.rust.result != 'skipped') ||
          (needs.repository-ui.result != 'success' && needs.repository-ui.result != 'skipped') ||
          (needs.web.result != 'success' && needs.web.result != 'skipped')
        run: exit 1

      - name: Report selected gates
        run: |
          echo "Rust gate: ${{ needs.rust.result }}"
          echo "Repository browser gate: ${{ needs.repository-ui.result }}"
          echo "Web and docs gate: ${{ needs.web.result }}"
