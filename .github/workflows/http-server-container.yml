name: HTTP server container

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Exact Git ref or commit to qualify"
        required: false
        type: string
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/http-server-container.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crab/**"
      - "crates/**"
      - "packages/repository/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: http-server-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and inspect image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Validate deployment profiles
        run: |
          set -euo pipefail
          chart=crates/crab-http-server/deploy/helm/crab-http-server
          terraform_root=crates/crab-http-server/deploy/terraform
          helm_image=alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          kubeconform_image=ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          terraform_image=hashicorp/terraform:1.13.3@sha256:dfb1889a8ee74ada3ddacc48f89b8a0d69f3e114de3d8a2ce15f6a8d3dbfdbe2

          jq empty crates/crab-http-server/deploy/ecs/task-definition.example.json
          docker compose --file crates/crab-http-server/deploy/compose.yaml config --quiet
          docker run --rm \
            --volume "$PWD/crates/crab-http-server/deploy/compose.Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              >/dev/null 2>&1; then
            echo "chart accepted mutable or missing deployment inputs" >&2
            exit 1
          fi

          for values in eks-values.example.yaml gke-values.example.yaml aks-values.example.yaml; do
            values_path="${chart}/${values}"
            rendered="${RUNNER_TEMP}/crab-http-server-${values}"
            docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
              "${helm_image}" lint --strict "${chart}" --values "${values_path}"
            docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
              "${helm_image}" template qualification "${chart}" \
                --namespace crab --values "${values_path}" \
                --set autoscaling.enabled=true \
                --set ingress.enabled=true \
                --set ingress.className=nginx \
                --set ingress.host=git.example.com \
                --set ingress.tlsSecretName=crab-http-server-tls \
                --set metrics.prometheusAnnotations=true \
                --set-json 'networkPolicy.publicIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"ingress-nginx"}}}]' \
                --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
                > "${rendered}"
            grep -F 'prometheus.io/scrape: "true"' "${rendered}"
            grep -F 'port: management' "${rendered}"
            grep -F 'terminationGracePeriodSeconds: 630' "${rendered}"
            grep -F -- '- /usr/bin/sleep' "${rendered}"
            grep -F -- '- "15"' "${rendered}"
            docker run --rm \
              --volume "${rendered}:/manifests/server.yaml:ro" \
              "${kubeconform_image}" -strict -summary -kubernetes-version 1.29.0 \
                /manifests/server.yaml
          done

          values="${chart}/eks-values.example.yaml"
          default_rendered="${RUNNER_TEMP}/crab-http-server-default.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              > "${default_rendered}"
          grep -F 'ingress: []' "${default_rendered}"
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set serviceAccount.automountServiceAccountToken=true \
              >/dev/null 2>&1; then
            echo "chart accepted automatic Kubernetes API credentials" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set config.existingConfigMap=another-config \
              >/dev/null 2>&1; then
            echo "chart accepted two configuration sources" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set ingress.enabled=true --set ingress.host=git.example.com \
              >/dev/null 2>&1; then
            echo "chart accepted ingress without a TLS Secret" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set ingress.enabled=true --set ingress.host=git.example.com \
              --set ingress.tlsSecretName=crab-http-server-tls >/dev/null 2>&1; then
            echo "chart accepted ingress from every network source" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set metrics.prometheusAnnotations=true >/dev/null 2>&1; then
            echo "chart accepted a metrics scraper without an allowed source" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set networkPolicy.enabled=false >/dev/null 2>&1; then
            echo "chart accepted disabled network isolation" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set-json 'podLabels={"app.kubernetes.io/name":"other"}' >/dev/null 2>&1; then
            echo "chart accepted an overridden selector label" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set-json 'podAnnotations={"prometheus.io/scrape":"true"}' >/dev/null 2>&1; then
            echo "chart accepted an overridden management annotation" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set service.type=LoadBalancer >/dev/null 2>&1; then
            echo "chart accepted a direct load balancer that bypasses TLS ingress" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set autoscaling.enabled=true --set autoscaling.minReplicas=5 \
              --set autoscaling.maxReplicas=2 >/dev/null 2>&1; then
            echo "chart accepted an invalid autoscaling range" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" --values "${values}" \
              --set terminationGracePeriodSeconds=629 >/dev/null 2>&1; then
            echo "chart accepted a shutdown budget shorter than pre-stop plus drain" >&2
            exit 1
          fi

          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${terraform_image}" fmt -check -recursive "${terraform_root}"
          for provider in aws gcp azure; do
            module="${terraform_root}/${provider}"
            docker run --rm --volume "${PWD}:/src" --workdir "/src/${module}" \
              "${terraform_image}" init -backend=false -input=false -lockfile=readonly
            docker run --rm --volume "${PWD}:/src:ro" --workdir "/src/${module}" \
              "${terraform_image}" validate
          done
      - name: Build locked server image
        run: >-
          docker build
          --file crates/crab-http-server/deploy/Dockerfile
          --tag crab-http-server:test
          .
      - name: Reject fixable high-severity image vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          crab-http-server:test
      - name: Verify runtime contract
        run: |
          test "$(docker image inspect crab-http-server:test --format '{{.Config.User}}')" = "crab:crab"
          test "$(docker image inspect crab-http-server:test --format '{{.Config.StopSignal}}')" = "SIGTERM"
          docker image inspect crab-http-server:test --format '{{json .Config.Healthcheck.Test}}' | grep -F -- '"healthcheck"'
          test "$(docker run --rm --entrypoint /usr/bin/id crab-http-server:test -u)" = "10001"
          docker run --rm --entrypoint /usr/bin/test crab-http-server:test \
            -s /etc/ssl/certs/ca-certificates.crt
          docker run --rm --entrypoint /usr/bin/test crab-http-server:test \
            -x /usr/bin/sleep
          expected_version="$(sed -n 's/^version = "\(.*\)"/\1/p' \
            crates/crab-http-server/Cargo.toml | head -1)"
          test "$(docker run --rm crab-http-server:test --version)" = \
            "crab-http-server ${expected_version}"
          docker run --rm crab-http-server:test --help | grep -F -- "--config"
          docker run --rm crab-http-server:test --config /dev/null repository --help | grep -F -- "create"
      - name: Exercise the Compose quick start and restart
        env:
          CRAB_HTTP_SERVER_IMAGE: crab-http-server:test
        run: |
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              docker compose --file crates/crab-http-server/deploy/compose.yaml ps --all || true
              docker compose --file crates/crab-http-server/deploy/compose.yaml logs --no-color || true
            fi
            docker compose --file crates/crab-http-server/deploy/compose.yaml \
              down --volumes --remove-orphans || true
            exit "$result"
          }
          trap cleanup EXIT

          docker compose --file crates/crab-http-server/deploy/compose.yaml \
            up --detach --no-build --wait --wait-timeout 120
          curl --fail --silent --show-error \
            --dump-header "${RUNNER_TEMP}/crab-http-server-headers" \
            --output "${RUNNER_TEMP}/crab-http-server-repositories.json" \
            http://127.0.0.1:8788/api/repos
          grep --extended-regexp --ignore-case \
            '^x-request-id: [0-9a-f-]{36}[[:space:]]*$' \
            "${RUNNER_TEMP}/crab-http-server-headers"
          docker compose --file crates/crab-http-server/deploy/compose.yaml \
            exec --no-TTY proxy curl --fail --silent --show-error \
              http://127.0.0.1:8789/metrics \
            | grep -F 'crab_http_server_requests_total{method="get",outcome="2xx"}'
          jq --exit-status \
            '.repositories | map(select(.owner == "demo" and .name == "hello")) | length == 1' \
            "${RUNNER_TEMP}/crab-http-server-repositories.json"

          docker compose --file crates/crab-http-server/deploy/compose.yaml down
          docker compose --file crates/crab-http-server/deploy/compose.yaml \
            up --detach --no-build --wait --wait-timeout 120
          curl --fail --silent --show-error \
            --output "${RUNNER_TEMP}/crab-http-server-repositories.json" \
            http://127.0.0.1:8788/api/repos
          jq --exit-status \
            '.repositories | map(select(.owner == "demo" and .name == "hello")) | length == 1' \
            "${RUNNER_TEMP}/crab-http-server-repositories.json"
