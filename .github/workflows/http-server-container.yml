name: HTTP server container

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Exact Git ref or commit to qualify"
        required: false
        type: string
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/http-server-container.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crab/**"
      - "crates/**"
      - "packages/repository/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: http-server-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and inspect image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate deployment profiles
        run: |
          set -euo pipefail
          chart=crates/crab-http-server/deploy/helm/crab-http-server
          terraform_root=crates/crab-http-server/deploy/terraform
          helm_image=alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          kubeconform_image=ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          prometheus_image=prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          shellcheck_image=koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
          terraform_image=hashicorp/terraform:1.13.3@sha256:dfb1889a8ee74ada3ddacc48f89b8a0d69f3e114de3d8a2ce15f6a8d3dbfdbe2

          for secret_pattern in \
            '**/.env' '**/.env.*' '**/*.key' '**/*.pem' '**/*.p12' \
            '**/*.pfx' '**/id_dsa' '**/id_ed25519' '**/id_ecdsa' '**/id_rsa'; do
            grep --fixed-strings --line-regexp --quiet -- "$secret_pattern" .dockerignore
          done

          jq empty crates/crab-http-server/deploy/ecs/task-definition.example.json
          docker compose --file crates/crab-http-server/deploy/compose.yaml config --quiet
          bash -n crates/crab-http-server/deploy/helm/crab-http-server/qualification/qualify-kubernetes.sh
          if CRAB_HTTP_SERVER_GIT_TOKEN=test-only \
            CRAB_HTTP_SERVER_EXPECTED_IMAGE=crab-http-server:mutable \
            CRAB_HTTP_SERVER_APPROVE_ROLLOUT=true \
            bash crates/crab-http-server/deploy/helm/crab-http-server/qualification/qualify-kubernetes.sh \
              eks crab crab-http-server https://git.example.com \
              qualification repository "${RUNNER_TEMP}/invalid-evidence.json" \
              > /dev/null 2> "${RUNNER_TEMP}/invalid-image-error"; then
            echo "qualification accepted a mutable expected image" >&2
            exit 1
          fi
          grep -F 'CRAB_HTTP_SERVER_EXPECTED_IMAGE must be an immutable image reference.' \
            "${RUNNER_TEMP}/invalid-image-error"
          docker run --rm --volume "$PWD:/src:ro" "$shellcheck_image" \
            /src/crates/crab-http-server/tests/qualify_abrupt_receive_crash.sh \
            /src/crates/crab-http-server/tests/qualify_backup_restore.sh \
            /src/crates/crab-http-server/deploy/helm/crab-http-server/qualification/qualify-kubernetes.sh \
            /src/crates/crab-http-server/tests/qualify_lfs_locking.sh \
            /src/crates/crab-http-server/tests/qualify_lfs_range_resume.sh
          docker run --rm \
            --volume "$PWD/crates/crab-http-server/deploy/compose.Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              >/dev/null 2>&1; then
            echo "chart accepted mutable or missing deployment inputs" >&2
            exit 1
          fi

          for values in eks-values.example.yaml gke-values.example.yaml aks-values.example.yaml; do
            values_path="${chart}/${values}"
            profile_values=(--values "${chart}/team-values.example.yaml" --values "${values_path}")
            rendered="${RUNNER_TEMP}/crab-http-server-${values}"
            docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
              "${helm_image}" lint --strict "${chart}" "${profile_values[@]}"
            docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
              "${helm_image}" template qualification "${chart}" \
                --namespace crab "${profile_values[@]}" \
                --set autoscaling.enabled=true \
                --set ingress.enabled=true \
                --set ingress.className=nginx \
                --set ingress.host=git.example.com \
                --set ingress.tlsSecretName=crab-http-server-tls \
                --set-json 'networkPolicy.publicIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"ingress-nginx"}}}]' \
                > "${rendered}"
            grep -F 'port: management' "${rendered}"
            grep -F 'terminationGracePeriodSeconds: 630' "${rendered}"
            grep -F -- '- /usr/bin/sleep' "${rendered}"
            grep -F -- '- "15"' "${rendered}"
            grep -F '"helm.sh/hook": test' "${rendered}"
            grep -F 'kind: Pod' "${rendered}"
            grep -F -- '- storage-probe' "${rendered}"
            docker run --rm \
              --volume "${rendered}:/manifests/server.yaml:ro" \
              "${kubeconform_image}" -strict -summary -kubernetes-version 1.29.0 \
                /manifests/server.yaml
          done

          gke_autopilot_rendered="${RUNNER_TEMP}/crab-http-server-gke-autopilot.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab \
              --values "${chart}/team-values.example.yaml" \
              --values "${chart}/gke-values.example.yaml" \
              --set-json 'nodeSelector={}' > "${gke_autopilot_rendered}"
          if grep -F 'iam.gke.io/gke-metadata-server-enabled' \
            "${gke_autopilot_rendered}"; then
            echo "GKE Autopilot render retained the Standard-only node selector" >&2
            exit 1
          fi
          docker run --rm \
            --volume "${gke_autopilot_rendered}:/manifests/server.yaml:ro" \
            "${kubeconform_image}" -strict -summary -kubernetes-version 1.29.0 \
              /manifests/server.yaml
          docker run --rm \
            --volume "${PWD}/${chart}/qualification/rbac.example.yaml:/manifests/qualification-rbac.yaml:ro" \
            "${kubeconform_image}" -strict -summary -kubernetes-version 1.29.0 \
              /manifests/qualification-rbac.yaml

          grep -F 'azure.workload.identity/use: "true"' \
            "${RUNNER_TEMP}/crab-http-server-aks-values.example.yaml"
          nginx_rendered="${RUNNER_TEMP}/crab-http-server-eks-values.example.yaml"
          grep -F 'nginx.ingress.kubernetes.io/proxy-body-size: "0"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-buffering: "off"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-http-version: "1.1"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-read-timeout: "630"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-request-buffering: "off"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-send-timeout: "630"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/ssl-redirect: "true"' "$nginx_rendered"

          chart_package_dir="${RUNNER_TEMP}/crab-http-server-chart"
          mkdir -p "$chart_package_dir"
          docker run --rm --volume "${PWD}:/src:ro" \
            --volume "${chart_package_dir}:/out" --workdir /src \
            "${helm_image}" package "${chart}" --destination /out
          chart_version="$(sed -n 's/^version: *//p' "${chart}/Chart.yaml")"
          chart_archive="${chart_package_dir}/crab-http-server-${chart_version}.tgz"
          test -f "$chart_archive"
          tar -tzf "$chart_archive" \
            | grep -F 'crab-http-server/templates/tests/catalog.yaml'
          tar -tzf "$chart_archive" \
            | grep -F 'crab-http-server/qualification/qualify-kubernetes.sh'
          tar -tzf "$chart_archive" \
            | grep -F 'crab-http-server/qualification/rbac.example.yaml'

          profile_values=(
            --values "${chart}/team-values.example.yaml"
            --values "${chart}/eks-values.example.yaml"
          )
          config_resource="${RUNNER_TEMP}/crab-http-server-config-map.yaml"
          config_file="${RUNNER_TEMP}/crab-http-server-server.toml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab "${profile_values[@]}" \
              --show-only templates/configmap.yaml \
              > "${config_resource}"
          awk '
            $0 == "  server.toml: |" { found=1; next }
            found && /^    / { sub(/^    /, ""); print; next }
            found { exit }
          ' "${config_resource}" > "${config_file}"
          python3 -c '
          import sys, tomllib
          with open(sys.argv[1], "rb") as config_file:
              config = tomllib.load(config_file)
          assert config["listen"] == "0.0.0.0:8788"
          assert config["management_listen"] == "0.0.0.0:8789"
          assert config["storage"]["url"] == "s3://team-crab-repositories/repositories"
          assert config["auth"]["issuer"] == "https://identity.example.com/realms/team"
          assert config["auth"]["public_url"] == "https://git.example.com"
          ' "${config_file}"

          monitor_resource="${RUNNER_TEMP}/crab-http-server-pod-monitor.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab "${profile_values[@]}" \
              --show-only templates/podmonitor.yaml \
              --set metrics.podMonitor.enabled=true \
              --set-json 'metrics.podMonitor.labels={"prometheus":"platform"}' \
              --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
              > "${monitor_resource}"
          grep -F 'kind: PodMonitor' "${monitor_resource}"
          grep -F 'port: management' "${monitor_resource}"
          grep -F 'path: /metrics' "${monitor_resource}"
          grep -F 'prometheus: platform' "${monitor_resource}"

          rules_resource="${RUNNER_TEMP}/crab-http-server-prometheus-rule.yaml"
          rules_file="${RUNNER_TEMP}/crab-http-server-rules.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab "${profile_values[@]}" \
              --show-only templates/prometheusrule.yaml \
              --set metrics.podMonitor.enabled=true \
              --set metrics.prometheusRule.enabled=true \
              --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
              > "${rules_resource}"
          awk 'found { sub(/^  /, ""); print } /^spec:$/ { found=1 }' \
            "${rules_resource}" > "${rules_file}"
          docker run --rm --entrypoint /bin/promtool \
            --volume "${rules_file}:/rules/crab-http-server.yaml:ro" \
            "${prometheus_image}" check rules /rules/crab-http-server.yaml

          default_rendered="${RUNNER_TEMP}/crab-http-server-default.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.enabled=false \
              --set-json 'networkPolicy.publicIngressFrom=[]' \
              > "${default_rendered}"
          grep -F 'ingress: []' "${default_rendered}"

          external_rendered="${RUNNER_TEMP}/crab-http-server-external-config.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --set image.repository=registry.example.com/crab-http-server \
              --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              --set config.existingConfigMap=platform-owned-config \
              --set secrets.existingSecret=platform-owned-secret \
              --set serviceAccount.name=crab-http-server \
              > "${external_rendered}"
          grep -F 'name: platform-owned-config' "${external_rendered}"
          if grep -F 'kind: ConfigMap' "${external_rendered}"; then
            echo "chart rendered a managed ConfigMap for an external configuration" >&2
            exit 1
          fi

          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set serviceAccount.automountServiceAccountToken=true \
              >/dev/null 2>&1; then
            echo "chart accepted automatic Kubernetes API credentials" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set image.repository=registry.example.com/crab-http-server:latest \
              >/dev/null 2>&1; then
            echo "chart accepted a mutable image tag" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set image.repository=registry.example.com/crab-http-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              >/dev/null 2>&1; then
            echo "chart accepted a digest in image.repository" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set config.existingConfigMap=another-config \
              >/dev/null 2>&1; then
            echo "chart accepted two configuration sources" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set config.storageUrl=https://storage.example.com/repositories \
              >/dev/null 2>&1; then
            echo "chart accepted a non-cloud storage URL" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.enabled=true --set ingress.host=git.example.com \
              --set-string ingress.tlsSecretName= \
              >/dev/null 2>&1; then
            echo "chart accepted ingress without a TLS Secret" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.enabled=true --set ingress.host=git.example.com \
              --set ingress.tlsSecretName=crab-http-server-tls \
              --set-json 'networkPolicy.publicIngressFrom=[]' >/dev/null 2>&1; then
            echo "chart accepted ingress from every network source" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.enabled=true --set ingress.host=git.example.com \
              --set ingress.tlsSecretName=crab-http-server-tls \
              --set-json 'networkPolicy.publicIngressFrom=[{"ipBlock":{"cidr":"0.0.0.0/0"}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted unrestricted IPv4 ingress" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.enabled=true --set ingress.host=git.example.com \
              --set ingress.tlsSecretName=crab-http-server-tls \
              --set-json 'networkPolicy.publicIngressFrom=[{"namespaceSelector":{}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted an unrestricted namespace selector" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.host=other.example.com >/dev/null 2>&1; then
            echo "chart accepted an ingress host that differs from the OIDC public URL" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.podMonitor.enabled=true >/dev/null 2>&1; then
            echo "chart accepted a metrics scraper without an allowed source" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.podMonitor.enabled=true \
              --set-json 'networkPolicy.metricsIngressFrom=[{"ipBlock":{"cidr":"::/0"}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted unrestricted IPv6 metrics ingress" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.prometheusRule.enabled=true >/dev/null 2>&1; then
            echo "chart accepted alert rules without metrics discovery" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.podMonitor.enabled=true \
              --set metrics.prometheusRule.enabled=true \
              --set-json 'metrics.prometheusRule.labels={"app.kubernetes.io/name":"other"}' \
              --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted an overridden alert-policy label" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.podMonitor.enabled=true \
              --set-json 'metrics.podMonitor.labels={"app.kubernetes.io/name":"other"}' \
              --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted an overridden metrics-discovery label" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set networkPolicy.enabled=false >/dev/null 2>&1; then
            echo "chart accepted disabled network isolation" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set-json 'podLabels={"app.kubernetes.io/name":"other"}' >/dev/null 2>&1; then
            echo "chart accepted an overridden selector label" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set-json 'podAnnotations={"prometheus.io/scrape":"true"}' >/dev/null 2>&1; then
            echo "chart accepted an overridden management annotation" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set service.type=LoadBalancer >/dev/null 2>&1; then
            echo "chart accepted a direct load balancer that bypasses TLS ingress" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set autoscaling.enabled=true --set autoscaling.minReplicas=5 \
              --set autoscaling.maxReplicas=2 >/dev/null 2>&1; then
            echo "chart accepted an invalid autoscaling range" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set terminationGracePeriodSeconds=629 >/dev/null 2>&1; then
            echo "chart accepted a shutdown budget shorter than pre-stop plus drain" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set podDisruptionBudget.minAvailable=2 >/dev/null 2>&1; then
            echo "chart accepted a disruption budget that blocks every minimum replica" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set-string 'topologySpreadConstraints[0].whenUnsatisfiable=ScheduleAnyway' \
              >/dev/null 2>&1; then
            echo "chart accepted soft zone placement" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set 'topologySpreadConstraints[1].minDomains=1' >/dev/null 2>&1; then
            echo "chart accepted single-node placement" >&2
            exit 1
          fi

          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${terraform_image}" fmt -check -recursive "${terraform_root}"
          for provider in aws gcp azure; do
            module="${terraform_root}/${provider}"
            docker run --rm --volume "${PWD}:/src" --workdir "/src/${module}" \
              "${terraform_image}" init -backend=false -input=false -lockfile=readonly
            docker run --rm --volume "${PWD}:/src:ro" --workdir "/src/${module}" \
              "${terraform_image}" validate
            if [ -d "${module}/tests" ]; then
              docker run --rm --volume "${PWD}:/src" --workdir "/src/${module}" \
                "${terraform_image}" test
            fi
          done
      - name: Build locked server image
        run: >-
          docker build
          --file crates/crab-http-server/deploy/Dockerfile
          --tag crab-http-server:test
          .
      - name: Reject fixable high-severity image vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          crab-http-server:test
      - name: Verify runtime contract
        run: |
          test "$(docker image inspect crab-http-server:test --format '{{.Config.User}}')" = "crab:crab"
          test "$(docker image inspect crab-http-server:test --format '{{.Config.StopSignal}}')" = "SIGTERM"
          docker image inspect crab-http-server:test --format '{{json .Config.Healthcheck.Test}}' | grep -F -- '"healthcheck"'
          test "$(docker run --rm --entrypoint /usr/bin/id crab-http-server:test -u)" = "10001"
          docker run --rm --entrypoint /usr/bin/test crab-http-server:test \
            -s /etc/ssl/certs/ca-certificates.crt
          docker run --rm --entrypoint /usr/bin/test crab-http-server:test \
            -x /usr/bin/sleep
          expected_version="$(sed -n 's/^version = "\(.*\)"/\1/p' \
            crates/crab-http-server/Cargo.toml | head -1)"
          test "$(docker run --rm crab-http-server:test --version)" = \
            "crab-http-server ${expected_version}"
          docker run --rm crab-http-server:test --help | grep -F -- "--config"
          docker run --rm crab-http-server:test --help | grep -F -- "storage-probe"
          docker run --rm crab-http-server:test --config /dev/null repository --help | grep -F -- "create"
          docker run --rm crab-http-server:test --config /dev/null repository --help | grep -F -- "set-members"
      - name: Exercise Compose startup, restore, crash recovery, and restart
        env:
          CRAB_HTTP_SERVER_IMAGE: crab-http-server:test
        run: |
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              docker compose --file crates/crab-http-server/deploy/compose.yaml ps --all || true
              docker compose --file crates/crab-http-server/deploy/compose.yaml logs --no-color || true
            fi
            docker compose --file crates/crab-http-server/deploy/compose.yaml \
              down --volumes --remove-orphans || true
            exit "$result"
          }
          trap cleanup EXIT

          docker compose --file crates/crab-http-server/deploy/compose.yaml \
            up --detach --no-build --wait --wait-timeout 120
          docker compose --file crates/crab-http-server/deploy/compose.yaml \
            run --rm --no-deps repository-init \
              --config /etc/crab/server.toml storage-probe
          docker compose --file crates/crab-http-server/deploy/compose.yaml \
            run --rm --no-deps --entrypoint aws bucket-init \
              --endpoint-url http://rustfs:9000 s3api list-objects-v2 \
              --bucket crab-http-server \
              --prefix repositories/.crab/http-server/v1/auth/preflight/ \
              --output json \
            | jq --exit-status '(.Contents // []) | length == 0'
          printf '%s\n' \
            'members = [{ subject = "ci-admin", name = "CI Admin", access = "admin" }]' \
            | docker compose --file crates/crab-http-server/deploy/compose.yaml \
                run --rm --no-deps --no-TTY repository-init \
                  --config /etc/crab/server.toml repository create \
                  --owner demo --name stdin-members --prefix demo/stdin-members \
                  --members-file - \
            > "${RUNNER_TEMP}/crab-http-server-stdin-repository.json"
          jq --exit-status \
            '.owner == "demo" and .name == "stdin-members" and (.members | any(.subject == "ci-admin" and .access == "admin"))' \
            "${RUNNER_TEMP}/crab-http-server-stdin-repository.json"
          printf '%s\n' \
            'members = [{ subject = "ci-owner", name = "CI Owner", access = "admin" }, { subject = "ci-reader", name = "CI Reader", access = "read" }]' \
            | docker compose --file crates/crab-http-server/deploy/compose.yaml \
                run --rm --no-deps --no-TTY repository-init \
                  --config /etc/crab/server.toml repository set-members \
                  --owner demo --name stdin-members --members-file - \
            > "${RUNNER_TEMP}/crab-http-server-updated-members.json"
          jq --exit-status \
            '.members | length == 2 and any(.subject == "ci-owner" and .access == "admin") and any(.subject == "ci-reader" and .access == "read")' \
            "${RUNNER_TEMP}/crab-http-server-updated-members.json"
          for _ in {1..15}; do
            curl --fail --silent --show-error \
              --dump-header "${RUNNER_TEMP}/crab-http-server-headers" \
              --output "${RUNNER_TEMP}/crab-http-server-repositories.json" \
              http://127.0.0.1:8788/api/repos
            if jq --exit-status \
              '.repositories | any(.owner == "demo" and .name == "stdin-members")' \
              "${RUNNER_TEMP}/crab-http-server-repositories.json" >/dev/null; then
              break
            fi
            sleep 1
          done
          grep --extended-regexp --ignore-case \
            '^x-request-id: [0-9a-f-]{36}[[:space:]]*$' \
            "${RUNNER_TEMP}/crab-http-server-headers"
          docker compose --file crates/crab-http-server/deploy/compose.yaml \
            exec --no-TTY proxy curl --fail --silent --show-error \
              http://127.0.0.1:8789/metrics \
            | grep -F 'crab_http_server_requests_total{method="get",outcome="2xx"}'
          jq --exit-status \
            '.repositories | map(select(.owner == "demo" and (.name == "hello" or .name == "stdin-members"))) | length == 2' \
            "${RUNNER_TEMP}/crab-http-server-repositories.json"

          crates/crab-http-server/tests/qualify_lfs_range_resume.sh \
            http://127.0.0.1:8788

          crates/crab-http-server/tests/qualify_lfs_locking.sh \
            http://127.0.0.1:8788

          crates/crab-http-server/tests/qualify_backup_restore.sh \
            crates/crab-http-server/deploy/compose.yaml

          crates/crab-http-server/tests/qualify_abrupt_receive_crash.sh \
            crates/crab-http-server/deploy/compose.yaml

          docker compose --file crates/crab-http-server/deploy/compose.yaml down
          docker compose --file crates/crab-http-server/deploy/compose.yaml \
            up --detach --no-build --wait --wait-timeout 120
          curl --fail --silent --show-error \
            --output "${RUNNER_TEMP}/crab-http-server-repositories.json" \
            http://127.0.0.1:8788/api/repos
          jq --exit-status \
            '.repositories | map(select(.owner == "demo" and .name == "hello")) | length == 1' \
            "${RUNNER_TEMP}/crab-http-server-repositories.json"
