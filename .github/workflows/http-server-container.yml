name: HTTP server container

on:
  workflow_call:
    inputs:
      source_ref:
        description: "Exact Git ref or commit to qualify"
        required: false
        type: string
      image_ref:
        description: "Immutable server image reference to qualify; empty builds the checked-out source"
        required: false
        type: string
      image_digest:
        description: "Expected digest for image_ref"
        required: false
        type: string
      arm64:
        description: "Build and qualify on a native Linux ARM64 runner"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/workflows/http-server-container.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crab/**"
      - "crates/**"
      - "packages/ui/**"
  workflow_dispatch:
    inputs:
      arm64:
        description: "Build and qualify on a native Linux ARM64 runner"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: http-server-container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and inspect image
    runs-on: ${{ inputs.arm64 && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    env:
      # The ARM runner is native; the repository's cross-linker is absent there.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: cc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - name: Validate deployment profiles
        run: |
          set -euo pipefail
          chart=crates/crab-server/deploy/helm/crab-server
          terraform_root=crates/crab-server/deploy/terraform
          helm_image=alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          kubeconform_image=ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          prometheus_image=prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
          shellcheck_image=koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
          terraform_image=hashicorp/terraform:1.13.3@sha256:dfb1889a8ee74ada3ddacc48f89b8a0d69f3e114de3d8a2ce15f6a8d3dbfdbe2

          for secret_pattern in \
            '**/.env' '**/.env.*' '**/*.key' '**/*.pem' '**/*.p12' \
            '**/*.pfx' '**/id_dsa' '**/id_ed25519' '**/id_ecdsa' '**/id_rsa'; do
            grep --fixed-strings --line-regexp --quiet -- "$secret_pattern" .dockerignore
          done

          jq empty crates/crab-server/deploy/ecs/task-definition.example.json
          jq --exit-status '
            .containerDefinitions[0].command[0]
              | contains("--peer-advertise-host-from-ecs-metadata") and
                contains("unset CRAB_HTTP_CONFIG CRAB_OIDC_CLIENT_SECRET CRAB_STATE_KEY CRAB_PEER_CERTIFICATE CRAB_PEER_PRIVATE_KEY CRAB_PEER_CA")
          ' crates/crab-server/deploy/ecs/task-definition.example.json >/dev/null
          jq --exit-status '
            [.containerDefinitions[0].environment[]
              | select(.name == "CRAB_SERVER_RELEASE_IMAGE")]
              | length == 0
          ' crates/crab-server/deploy/ecs/task-definition.example.json >/dev/null
          jq --exit-status '
            [.containerDefinitions[0].secrets[].name] as $names |
            (["CRAB_HTTP_CONFIG", "CRAB_OIDC_CLIENT_SECRET", "CRAB_STATE_KEY",
              "CRAB_PEER_CERTIFICATE", "CRAB_PEER_PRIVATE_KEY", "CRAB_PEER_CA"]
             | all(. as $name | $names | index($name)))
          ' crates/crab-server/deploy/ecs/task-definition.example.json >/dev/null
          docker compose --file crates/crab-server/deploy/compose.yaml config --quiet
          docker compose \
            --file crates/crab-server/deploy/compose.yaml \
            --file crates/crab-server/deploy/compose.cluster.yaml \
            config --quiet
          release_manifest="${RUNNER_TEMP}/crab-server-release.json"
          release_manifest_generator=crates/crab-server/deploy/generate-release-manifest.sh
          source_sha=0123456789abcdef0123456789abcdef01234567
          image_digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          chart_digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          chart_package_digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          "$release_manifest_generator" \
            crab-server-v0.1.0 0.1.0 "$source_sha" \
            ghcr.io/crabbuild/crab-server "$image_digest" \
            oci://ghcr.io/crabbuild/charts/crab-server "$chart_digest" \
            "$chart_package_digest" \
            "$release_manifest"
          jq --exit-status \
            --arg source_sha "$source_sha" \
            --arg image_digest "$image_digest" \
            --arg chart_digest "$chart_digest" \
            --arg chart_package_digest "$chart_package_digest" \
            '.schema == 1 and .tag == "crab-server-v0.1.0" and
             .version == "0.1.0" and .source_commit == $source_sha and
             .image.repository == "ghcr.io/crabbuild/crab-server" and
             .image.digest == $image_digest and
             .image.reference == "ghcr.io/crabbuild/crab-server@" + $image_digest and
             .image.platforms == ["linux/amd64", "linux/arm64"] and
             .chart.repository == "oci://ghcr.io/crabbuild/charts/crab-server" and
             .chart.digest == $chart_digest and
             .chart.reference == "oci://ghcr.io/crabbuild/charts/crab-server@" + $chart_digest and
             .chart.package == "crab-server-0.1.0.tgz" and
             .chart.package_digest == $chart_package_digest' \
            "$release_manifest" >/dev/null
          for invalid_case in version source image chart digest package_digest; do
            invalid_version=0.1.0
            invalid_source="$source_sha"
            invalid_image=ghcr.io/crabbuild/crab-server
            invalid_chart=oci://ghcr.io/crabbuild/charts/crab-server
            invalid_digest="$image_digest"
            invalid_package_digest="$chart_package_digest"
            case "$invalid_case" in
              version) invalid_version=0.1.1 ;;
              source) invalid_source=not-a-commit ;;
              image) invalid_image=ghcr.io/crabbuild/crab-server:latest ;;
              chart) invalid_chart=oci://example.com/crab-server ;;
              digest) invalid_digest=sha256:bad ;;
              package_digest) invalid_package_digest=sha256:bad ;;
            esac
            if "$release_manifest_generator" \
              crab-server-v0.1.0 "$invalid_version" "$invalid_source" \
              "$invalid_image" "$invalid_digest" "$invalid_chart" "$chart_digest" \
              "$invalid_package_digest" \
              "${RUNNER_TEMP}/invalid-release-manifest.json" >/dev/null 2>&1; then
              echo "release manifest generator accepted invalid ${invalid_case}" >&2
              exit 1
            fi
          done
          bash -n \
            crates/crab-server/deploy/helm/crab-server/qualification/test-load-report.sh \
            crates/crab-server/deploy/helm/crab-server/qualification/verify-workload-identity.sh \
            crates/crab-server/deploy/helm/crab-server/qualification/test-workload-identity.sh
          crates/crab-server/deploy/helm/crab-server/qualification/test-load-report.sh
          crates/crab-server/deploy/helm/crab-server/qualification/test-workload-identity.sh
          docker run --rm --volume "$PWD:/src:ro" "$shellcheck_image" \
            /src/crates/crab-server/tests/qualify_abrupt_receive_crash.sh \
            /src/crates/crab-server/tests/qualify_backup_restore.sh \
            /src/crates/crab-server/tests/hash_backup_restore_objects.sh \
            /src/crates/crab-server/deploy/generate-release-manifest.sh \
            /src/crates/crab-server/deploy/helm/crab-server/qualification/test-load-report.sh \
            /src/crates/crab-server/deploy/helm/crab-server/qualification/verify-workload-identity.sh \
            /src/crates/crab-server/deploy/helm/crab-server/qualification/test-workload-identity.sh \
            /src/crates/crab-server/tests/qualify_lfs_locking.sh \
            /src/crates/crab-server/tests/qualify_lfs_range_resume.sh
          docker run --rm \
            --volume "$PWD/crates/crab-server/deploy/compose.Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm \
            --volume "$PWD/crates/crab-server/deploy/compose.cluster.Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              >/dev/null 2>&1; then
            echo "chart accepted mutable or missing deployment inputs" >&2
            exit 1
          fi

          for forbidden_env in \
            AWS_SECRET_ACCESS_KEY aws_secret_access_key GOOGLE_BASE_URL \
            AZURE_STORAGE_SAS_TOKEN endpoint; do
            if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
              "${helm_image}" template qualification "${chart}" \
                --values "${chart}/team-values.example.yaml" \
                --values "${chart}/eks-values.example.yaml" \
                --set-json "extraEnv=[{\"name\":\"${forbidden_env}\",\"value\":\"unsafe\"}]" \
                >/dev/null 2> "${RUNNER_TEMP}/forbidden-env-error"; then
              echo "chart accepted forbidden cloud environment variable ${forbidden_env}" >&2
              exit 1
            fi
            grep -F 'use workload identity and the provider-native storage endpoint' \
              "${RUNNER_TEMP}/forbidden-env-error"
          done

          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --values "${chart}/team-values.example.yaml" \
              --values "${chart}/eks-values.example.yaml" \
              --set-json 'extraEnv=[{"name":"AWS_SECRET_ACCESS_KEY","valueFrom":{"secretKeyRef":{"name":"static-cloud-key","key":"secret"}}}]' \
              >/dev/null 2> "${RUNNER_TEMP}/forbidden-secret-ref-error"; then
            echo "chart accepted a static cloud credential Secret reference" >&2
            exit 1
          fi
          grep -F 'use workload identity and the provider-native storage endpoint' \
            "${RUNNER_TEMP}/forbidden-secret-ref-error"

          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --values "${chart}/team-values.example.yaml" \
              --values "${chart}/eks-values.example.yaml" \
              --set-json 'extraEnv=[{"name":"RUST_LOG","value":"info"},{"name":"rust_log","value":"debug"}]' \
              >/dev/null 2> "${RUNNER_TEMP}/duplicate-env-error"; then
            echo "chart accepted duplicate environment variable names" >&2
            exit 1
          fi
          grep -F 'duplicates another environment variable' \
            "${RUNNER_TEMP}/duplicate-env-error"

          for values in eks-values.example.yaml gke-values.example.yaml aks-values.example.yaml; do
            values_path="${chart}/${values}"
            profile_values=(--values "${chart}/team-values.example.yaml" --values "${values_path}")
            rendered="${RUNNER_TEMP}/crab-server-${values}"
            docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
              "${helm_image}" lint --strict "${chart}" "${profile_values[@]}"
            docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
              "${helm_image}" template qualification "${chart}" \
                --namespace crab "${profile_values[@]}" \
                --set autoscaling.enabled=true \
                --set ingress.enabled=true \
                --set ingress.className=nginx \
                --set ingress.host=git.example.com \
                --set ingress.tlsSecretName=crab-server-tls \
                --set-json 'networkPolicy.publicIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"ingress-nginx"}}}]' \
                > "${rendered}"
            grep -F 'port: management' "${rendered}"
            grep -F 'terminationGracePeriodSeconds: 630' "${rendered}"
            grep -F 'unhealthyPodEvictionPolicy: AlwaysAllow' "${rendered}"
            grep -F -- '- /usr/bin/sleep' "${rendered}"
            grep -F -- '- "15"' "${rendered}"
            grep -F '"helm.sh/hook": test' "${rendered}"
            grep -F 'kind: Pod' "${rendered}"
            if grep -Fq 'name: cell-release-bootstrap' "${rendered}"; then
              echo 'native Cellar must start without a release bootstrap' >&2
              exit 1
            fi
            grep -F -- '- --peer-advertise-host' "${rendered}"
            # This is the literal Kubernetes env expansion, not a shell substitution.
            # shellcheck disable=SC2016
            grep -F -- '- $(CRAB_POD_IP)' "${rendered}"
            grep -F -- 'mountPath: /var/lib/crab' "${rendered}"
            grep -F -- 'path: peer/tls.crt' "${rendered}"
            grep -F -- 'path: peer/tls.key' "${rendered}"
            grep -F -- 'path: peer/ca.crt' "${rendered}"
            grep -F -- '- storage-probe' "${rendered}"
            docker run --rm \
              --volume "${rendered}:/manifests/server.yaml:ro" \
              "${kubeconform_image}" -strict -summary -kubernetes-version 1.29.0 \
                /manifests/server.yaml
          done

          gke_autopilot_rendered="${RUNNER_TEMP}/crab-server-gke-autopilot.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab \
              --values "${chart}/team-values.example.yaml" \
              --values "${chart}/gke-values.example.yaml" \
              --set-json 'nodeSelector={}' > "${gke_autopilot_rendered}"
          if grep -F 'iam.gke.io/gke-metadata-server-enabled' \
            "${gke_autopilot_rendered}"; then
            echo "GKE Autopilot render retained the Standard-only node selector" >&2
            exit 1
          fi
          docker run --rm \
            --volume "${gke_autopilot_rendered}:/manifests/server.yaml:ro" \
            "${kubeconform_image}" -strict -summary -kubernetes-version 1.29.0 \
              /manifests/server.yaml
          docker run --rm \
            --volume "${PWD}/${chart}/qualification/rbac.example.yaml:/manifests/qualification-rbac.yaml:ro" \
            "${kubeconform_image}" -strict -summary -kubernetes-version 1.29.0 \
              /manifests/qualification-rbac.yaml

          grep -F 'azure.workload.identity/use: "true"' \
            "${RUNNER_TEMP}/crab-server-aks-values.example.yaml"
          nginx_rendered="${RUNNER_TEMP}/crab-server-eks-values.example.yaml"
          grep -F 'nginx.ingress.kubernetes.io/proxy-body-size: "0"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-buffering: "off"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-http-version: "1.1"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-next-upstream: "off"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-read-timeout: "630"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-request-buffering: "off"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/proxy-send-timeout: "630"' "$nginx_rendered"
          grep -F 'nginx.ingress.kubernetes.io/ssl-redirect: "true"' "$nginx_rendered"

          chart_package_dir="${RUNNER_TEMP}/crab-server-chart"
          mkdir -p "$chart_package_dir"
          docker run --rm --volume "${PWD}:/src:ro" \
            --volume "${chart_package_dir}:/out" --workdir /src \
            "${helm_image}" package "${chart}" --destination /out
          chart_version="$(sed -n 's/^version: *//p' "${chart}/Chart.yaml")"
          chart_archive="${chart_package_dir}/crab-server-${chart_version}.tgz"
          test -f "$chart_archive"
          tar -tzf "$chart_archive" \
            | grep -F 'crab-server/templates/tests/catalog.yaml'
          tar -tzf "$chart_archive" \
            | grep -F 'crab-server/qualification/verify-workload-identity.sh'
          tar -tzf "$chart_archive" \
            | grep -F 'crab-server/qualification/test-workload-identity.sh'
          tar -tzf "$chart_archive" \
            | grep -F 'crab-server/qualification/test-load-report.sh'
          tar -tzf "$chart_archive" \
            | grep -F 'crab-server/qualification/validate-load-report.jq'
          tar -tzf "$chart_archive" \
            | grep -F 'crab-server/qualification/rbac.example.yaml'

          profile_values=(
            --values "${chart}/team-values.example.yaml"
            --values "${chart}/eks-values.example.yaml"
          )
          config_resource="${RUNNER_TEMP}/crab-server-config-map.yaml"
          config_file="${RUNNER_TEMP}/crab-server-server.toml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab "${profile_values[@]}" \
              --show-only templates/configmap.yaml \
              > "${config_resource}"
          awk '
            $0 == "  server.toml: |" { found=1; next }
            found && /^    / { sub(/^    /, ""); print; next }
            found { exit }
          ' "${config_resource}" > "${config_file}"
          python3 -c '
          import sys, tomllib
          with open(sys.argv[1], "rb") as config_file:
              config = tomllib.load(config_file)
          assert config["listen"] == "0.0.0.0:8788"
          assert config["management_listen"] == "0.0.0.0:8789"
          assert config["storage"]["url"] == "s3://team-crab-repositories/repositories"
          assert config["cells"] == {
              "data_dir": "/var/lib/crab/cells",
              "local_disk_limit_bytes": 34359738368,
              "peer_advertise": "https://127.0.0.1:8789",
              "peer_tls_server_name": "crab-server-peer",
              "peer_certificate": "/run/secrets/crab/peer/tls.crt",
              "peer_private_key": "/run/secrets/crab/peer/tls.key",
              "peer_ca": "/run/secrets/crab/peer/ca.crt",
          }
          assert config["auth"]["issuer"] == "https://identity.example.com/realms/team"
          assert config["auth"]["public_url"] == "https://git.example.com"
          ' "${config_file}"

          monitor_resource="${RUNNER_TEMP}/crab-server-pod-monitor.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab "${profile_values[@]}" \
              --show-only templates/podmonitor.yaml \
              --set metrics.podMonitor.enabled=true \
              --set metrics.podMonitor.existingSecret=crab-server-metrics \
              --set-json 'metrics.podMonitor.labels={"prometheus":"platform"}' \
              --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
              > "${monitor_resource}"
          grep -F 'kind: PodMonitor' "${monitor_resource}"
          grep -F 'port: management' "${monitor_resource}"
          grep -F 'path: /metrics' "${monitor_resource}"
          grep -F 'scheme: https' "${monitor_resource}"
          grep -F 'name: crab-server-metrics' "${monitor_resource}"
          grep -F 'serverName: "crab-server-peer"' "${monitor_resource}"
          grep -F 'prometheus: platform' "${monitor_resource}"

          rules_resource="${RUNNER_TEMP}/crab-server-prometheus-rule.yaml"
          rules_file="${RUNNER_TEMP}/crab-server-rules.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --namespace crab "${profile_values[@]}" \
              --show-only templates/prometheusrule.yaml \
              --set metrics.podMonitor.enabled=true \
              --set metrics.podMonitor.existingSecret=crab-server-metrics \
              --set metrics.prometheusRule.enabled=true \
              --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
              > "${rules_resource}"
          awk 'found { sub(/^  /, ""); print } /^spec:$/ { found=1 }' \
            "${rules_resource}" > "${rules_file}"
          docker run --rm --entrypoint /bin/promtool \
            --volume "${rules_file}:/rules/crab-server.yaml:ro" \
            "${prometheus_image}" check rules /rules/crab-server.yaml

          default_rendered="${RUNNER_TEMP}/crab-server-default.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.enabled=false \
              --set-json 'networkPolicy.publicIngressFrom=[]' \
              > "${default_rendered}"
          grep -F 'port: management' "${default_rendered}"
          grep -F 'app.kubernetes.io/name: crab-server' "${default_rendered}"

          external_rendered="${RUNNER_TEMP}/crab-server-external-config.yaml"
          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" \
              --set image.repository=registry.example.com/crab-server \
              --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              --set config.existingConfigMap=platform-owned-config \
              --set secrets.existingSecret=platform-owned-secret \
              --set cells.existingSecret=platform-owned-peer-secret \
              --set serviceAccount.name=crab-server \
              > "${external_rendered}"
          grep -F 'name: platform-owned-config' "${external_rendered}"
          if grep -F 'kind: ConfigMap' "${external_rendered}"; then
            echo "chart rendered a managed ConfigMap for an external configuration" >&2
            exit 1
          fi

          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set serviceAccount.automountServiceAccountToken=true \
              >/dev/null 2>&1; then
            echo "chart accepted automatic Kubernetes API credentials" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set image.repository=registry.example.com/crab-server:latest \
              >/dev/null 2>&1; then
            echo "chart accepted a mutable image tag" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set image.repository=registry.example.com/crab-server@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
              >/dev/null 2>&1; then
            echo "chart accepted a digest in image.repository" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set config.existingConfigMap=another-config \
              >/dev/null 2>&1; then
            echo "chart accepted two configuration sources" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set config.storageUrl=https://storage.example.com/repositories \
              >/dev/null 2>&1; then
            echo "chart accepted a non-cloud storage URL" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.enabled=true --set ingress.host=git.example.com \
              --set-string ingress.tlsSecretName= \
              >/dev/null 2>&1; then
            echo "chart accepted ingress without a TLS Secret" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.enabled=true --set ingress.host=git.example.com \
              --set ingress.tlsSecretName=crab-server-tls \
              --set-json 'networkPolicy.publicIngressFrom=[]' >/dev/null 2>&1; then
            echo "chart accepted ingress from every network source" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.enabled=true --set ingress.host=git.example.com \
              --set ingress.tlsSecretName=crab-server-tls \
              --set-json 'networkPolicy.publicIngressFrom=[{"ipBlock":{"cidr":"0.0.0.0/0"}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted unrestricted IPv4 ingress" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.enabled=true --set ingress.host=git.example.com \
              --set ingress.tlsSecretName=crab-server-tls \
              --set-json 'networkPolicy.publicIngressFrom=[{"namespaceSelector":{}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted an unrestricted namespace selector" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set ingress.host=other.example.com >/dev/null 2>&1; then
            echo "chart accepted an ingress host that differs from the OIDC public URL" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.podMonitor.enabled=true \
              --set metrics.podMonitor.existingSecret=crab-server-metrics \
              >/dev/null 2>&1; then
            echo "chart accepted a metrics scraper without an allowed source" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.podMonitor.enabled=true \
              --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted a metrics scraper without a client Secret" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.podMonitor.enabled=true \
              --set metrics.podMonitor.existingSecret=crab-server-peer \
              --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted the Cell peer identity as its metrics client" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.podMonitor.enabled=true \
              --set metrics.podMonitor.existingSecret=crab-server-metrics \
              --set-json 'networkPolicy.metricsIngressFrom=[{"ipBlock":{"cidr":"::/0"}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted unrestricted IPv6 metrics ingress" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.prometheusRule.enabled=true >/dev/null 2>&1; then
            echo "chart accepted alert rules without metrics discovery" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.podMonitor.enabled=true \
              --set metrics.podMonitor.existingSecret=crab-server-metrics \
              --set metrics.prometheusRule.enabled=true \
              --set-json 'metrics.prometheusRule.labels={"app.kubernetes.io/name":"other"}' \
              --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted an overridden alert-policy label" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set metrics.podMonitor.enabled=true \
              --set metrics.podMonitor.existingSecret=crab-server-metrics \
              --set-json 'metrics.podMonitor.labels={"app.kubernetes.io/name":"other"}' \
              --set-json 'networkPolicy.metricsIngressFrom=[{"namespaceSelector":{"matchLabels":{"kubernetes.io/metadata.name":"monitoring"}}}]' \
              >/dev/null 2>&1; then
            echo "chart accepted an overridden metrics-discovery label" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set networkPolicy.enabled=false >/dev/null 2>&1; then
            echo "chart accepted disabled network isolation" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set-json 'podLabels={"app.kubernetes.io/name":"other"}' >/dev/null 2>&1; then
            echo "chart accepted an overridden selector label" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set-json 'podAnnotations={"prometheus.io/scrape":"true"}' >/dev/null 2>&1; then
            echo "chart accepted an overridden management annotation" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set service.type=LoadBalancer >/dev/null 2>&1; then
            echo "chart accepted a direct load balancer that bypasses TLS ingress" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set autoscaling.enabled=true --set autoscaling.minReplicas=5 \
              --set autoscaling.maxReplicas=2 >/dev/null 2>&1; then
            echo "chart accepted an invalid autoscaling range" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set terminationGracePeriodSeconds=629 >/dev/null 2>&1; then
            echo "chart accepted a shutdown budget shorter than pre-stop plus drain" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set podDisruptionBudget.minAvailable=3 >/dev/null 2>&1; then
            echo "chart accepted a disruption budget that blocks every minimum replica" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set-json 'extraEnv=[{"name":"CRAB_POD_IP","value":"127.0.0.1"}]' \
              >/dev/null 2>&1; then
            echo "chart accepted an override of its Pod IP identity" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set-string 'topologySpreadConstraints[0].whenUnsatisfiable=ScheduleAnyway' \
              >/dev/null 2>&1; then
            echo "chart accepted soft zone placement" >&2
            exit 1
          fi
          if docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${helm_image}" template qualification "${chart}" "${profile_values[@]}" \
              --set 'topologySpreadConstraints[1].minDomains=2' >/dev/null 2>&1; then
            echo "chart accepted fewer than three node domains" >&2
            exit 1
          fi

          docker run --rm --volume "${PWD}:/src:ro" --workdir /src \
            "${terraform_image}" fmt -check -recursive "${terraform_root}"
          for provider in aws gcp azure; do
            module="${terraform_root}/${provider}"
            docker run --rm --volume "${PWD}:/src" --workdir "/src/${module}" \
              "${terraform_image}" init -backend=false -input=false -lockfile=readonly
            docker run --rm --volume "${PWD}:/src:ro" --workdir "/src/${module}" \
              "${terraform_image}" validate
            if [ -d "${module}/tests" ]; then
              docker run --rm --volume "${PWD}:/src" --workdir "/src/${module}" \
                "${terraform_image}" test
            fi
          done
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build or import locked server image
        id: image
        env:
          INPUT_IMAGE_DIGEST: ${{ inputs.image_digest }}
          INPUT_IMAGE_REF: ${{ inputs.image_ref }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_IMAGE_REF" ]; then
            if [[ ! "$INPUT_IMAGE_REF" =~ ^ghcr\.io/[^@]+@sha256:[0-9a-f]{64}$ ]]; then
              echo "image_ref must be an immutable GitHub Container Registry sha256 reference." >&2
              exit 1
            fi
            if [[ ! "$INPUT_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "image_digest must be a sha256 digest when image_ref is set." >&2
              exit 1
            fi
            ref_digest="${INPUT_IMAGE_REF##*@}"
            test "$ref_digest" = "$INPUT_IMAGE_DIGEST"
            docker pull "$INPUT_IMAGE_REF"
            docker image inspect "$INPUT_IMAGE_REF" --format '{{json .RepoDigests}}' \
              | jq --exit-status --arg digest "$INPUT_IMAGE_DIGEST" \
                'any(.[]; endswith("@" + $digest))' >/dev/null
            docker tag "$INPUT_IMAGE_REF" crab-server:test
            digest="$INPUT_IMAGE_DIGEST"
          else
            if [ -n "$INPUT_IMAGE_DIGEST" ]; then
              echo "image_digest requires image_ref." >&2
              exit 1
            fi
            git archive --format=tar HEAD | docker build \
              --file crates/crab-server/deploy/Dockerfile \
              --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
              --tag crab-server:test \
              -
            digest="$(docker image inspect crab-server:test --format '{{.Id}}')"
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Reject fixable high-severity image vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image
          --scanners vuln
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          crab-server:test
      - name: Verify runtime contract
        run: |
          test "$(docker image inspect crab-server:test --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$(git rev-parse HEAD)"
          test "$(docker image inspect crab-server:test --format '{{.Config.User}}')" = "crab:crab"
          test "$(docker image inspect crab-server:test --format '{{.Config.StopSignal}}')" = "SIGTERM"
          docker image inspect crab-server:test --format '{{json .Config.Healthcheck.Test}}' | grep -F -- '"healthcheck"'
          test "$(docker run --rm --entrypoint /usr/bin/id crab-server:test -u)" = "10001"
          docker run --rm --entrypoint /usr/bin/test crab-server:test \
            -s /etc/ssl/certs/ca-certificates.crt
          docker run --rm --entrypoint /usr/bin/test crab-server:test \
            -x /usr/bin/sleep
          expected_version="$(sed -n 's/^version = "\(.*\)"/\1/p' \
            crates/crab-server/Cargo.toml | head -1)"
          test "$(docker run --rm crab-server:test --version)" = \
            "crab-server ${expected_version}"
          docker run --rm crab-server:test --help | grep -F -- "--config"
          docker run --rm crab-server:test --help | grep -F -- "storage-probe"
          docker run --rm crab-server:test --config /dev/null repository --help | grep -F -- "create"
          docker run --rm crab-server:test --config /dev/null repository --help | grep -F -- "set-members"
      - name: Install process qualification dependencies
        run: |
          git --version
          openssl version
          python3 --version
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Qualify the native image against RustFS and process restart
        run: |
          python3 crates/crab-server/tests/qualify_cellar_process.py \
            --image crab-server:test \
            --artifacts "${RUNNER_TEMP}/crab-cellar-process-proof"
      - name: Bind native process evidence to the checked source and image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          evidence_dir="${RUNNER_TEMP}/crab-cellar-process-qualification"
          mkdir -p "$evidence_dir"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          receipts = list((root / "crab-cellar-process-proof").glob("*/receipt.json"))
          if len(receipts) != 1:
              raise SystemExit("expected exactly one native process receipt")
          receipt = json.loads(receipts[0].read_text())
          if not (receipt["schema"] == 1 and receipt["runtime"] == "cellar"
                  and receipt["version"] == "0.1.0" and receipt["durable_objects"] > 0
                  and all(receipt[key] is True for key in
                          ["repository_creation", "issue_replay", "git_push", "process_restart",
                           "reaction_restart", "reaction_remove", "milestone_restart", "milestone_progress"])):
              raise SystemExit("native process proof is incomplete")
          target = root / "crab-cellar-process-qualification/native-process-receipt.json"
          target.write_text(json.dumps(receipt, indent=2))
          PY
          git rev-parse HEAD > "$evidence_dir/source-revision"
          printf '%s\n' "$IMAGE_DIGEST" > "$evidence_dir/image-digest"
          sha256sum "$evidence_dir/native-process-receipt.json" > "$evidence_dir/artifact.sha256"
      - name: Upload exact-source native process evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cellar-process-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/crab-cellar-process-qualification
          if-no-files-found: error
          retention-days: 14
      - name: Retain failed process diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cellar-process-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/crab-cellar-process-proof/**/commands.log
            ${{ runner.temp }}/crab-cellar-process-proof/**/server.log
          if-no-files-found: warn
      - name: Export the qualified Linux image
        shell: bash
        run: |
          set -euo pipefail
          image_dir="${RUNNER_TEMP}/crab-server-qualified-image"
          mkdir -p "$image_dir"
          git rev-parse HEAD > "$image_dir/source-revision"
          docker image inspect crab-server:test --format '{{.Id}}' > "$image_dir/image-id"
          docker image inspect crab-server:test --format '{{.Os}}/{{.Architecture}}' > "$image_dir/platform"
          docker image save --output "$image_dir/image.tar" crab-server:test
          gzip -1 "$image_dir/image.tar"
          cd "$image_dir"
          sha256sum image.tar.gz > image.sha256
      - name: Upload the qualified Linux image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: http-server-image-${{ github.run_id }}
          path: ${{ runner.temp }}/crab-server-qualified-image
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
