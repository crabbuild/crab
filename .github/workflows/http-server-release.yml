name: HTTP server release image

on:
  push:
    tags: ["crab-http-server-v*"]

permissions:
  contents: read
  packages: read

concurrency:
  group: http-server-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/crab-http-server
  CHART_REGISTRY: ghcr.io/${{ github.repository_owner }}/charts

jobs:
  prepare:
    name: Prepare server release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate the release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^crab-http-server-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Server release tag must be stable SemVer such as crab-http-server-v0.1.0, got '$tag'."
            exit 1
          fi

          version="${tag#crab-http-server-v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/crab-http-server/Cargo.toml | head -1)"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::Release tag $tag does not match crab-http-server version $manifest_version."
            exit 1
          fi

          chart_version="$(sed -n 's/^version: *//p' crates/crab-http-server/deploy/helm/crab-http-server/Chart.yaml | head -1)"
          app_version="$(sed -n 's/^appVersion: *"\(.*\)"/\1/p' crates/crab-http-server/deploy/helm/crab-http-server/Chart.yaml | head -1)"
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "::error::Helm chart and app versions must both match server version $version."
            exit 1
          fi

          if [ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]; then
            echo "::error::$tag must be an annotated tag."
            exit 1
          fi

          source_sha="$(git rev-list -n 1 "$tag")"
          if [ "$(git rev-parse HEAD)" != "$source_sha" ]; then
            echo "::error::Checked-out source does not match $tag."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "::error::$tag is not reachable from origin/main."
            exit 1
          fi

          {
            echo "version=$version"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

  candidate:
    name: Build immutable qualification candidate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.candidate_ref.outputs.image_ref }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up emulation
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Compute unique candidate reference
        id: candidate_ref
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          reference="${REGISTRY}/${IMAGE_NAME}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${SOURCE_SHA:0:12}"
          printf 'image_ref=%s\n' "$reference" >> "$GITHUB_OUTPUT"

      - name: Build and publish the candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: crates/crab-http-server/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.candidate_ref.outputs.image_ref }}
          labels: |
            org.opencontainers.image.title=crab-http-server
            org.opencontainers.image.description=Self-hosted Crab repository HTTP application
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=crab-http-server-release
          cache-to: type=gha,mode=max,scope=crab-http-server-release
          provenance: mode=max
          sbom: true

      - name: Verify candidate platform coverage
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REF: ${{ steps.candidate_ref.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_REF}@${IMAGE_DIGEST}" \
            --format '{{json .Manifest}}' > "${RUNNER_TEMP}/candidate-manifest.json"
          jq --exit-status '
            [.manifests[]?.platform
              | select(.os == "linux")
              | select(.architecture == "amd64" or .architecture == "arm64")
              | .architecture]
            | sort == ["amd64", "arm64"]
          ' "${RUNNER_TEMP}/candidate-manifest.json"

  qualification:
    name: Qualify exact tagged source
    needs: [prepare, candidate]
    uses: ./.github/workflows/http-server-container.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
      image_ref: ${{ needs.candidate.outputs.image_ref }}@${{ needs.candidate.outputs.image_digest }}
      image_digest: ${{ needs.candidate.outputs.image_digest }}

  image:
    name: Publish qualified release artifacts
    needs: [prepare, candidate, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out the qualified source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Rust for receipt verification
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master

      - name: Download exact-source qualification evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cell-runtime-qualification-${{ github.run_id }}
          path: ${{ runner.temp }}/crab-cell-runtime-qualification

      - name: Package the Helm chart
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/chart"
          docker run --rm \
            --volume "${PWD}:/src:ro" \
            --volume "${RUNNER_TEMP}/chart:/dist" \
            --workdir /src \
            alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 \
            package crates/crab-http-server/deploy/helm/crab-http-server \
            --destination /dist
          test -s "${RUNNER_TEMP}/chart/crab-http-server-${VERSION}.tgz"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Reject existing immutable artifacts
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}"
          for reference in "${image}:${VERSION}" "${image}:sha-${SOURCE_SHA}"; do
            set +e
            inspect_output="$(docker buildx imagetools inspect "$reference" 2>&1)"
            inspect_status=$?
            set -e
            if [ "$inspect_status" -eq 0 ]; then
              echo "::error::Immutable image tag already exists: $reference"
              exit 1
            fi
            if ! grep --extended-regexp --ignore-case --quiet \
              'manifest unknown|not found' <<< "$inspect_output"; then
              printf '%s\n' "$inspect_output"
              echo "::error::Could not prove that image tag is unused: $reference"
              exit 1
            fi
          done

          set +e
          chart_output="$(docker run --rm \
            --volume "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            --env HELM_REGISTRY_CONFIG=/root/.docker/config.json \
            alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 \
            show chart "oci://${CHART_REGISTRY}/crab-http-server" \
            --version "$VERSION" 2>&1)"
          chart_status=$?
          set -e
          if [ "$chart_status" -eq 0 ]; then
            echo "::error::Immutable Helm chart version already exists: $VERSION"
            exit 1
          fi
          if ! grep --extended-regexp --ignore-case --quiet \
            'manifest unknown|not found' <<< "$chart_output"; then
            printf '%s\n' "$chart_output"
            echo "::error::Could not prove that Helm chart version is unused: $VERSION"
            exit 1
          fi

      - name: Promote the qualified candidate image
        id: promote
        env:
          CANDIDATE_DIGEST: ${{ needs.candidate.outputs.image_digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Candidate image did not report an immutable digest." >&2
            exit 1
          fi
          source="${REGISTRY}/${IMAGE_NAME}@${CANDIDATE_DIGEST}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:sha-${SOURCE_SHA}" \
            "$source"
          for reference in \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            "${REGISTRY}/${IMAGE_NAME}:sha-${SOURCE_SHA}"; do
            actual="$(docker buildx imagetools inspect "$reference" \
              --format '{{json .Manifest.Digest}}' | jq --raw-output .)"
            if [ "$actual" != "$CANDIDATE_DIGEST" ]; then
              echo "::error::$reference was promoted as $actual, expected $CANDIDATE_DIGEST."
              exit 1
            fi
          done
          printf 'digest=%s\n' "$CANDIDATE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest the registry image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.promote.outputs.digest }}
          push-to-registry: true

      - name: Verify the published manifest
        shell: bash
        env:
          DIGEST: ${{ steps.promote.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}"
          for reference in "${image}:${VERSION}" "${image}:sha-${SOURCE_SHA}"; do
            actual="$(docker buildx imagetools inspect "$reference" \
              --format '{{json .Manifest.Digest}}' | jq --raw-output .)"
            if [ "$actual" != "$DIGEST" ]; then
              echo "::error::$reference resolves to $actual, expected $DIGEST."
              exit 1
            fi
          done

          docker buildx imagetools inspect "${image}@${DIGEST}" \
            --format '{{json .Manifest}}' > "${RUNNER_TEMP}/crab-http-server-manifest.json"
          jq --exit-status '
            [.manifests[]?.platform
              | select(.os == "linux")
              | select(.architecture == "amd64" or .architecture == "arm64")
              | .architecture]
            | sort == ["amd64", "arm64"]
          ' "${RUNNER_TEMP}/crab-http-server-manifest.json"

      - name: Bind and verify the release qualification receipt
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail

          evidence_dir="${RUNNER_TEMP}/crab-cell-runtime-qualification"
          test "$(cat "$evidence_dir/source-revision")" = "$SOURCE_SHA"
          test "$(cat "$evidence_dir/image-digest")" = "$IMAGE_DIGEST"
          test -s "$evidence_dir/cluster-receipt.json"
          test -s "$evidence_dir/artifact.sha256"
          (cd "$evidence_dir" && sha256sum --check artifact.sha256)

          release_dir="${RUNNER_TEMP}/crab-http-server-release"
          mkdir -p "$release_dir"
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/crab-cell-runtime-target"
          cargo run --locked --quiet -p crab-cell-runtime --bin qualification_receipt \
            -- validate-cluster "$evidence_dir/cluster-receipt.json" \
            "$SOURCE_SHA" "$IMAGE_DIGEST" release
          cargo run --locked --quiet -p crab-cell-runtime --bin qualification_receipt \
            -- emit "$release_dir/cell-runtime-qualification.json" \
            "$SOURCE_SHA" "$IMAGE_DIGEST" "$evidence_dir/cluster-receipt.json" \
            github-actions http-server-release none
          cargo run --locked --quiet -p crab-cell-runtime --bin qualification_receipt \
            -- verify "$release_dir/cell-runtime-qualification.json" \
            "$SOURCE_SHA" "$IMAGE_DIGEST" "$evidence_dir/cluster-receipt.json"

      - name: Require protected Cell runtime qualification matrix
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          QUALIFICATION_SIGNER: ${{ vars.CRAB_CELL_RUNTIME_QUALIFICATION_SIGNER }}
        run: |
          set -euo pipefail

          evidence_dir="${RUNNER_TEMP}/crab-cell-runtime-qualification"
          protected_dir="$evidence_dir/protected"
          if [[ ! "$QUALIFICATION_SIGNER" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::CRAB_CELL_RUNTIME_QUALIFICATION_SIGNER must be a pinned 32-byte lowercase Ed25519 public key."
            exit 1
          fi
          export CARGO_TARGET_DIR="${RUNNER_TEMP}/crab-cell-runtime-target"
          required_profiles=(
            "local-provider-v1|qualification-matrix-local-provider.json"
            "scale-v1|qualification-matrix.json"
            "compatibility-v1|qualification-matrix-compatibility.json"
            "provider-s3-v1|qualification-matrix-provider-s3.json"
            "provider-gcs-v1|qualification-matrix-provider-gcs.json"
            "provider-azure-v1|qualification-matrix-provider-azure.json"
            "fault-s3-v1|qualification-matrix-fault-s3.json"
            "fault-gcs-v1|qualification-matrix-fault-gcs.json"
            "fault-azure-v1|qualification-matrix-fault-azure.json"
          )
          for requirement in "${required_profiles[@]}"; do
            IFS='|' read -r profile_name matrix_name <<< "$requirement"
            matrix="$protected_dir/$matrix_name"
            profile="$protected_dir/$profile_name.json"
            tracked_profile="crates/crab-cell-runtime/qualification/profiles/$profile_name.json"
            test -s "$matrix" || {
              echo "::error::Protected Cell runtime matrix is required at $matrix; fixture receipts cannot qualify a release."
              exit 1
            }
            test -s "$profile" || {
              echo "::error::Protected profile is required at $profile."
              exit 1
            }
            test -f "$tracked_profile" || {
              echo "::error::The checked-out source is missing the tracked $profile_name qualification profile."
              exit 1
            }
            test ! -L "$matrix" && test ! -L "$profile" || {
              echo "::error::Protected qualification evidence must not contain symlinks."
              exit 1
            }
            cmp -- "$profile" "$tracked_profile" || {
              echo "::error::Protected $profile_name profile does not match the exact tagged source."
              exit 1
            }
            cargo run --locked --quiet -p crab-cell-runtime --bin qualification_receipt \
              -- verify-matrix "$matrix" \
              "$SOURCE_SHA" "$IMAGE_DIGEST" "$profile" "$QUALIFICATION_SIGNER"
          done

      - name: Package verified Cell runtime qualification evidence
        shell: bash
        run: |
          set -euo pipefail

          evidence_dir="${RUNNER_TEMP}/crab-cell-runtime-qualification"
          protected_dir="$evidence_dir/protected"
          release_dir="${RUNNER_TEMP}/crab-http-server-release"
          bundle="$release_dir/cell-runtime-qualification.tar.gz"
          mkdir -p "$release_dir"
          if find "$protected_dir" -type l -print -quit | grep --quiet .; then
            echo "::error::Protected qualification evidence must not contain symlinks."
            exit 1
          fi
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$protected_dir" . | gzip --no-name > "$bundle"
          (
            cd "$release_dir"
            sha256sum "$(basename "$bundle")" > "$(basename "$bundle").sha256"
          )

      - name: Publish and verify the Helm chart
        id: chart
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          package="crab-http-server-${VERSION}.tgz"
          push_output="$(docker run --rm \
            --volume "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            --volume "${RUNNER_TEMP}/chart:/dist:ro" \
            --env HELM_REGISTRY_CONFIG=/root/.docker/config.json \
            alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 \
            push "/dist/${package}" "oci://${CHART_REGISTRY}" 2>&1)"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | sed -n 's/^Digest: //p' | tail -1)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Helm did not report a valid chart digest."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

          mkdir -p "${RUNNER_TEMP}/chart-verify"
          docker run --rm \
            --volume "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            --volume "${RUNNER_TEMP}/chart-verify:/verify" \
            --env HELM_REGISTRY_CONFIG=/root/.docker/config.json \
            alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 \
            pull "oci://${CHART_REGISTRY}/crab-http-server" \
            --version "$VERSION" --destination /verify
          cmp "${RUNNER_TEMP}/chart/${package}" \
            "${RUNNER_TEMP}/chart-verify/${package}"

      - name: Attest the registry chart
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REGISTRY }}/crab-http-server
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Create the release manifest
        shell: bash
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          release_dir="${RUNNER_TEMP}/crab-http-server-release"
          image_repository="${REGISTRY}/${IMAGE_NAME}"
          chart_repository="oci://${CHART_REGISTRY}/crab-http-server"
          chart_package="${RUNNER_TEMP}/chart/crab-http-server-${VERSION}.tgz"
          chart_package_digest="sha256:$(sha256sum "$chart_package" | awk '{print $1}')"
          crates/crab-http-server/deploy/generate-release-manifest.sh \
            "$TAG" "$VERSION" "$SOURCE_SHA" \
            "$image_repository" "$IMAGE_DIGEST" \
            "$chart_repository" "$CHART_DIGEST" \
            "$chart_package_digest" \
            "$release_dir/crab-http-server-release.json"

      - name: Attest the release manifest
        id: release-manifest-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/crab-http-server-release/crab-http-server-release.json

      - name: Verify and preserve the release-manifest attestation
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.release-manifest-attestation.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_dir="${RUNNER_TEMP}/crab-http-server-release"
          bundle="$release_dir/crab-http-server-release.attestation.json"
          cp "$BUNDLE_PATH" "$bundle"
          gh attestation verify \
            "$release_dir/crab-http-server-release.json" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/http-server-release.yml" \
            --source-ref "refs/tags/${TAG}" \
            --source-digest "$SOURCE_SHA" \
            --deny-self-hosted-runners

      - name: Publish the GitHub release
        shell: bash
        env:
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ steps.promote.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          release_dir="${RUNNER_TEMP}/crab-http-server-release"
          notes="$release_dir/release-notes.md"
          chart_package_digest="$(jq --raw-output .chart.package_digest \
            "$release_dir/crab-http-server-release.json")"
          cat > "$notes" <<EOF
          Qualified Crab HTTP Server ${VERSION} deployment artifacts.

          - Source commit: \`${SOURCE_SHA}\`
          - Image: \`${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}\`
          - Helm chart: \`oci://${CHART_REGISTRY}/crab-http-server@${CHART_DIGEST}\`
          - Chart package: \`crab-http-server-${VERSION}.tgz\` (\`${chart_package_digest}\`)
          - Platforms: \`linux/amd64\`, \`linux/arm64\`
          - Cell runtime qualification: \`cell-runtime-qualification.tar.gz\` and its SHA-256 sidecar; the bundle contains the verified matrix, profile, receipts, and raw artifacts bound to the source and image above.

          Download and verify the signed deployment record:

          \`\`\`sh
          gh release download ${TAG} --repo ${GITHUB_REPOSITORY} \\
            --pattern 'crab-http-server-*' \\
            --pattern 'cell-runtime-qualification.tar.gz*'
          sha256sum --check cell-runtime-qualification.tar.gz.sha256
          mkdir cell-runtime-qualification
          tar -xzf cell-runtime-qualification.tar.gz -C cell-runtime-qualification
          gh attestation verify crab-http-server-release.json \\
            --bundle crab-http-server-release.attestation.json \\
            --repo ${GITHUB_REPOSITORY} \\
            --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/http-server-release.yml \\
            --source-ref refs/tags/${TAG} \\
            --source-digest ${SOURCE_SHA} \\
            --deny-self-hosted-runners
          \`\`\`
          EOF

          gh release create "$TAG" \
            "$release_dir/crab-http-server-release.json" \
            "$release_dir/crab-http-server-release.attestation.json" \
            "$release_dir/cell-runtime-qualification.tar.gz" \
            "$release_dir/cell-runtime-qualification.tar.gz.sha256" \
            "${RUNNER_TEMP}/chart/crab-http-server-${VERSION}.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --latest=false \
            --title "Crab HTTP Server ${VERSION}" \
