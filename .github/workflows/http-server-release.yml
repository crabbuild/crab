name: HTTP server release image

on:
  push:
    tags: ["crab-http-server-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Annotated server release tag (for example crab-http-server-v0.1.0)"
        required: true

permissions:
  contents: read

concurrency:
  group: http-server-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/crab-http-server

jobs:
  prepare:
    name: Prepare server release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate the release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^crab-http-server-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Server release tag must be stable SemVer such as crab-http-server-v0.1.0, got '$tag'."
            exit 1
          fi

          version="${tag#crab-http-server-v}"
          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/crab-http-server/Cargo.toml | head -1)"
          if [ "$manifest_version" != "$version" ]; then
            echo "::error::Release tag $tag does not match crab-http-server version $manifest_version."
            exit 1
          fi

          if [ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]; then
            echo "::error::$tag must be an annotated tag."
            exit 1
          fi

          source_sha="$(git rev-list -n 1 "$tag")"
          if [ "$(git rev-parse HEAD)" != "$source_sha" ]; then
            echo "::error::Checked-out source does not match $tag."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$source_sha" origin/main; then
            echo "::error::$tag is not reachable from origin/main."
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "source_sha=$source_sha"
          } >> "$GITHUB_OUTPUT"

  qualification:
    name: Qualify exact tagged source
    needs: prepare
    uses: ./.github/workflows/http-server-container.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}

  image:
    name: Publish qualified multi-platform image
    needs: [prepare, qualification]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the qualified source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}

      - name: Set up emulation
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Reject an existing immutable tag
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}"
          for reference in "${image}:${VERSION}" "${image}:sha-${SOURCE_SHA}"; do
            if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
              echo "::error::Immutable image tag already exists: $reference"
              exit 1
            fi
          done

      - name: Build and publish the image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: crates/crab-http-server/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ needs.prepare.outputs.source_sha }}
          labels: |
            org.opencontainers.image.title=crab-http-server
            org.opencontainers.image.description=Self-hosted Crab repository HTTP application
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha,scope=crab-http-server-release
          cache-to: type=gha,mode=max,scope=crab-http-server-release
          provenance: mode=max
          sbom: true

      - name: Attest the registry image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify the published manifest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME}"
          for reference in "${image}:${VERSION}" "${image}:sha-${SOURCE_SHA}"; do
            actual="$(docker buildx imagetools inspect "$reference" \
              --format '{{json .Manifest.Digest}}' | jq --raw-output .)"
            if [ "$actual" != "$DIGEST" ]; then
              echo "::error::$reference resolves to $actual, expected $DIGEST."
              exit 1
            fi
          done

          docker buildx imagetools inspect "${image}@${DIGEST}" \
            --format '{{json .Manifest}}' > "${RUNNER_TEMP}/crab-http-server-manifest.json"
          jq --exit-status '
            [.manifests[]?.platform
              | select(.os == "linux")
              | select(.architecture == "amd64" or .architecture == "arm64")
              | .architecture]
            | sort == ["amd64", "arm64"]
          ' "${RUNNER_TEMP}/crab-http-server-manifest.json"
