name: Release

# Triggered by pushing a version tag (e.g. `git tag v1.0.2 && git push origin v1.0.2`)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.2)"
        required: true
      require_enterprise_evidence:
        description: "Run enterprise evidence gates before building CLI artifacts"
        type: boolean
        required: false
        default: false
      require_nfs_evidence:
        description: "Require retained native NFS mount evidence before building CLI artifacts"
        type: boolean
        required: false
        default: false
      require_cloud_evidence:
        description: "Require live AWS S3 and cross-platform protocol evidence before publishing"
        type: boolean
        required: false
        default: false
      replica_evidence_run_id:
        description: "Run ID from the Replica Live Evidence enterprise workflow"
        required: false
      replica_evidence_artifact:
        description: "Artifact name from the live evidence run; defaults to replica-live-evidence-<run-id>-<attempt>"
        required: false
        default: ""
      cache_service_evidence_run_id:
        description: "Run ID from the Cache Service Tests workflow"
        required: false
      cache_service_evidence_artifact:
        description: "Artifact name from the cache-service smoke run; defaults to cache-service-rustfs-smoke-<run-id>-<attempt>"
        required: false
        default: ""
      nfs_evidence_run_id:
        description: "Run ID from the NFS Mount Evidence workflow"
        required: false
      nfs_release_verify_args:
        description: "Optional args for make nfs-release-gate, usually promoted from retained NFS threshold suggestions"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REPO: ${{ github.repository }}
  TAP_REPO: crabbuild/homebrew-tap
  CARGO_TERM_COLOR: always
  REPLICA_RELEASE_EVIDENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.replica_evidence_run_id || vars.CRAB_REPLICA_RELEASE_EVIDENCE_RUN_ID }}
  REPLICA_RELEASE_EVIDENCE_ARTIFACT: ${{ github.event_name == 'workflow_dispatch' && inputs.replica_evidence_artifact || vars.CRAB_REPLICA_RELEASE_EVIDENCE_ARTIFACT }}
  CACHE_SERVICE_RELEASE_EVIDENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_service_evidence_run_id || vars.CRAB_CACHE_SERVICE_RELEASE_EVIDENCE_RUN_ID }}
  CACHE_SERVICE_RELEASE_EVIDENCE_ARTIFACT: ${{ github.event_name == 'workflow_dispatch' && inputs.cache_service_evidence_artifact || vars.CRAB_CACHE_SERVICE_RELEASE_EVIDENCE_ARTIFACT }}
  NFS_RELEASE_EVIDENCE_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.nfs_evidence_run_id || vars.CRAB_NFS_RELEASE_EVIDENCE_RUN_ID }}
  NFS_RELEASE_VERIFY_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.nfs_release_verify_args || vars.CRAB_NFS_RELEASE_VERIFY_ARGS }}

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      source_short_sha: ${{ steps.release.outputs.source_short_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail

          tag="$REQUESTED_TAG"
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be stable SemVer such as v1.2.3, got '$tag'."
            exit 1
          fi

          version="$(sed -n 's/^version = "\(.*\)"/\1/p' crab/Cargo.toml | head -1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read crab/Cargo.toml package version."
            exit 1
          fi

          if [ "v${version}" != "$tag" ]; then
            echo "::error::Release tag $tag does not match crab/Cargo.toml version ${version}."
            exit 1
          fi

          for manifest in crab/Cargo.toml crates/crab-auth-server/Cargo.toml crates/crab-cache-server/Cargo.toml; do
            manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' "$manifest" | head -1)"
            if [ "$manifest_version" != "$version" ]; then
              echo "::error::$manifest has $manifest_version, expected $version."
              exit 1
            fi
          done

          for package in crab crab-auth-server crab-cache-server; do
            lock_version="$(awk -v package="$package" '
              $0 == "name = \"" package "\"" { found = 1; next }
              found && /^version = / { gsub(/^version = \"|\"$/, ""); print; exit }
            ' Cargo.lock)"
            if [ "$lock_version" != "$version" ]; then
              echo "::error::Cargo.lock has $package $lock_version, expected $version."
              exit 1
            fi
          done

          if ! grep -Eq "^## ${version} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md must contain a dated ${version} release section."
            exit 1
          fi

          if [ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]; then
            echo "::error::$tag must be an annotated tag."
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$tag is not reachable from origin/main."
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          source_short_sha="$(git rev-parse --short HEAD)"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "source_short_sha=$source_short_sha"
          } >> "$GITHUB_OUTPUT"

  workflow-release-gate:
    name: Workflow release gate (RustFS)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKFLOW_RUSTFS_ACCESS_KEY: crab
      WORKFLOW_RUSTFS_SECRET_KEY: crab
      WORKFLOW_RUSTFS_BUCKET: crab
      WORKFLOW_RUSTFS_ENDPOINT: http://127.0.0.1:9000
      WORKFLOW_RUSTFS_REGION: us-east-1
      WORKFLOW_RUSTFS_ROOT: /tmp/crab-workflow-release-gate
      WORKFLOW_RUSTFS_RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
      WORKFLOW_RUSTFS_IMAGE: rustfs/rustfs:1.0.0-beta.8-glibc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
      - name: Install workflow smoke dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl libfuse3-dev pipx
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build release candidate
        run: |
          cargo build -p crab --release --locked
          ln -sf crab target/release/git-remote-crab
      - name: Start RustFS
        run: |
          mkdir -p "${WORKFLOW_RUSTFS_ROOT}" "${RUNNER_TEMP}/rustfs-data"
          sudo chown 10001:10001 "${RUNNER_TEMP}/rustfs-data"
          docker run -d \
            --name crab-workflow-rustfs \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY \
            -e RUSTFS_SECRET_KEY \
            -v "${RUNNER_TEMP}/rustfs-data:/data" \
            "${WORKFLOW_RUSTFS_IMAGE}" server /data --address :9000
          ready=false
          for _ in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "${WORKFLOW_RUSTFS_ENDPOINT}" || true)"
            if [ "${status:-000}" != "000" ] && [ "${status}" -lt 500 ]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "${ready}" != true ]; then
            docker logs crab-workflow-rustfs >&2 || true
            exit 1
          fi
          if ! aws --endpoint-url "${WORKFLOW_RUSTFS_ENDPOINT}" s3api head-bucket --bucket "${WORKFLOW_RUSTFS_BUCKET}" >/dev/null 2>&1; then
            aws --endpoint-url "${WORKFLOW_RUSTFS_ENDPOINT}" s3api create-bucket --bucket "${WORKFLOW_RUSTFS_BUCKET}" >/dev/null
          fi
          aws --endpoint-url "${WORKFLOW_RUSTFS_ENDPOINT}" s3api head-bucket --bucket "${WORKFLOW_RUSTFS_BUCKET}" >/dev/null
        env:
          RUSTFS_ACCESS_KEY: ${{ env.WORKFLOW_RUSTFS_ACCESS_KEY }}
          RUSTFS_SECRET_KEY: ${{ env.WORKFLOW_RUSTFS_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ env.WORKFLOW_RUSTFS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.WORKFLOW_RUSTFS_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ env.WORKFLOW_RUSTFS_REGION }}
      - name: Run workflow smoke against release candidate
        env:
          CRAB_RUSTFS_IMAGE: ${{ env.WORKFLOW_RUSTFS_IMAGE }}
        run: |
          export PATH="$GITHUB_WORKSPACE/target/release:$PATH"
          python3 crab/scripts/e2e/run_dvc_workflow_smoke.py \
            --root "${WORKFLOW_RUSTFS_ROOT}" \
            --run-id "${WORKFLOW_RUSTFS_RUN_ID}" \
            --source-sha "${{ needs.prepare.outputs.source_sha }}" \
            --bucket "${WORKFLOW_RUSTFS_BUCKET}" \
            --endpoint-url "${WORKFLOW_RUSTFS_ENDPOINT}" \
            --region "${WORKFLOW_RUSTFS_REGION}" \
            --access-key "${WORKFLOW_RUSTFS_ACCESS_KEY}" \
            --secret-key "${WORKFLOW_RUSTFS_SECRET_KEY}" \
            --min-free-bytes 1073741824
      - name: Verify exact-commit workflow evidence
        run: |
          python3 crab/scripts/e2e/verify_workflow_evidence.py \
            "${WORKFLOW_RUSTFS_ROOT}/${WORKFLOW_RUSTFS_RUN_ID}/artifacts/report.json" \
            --source-sha "${{ needs.prepare.outputs.source_sha }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}"
      - name: Capture RustFS logs
        if: always()
        run: |
          docker logs crab-workflow-rustfs > "${WORKFLOW_RUSTFS_ROOT}/rustfs.log" 2>&1 || true
          docker rm -f crab-workflow-rustfs >/dev/null 2>&1 || true
      - name: Upload workflow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workflow-rustfs-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.WORKFLOW_RUSTFS_ROOT }}/${{ env.WORKFLOW_RUSTFS_RUN_ID }}/artifacts/*.json
            ${{ env.WORKFLOW_RUSTFS_ROOT }}/${{ env.WORKFLOW_RUSTFS_RUN_ID }}/logs/*.log
            ${{ env.WORKFLOW_RUSTFS_ROOT }}/rustfs.log
          if-no-files-found: error
          retention-days: 14

  replica-enterprise-gate:
    name: Replica enterprise gate
    needs: prepare
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_enterprise_evidence) || (github.event_name != 'workflow_dispatch' && vars.CRAB_RELEASE_REQUIRE_ENTERPRISE_EVIDENCE == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: Run locked replica feature matrix
        working-directory: crab
        run: make replica-feature-matrix-all-locked

      - name: Validate replica evidence schemas
        run: cargo test --manifest-path crab/Cargo.toml --test schema_validate replica

      - name: Validate retained evidence recorder contracts
        run: |
          cargo test --manifest-path crab/Cargo.toml --test replica_live_control_plane evidence_recorder
          cargo test --manifest-path crab/Cargo.toml --test replica_binary_hydrate_live evidence_recorder
          cargo test --manifest-path crab/Cargo.toml --test replica_live_cross_region evidence_recorder

      - name: Download retained enterprise live evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          run_id="${REPLICA_RELEASE_EVIDENCE_RUN_ID:-}"
          artifact="${REPLICA_RELEASE_EVIDENCE_ARTIFACT:-}"
          if [ -z "$run_id" ]; then
            {
              echo "::error::Replica enterprise releases require retained live evidence."
              echo "Run .github/workflows/replica-live-evidence.yml with suite=enterprise, storage_provider=all, coordinator=all, hydrate_provider=all, mutate=true, and evidence_profile=enterprise."
              echo "Then rerun release.yml with replica_evidence_run_id set, or set repository variable CRAB_REPLICA_RELEASE_EVIDENCE_RUN_ID for tag-triggered releases."
            } >&2
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          run_metadata="$(gh run view "$run_id" \
            --json workflowName,status,conclusion,event,databaseId,url,headSha,attempt \
            --jq '[.workflowName, .status, .conclusion, .event, (.databaseId | tostring), .url, .headSha, (.attempt | tostring)] | @tsv')"
          old_ifs="$IFS"
          IFS=$'\t' read -r workflow_name status conclusion event database_id run_url evidence_sha attempt <<< "$run_metadata"
          IFS="$old_ifs"
          if [ "$workflow_name" != "Replica Live Evidence" ]; then
            {
              echo "::error::Replica evidence run $run_id came from workflow '$workflow_name', not 'Replica Live Evidence'."
              echo "Run .github/workflows/replica-live-evidence.yml and pass that run ID to release.yml."
            } >&2
            exit 1
          fi
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            {
              echo "::error::Replica evidence run $run_id is not a successful completed run."
              echo "status=$status conclusion=$conclusion url=$run_url"
            } >&2
            exit 1
          fi
          if [ "$event" != "workflow_dispatch" ]; then
            {
              echo "::error::Replica evidence run $run_id used event '$event', expected workflow_dispatch."
              echo "Use the protected manual live evidence workflow so credentials and topology are explicit."
            } >&2
            exit 1
          fi
          if [ "$database_id" != "$run_id" ]; then
            {
              echo "::error::Replica evidence run metadata mismatch: requested $run_id but GitHub returned $database_id."
              echo "Refusing to download ambiguous retained evidence."
            } >&2
            exit 1
          fi
          if [ "$evidence_sha" != "$release_sha" ]; then
            {
              echo "::error::Replica evidence run $run_id was collected from commit $evidence_sha, but this release is building $release_sha."
              echo "Rerun .github/workflows/replica-live-evidence.yml on the exact release commit before publishing."
            } >&2
            exit 1
          fi
          if [ -z "$attempt" ] || [ "$attempt" = "null" ]; then
            {
              echo "::error::Replica evidence run $run_id did not expose a run attempt."
              echo "Refusing to verify retained evidence without an exact run-attempt binding."
            } >&2
            exit 1
          fi
          if [ -z "$artifact" ]; then
            artifact="replica-live-evidence-${run_id}-${attempt}"
          fi
          echo "REPLICA_RELEASE_EVIDENCE_EXPECTED_RUN_ID=replica-live-${run_id}-${attempt}" >> "$GITHUB_ENV"

          mkdir -p replica-release-evidence
          gh run download "$run_id" \
            --name "$artifact" \
            --dir replica-release-evidence

          mapfile -t evidence_dirs < <(find replica-release-evidence -type d -name replica-live-evidence | sort)
          if [ "${#evidence_dirs[@]}" -ne 1 ]; then
            {
              echo "::error::Downloaded artifact must contain exactly one replica-live-evidence directory from .github/workflows/replica-live-evidence.yml."
              echo "Found ${#evidence_dirs[@]} candidate directories."
            } >&2
            exit 1
          fi
          echo "REPLICA_RELEASE_EVIDENCE_DIR=${evidence_dirs[0]}" >> "$GITHUB_ENV"

      - name: Verify retained enterprise live evidence
        shell: bash
        run: |
          set -euo pipefail
          crab/scripts/release/verify-replica-release-evidence.sh \
            "$REPLICA_RELEASE_EVIDENCE_DIR" \
            replica-release-evidence-verify.json \
            "$REPLICA_RELEASE_EVIDENCE_EXPECTED_RUN_ID"

  cache-service-enterprise-gate:
    name: Cache service enterprise gate
    needs: prepare
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_enterprise_evidence) || (github.event_name != 'workflow_dispatch' && vars.CRAB_RELEASE_REQUIRE_ENTERPRISE_EVIDENCE == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: Download retained cache-service RustFS smoke evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          run_id="${CACHE_SERVICE_RELEASE_EVIDENCE_RUN_ID:-}"
          artifact="${CACHE_SERVICE_RELEASE_EVIDENCE_ARTIFACT:-}"
          if [ -z "$run_id" ]; then
            {
              echo "::error::Cache-service enterprise releases require retained RustFS smoke evidence."
              echo "Run .github/workflows/cache-service.yml manually on the exact release commit."
              echo "Then rerun release.yml with cache_service_evidence_run_id set, or set repository variable CRAB_CACHE_SERVICE_RELEASE_EVIDENCE_RUN_ID for tag-triggered releases."
            } >&2
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          run_metadata="$(gh run view "$run_id" \
            --json workflowName,status,conclusion,event,databaseId,url,headSha,attempt \
            --jq '[.workflowName, .status, .conclusion, .event, (.databaseId | tostring), .url, .headSha, (.attempt | tostring)] | @tsv')"
          old_ifs="$IFS"
          IFS=$'\t' read -r workflow_name status conclusion event database_id run_url evidence_sha attempt <<< "$run_metadata"
          IFS="$old_ifs"
          if [ "$workflow_name" != "Cache Service Tests" ]; then
            {
              echo "::error::Cache-service evidence run $run_id came from workflow '$workflow_name', not 'Cache Service Tests'."
              echo "Run .github/workflows/cache-service.yml and pass that run ID to release.yml."
            } >&2
            exit 1
          fi
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            {
              echo "::error::Cache-service evidence run $run_id is not a successful completed run."
              echo "status=$status conclusion=$conclusion url=$run_url"
            } >&2
            exit 1
          fi
          if [ "$event" != "workflow_dispatch" ]; then
            {
              echo "::error::Cache-service evidence run $run_id used event '$event', expected workflow_dispatch."
              echo "Use the protected manual cache-service smoke workflow so the release evidence is explicit."
            } >&2
            exit 1
          fi
          if [ "$database_id" != "$run_id" ]; then
            {
              echo "::error::Cache-service evidence run metadata mismatch: requested $run_id but GitHub returned $database_id."
              echo "Refusing to download ambiguous retained evidence."
            } >&2
            exit 1
          fi
          if [ "$evidence_sha" != "$release_sha" ]; then
            {
              echo "::error::Cache-service evidence run $run_id was collected from commit $evidence_sha, but this release is building $release_sha."
              echo "Rerun .github/workflows/cache-service.yml on the exact release commit before publishing."
            } >&2
            exit 1
          fi
          if [ -z "$attempt" ] || [ "$attempt" = "null" ]; then
            {
              echo "::error::Cache-service evidence run $run_id did not expose a run attempt."
              echo "Refusing to verify retained evidence without an exact run-attempt binding."
            } >&2
            exit 1
          fi
          if [ -z "$artifact" ]; then
            artifact="cache-service-rustfs-smoke-${run_id}-${attempt}"
          fi
          expected_report_run_id="gha-${run_id}-${attempt}"
          echo "CACHE_SERVICE_RELEASE_EXPECTED_RUN_ID=${expected_report_run_id}" >> "$GITHUB_ENV"

          mkdir -p cache-service-release-evidence
          gh run download "$run_id" \
            --name "$artifact" \
            --dir cache-service-release-evidence

      - name: Verify retained cache-service smoke evidence
        shell: bash
        run: |
          set -euo pipefail

          cargo build --manifest-path Cargo.toml -p crab-cache-server --bin crab-cache-server

          set +e
          target/debug/crab-cache-server evidence gate \
            --evidence-dir cache-service-release-evidence \
            --expected-run-id "$CACHE_SERVICE_RELEASE_EXPECTED_RUN_ID" \
            --output cache-service-release-evidence-verify.json \
            --summary-output cache-service-release-evidence-summary.json \
            --doctor-output cache-service-release-evidence-doctor.json \
            --doctor-text-output cache-service-release-evidence-doctor.txt
          gate_status=$?
          set -e

          if [ "$gate_status" -ne 0 ]; then
            {
              echo "### Cache-service release evidence doctor"
              echo
              echo '```text'
              if [ -s cache-service-release-evidence-doctor.txt ]; then
                cat cache-service-release-evidence-doctor.txt
              else
                echo "cache-service evidence doctor output was not generated"
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$gate_status"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cache-service-release-evidence-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cache-service-release-evidence-verify.json
            cache-service-release-evidence-summary.json
            cache-service-release-evidence-doctor.json
            cache-service-release-evidence-doctor.txt
          if-no-files-found: ignore

  nfs-native-evidence-gate:
    name: NFS native evidence gate
    needs: prepare
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.require_nfs_evidence) || (github.event_name != 'workflow_dispatch' && vars.CRAB_RELEASE_REQUIRE_NFS_EVIDENCE == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download retained native NFS mount evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          run_id="${NFS_RELEASE_EVIDENCE_RUN_ID:-}"
          if [ -z "$run_id" ]; then
            {
              echo "::error::Crab releases require retained native NFS mount evidence."
              echo "Run .github/workflows/nfs-mount.yml on the exact release commit and pass that run ID to release.yml."
              echo "For tag-triggered releases, set repository variable CRAB_NFS_RELEASE_EVIDENCE_RUN_ID."
            } >&2
            exit 1
          fi

          release_sha="$(git rev-parse HEAD)"
          run_metadata="$(gh run view "$run_id" \
            --json workflowName,status,conclusion,event,databaseId,url,headSha,attempt \
            --jq '[.workflowName, .status, .conclusion, .event, (.databaseId | tostring), .url, .headSha, (.attempt | tostring)] | @tsv')"
          old_ifs="$IFS"
          IFS=$'\t' read -r workflow_name status conclusion event database_id run_url evidence_sha attempt <<< "$run_metadata"
          IFS="$old_ifs"
          if [ "$workflow_name" != "NFS Mount Evidence" ]; then
            {
              echo "::error::NFS evidence run $run_id came from workflow '$workflow_name', not 'NFS Mount Evidence'."
              echo "Run .github/workflows/nfs-mount.yml and pass that run ID to release.yml."
            } >&2
            exit 1
          fi
          if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
            {
              echo "::error::NFS evidence run $run_id is not a successful completed run."
              echo "status=$status conclusion=$conclusion url=$run_url"
            } >&2
            exit 1
          fi
          case "$event" in
            workflow_dispatch|push) ;;
            *)
              {
                echo "::error::NFS evidence run $run_id used event '$event', expected workflow_dispatch or push."
                echo "Use the NFS Mount Evidence workflow on the exact release commit before publishing."
              } >&2
              exit 1
              ;;
          esac
          if [ "$database_id" != "$run_id" ]; then
            {
              echo "::error::NFS evidence run metadata mismatch: requested $run_id but GitHub returned $database_id."
              echo "Refusing to download ambiguous retained evidence."
            } >&2
            exit 1
          fi
          if [ "$evidence_sha" != "$release_sha" ]; then
            {
              echo "::error::NFS evidence run $run_id was collected from commit $evidence_sha, but this release is building $release_sha."
              echo "Rerun .github/workflows/nfs-mount.yml on the exact release commit before publishing."
            } >&2
            exit 1
          fi
          if [ -z "$attempt" ] || [ "$attempt" = "null" ]; then
            {
              echo "::error::NFS evidence run $run_id did not expose a run attempt."
              echo "Refusing to verify retained evidence without an exact run-attempt binding."
            } >&2
            exit 1
          fi

          echo "NFS_RELEASE_EXPECTED_RUN_SUFFIX=${run_id}-${attempt}" >> "$GITHUB_ENV"
          echo "NFS_RELEASE_EXPECTED_GIT_COMMIT=${release_sha}" >> "$GITHUB_ENV"
          mkdir -p nfs-release-evidence
          gh run download "$run_id" \
            --pattern "nfs-smoke-*-${run_id}-${attempt}" \
            --dir nfs-release-evidence

      - name: Verify retained native NFS mount evidence
        shell: bash
        run: |
          set -euo pipefail
          make -C crab nfs-release-gate \
            NFS_RELEASE_EVIDENCE_DIR=../nfs-release-evidence \
            NFS_RELEASE_EXPECTED_RUN_SUFFIX="${NFS_RELEASE_EXPECTED_RUN_SUFFIX}" \
            NFS_RELEASE_EXPECTED_GIT_COMMIT="${NFS_RELEASE_EXPECTED_GIT_COMMIT}" \
            NFS_RELEASE_SUMMARY_OUTPUT=../nfs-release-smoke-summary.json \
            NFS_RELEASE_VERIFY_ARGS="${NFS_RELEASE_VERIFY_ARGS}"

      - name: Summarize retained native NFS release evidence
        if: always()
        run: |
          python3 crab/scripts/nfs-evidence-summary.py smoke \
            --summary nfs-release-smoke-summary.json \
            --output "$GITHUB_STEP_SUMMARY" \
            --append \
            --allow-missing

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nfs-release-evidence-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            nfs-release-smoke-summary.json
          if-no-files-found: ignore

  nfs-feature-gate:
    name: NFS feature gate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-nfs-feature-gate

      - name: Run NFS feature gate
        working-directory: crab
        run: make nfs-feature-gate

  workflow-native-release-gate:
    name: Native workflow release gate (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Install macOS FUSE dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install pkg-config
          brew install --cask macfuse
          fuse_pc="$(find "$(brew --prefix)" /usr/local /Library/Frameworks \
            -path '*/pkgconfig/fuse.pc' -print -quit 2>/dev/null || true)"
          if [ -z "${fuse_pc}" ]; then
            echo "::error::macFUSE fuse.pc was not found after installation"
            exit 1
          fi
          echo "PKG_CONFIG_PATH=$(dirname "${fuse_pc}")${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "${GITHUB_ENV}"

      - name: Run workflow contract tests
        run: cargo test -p crab-workflow --locked

      - name: Run CLI migration contract tests
        run: cargo test -p crab --test workflow_migration --no-default-features --features simd-accel,tier,watch --locked

      - name: Build and execute the Windows release candidate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build -p crab --release --locked --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch
          .\target\release\crab.exe --version

      - name: Build and execute the Unix release candidate
        if: runner.os != 'Windows'
        run: |
          cargo build -p crab --release --locked
          ./target/release/crab --version

      - name: Execute a native workflow stage on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          cat > "${smoke_root}/crab.yaml" <<'YAML'
          stages:
            smoke:
              cmd:
                argv: [python3, write.py]
              outs: [output.txt]
          YAML
          cat > "${smoke_root}/write.py" <<'PY'
          from pathlib import Path
          Path("output.txt").write_text("native-workflow", encoding="utf-8")
          PY
          (cd "${smoke_root}" && "${GITHUB_WORKSPACE}/target/release/crab" run)
          test "$(cat "${smoke_root}/output.txt")" = native-workflow

      - name: Execute a native workflow stage on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "crab-native-workflow"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          @'
          stages:
            smoke:
              cmd:
                argv: [python, write.py]
              outs: [output.txt]
          '@ | Set-Content -Path (Join-Path $smokeRoot "crab.yaml") -Encoding utf8
          @'
          from pathlib import Path
          Path("output.txt").write_text("native-workflow", encoding="utf-8")
          '@ | Set-Content -Path (Join-Path $smokeRoot "write.py") -Encoding utf8
          Push-Location $smokeRoot
          try {
            & "$env:GITHUB_WORKSPACE\target\release\crab.exe" run
            if ($LASTEXITCODE -ne 0) { throw "native workflow failed with exit code $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
          if ((Get-Content (Join-Path $smokeRoot "output.txt") -Raw).Trim() -ne "native-workflow") {
            throw "native workflow output mismatch"
          }

      - name: Write exact native evidence
        if: always()
        shell: bash
        run: |
          mkdir -p native-workflow-evidence
          printf '{"schema_version":1,"source_sha":"%s","run_id":"%s","run_attempt":"%s","os":"%s","result":"%s"}\n' \
            "$(git rev-parse HEAD)" "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}" "${RUNNER_OS}" "${{ job.status }}" \
            > "native-workflow-evidence/${RUNNER_OS}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workflow-native-release-evidence-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-workflow-evidence/*.json
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    needs: [prepare, workflow-release-gate, workflow-native-release-gate, replica-enterprise-gate, cache-service-enterprise-gate, nfs-native-evidence-gate, nfs-feature-gate]
    if: ${{ always() && needs.prepare.result == 'success' && needs.workflow-release-gate.result == 'success' && needs.workflow-native-release-gate.result == 'success' && needs.nfs-feature-gate.result == 'success' && (needs.nfs-native-evidence-gate.result == 'success' || needs.nfs-native-evidence-gate.result == 'skipped') && (needs.replica-enterprise-gate.result == 'success' || needs.replica-enterprise-gate.result == 'skipped') && (needs.cache-service-enterprise-gate.result == 'success' || needs.cache-service-enterprise-gate.result == 'skipped') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CRAB_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
      GIT_SHA: ${{ needs.prepare.outputs.source_short_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-aarch64
            target: aarch64-apple-darwin
            os: macos-15
            windows: false
            archive: crab-darwin-aarch64.tar.gz
          - name: darwin-x86_64
            target: x86_64-apple-darwin
            os: macos-15-intel
            windows: false
            archive: crab-darwin-x86_64.tar.gz
          - name: linux-x86_64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            windows: false
            archive: crab-linux-x86_64.tar.gz
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            windows: false
            archive: crab-linux-aarch64.tar.gz
          - name: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-2025
            windows: true
            archive: crab-windows-x86_64.zip
          - name: windows-aarch64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
            windows: true
            archive: crab-windows-aarch64.zip

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install FUSE dev headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev

      - name: Install macFUSE (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask macfuse

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          no_fuse_features="simd-accel,tier,replication-s3-control-plane,replication-gcs-control-plane,replication-azure-control-plane,coordinator-dynamodb,coordinator-spanner,coordinator-cosmosdb,watch,nfs,gix-pathmatch"
          with_fuse_features="${no_fuse_features},fuse"
          if [ "${{ matrix.windows }}" = "true" ]; then
            cargo build --release --locked --target ${{ matrix.target }} -p crab --bin crab \
              --no-default-features --features simd-accel,tier,watch,nfs,gix-pathmatch
            cargo build --release --locked --target ${{ matrix.target }} -p crab --bin crab-nfs-mount \
              --no-default-features
          else
            cargo build --release --locked --target ${{ matrix.target }} -p crab --bin crab \
              --no-default-features --features "$with_fuse_features"
            cp target/${{ matrix.target }}/release/crab target/${{ matrix.target }}/release/crab-fuse-mount
            cargo build --release --locked --target ${{ matrix.target }} -p crab --bin crab \
              --no-default-features --features "$no_fuse_features"
            ln -sf crab target/${{ matrix.target }}/release/crab-nfs-mount
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.windows }}" = "true" ]; then
            cp target/${{ matrix.target }}/release/crab.exe dist/
            cp target/${{ matrix.target }}/release/crab-nfs-mount.exe dist/
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command \
              "Compress-Archive -LiteralPath 'dist/crab.exe','dist/crab-nfs-mount.exe' -DestinationPath 'dist/${{ matrix.archive }}' -Force"
            rm dist/crab.exe dist/crab-nfs-mount.exe
          else
            cp target/${{ matrix.target }}/release/crab dist/
            cp target/${{ matrix.target }}/release/crab-fuse-mount dist/
            (cd dist && ln -sf crab crab-nfs-mount)
            tar czf "dist/${{ matrix.archive }}" -C dist crab crab-fuse-mount crab-nfs-mount
            rm dist/crab dist/crab-fuse-mount dist/crab-nfs-mount
          fi

      - name: Verify archive layout
        shell: bash
        run: |
          set -euo pipefail
          asset="dist/${{ matrix.archive }}"

          if [ ! -s "$asset" ]; then
            echo "::error::Release archive is missing or empty: $asset"
            exit 1
          fi

          extract_dir="dist/verify"
          rm -rf "$extract_dir"
          mkdir -p "$extract_dir"
          if [ "${{ matrix.windows }}" = "true" ]; then
            powershell.exe -NoLogo -NoProfile -NonInteractive -Command \
              "Expand-Archive -LiteralPath 'dist/${{ matrix.archive }}' -DestinationPath 'dist/verify' -Force"
            entries="$(cd "$extract_dir" && printf '%s\n' * | sort | tr '\n' ' ')"
            if [ "$entries" != "crab-nfs-mount.exe crab.exe " ]; then
              echo "::error::Unexpected Windows archive layout: $entries"
              exit 1
            fi
            "$extract_dir/crab.exe" version
            "$extract_dir/crab.exe" --help >/dev/null
          else
            entries="$(tar -tzf "$asset" | sort | tr '\n' ' ')"
            if [ "$entries" != "crab crab-fuse-mount crab-nfs-mount " ]; then
              echo "::error::Unexpected Unix archive layout: $entries"
              exit 1
            fi
            tar -xzf "$asset" -C "$extract_dir"
            if [ ! -L "$extract_dir/crab-nfs-mount" ] || [ "$(readlink "$extract_dir/crab-nfs-mount")" != "crab" ]; then
              echo "::error::Unix archive crab-nfs-mount must be a symlink to crab"
              exit 1
            fi
            "$extract_dir/crab" version
            "$extract_dir/crab" --help >/dev/null
          fi

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/${{ matrix.archive }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crab-${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  protocol-v2-release-gate:
    name: Protocol v2 partial-clone release gate
    needs: [prepare, build]
    if: ${{ needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CRAB_E2E_BUCKET: crab
      CRAB_E2E_ROOT: ${{ github.workspace }}/.ci/crab-protocol-v2-release-smoke
      CRAB_E2E_RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ACCESS_KEY_ID: crab
      AWS_SECRET_ACCESS_KEY: crab
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      RUSTFS_IMAGE: rustfs/rustfs:1.0.0-beta.8-glibc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install smoke dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl libfuse3-dev pipx
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download exact Linux release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: crab-linux-x86_64
          path: release-dist

      - name: Extract release artifact
        run: |
          set -euo pipefail
          mkdir -p release-bin
          tar -xzf release-dist/crab-linux-x86_64.tar.gz -C release-bin
          test -x release-bin/crab
          test -L release-bin/git-remote-crab || ln -s crab release-bin/git-remote-crab

      - name: Start RustFS
        run: |
          set -euo pipefail
          mkdir -p "${CRAB_E2E_ROOT}/rustfs-data"
          sudo chown 10001:10001 "${CRAB_E2E_ROOT}/rustfs-data"
          docker run -d \
            --name crab-protocol-v2-release-rustfs \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=crab \
            -e RUSTFS_SECRET_KEY=crab \
            -v "${CRAB_E2E_ROOT}/rustfs-data:/data" \
            "${RUSTFS_IMAGE}" server /data --address :9000
          for _ in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/health/ready || true)"
            if [ "${status:-000}" = "200" ]; then exit 0; fi
            sleep 1
          done
          docker logs crab-protocol-v2-release-rustfs >&2 || true
          exit 1

      - name: Run lifecycle against the packaged artifact
        run: |
          python3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
            --crab-bin "$GITHUB_WORKSPACE/release-bin/crab" \
            --backend rustfs \
            --bucket "$CRAB_E2E_BUCKET" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --root "$CRAB_E2E_ROOT" \
            --run-id "$CRAB_E2E_RUN_ID" \
            --source-root "$GITHUB_WORKSPACE"

      - name: Capture RustFS logs
        if: always()
        run: |
          mkdir -p "${CRAB_E2E_ROOT}"
          docker logs crab-protocol-v2-release-rustfs > "${CRAB_E2E_ROOT}/rustfs.log" 2>&1 || true
          docker rm -f crab-protocol-v2-release-rustfs >/dev/null 2>&1 || true

      - name: Upload protocol release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-v2-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/artifacts/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/logs/**
            ${{ env.CRAB_E2E_ROOT }}/rustfs.log
          if-no-files-found: error
          retention-days: 30

  protocol-v2-git-compatibility-release-gate:
    name: Protocol v2 packaged Git compatibility (${{ matrix.label }})
    needs: [prepare, build, protocol-v2-release-gate]
    if: ${{ needs.prepare.result == 'success' && needs.build.result == 'success' && needs.protocol-v2-release-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: git-2-30
            git_version: 2.30.9
          - label: git-2-40
            git_version: 2.40.4
          - label: git-2-45
            git_version: 2.45.4
          - label: git-current
            git_version: current
    env:
      CRAB_E2E_BUCKET: crab
      CRAB_E2E_ROOT: ${{ github.workspace }}/.ci/crab-protocol-v2-release-${{ matrix.label }}
      CRAB_E2E_RUN_ID: release-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ACCESS_KEY_ID: crab
      AWS_SECRET_ACCESS_KEY: crab
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      RUSTFS_IMAGE: rustfs/rustfs:1.0.0-beta.8-glibc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install compatibility dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential ca-certificates curl gettext libcurl4-gnutls-dev \
            libexpat1-dev libfuse3-dev libpcre2-dev libssl-dev pipx xz-utils \
            zlib1g-dev
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download exact Linux release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: crab-linux-x86_64
          path: release-dist

      - name: Extract exact Linux release artifact
        run: |
          set -euo pipefail
          mkdir -p release-bin
          tar -xzf release-dist/crab-linux-x86_64.tar.gz -C release-bin
          test -x release-bin/crab
          test -L release-bin/git-remote-crab || ln -s crab release-bin/git-remote-crab

      - name: Install selected Git
        shell: bash
        run: |
          set -euo pipefail
          version="${{ matrix.git_version }}"
          if [ "$version" = "current" ]; then
            git_bin="$(command -v git)"
          else
            archive="$RUNNER_TEMP/git-${version}.tar.xz"
            source_dir="$RUNNER_TEMP/git-${version}"
            prefix="$RUNNER_TEMP/git-install-${version}"
            curl --fail --location --silent --show-error \
              "https://www.kernel.org/pub/software/scm/git/git-${version}.tar.xz" \
              --output "$archive"
            tar -xJf "$archive" -C "$RUNNER_TEMP"
            (
              cd "$source_dir"
              make configure
              ./configure --prefix="$prefix" --without-tcltk
              make -j"$(nproc)" all
              make install
            )
            git_bin="$prefix/bin/git"
          fi
          "$git_bin" --version
          echo "GIT_BIN=$git_bin" >> "$GITHUB_ENV"

      - name: Start RustFS
        run: |
          set -euo pipefail
          mkdir -p "${CRAB_E2E_ROOT}/rustfs-data"
          sudo chown 10001:10001 "${CRAB_E2E_ROOT}/rustfs-data"
          docker run -d \
            --name "crab-protocol-v2-release-${{ matrix.label }}" \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=crab \
            -e RUSTFS_SECRET_KEY=crab \
            -v "${CRAB_E2E_ROOT}/rustfs-data:/data" \
            "${RUSTFS_IMAGE}" server /data --address :9000
          for _ in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/health/ready || true)"
            if [ "${status:-000}" = "200" ]; then exit 0; fi
            sleep 1
          done
          docker logs "crab-protocol-v2-release-${{ matrix.label }}" >&2 || true
          exit 1

      - name: Run lifecycle against exact artifact
        run: |
          python3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
            --crab-bin "$GITHUB_WORKSPACE/release-bin/crab" \
            --git-bin "$GIT_BIN" \
            --backend rustfs \
            --bucket "$CRAB_E2E_BUCKET" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --root "$CRAB_E2E_ROOT" \
            --run-id "$CRAB_E2E_RUN_ID" \
            --source-root "$GITHUB_WORKSPACE"

      - name: Capture RustFS logs
        if: always()
        run: |
          mkdir -p "${CRAB_E2E_ROOT}"
          docker logs "crab-protocol-v2-release-${{ matrix.label }}" > "${CRAB_E2E_ROOT}/rustfs.log" 2>&1 || true
          docker rm -f "crab-protocol-v2-release-${{ matrix.label }}" >/dev/null 2>&1 || true

      - name: Upload Git compatibility release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-v2-release-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/artifacts/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/logs/**
            ${{ env.CRAB_E2E_ROOT }}/rustfs.log
          if-no-files-found: error
          retention-days: 30

  protocol-v2-rollback-release-gate:
    name: Protocol v2 rollback compatibility release gate
    needs: [prepare, build, protocol-v2-release-gate]
    if: ${{ needs.prepare.result == 'success' && needs.build.result == 'success' && needs.protocol-v2-release-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CRAB_E2E_BUCKET: crab
      CRAB_E2E_ROOT: ${{ github.workspace }}/.ci/crab-protocol-v2-rollback-release
      CRAB_E2E_RUN_ID: release-rollback-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ACCESS_KEY_ID: crab
      AWS_SECRET_ACCESS_KEY: crab
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      RUSTFS_IMAGE: rustfs/rustfs:1.0.0-beta.8-glibc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Install rollback build and smoke dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential ca-certificates curl gettext libcurl4-gnutls-dev \
            libexpat1-dev libfuse3-dev libpcre2-dev libssl-dev pipx xz-utils \
            zlib1g-dev
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download exact Linux release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: crab-linux-x86_64
          path: release-dist

      - name: Extract exact Linux release artifact
        run: |
          set -euo pipefail
          mkdir -p release-bin
          tar -xzf release-dist/crab-linux-x86_64.tar.gz -C release-bin
          test -x release-bin/crab
          test -L release-bin/git-remote-crab || ln -s crab release-bin/git-remote-crab

      - name: Build the immediately prior tagged Crab binary
        shell: bash
        run: |
          set -euo pipefail
          current="${{ needs.prepare.outputs.tag }}"
          previous="$(git tag --list 'v*' --sort=-v:refname | awk -v current="$current" '$0 != current { print; exit }')"
          if [ -z "$previous" ]; then
            echo "::error::No prior tagged Crab release is available for rollback qualification." >&2
            exit 1
          fi
          prior_root="$RUNNER_TEMP/crab-previous"
          prior_target="$RUNNER_TEMP/crab-previous-target"
          git worktree add --detach "$prior_root" "$previous"
          (
            cd "$prior_root"
            GIT_SHA="$(git rev-parse HEAD)" \
              CARGO_TARGET_DIR="$prior_target" \
              cargo build -p crab --release --locked --features gix-transport
          )
          test -x "$prior_target/release/crab"
          "$prior_target/release/crab" --version
          echo "PRIOR_CRAB_BIN=$prior_target/release/crab" >> "$GITHUB_ENV"
          echo "PRIOR_CRAB_TAG=$previous" >> "$GITHUB_ENV"

      - name: Start RustFS
        run: |
          set -euo pipefail
          mkdir -p "${CRAB_E2E_ROOT}/rustfs-data"
          sudo chown 10001:10001 "${CRAB_E2E_ROOT}/rustfs-data"
          docker run -d \
            --name crab-protocol-v2-rollback-rustfs \
            -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=crab \
            -e RUSTFS_SECRET_KEY=crab \
            -v "${CRAB_E2E_ROOT}/rustfs-data:/data" \
            "${RUSTFS_IMAGE}" server /data --address :9000
          for _ in $(seq 1 60); do
            status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9000/health/ready || true)"
            if [ "${status:-000}" = "200" ]; then exit 0; fi
            sleep 1
          done
          docker logs crab-protocol-v2-rollback-rustfs >&2 || true
          exit 1

      - name: Run rollback compatibility against exact artifacts
        run: |
          python3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
            --crab-bin "$GITHUB_WORKSPACE/release-bin/crab" \
            --rollback-crab-bin "$PRIOR_CRAB_BIN" \
            --rollback-crab-tag "$PRIOR_CRAB_TAG" \
            --git-bin "$(command -v git)" \
            --backend rustfs \
            --bucket "$CRAB_E2E_BUCKET" \
            --endpoint-url "$AWS_ENDPOINT_URL" \
            --root "$CRAB_E2E_ROOT" \
            --run-id "$CRAB_E2E_RUN_ID" \
            --source-root "$GITHUB_WORKSPACE"

      - name: Capture rollback RustFS logs
        if: always()
        run: |
          mkdir -p "${CRAB_E2E_ROOT}"
          docker logs crab-protocol-v2-rollback-rustfs > "${CRAB_E2E_ROOT}/rustfs.log" 2>&1 || true
          docker rm -f crab-protocol-v2-rollback-rustfs >/dev/null 2>&1 || true

      - name: Remove prior release worktree
        if: always()
        run: git worktree remove --force "$RUNNER_TEMP/crab-previous" || true

      - name: Upload rollback protocol release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-v2-rollback-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/artifacts/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/logs/**
            ${{ env.CRAB_E2E_ROOT }}/rustfs.log
          if-no-files-found: error
          retention-days: 30

  protocol-v2-aws-release-gate:
    name: Protocol v2 partial-clone AWS S3 release gate
    needs: [prepare, build, protocol-v2-release-gate]
    if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.require_cloud_evidence) || (github.event_name != 'workflow_dispatch' && vars.CRAB_RELEASE_REQUIRE_CLOUD_EVIDENCE == 'true')) && needs.prepare.result == 'success' && needs.build.result == 'success' && needs.protocol-v2-release-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CRAB_E2E_BUCKET: ${{ vars.CRAB_PROTOCOL_V2_AWS_BUCKET }}
      CRAB_E2E_ROOT: ${{ github.workspace }}/.ci/crab-protocol-v2-aws-release-smoke
      CRAB_E2E_RUN_ID: release-aws-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.CRAB_PROTOCOL_V2_AWS_REGION }}
      AWS_ENDPOINT_URL: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Require AWS release qualification configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CRAB_E2E_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for the AWS S3 protocol release gate." >&2
              exit 1
            fi
          done

      - name: Install smoke dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libfuse3-dev pipx
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download exact Linux release artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: crab-linux-x86_64
          path: release-dist

      - name: Extract release artifact
        run: |
          set -euo pipefail
          mkdir -p release-bin
          tar -xzf release-dist/crab-linux-x86_64.tar.gz -C release-bin
          test -x release-bin/crab
          test -L release-bin/git-remote-crab || ln -s crab release-bin/git-remote-crab

      - name: Run lifecycle against AWS S3
        run: |
          python3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
            --crab-bin "$GITHUB_WORKSPACE/release-bin/crab" \
            --backend s3 \
            --require-existing-bucket \
            --bucket "$CRAB_E2E_BUCKET" \
            --endpoint-url "" \
            --root "$CRAB_E2E_ROOT" \
            --run-id "$CRAB_E2E_RUN_ID" \
            --source-root "$GITHUB_WORKSPACE"

      - name: Upload AWS protocol release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-v2-aws-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/artifacts/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/logs/**
          if-no-files-found: error
          retention-days: 30

  protocol-v2-platform-release-gate:
    name: Protocol v2 platform gate (${{ matrix.platform }})
    needs: [prepare, build, protocol-v2-release-gate, protocol-v2-aws-release-gate]
    if: ${{ needs.prepare.result == 'success' && needs.build.result == 'success' && needs.protocol-v2-release-gate.result == 'success' && needs.protocol-v2-aws-release-gate.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-15
            artifact: crab-darwin-aarch64
            archive: crab-darwin-aarch64.tar.gz
          - platform: windows-x86_64
            os: windows-2022
            artifact: crab-windows-x86_64
            archive: crab-windows-x86_64.zip
    env:
      CRAB_E2E_BUCKET: ${{ vars.CRAB_PROTOCOL_V2_AWS_BUCKET }}
      CRAB_E2E_ROOT: ${{ github.workspace }}/.ci/crab-protocol-v2-platform-${{ matrix.platform }}
      CRAB_E2E_RUN_ID: release-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.CRAB_PROTOCOL_V2_AWS_REGION }}
      AWS_ENDPOINT_URL: ""
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Require AWS release qualification configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CRAB_E2E_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for the platform protocol release gate." >&2
              exit 1
            fi
          done

      - name: Install macOS smoke dependencies
        if: runner.os == 'macOS'
        run: |
          brew install awscli
          brew install --cask macfuse

      - name: Install Windows smoke dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            py -3 -m pip install --user awscli
            $userScripts = py -3 -c "import site; print(site.USER_BASE + r'\\Scripts')"
            $userScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          Get-Command aws -ErrorAction Stop
          py -3 --version

      - name: Download exact packaged platform artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ matrix.artifact }}
          path: release-dist

      - name: Extract packaged macOS artifact
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p release-bin
          tar -xzf "release-dist/${{ matrix.archive }}" -C release-bin
          test -x release-bin/crab
          ln -s crab release-bin/git-remote-crab

      - name: Extract packaged Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-bin | Out-Null
          Expand-Archive -LiteralPath "release-dist/${{ matrix.archive }}" -DestinationPath release-bin -Force
          if (-not (Test-Path release-bin/crab.exe)) {
            throw 'Packaged Crab executable is missing.'
          }
          Copy-Item release-bin/crab.exe release-bin/git-remote-crab.exe -Force

      - name: Run real-Git platform lifecycle
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            py -3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
              --crab-bin "$GITHUB_WORKSPACE/release-bin/crab.exe" \
              --backend s3 --require-existing-bucket \
              --bucket "$CRAB_E2E_BUCKET" --endpoint-url "" \
              --root "$CRAB_E2E_ROOT" --run-id "$CRAB_E2E_RUN_ID" \
              --source-root "$GITHUB_WORKSPACE"
          else
            python3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
              --crab-bin "$GITHUB_WORKSPACE/release-bin/crab" \
              --backend s3 --require-existing-bucket \
              --bucket "$CRAB_E2E_BUCKET" --endpoint-url "" \
              --root "$CRAB_E2E_ROOT" --run-id "$CRAB_E2E_RUN_ID" \
              --source-root "$GITHUB_WORKSPACE"
          fi

      - name: Upload platform protocol release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-v2-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/artifacts/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/logs/**
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Publish — collect artifacts, create GitHub release, update Homebrew tap
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [prepare, build, protocol-v2-release-gate, protocol-v2-git-compatibility-release-gate, protocol-v2-rollback-release-gate, protocol-v2-aws-release-gate, protocol-v2-platform-release-gate]
    if: ${{ always() && needs.prepare.result == 'success' && needs.build.result == 'success' && needs.protocol-v2-release-gate.result == 'success' && needs.protocol-v2-git-compatibility-release-gate.result == 'success' && needs.protocol-v2-rollback-release-gate.result == 'success' && (needs.protocol-v2-aws-release-gate.result == 'success' || needs.protocol-v2-aws-release-gate.result == 'skipped') && (needs.protocol-v2-platform-release-gate.result == 'success' || needs.protocol-v2-platform-release-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: crab-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            crab-darwin-aarch64.tar.gz
            crab-darwin-x86_64.tar.gz
            crab-linux-aarch64.tar.gz
            crab-linux-x86_64.tar.gz
            crab-windows-aarch64.zip
            crab-windows-x86_64.zip
          )

          mapfile -t actual < <(find . -maxdepth 1 -type f \( -name 'crab-*.tar.gz' -o -name 'crab-*.zip' \) -printf '%f\n' | sort)
          actual_joined="${actual[*]}"
          expected_joined="${expected[*]}"
          if [ "$actual_joined" != "$expected_joined" ]; then
            echo "::error::Release artifact set mismatch."
            printf 'expected: %s\n' "$expected_joined"
            printf 'actual:   %s\n' "$actual_joined"
            exit 1
          fi

          for asset in crab-darwin-aarch64.tar.gz crab-darwin-x86_64.tar.gz; do
            entries="$(tar -tzf "$asset" | sort | tr '\n' ' ')"
            if [ "$entries" != "crab crab-fuse-mount crab-nfs-mount " ]; then
              echo "::error::Unexpected macOS archive layout in $asset: $entries"
              exit 1
            fi
            extract_dir="$(mktemp -d)"
            tar -xzf "$asset" -C "$extract_dir"
            if [ ! -L "$extract_dir/crab-nfs-mount" ] || [ "$(readlink "$extract_dir/crab-nfs-mount")" != "crab" ]; then
              echo "::error::macOS archive $asset crab-nfs-mount must be a symlink to crab"
              exit 1
            fi
          done

          for asset in crab-linux-aarch64.tar.gz crab-linux-x86_64.tar.gz; do
            entries="$(tar -tzf "$asset" | sort | tr '\n' ' ')"
            if [ "$entries" != "crab crab-fuse-mount crab-nfs-mount " ]; then
              echo "::error::Unexpected Linux archive layout in $asset: $entries"
              exit 1
            fi
            extract_dir="$(mktemp -d)"
            tar -xzf "$asset" -C "$extract_dir"
            if [ ! -L "$extract_dir/crab-nfs-mount" ] || [ "$(readlink "$extract_dir/crab-nfs-mount")" != "crab" ]; then
              echo "::error::Linux archive $asset crab-nfs-mount must be a symlink to crab"
              exit 1
            fi
          done

          for asset in crab-windows-aarch64.zip crab-windows-x86_64.zip; do
            entries="$(unzip -Z1 "$asset" | sort | tr '\n' ' ')"
            if [ "$entries" != "crab-nfs-mount.exe crab.exe " ]; then
              echo "::error::Unexpected Windows archive layout in $asset: $entries"
              exit 1
            fi
          done

          sha256sum crab-*.* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          SOURCE_SHA="${{ needs.prepare.outputs.source_sha }}"
          FILES=(dist/crab-*.tar.gz dist/crab-*.zip dist/SHA256SUMS.txt)
          existing="$(gh release view "$TAG" --repo "$RELEASE_REPO" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$existing" = "false" ]; then
            echo "::error::Release $TAG is already published and cannot be replaced." >&2
            exit 1
          fi
          if [ "$existing" = "true" ]; then
            echo "Removing incomplete draft from an earlier attempt."
            gh release delete "$TAG" --repo "$RELEASE_REPO" --yes
          fi

          notes_file="${RUNNER_TEMP}/release-notes.md"
          awk -v version="$VERSION" '
            $0 ~ "^## " version " - " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::error::Could not extract release notes for $VERSION from CHANGELOG.md." >&2
            exit 1
          fi
          printf '\n---\n\nSource commit: %s\n\nVerify an archive with: %s\n' \
            "$SOURCE_SHA" \
            "gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}" \
            >> "$notes_file"

          gh release create "$TAG" "${FILES[@]}" \
            --repo "$RELEASE_REPO" \
            --verify-tag \
            --fail-on-no-commits \
            --latest \
            --title "Crab ${TAG}" \
            --notes-file "$notes_file"

  homebrew:
    name: Update Homebrew tap
    needs: [prepare, publish]
    if: ${{ needs.prepare.result == 'success' && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Update tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "TAP_GITHUB_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi
          TAG="${{ needs.prepare.outputs.tag }}"
          crab/scripts/release/update-homebrew.sh "$TAG"
