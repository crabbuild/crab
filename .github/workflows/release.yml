      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.CRAB_PROTOCOL_V2_AWS_REGION }}
      AWS_ENDPOINT_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Require AWS release qualification configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CRAB_E2E_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for the AWS S3 protocol release gate." >&2
              exit 1
            fi
          done

      - name: Install smoke dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libfuse3-dev pipx
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download exact Linux release artifact
        uses: actions/download-artifact@v4
        with:
          name: crab-linux-x86_64
          path: release-dist

      - name: Extract release artifact
        run: |
          set -euo pipefail
          mkdir -p release-bin
          tar -xzf release-dist/crab-linux-x86_64.tar.gz -C release-bin
          test -x release-bin/crab
          test -L release-bin/git-remote-crab || ln -s crab release-bin/git-remote-crab

      - name: Run lifecycle against AWS S3
        run: |
          python3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
            --crab-bin "$GITHUB_WORKSPACE/release-bin/crab" \
            --backend s3 \
            --require-existing-bucket \
            --bucket "$CRAB_E2E_BUCKET" \
            --endpoint-url "" \
            --root "$CRAB_E2E_ROOT" \
            --run-id "$CRAB_E2E_RUN_ID" \
            --source-root "$GITHUB_WORKSPACE"

      - name: Upload AWS protocol release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-v2-aws-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/artifacts/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/logs/**
          if-no-files-found: error
          retention-days: 30

  protocol-v2-platform-release-gate:
    name: Protocol v2 platform gate (${{ matrix.platform }})
    needs: [prepare, build, protocol-v2-release-gate, protocol-v2-aws-release-gate]
    if: ${{ needs.prepare.result == 'success' && needs.build.result == 'success' && needs.protocol-v2-release-gate.result == 'success' && needs.protocol-v2-aws-release-gate.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-15
            artifact: crab-darwin-aarch64
            archive: crab-darwin-aarch64.tar.gz
          - platform: windows-x86_64
            os: windows-2022
            artifact: crab-windows-x86_64
            archive: crab-windows-x86_64.zip
    env:
      CRAB_E2E_BUCKET: ${{ vars.CRAB_PROTOCOL_V2_AWS_BUCKET }}
      CRAB_E2E_ROOT: ${{ runner.temp }}/crab-protocol-v2-platform-${{ matrix.platform }}
      CRAB_E2E_RUN_ID: release-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.CRAB_PROTOCOL_V2_AWS_REGION }}
      AWS_ENDPOINT_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Require AWS release qualification configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CRAB_E2E_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            if [ -z "${!name:-}" ]; then
              echo "::error::${name} is required for the platform protocol release gate." >&2
              exit 1
            fi
          done

      - name: Install macOS smoke dependencies
        if: runner.os == 'macOS'
        run: |
          brew install awscli
          brew install --cask macfuse

      - name: Install Windows smoke dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            py -3 -m pip install --user awscli
            $userScripts = py -3 -c "import site; print(site.USER_BASE + r'\\Scripts')"
            $userScripts | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          Get-Command aws -ErrorAction Stop
          py -3 --version

      - name: Download exact packaged platform artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-dist

      - name: Extract packaged macOS artifact
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p release-bin
          tar -xzf "release-dist/${{ matrix.archive }}" -C release-bin
          test -x release-bin/crab
          ln -s crab release-bin/git-remote-crab

      - name: Extract packaged Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-bin | Out-Null
          Expand-Archive -LiteralPath "release-dist/${{ matrix.archive }}" -DestinationPath release-bin -Force
          if (-not (Test-Path release-bin/crab.exe)) {
            throw 'Packaged Crab executable is missing.'
          }
          Copy-Item release-bin/crab.exe release-bin/git-remote-crab.exe -Force

      - name: Run real-Git platform lifecycle
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            py -3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
              --crab-bin "$GITHUB_WORKSPACE/release-bin/crab.exe" \
              --backend s3 --require-existing-bucket \
              --bucket "$CRAB_E2E_BUCKET" --endpoint-url "" \
              --root "$CRAB_E2E_ROOT" --run-id "$CRAB_E2E_RUN_ID" \
              --source-root "$GITHUB_WORKSPACE"
          else
            python3 crab/scripts/e2e/run_protocol_v2_partial_clone_rustfs_smoke.py \
              --crab-bin "$GITHUB_WORKSPACE/release-bin/crab" \
              --backend s3 --require-existing-bucket \
              --bucket "$CRAB_E2E_BUCKET" --endpoint-url "" \
              --root "$CRAB_E2E_ROOT" --run-id "$CRAB_E2E_RUN_ID" \
              --source-root "$GITHUB_WORKSPACE"
          fi

      - name: Upload platform protocol release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-v2-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/artifacts/**
            ${{ env.CRAB_E2E_ROOT }}/${{ env.CRAB_E2E_RUN_ID }}/logs/**
          if-no-files-found: warn
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Publish — collect artifacts, create GitHub release, update Homebrew tap
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [prepare, build, protocol-v2-release-gate, protocol-v2-git-compatibility-release-gate, protocol-v2-rollback-release-gate, protocol-v2-aws-release-gate, protocol-v2-platform-release-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          pattern: crab-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            crab-darwin-aarch64.tar.gz
            crab-darwin-x86_64.tar.gz
            crab-linux-aarch64.tar.gz
            crab-linux-x86_64.tar.gz
            crab-windows-aarch64.zip
            crab-windows-x86_64.zip
          )

          mapfile -t actual < <(find . -maxdepth 1 -type f \( -name 'crab-*.tar.gz' -o -name 'crab-*.zip' \) -printf '%f\n' | sort)
          actual_joined="${actual[*]}"
          expected_joined="${expected[*]}"
          if [ "$actual_joined" != "$expected_joined" ]; then
            echo "::error::Release artifact set mismatch."
            printf 'expected: %s\n' "$expected_joined"
            printf 'actual:   %s\n' "$actual_joined"
            exit 1
          fi

          for asset in crab-darwin-aarch64.tar.gz crab-darwin-x86_64.tar.gz; do
            entries="$(tar -tzf "$asset" | sort | tr '\n' ' ')"
            if [ "$entries" != "crab crab-fuse-mount crab-nfs-mount " ]; then
              echo "::error::Unexpected macOS archive layout in $asset: $entries"
              exit 1
            fi
            extract_dir="$(mktemp -d)"
            tar -xzf "$asset" -C "$extract_dir"
            if [ ! -L "$extract_dir/crab-nfs-mount" ] || [ "$(readlink "$extract_dir/crab-nfs-mount")" != "crab" ]; then
              echo "::error::macOS archive $asset crab-nfs-mount must be a symlink to crab"
              exit 1
            fi
          done

          for asset in crab-linux-aarch64.tar.gz crab-linux-x86_64.tar.gz; do
            entries="$(tar -tzf "$asset" | sort | tr '\n' ' ')"
            if [ "$entries" != "crab crab-fuse-mount crab-nfs-mount " ]; then
              echo "::error::Unexpected Linux archive layout in $asset: $entries"
              exit 1
            fi
            extract_dir="$(mktemp -d)"
            tar -xzf "$asset" -C "$extract_dir"
            if [ ! -L "$extract_dir/crab-nfs-mount" ] || [ "$(readlink "$extract_dir/crab-nfs-mount")" != "crab" ]; then
              echo "::error::Linux archive $asset crab-nfs-mount must be a symlink to crab"
              exit 1
            fi
          done

          for asset in crab-windows-aarch64.zip crab-windows-x86_64.zip; do
            entries="$(unzip -Z1 "$asset" | sort | tr '\n' ' ')"
            if [ "$entries" != "crab-nfs-mount.exe crab.exe " ]; then
              echo "::error::Unexpected Windows archive layout in $asset: $entries"
              exit 1
            fi
          done

          sha256sum crab-*.* > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt

      - name: Validate release repository token
        env:
          GH_TOKEN: ${{ secrets.CRAB_RELEASE_GITHUB_TOKEN || secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            {
              echo "::error::Set CRAB_RELEASE_GITHUB_TOKEN with contents:write access to ${RELEASE_REPO}."
              echo "The workflow cannot use the source repository GITHUB_TOKEN to publish to a separate release repository."
            } >&2
            exit 1
          fi

          gh repo view "$RELEASE_REPO" >/dev/null

      - name: Create release on crab-release repo
        env:
          GH_TOKEN: ${{ secrets.CRAB_RELEASE_GITHUB_TOKEN || secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          SOURCE_SHA="${{ needs.prepare.outputs.source_sha }}"
          FILES=(dist/crab-*.tar.gz dist/crab-*.zip dist/SHA256SUMS.txt)
          notes_file="$(mktemp)"
          trap 'rm -f "$notes_file"' EXIT
          {
            echo "Crab CLI ${TAG} release artifacts for macOS, Linux, and Windows on ARM64 and x86_64."
            echo
            echo "Source: https://github.com/${GITHUB_REPOSITORY}/tree/${TAG}"
            echo "Commit: ${SOURCE_SHA}"
          } > "$notes_file"

          if gh release view "$TAG" --repo "$RELEASE_REPO" &>/dev/null; then
            echo "Release $TAG exists — uploading assets (clobber)."
            gh release upload "$TAG" "${FILES[@]}" \
              --repo "$RELEASE_REPO" --clobber
          else
            gh release create "$TAG" "${FILES[@]}" \
              --repo "$RELEASE_REPO" \
              --title "Crab CLI ${TAG}" \
              --notes-file "$notes_file"
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "TAP_GITHUB_TOKEN is not configured; skipping Homebrew tap update."
            exit 0
          fi
          TAG="${{ needs.prepare.outputs.tag }}"
          DIST_DIR="$PWD/dist" crab/scripts/update-homebrew.sh --local "$TAG"
