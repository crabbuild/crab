[package]
name = "crab-read"
version = "0.1.0"
publish = true
edition = "2024"
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
description = "Read and hydration orchestration for Crab repositories."

[features]
default = ["hydration"]
hydration = ["dep:crab-cache", "dep:crab-cache-store", "dep:crab-diff", "dep:crab-lfs", "dep:globset", "dep:gix-packetline", "dep:gix-ignore", "dep:xet-client", "dep:xet-data", "dep:xet-runtime", "crab-metadata/file-index-reader"]
local-staging = ["hydration", "dep:crab-staging"]

[lib]
name = "crab_read"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
bstr = { version = "1", default-features = false, features = ["std"] }
bytes = { workspace = true }
crab-cache = { workspace = true, optional = true, features = ["local-cache", "xet-chunk-cache"] }
crab-cache-store = { workspace = true, optional = true }
crab-diff = { workspace = true, optional = true }
crab-git = { workspace = true }
crab-lfs = { workspace = true, optional = true }
crab-metadata = { workspace = true, features = ["storage"] }
crab-remote-git = { workspace = true }
crab-staging = { workspace = true, optional = true }
crab-storage = { workspace = true }
crab-types = { workspace = true }
crab-xet = { workspace = true }
futures-util = { workspace = true }
globset = { workspace = true, optional = true }
gix-packetline = { workspace = true, optional = true }
gix-hash = { workspace = true, features = ["sha1"] }
gix-ignore = { workspace = true, optional = true }
gix-object = { workspace = true }
object_store = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "io-util"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
xet-client = { workspace = true, optional = true }
xet-data = { workspace = true, optional = true }
xet-runtime = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
