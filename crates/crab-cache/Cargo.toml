[package]
name = "crab-cache"
version = "0.1.0"
publish = false
edition = "2024"
license = "Apache-2.0"
description = "Local and remote cache contracts for Crab."

[lib]
name = "crab_cache"
path = "src/lib.rs"

[features]
default = []
active-probe = ["dep:reqwest"]
local-cache = ["dep:errno", "dep:filetime", "dep:fs4", "dep:libc", "dep:rusqlite", "rusqlite?/hooks", "dep:tokio", "dep:tokio-util"]
remote-client = ["active-probe", "dep:futures-util", "dep:tokio"]
xet-chunk-cache = [
    "dep:async-trait",
    "dep:crc32fast",
    "dep:errno",
    "dep:fs4",
    "dep:libc",
    "dep:rusqlite",
    "dep:tokio",
    "dep:tokio-util",
    "dep:xet-client",
    "dep:xet-runtime",
]

[dependencies]
async-trait = { workspace = true, optional = true }
blake3 = { workspace = true, features = ["rayon"] }
bytes = { workspace = true }
crab-types = { workspace = true }
crab-xet = { workspace = true }
crc32fast = { version = "1", optional = true }
errno = { version = "0.3", optional = true }
filetime = { version = "0.2", optional = true }
fs4 = { version = "0.13", optional = true }
libc = { version = "0.2", optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"], optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"], optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
tracing = { workspace = true }
xet-client = { workspace = true, optional = true }
xet-runtime = { workspace = true, optional = true }

[dev-dependencies]
axum = { version = "0.8", features = ["json", "matched-path"] }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
