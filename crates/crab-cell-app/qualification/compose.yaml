x-image: &image rust:1.97-bookworm@sha256:0e2bcaef56d041a486784e54104a81aebe0da44bd03019bd70bc0401e42e4a97
x-storage: &storage
  AWS_ACCESS_KEY_ID: crab
  AWS_SECRET_ACCESS_KEY: crab
  AWS_EC2_METADATA_DISABLED: "true"
  AWS_DEFAULT_REGION: us-east-1
x-environment: &environment
  <<: *storage
  CRAB_CELL_TEST_BUCKET: crab-reference-app
  CRAB_CELL_TEST_ENDPOINT: http://rustfs:9000
  CRAB_CELL_PERF_PROCESS_ROOT: reference-compose
  CRAB_CELL_PERF_PROCESS_SYNC: /evidence/control
  CRAB_CELL_PERF_PROCESS_GATEWAY: "1"
  CRAB_CELL_PERF_PROCESS_BIND: 0.0.0.0:8080
  CRAB_CELL_PERF_ITERATIONS: ${CRAB_CELL_PERF_ITERATIONS:-30}
  TMPDIR: /scratch
x-node: &node
  image: *image
  entrypoint: [/bin/sh, /source/crates/crab-cell-app/qualification/run.sh]
  command: [node]
  volumes:
    - ${CRAB_REFERENCE_STATE:?set an external state directory}/source:/source:ro
    - ${CRAB_REFERENCE_STATE:?set an external state directory}/target-linux:/target:ro
    - ${CRAB_REFERENCE_STATE:?set an external state directory}/evidence:/evidence
    # Anonymous Docker volumes give each node its own disk-backed SQLite/WAL/cache.
    - /scratch
  cpus: 1.0
  mem_limit: 1g
  memswap_limit: 1g
  pids_limit: 256
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    bucket-init:
      condition: service_completed_successfully
  restart: "no"

services:
  build:
    image: *image
    working_dir: /source
    environment:
      CARGO_TARGET_DIR: /target
      CARGO_HOME: /cargo-home
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: cc
    volumes:
      - ${CRAB_REFERENCE_STATE:?set an external state directory}/source:/source:ro
      - ${CRAB_REFERENCE_STATE:?set an external state directory}/target-linux:/target
      - cargo-home:/cargo-home
    command: [cargo, test, --release, --locked, -p, crab-cell-app, --test, reference_application, --no-run]
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 4g
    restart: "no"

  rustfs:
    image: ghcr.io/rustfs/rustfs:1.0.0-glibc@sha256:bffcab0c9d647aab0055d1c69d340b202d0909966b385932d4ead1aeb7602858
    environment:
      RUSTFS_ACCESS_KEY: crab
      RUSTFS_SECRET_KEY: crab
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_OBS_LOG_DIRECTORY: /data/logs
    volumes: [rustfs-data:/data]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9000/health/ready]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: "no"

  bucket-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.27.41@sha256:1c2d7a51b1ff4f460bc3f1e1ee46a6cef47c7429ad9089ef99012a95e472a1a5
    environment: *storage
    command: [--endpoint-url, http://rustfs:9000, s3api, create-bucket, --bucket, crab-reference-app]
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  node-0:
    <<: *node
    environment:
      <<: *environment
      CRAB_CELL_PERF_PROCESS_NODE: "0"
      CRAB_CELL_PERF_PROCESS_ADVERTISE: node-0:8080
  node-1:
    <<: *node
    environment:
      <<: *environment
      CRAB_CELL_PERF_PROCESS_NODE: "1"
      CRAB_CELL_PERF_PROCESS_ADVERTISE: node-1:8080
  node-2:
    <<: *node
    environment:
      <<: *environment
      CRAB_CELL_PERF_PROCESS_NODE: "2"
      CRAB_CELL_PERF_PROCESS_ADVERTISE: node-2:8080
  driver:
    <<: *node
    environment: *environment
    command: [driver]

volumes:
  cargo-home:
  rustfs-data:
