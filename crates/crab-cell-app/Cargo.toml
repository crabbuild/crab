[package]
name = "crab-cell-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Dependency-light author API for Crab Cell applications"

[dependencies]
blake3.workspace = true
crab-cell-runtime.workspace = true

[dev-dependencies]
async-trait.workspace = true
crab-cell-runtime = { workspace = true, features = ["test-support"] }
crab-ltx = { workspace = true, features = ["replica"] }
crab-storage.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
object_store.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread"] }
