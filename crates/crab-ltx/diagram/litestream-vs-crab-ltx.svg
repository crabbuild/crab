<svg viewBox="0 0 1120 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Litestream sidecar and crab-ltx embedded architecture</title>
  <desc id="description">Litestream operates background replication beside an application. Crab-ltx is embedded in the host runtime and prepares immutable data for a separate authority decision.</desc>
  <style>text { font-family: 'SF Mono', 'Cascadia Code', 'DejaVu Sans Mono', monospace; }</style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
  </defs>
  <rect width="1120" height="600" fill="#0f172a"/>
  <rect width="1120" height="600" fill="url(#grid)"/>

  <text x="40" y="38" fill="#f8fafc" font-size="18" font-weight="700">Two LTX architectures, two ownership models</text>
  <text x="40" y="59" fill="#94a3b8" font-size="9">The important difference is who drives progress and who selects durable truth.</text>

  <rect x="35" y="85" width="500" height="455" rx="12" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="53" y="111" fill="#22d3ee" font-size="12" font-weight="700">LITESTREAM · SIDECAR</text>
  <text x="53" y="130" fill="#94a3b8" font-size="9">Background process owns replication scheduling and maintenance</text>

  <path d="M 185 205 L 185 250" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 265 285 L 325 285" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 405 320 L 405 365" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <path d="M 405 425 L 405 470" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="294" y="274" fill="#94a3b8" font-size="8" text-anchor="middle">observe WAL</text>
  <text x="420" y="350" fill="#94a3b8" font-size="8">sync loop</text>
  <text x="420" y="454" fill="#94a3b8" font-size="8">upload / list</text>

  <rect x="105" y="150" width="160" height="55" rx="7" fill="#0f172a"/>
  <rect x="105" y="150" width="160" height="55" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="185" y="174" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Application</text>
  <text x="185" y="190" fill="#94a3b8" font-size="8" text-anchor="middle">owns SQL connections</text>

  <rect x="105" y="250" width="160" height="70" rx="7" fill="#0f172a"/>
  <rect x="105" y="250" width="160" height="70" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="185" y="279" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">SQLite database</text>
  <text x="185" y="296" fill="#94a3b8" font-size="8" text-anchor="middle">main file + WAL</text>

  <rect x="325" y="250" width="160" height="70" rx="7" fill="#0f172a"/>
  <rect x="325" y="250" width="160" height="70" rx="7" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="405" y="277" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Litestream</text>
  <text x="405" y="294" fill="#94a3b8" font-size="8" text-anchor="middle">monitor + checkpoints</text>
  <text x="405" y="307" fill="#94a3b8" font-size="8" text-anchor="middle">compaction + retention</text>

  <rect x="325" y="365" width="160" height="60" rx="7" fill="#0f172a"/>
  <rect x="325" y="365" width="160" height="60" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="405" y="391" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Local LTX levels</text>
  <text x="405" y="408" fill="#94a3b8" font-size="8" text-anchor="middle">replica position</text>

  <g transform="translate(345,480)">
    <rect x="0" y="10" width="120" height="42" rx="2" fill="#0f172a"/>
    <ellipse cx="60" cy="10" rx="60" ry="11" fill="#0f172a"/>
    <ellipse cx="60" cy="52" rx="60" ry="11" fill="#0f172a"/>
    <rect x="0" y="10" width="120" height="42" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="60" cy="10" rx="60" ry="11" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="60" cy="52" rx="60" ry="11" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="52" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="120" y1="10" x2="120" y2="52" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="60" y="35" fill="#f8fafc" font-size="10" font-weight="600" text-anchor="middle">Replica store</text>
  </g>

  <rect x="585" y="85" width="500" height="455" rx="12" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="603" y="111" fill="#34d399" font-size="12" font-weight="700">CRAB-LTX · EMBEDDED</text>
  <text x="603" y="130" fill="#94a3b8" font-size="9">Host owns scheduling, authority, acknowledgement, and retention</text>

  <path d="M 745 205 L 745 250" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M 825 285 L 885 285" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M 965 320 L 965 365" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <path d="M 885 395 L 825 395" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M 745 425 L 745 470" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="855" y="274" fill="#94a3b8" font-size="8" text-anchor="middle">capture</text>
  <text x="980" y="350" fill="#94a3b8" font-size="8">immutable upload</text>
  <text x="855" y="385" fill="#fbbf24" font-size="8" text-anchor="middle">root proposal</text>
  <text x="760" y="454" fill="#94a3b8" font-size="8">owner/head CAS</text>

  <rect x="665" y="150" width="160" height="55" rx="7" fill="#0f172a"/>
  <rect x="665" y="150" width="160" height="55" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="745" y="174" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Host runtime</text>
  <text x="745" y="190" fill="#94a3b8" font-size="8" text-anchor="middle">application + policy</text>

  <rect x="665" y="250" width="160" height="70" rx="7" fill="#0f172a"/>
  <rect x="665" y="250" width="160" height="70" rx="7" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="745" y="278" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">ManagedDb</text>
  <text x="745" y="295" fill="#94a3b8" font-size="8" text-anchor="middle">SQLite + WAL ownership</text>
  <text x="745" y="308" fill="#94a3b8" font-size="8" text-anchor="middle">verified local cuts</text>

  <rect x="885" y="250" width="160" height="70" rx="7" fill="#0f172a"/>
  <rect x="885" y="250" width="160" height="70" rx="7" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="965" y="278" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">CellReplica</text>
  <text x="965" y="295" fill="#94a3b8" font-size="8" text-anchor="middle">verify + prepare</text>
  <text x="965" y="308" fill="#94a3b8" font-size="8" text-anchor="middle">never publishes authority</text>

  <g transform="translate(905,375)">
    <rect x="0" y="10" width="120" height="42" rx="2" fill="#0f172a"/>
    <ellipse cx="60" cy="10" rx="60" ry="11" fill="#0f172a"/>
    <ellipse cx="60" cy="52" rx="60" ry="11" fill="#0f172a"/>
    <rect x="0" y="10" width="120" height="42" fill="rgba(76,29,149,0.4)"/>
    <ellipse cx="60" cy="10" rx="60" ry="11" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <ellipse cx="60" cy="52" rx="60" ry="11" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="0" y1="10" x2="0" y2="52" stroke="#a78bfa" stroke-width="1.5"/>
    <line x1="120" y1="10" x2="120" y2="52" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="60" y="31" fill="#f8fafc" font-size="9" font-weight="600" text-anchor="middle">Immutable Cell</text>
    <text x="60" y="43" fill="#94a3b8" font-size="8" text-anchor="middle">objects + roots</text>
  </g>

  <rect x="665" y="470" width="160" height="60" rx="7" fill="#0f172a"/>
  <rect x="665" y="470" width="160" height="60" rx="7" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="745" y="496" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Cell authority</text>
  <text x="745" y="513" fill="#94a3b8" font-size="8" text-anchor="middle">selects durable truth</text>

  <text x="40" y="577" fill="#64748b" font-size="8">Shared concept: checksum-linked LTX ranges. Different contract: lifecycle, layout, authority, and restore selection.</text>
</svg>
