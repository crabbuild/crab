[package]
name = "crab-ltx"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "SQLite LTX capture, object-store replication, and verified recovery for Crab"

[features]
default = []
replica = ["dep:crab-storage", "dep:object_store", "dep:bytes", "dep:serde", "dep:serde_json", "dep:tokio"]

[dependencies]
rusqlite.workspace = true
thiserror.workspace = true
blake3.workspace = true
tempfile.workspace = true
crc-fast = { version = "=1.10.0", default-features = false, features = ["std"] }
lz4_flex = "=0.11.6"
crab-storage = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "sync", "time", "net", "macros"] }

[dev-dependencies]
object_store = { workspace = true, features = ["fs"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
