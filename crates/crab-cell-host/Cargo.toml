[package]
name = "crab-cell-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Provider-neutral Cell node lifecycle facade"

[dependencies]
crab-cell-app.workspace = true
crab-cell-runtime.workspace = true
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
