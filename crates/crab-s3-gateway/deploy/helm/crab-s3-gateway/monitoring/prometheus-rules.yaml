groups:
  - name: crab-s3-gateway.availability
    rules:
      - alert: CrabS3GatewayMultipartMaintenanceStalled
        expr: time() - crab_s3_gateway_multipart_maintenance_last_success_timestamp_seconds > 180
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Crab S3 gateway multipart maintenance is stale
          description: The gateway has not completed a fully healthy multipart reconciliation cycle in more than three minutes.

      - alert: CrabS3GatewayMultipartMaintenanceFailures
        expr: sum by (namespace, pod) (increase(crab_s3_gateway_multipart_maintenance_failures_total[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Crab S3 gateway multipart maintenance failed
          description: Multipart reconciliation reported at least one bounded failure during the last ten minutes.

      - alert: CrabS3GatewayBackendAuthorizationFailures
        expr: sum by (namespace, pod) (increase(crab_s3_gateway_backend_requests_total{outcome="auth"}[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Crab S3 gateway backend authorization failed
          description: The gateway cannot authorize at least one logical request to its backing object store.

      - alert: CrabS3GatewayResponseBodyErrors
        expr: sum by (namespace, pod) (increase(crab_s3_gateway_http_response_body_errors_total[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Crab S3 gateway response streaming failed
          description: At least one response body failed after its S3 response headers were sent.

      - alert: CrabS3GatewayServerErrors
        expr: sum by (namespace, pod) (increase(crab_s3_gateway_http_requests_total{outcome="5xx"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Crab S3 gateway is returning server errors
          description: S3 requests have returned server-side failures for five minutes.

  - name: crab-s3-gateway.capacity
    rules:
      - alert: CrabS3GatewayAdmissionPressure
        expr: sum by (namespace, pod) (increase(crab_s3_gateway_admission_events_total{outcome=~"overloaded|timeout"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Crab S3 gateway admission queues are saturated
          description: Requests have been rejected or timed out at bounded admission for five minutes; scale replicas or reduce client fanout.

      - alert: CrabS3GatewayScratchProbeFailed
        expr: crab_s3_gateway_scratch_filesystem_probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Crab S3 gateway scratch filesystem is unavailable
          description: The gateway cannot verify writable scratch capacity and will reject work rather than risk disk exhaustion.

      - alert: CrabS3GatewayScratchCapacityRejected
        expr: sum by (namespace, pod) (increase(crab_s3_gateway_scratch_capacity_rejections_total[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Crab S3 gateway scratch admission is rejecting requests
          description: Scratch capacity or its safety probe has rejected requests for five minutes.

      - alert: CrabS3GatewayScratchIoFailures
        expr: sum by (namespace, pod) (increase(crab_s3_gateway_scratch_io_failures_total[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Crab S3 gateway scratch I/O failed
          description: A scratch create, write, flush, or read operation failed during the last ten minutes.

      - alert: CrabS3GatewayScratchLow
        expr: (crab_s3_gateway_scratch_filesystem_available_bytes / clamp_min(crab_s3_gateway_scratch_filesystem_size_bytes, 1) < 0.15) and on (namespace, pod) (crab_s3_gateway_scratch_filesystem_probe_success == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Crab S3 gateway scratch capacity is low
          description: Less than 15% of the scratch filesystem remains available on a healthy probe.

      - alert: CrabS3GatewayCacheCatalogUnavailable
        expr: crab_s3_gateway_cache_catalog_probe_success == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Crab S3 gateway cache catalog is unavailable
          description: The disposable cache catalog has not produced a healthy accounting probe for five minutes.

      - alert: CrabS3GatewayCachePersistenceFailures
        expr: sum by (namespace, pod) (increase(crab_s3_gateway_cache_local_write_failures_total[10m])) > 0
        labels:
          severity: warning
        annotations:
          summary: Crab S3 gateway cache persistence is failing
          description: Immutable cache publications failed during the last ten minutes; origin reads remain authoritative.

      - alert: CrabS3GatewayCacheNearLimit
        expr: (crab_s3_gateway_cache_retained_bytes + crab_s3_gateway_cache_reserved_bytes + crab_s3_gateway_cache_temporary_bytes) / clamp_min(crab_s3_gateway_cache_limit_bytes, 1) > 0.90
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: Crab S3 gateway cache is near its byte limit
          description: Retained, reserved, and temporary cache bytes have exceeded 90% of the configured process limit for fifteen minutes.

  - name: crab-s3-gateway.backend
    rules:
      - alert: CrabS3GatewayBackendPressure
        expr: sum by (namespace, pod) (rate(crab_s3_gateway_backend_requests_total{outcome=~"throttled|transient|error"}[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Crab S3 gateway backing object store is degraded
          description: Throttled, transient, or unclassified backend failures exceed 0.1 logical requests per second for ten minutes.
