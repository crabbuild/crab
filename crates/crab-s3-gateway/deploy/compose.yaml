name: crab-s3-gateway-smoke

services:
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0-beta.8-glibc}
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-19000}:9000"
    volumes:
      - rustfs-data:/data

  gateway-init:
    profiles: [initialize]
    image: ${CRAB_S3_GATEWAY_IMAGE:-crab-s3-gateway:local}
    depends_on:
      rustfs:
        condition: service_started
    command: ["--config", "/etc/crab/s3-gateway.toml", "--initialize"]
    environment: &backend-environment
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL_S3: http://rustfs:9000
      AWS_ALLOW_HTTP: "true"
      AWS_VIRTUAL_HOSTED_STYLE_REQUEST: "false"
    read_only: true
    tmpfs:
      - /var/lib/crab/tmp:rw,noexec,nosuid,nodev,size=64m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: &gateway-mounts
      - ${CRAB_S3_GATEWAY_CONFIG:?set CRAB_S3_GATEWAY_CONFIG}:/etc/crab/s3-gateway.toml:ro
      - ${CRAB_S3_GATEWAY_SECRET_FILE:?set CRAB_S3_GATEWAY_SECRET_FILE}:/run/secrets/crab-s3-secret:ro
      - gateway-cache:/var/lib/crab/cache-volume

  gateway:
    image: ${CRAB_S3_GATEWAY_IMAGE:-crab-s3-gateway:local}
    depends_on:
      rustfs:
        condition: service_started
    environment: *backend-environment
    read_only: true
    tmpfs:
      - /var/lib/crab/tmp:rw,noexec,nosuid,nodev,size=${CRAB_S3_GATEWAY_SCRATCH_SIZE:-512m},uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 35s
    ports:
      - "127.0.0.1:${CRAB_S3_GATEWAY_PORT:-18080}:8080"
      - "127.0.0.1:${CRAB_S3_GATEWAY_MANAGEMENT_PORT:-18081}:8081"
    volumes: *gateway-mounts

volumes:
  rustfs-data:
  gateway-cache:
