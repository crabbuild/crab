apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crab-http-server-live-qualification
  namespace: crab
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["crab-http-server"]
    verbs: ["patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crab-http-server-live-qualification
  namespace: crab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crab-http-server-live-qualification
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: replace-with-provider-mapped-qualification-group
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crab-http-server-live-qualification-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crab-http-server-live-qualification-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crab-http-server-live-qualification-nodes
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: replace-with-provider-mapped-qualification-group
