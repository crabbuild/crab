apiVersion: v1
kind: Pod
metadata:
  name: {{ include "crab-http-server.fullname" . }}-catalog-test
  {{- with .Values.podLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  serviceAccountName: {{ include "crab-http-server.serviceAccountName" . }}
  automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
  enableServiceLinks: false
  activeDeadlineSeconds: 120
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  {{- with .Values.priorityClassName }}
  priorityClassName: {{ . }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: catalog-test
      image: {{ include "crab-http-server.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args:
        - --config
        - /etc/crab/http-server/server.toml
        - storage-probe
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
          ephemeral-storage: 32Mi
        limits:
          cpu: 500m
          memory: 512Mi
          ephemeral-storage: 256Mi
      {{- with .Values.extraEnv }}
      env:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumeMounts:
        - name: config
          mountPath: /etc/crab/http-server
          readOnly: true
        - name: secrets
          mountPath: /run/secrets/crab
          readOnly: true
        - name: scratch
          mountPath: /var/lib/crab/tmp
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  volumes:
    - name: config
      configMap:
        name: {{ include "crab-http-server.configMapName" . }}
        defaultMode: 0440
        items:
          - key: {{ .Values.config.key }}
            path: server.toml
    - name: secrets
      projected:
        defaultMode: 0400
        sources:
          - secret:
              name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
              items:
                {{- with .Values.secrets.oidcClientSecretKey }}
                - key: {{ . }}
                  path: oidc-client-secret
                {{- end }}
                - key: {{ .Values.secrets.stateKeyKey }}
                  path: state-key
    - name: scratch
      emptyDir:
        sizeLimit: 256Mi
