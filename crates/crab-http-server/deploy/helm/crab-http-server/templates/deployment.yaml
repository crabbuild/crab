{{- range $key := list "app.kubernetes.io/name" "app.kubernetes.io/instance" }}
{{- if hasKey $.Values.podLabels $key }}
{{- fail (printf "podLabels.%s is owned by the chart" $key) }}
{{- end }}
{{- end }}
{{- range $key := list "checksum/managed-config" "crab.build/rollout-token" "prometheus.io/scrape" "prometheus.io/path" "prometheus.io/port" }}
{{- if hasKey $.Values.podAnnotations $key }}
{{- fail (printf "podAnnotations.%s is owned by the chart" $key) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crab-http-server.fullname" . }}
  labels:
    {{- include "crab-http-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "crab-http-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "crab-http-server.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/managed-config: {{ .Values.config.content | sha256sum | quote }}
        {{- with .Values.rolloutToken }}
        crab.build/rollout-token: {{ . | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "crab-http-server.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: crab-http-server
          image: {{ include "crab-http-server.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/crab/http-server/server.toml"]
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/bin/sleep
                  - "15"
          ports:
            - name: http
              containerPort: 8788
              protocol: TCP
            - name: management
              containerPort: 8789
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: management
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: management
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: management
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/crab/http-server
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/crab
              readOnly: true
            - name: scratch
              mountPath: /var/lib/crab/tmp
      topologySpreadConstraints:
        {{- range .Values.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          {{- with .minDomains }}
          minDomains: {{ . }}
          {{- end }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "crab-http-server.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "crab-http-server.configMapName" . }}
            defaultMode: 0440
            items:
              - key: {{ .Values.config.key }}
                path: server.toml
        - name: secrets
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ required "secrets.existingSecret is required" .Values.secrets.existingSecret }}
                  items:
                    {{- with .Values.secrets.oidcClientSecretKey }}
                    - key: {{ . }}
                      path: oidc-client-secret
                    {{- end }}
                    - key: {{ .Values.secrets.stateKeyKey }}
                      path: state-key
        - name: scratch
          emptyDir:
            sizeLimit: {{ .Values.scratch.sizeLimit }}
