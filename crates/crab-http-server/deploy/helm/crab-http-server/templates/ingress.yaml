{{- if .Values.ingress.enabled }}
{{- if ne .Values.service.type "ClusterIP" }}
{{- fail "service.type must be ClusterIP when ingress is enabled" }}
{{- end }}
{{- $host := required "ingress.host is required when ingress is enabled" .Values.ingress.host }}
{{- $tlsSecret := required "ingress.tlsSecretName is required when ingress is enabled" .Values.ingress.tlsSecretName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "crab-http-server.fullname" . }}
  labels:
    {{- include "crab-http-server.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ $tlsSecret }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "crab-http-server.fullname" . }}
                port:
                  name: http
{{- end }}
