replicaCount: 2

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  labels: {}
  automountServiceAccountToken: false

config:
  existingConfigMap: ""
  content: ""
  key: server.toml

secrets:
  existingSecret: ""
  oidcClientSecretKey: oidc-client-secret
  stateKeyKey: state-key

service:
  type: ClusterIP
  port: 80
  annotations: {}
  loadBalancerSourceRanges: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tlsSecretName: ""

networkPolicy:
  enabled: true
  publicIngressFrom: []
  metricsIngressFrom: []

metrics:
  prometheusAnnotations: false

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      percent: 25
      periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      percent: 100
      periodSeconds: 60

resources:
  requests:
    cpu: 500m
    memory: 1Gi
    ephemeral-storage: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi
    ephemeral-storage: 20Gi

scratch:
  sizeLimit: 16Gi

startupProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60

readinessProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

livenessProbe:
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

terminationGracePeriodSeconds: 600
minReadySeconds: 10
revisionHistoryLimit: 3
progressDeadlineSeconds: 900
priorityClassName: ""
rolloutToken: ""

podAnnotations: {}
podLabels: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    minDomains: 2
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
affinity: {}
extraEnv: []
