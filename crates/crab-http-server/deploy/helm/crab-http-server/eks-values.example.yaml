config:
  storageUrl: s3://team-crab-repositories/repositories

serviceAccount:
  name: crab-http-server
  # Associate this service account and namespace with an IAM role through
  # EKS Pod Identity; Pod Identity does not use a service-account annotation.

extraEnv:
  - name: AWS_REGION
    value: us-west-2
  - name: AWS_DEFAULT_REGION
    value: us-west-2
