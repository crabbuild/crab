[package]
name = "crab-http-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Self-hosted repository web application backed by Crab object storage."
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
blake3 = { workspace = true }
clap = { version = "4", features = ["derive"] }
crab-remote-git = { workspace = true }
crab-storage = { workspace = true }
rand = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
