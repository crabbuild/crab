[package]
name = "crab-http-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Self-hosted repository web application backed by Crab object storage."
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
bytes = { workspace = true }
blake3 = { workspace = true }
clap = { version = "4", features = ["derive"] }
crab-read = { workspace = true }
crab-cell-runtime = { workspace = true }
crab-cell-app = { workspace = true }
crab-cell-host = { workspace = true }
crab-lfs = { workspace = true }
crab-git = { workspace = true }
gix-hash = { workspace = true }
gix-diff = { workspace = true, features = ["blob"] }
gix-merge = { workspace = true }
gix-object = { workspace = true }
tempfile = { workspace = true }
crab-coordination = { workspace = true, features = ["object-store-lock"] }
crab-metadata = { workspace = true, features = ["storage"] }
crab-write = { workspace = true }
crab-remote = { workspace = true, features = ["publication"] }
base64 = "0.22"
futures-util = { workspace = true }
fs4 = "0.13.1"
jsonwebtoken.workspace = true
flate2 = { workspace = true }
http-body = "1"
crab-remote-git = { workspace = true }
crab-storage = { workspace = true }
ed25519-dalek = { workspace = true, features = ["pkcs8"] }
rand = "0.9"
rusqlite.workspace = true
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
object_store = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
rustls = "0.23"
rustls-pemfile = "2"
url = { version = "2", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
sysinfo = "0.38.4"
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tokio-util = { workspace = true, features = ["io", "rt"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true }
x509-cert = "0.2.5"
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
async-trait = { workspace = true }
crab-cell-runtime = { workspace = true, features = ["test-support"] }
crab-ltx = { workspace = true, features = ["replica"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
