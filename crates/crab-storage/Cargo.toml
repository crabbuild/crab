[package]
name = "crab-storage"
version = "0.1.0"
publish = false
edition = "2024"
license = "Apache-2.0"
description = "Object-store layout and transport helpers for Crab."

[lib]
name = "crab_storage"
path = "src/lib.rs"

[dependencies]
blake3 = { workspace = true }
bytes = { workspace = true }
crab-types = { workspace = true }
futures-util = { workspace = true }
object_store = { workspace = true, features = [
    "aws",
    "gcp",
    "azure",
    "fs",
] }
rand = "0.9"
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
url = "2.5"

[dev-dependencies]
tempfile = { workspace = true }
