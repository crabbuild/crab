[package]
name = "crab-vfs"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
description = "Virtual filesystem mounts, snapshots, overlays, and hydration for Crab."

[features]
default = []
fuse = ["dep:fuser"]
nfs = ["dep:nfs3_server", "dep:nfs3_types"]
gix-facade = ["crab-git/facade"]

[lib]
name = "crab_vfs"
path = "src/lib.rs"

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true }
crab-cache = { workspace = true, features = ["local-cache", "xet-chunk-cache"] }
crab-cache-store = { workspace = true }
crab-git = { workspace = true }
crab-read = { workspace = true }
crab-staging = { workspace = true }
crab-storage = { workspace = true }
crab-types = { workspace = true }
crab-xet = { workspace = true }
dashmap = "6"
fuser = { version = "0.17", optional = true }
fs4 = "0.13"
gix-hash = { workspace = true, features = ["sha1"] }
gix-object = { workspace = true }
gix-odb = { workspace = true, features = ["sha1"] }
gix-traverse = { workspace = true }
nfs3_server = { version = "0.11", optional = true }
nfs3_types = { version = "0.5", optional = true }
object_store = { workspace = true }
rand = "0.9"
rusqlite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "fs", "time", "signal", "process", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
xet-client = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["signal"] }

[dev-dependencies]
proptest = "1"
tempfile = { workspace = true }
