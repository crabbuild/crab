[package]
name = "crab-metadata"
version = "0.1.0"
publish = true
edition = "2024"
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
description = "Metadata schema and graph contracts for Crab."

[lib]
name = "crab_metadata"
path = "src/lib.rs"

[features]
default = []
file-index-reader = ["storage", "slatedb-cache", "dep:futures-util", "dep:object_store", "dep:tokio", "dep:tokio-util"]
local-index = ["dep:rusqlite"]
remote-index = ["storage", "slatedb-cache", "dep:futures-util", "dep:object_store"]
slatedb-cache = ["dep:async-trait", "dep:moka", "dep:slatedb"]
storage = ["dep:base64", "dep:crab-storage", "dep:futures-util", "dep:object_store", "dep:tokio"]

[dependencies]
async-trait = { workspace = true, optional = true }
base64 = { version = "0.22", optional = true }
blake3 = { workspace = true }
bstr = { version = "1", default-features = false, features = ["std"] }
bytes = { workspace = true }
crab-storage = { workspace = true, optional = true }
crab-xet = { workspace = true }
flate2 = { workspace = true }
futures-util = { workspace = true, optional = true }
gix-validate = { workspace = true }
object_store = { workspace = true, optional = true }
moka = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
slatedb = { workspace = true, optional = true, features = ["wal_disable", "zstd"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time"], optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
proptest = "1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
