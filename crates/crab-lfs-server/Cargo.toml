[package]
name = "crab-lfs-server"
version = "1.0.15"
edition = "2024"
license = "Apache-2.0"
description = "Standard Git LFS Batch/basic/File Locking gateway for Crab."

[lib]
name = "crab_lfs_server"
path = "src/lib.rs"

[[bin]]
name = "crab-lfs-server"
path = "src/bin/crab_lfs_server.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "matched-path"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
blake3 = { workspace = true }
clap = { version = "4", features = ["derive"] }
crab-lfs = { workspace = true }
crab-storage = { workspace = true }
futures-util = { workspace = true }
object_store = { workspace = true }
rustls = "0.23"
rustls-pemfile = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.10"
tempfile = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"

[dev-dependencies]
object_store = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
