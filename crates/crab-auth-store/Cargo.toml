[package]
name = "crab-auth-store"
version = "0.1.0"
publish = true
edition = "2024"
license = "Apache-2.0"
repository.workspace = true
rust-version.workspace = true
description = "Auth credential to storage store adapter for Crab."

[lib]
name = "crab_auth_store"
path = "src/lib.rs"

[features]
default = []
refreshing-store = [
    "dep:async-trait",
    "dep:blake3",
    "dep:futures-util",
    "dep:object_store",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
]
managed-service = [
    "refreshing-store",
    "crab-auth/oidc-client",
    "dep:crab-git",
    "dep:tokio-util",
    "dep:uuid",
]
azure-cdn-placement = ["crab-auth/azure-management", "dep:async-trait", "dep:reqwest"]
operator-cdn = ["refreshing-store", "crab-auth/crab-auth-client", "azure-cdn-placement", "dep:serde"]
view-retention = ["crab-auth/crab-auth-client", "dep:async-trait", "dep:crab-coordination", "dep:tokio"]

[dependencies]
async-trait = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
crab-auth = { workspace = true }
crab-coordination = { workspace = true, optional = true, features = ["object-store-lock"] }
crab-git = { workspace = true, optional = true }
crab-storage = { workspace = true }
crab-types = { workspace = true }
futures-util = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"], optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
tracing = { workspace = true, optional = true }
url = { version = "2.5", optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
bytes = { workspace = true }
crab-storage = { workspace = true, features = ["test-support"] }
tempfile = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true }
