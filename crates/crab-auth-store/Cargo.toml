[package]
name = "crab-auth-store"
version = "0.1.0"
publish = false
edition = "2024"
license = "Apache-2.0"
description = "Auth credential to storage store adapter for Crab."

[lib]
name = "crab_auth_store"
path = "src/lib.rs"

[features]
default = []
refreshing-store = [
    "dep:async-trait",
    "dep:blake3",
    "dep:futures-util",
    "dep:object_store",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing",
    "dep:url",
    "dep:uuid",
]
managed-service = [
    "refreshing-store",
    "crab-auth/oidc-client",
    "dep:crab-git",
    "dep:tokio-util",
    "dep:uuid",
]

[dependencies]
async-trait = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
crab-auth = { workspace = true }
crab-git = { workspace = true, optional = true }
crab-storage = { workspace = true }
crab-types = { workspace = true }
futures-util = { workspace = true, optional = true }
object_store = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "rustls-tls", "stream"], optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"], optional = true }
tokio-util = { workspace = true, features = ["rt"], optional = true }
tracing = { workspace = true, optional = true }
url = { version = "2.5", optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
bytes = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }
uuid = { workspace = true }
