# The GitHub GraphQL schema subset Crab serves at /api/graphql.
#
# Names and nullability follow GitHub's public schema so GitHub clients can
# decode responses unchanged. Every field here resolves to Crab data or to a
# value that is empty in Crab's model (for example, no stars). Fields absent
# from this file fail validation with GitHub's own error message, which is how
# clients such as gh detect optional features.

scalar DateTime
scalar URI
scalar GitObjectID
scalar GitTimestamp
scalar BigInt

interface Node {
  id: ID!
}

interface UniformResourceLocatable {
  resourcePath: URI!
  url: URI!
}

interface Actor {
  login: String!
  resourcePath: URI!
  url: URI!
}

interface RepositoryOwner {
  id: ID!
  login: String!
  repositories(first: Int, after: String, last: Int, before: String, privacy: RepositoryPrivacy, visibility: RepositoryVisibility, isFork: Boolean, isArchived: Boolean, isLocked: Boolean, ownerAffiliations: [RepositoryAffiliation], affiliations: [RepositoryAffiliation], orderBy: RepositoryOrder): RepositoryConnection!
  repository(name: String!, followRenames: Boolean): Repository
  resourcePath: URI!
  url: URI!
}

interface GitObject {
  abbreviatedOid: String!
  commitUrl: URI!
  id: ID!
  oid: GitObjectID!
  repository: Repository!
}

type Query {
  viewer: User!
  repository(owner: String!, name: String!, followRenames: Boolean): Repository
  repositoryOwner(login: String!): RepositoryOwner
  user(login: String!): User
  organization(login: String!): Organization
  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node]!
  search(first: Int, after: String, last: Int, before: String, query: String!, type: SearchType!): SearchResultItemConnection!
  rateLimit(dryRun: Boolean): RateLimit
}

type Mutation {
  addComment(input: AddCommentInput!): AddCommentPayload
  closeIssue(input: CloseIssueInput!): CloseIssuePayload
  reopenIssue(input: ReopenIssueInput!): ReopenIssuePayload
  createIssue(input: CreateIssueInput!): CreateIssuePayload
  createRepository(input: CreateRepositoryInput!): CreateRepositoryPayload
  updateIssue(input: UpdateIssueInput!): UpdateIssuePayload
  createPullRequest(input: CreatePullRequestInput!): CreatePullRequestPayload
  updatePullRequest(input: UpdatePullRequestInput!): UpdatePullRequestPayload
  closePullRequest(input: ClosePullRequestInput!): ClosePullRequestPayload
  reopenPullRequest(input: ReopenPullRequestInput!): ReopenPullRequestPayload
  mergePullRequest(input: MergePullRequestInput!): MergePullRequestPayload
  addPullRequestReview(input: AddPullRequestReviewInput!): AddPullRequestReviewPayload
  markPullRequestReadyForReview(input: MarkPullRequestReadyForReviewInput!): MarkPullRequestReadyForReviewPayload
  convertPullRequestToDraft(input: ConvertPullRequestToDraftInput!): ConvertPullRequestToDraftPayload
  addLabelsToLabelable(input: AddLabelsToLabelableInput!): AddLabelsToLabelablePayload
  removeLabelsFromLabelable(input: RemoveLabelsFromLabelableInput!): RemoveLabelsFromLabelablePayload
}

type RateLimit {
  cost: Int!
  limit: Int!
  nodeCount: Int!
  remaining: Int!
  resetAt: DateTime!
  used: Int!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
}

