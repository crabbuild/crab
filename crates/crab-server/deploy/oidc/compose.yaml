name: crab-oidc-dev

services:
  idp:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:18080"]
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin
    volumes:
      - ./crab-dev-realm.json:/opt/keycloak/data/import/crab-dev-realm.json:ro
      - ./themes/crab/login/theme.properties:/opt/keycloak/themes/crab/login/theme.properties:ro
      - ./themes/crab/login/messages:/opt/keycloak/themes/crab/login/messages:ro
      - ./themes/crab/login/resources/css/crab.css:/opt/keycloak/themes/crab/login/resources/css/crab.css:ro
      - ../../../../packages/ui/src/styles/theme.css:/opt/keycloak/themes/crab/login/resources/css/theme.css:ro
      - ./themes/crab/login/resources/fonts:/opt/keycloak/themes/crab/login/resources/fonts:ro
      - ../../../../packages/web/crab.optimized.svg:/opt/keycloak/themes/crab/login/resources/img/crab-mark.svg:ro
    mem_limit: 1g
