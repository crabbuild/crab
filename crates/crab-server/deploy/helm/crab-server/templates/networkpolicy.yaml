{{- if .Values.networkPolicy.enabled }}
{{- include "crab-server.validateNetworkPeers" (dict "name" "networkPolicy.publicIngressFrom" "peers" .Values.networkPolicy.publicIngressFrom) }}
{{- include "crab-server.validateNetworkPeers" (dict "name" "networkPolicy.metricsIngressFrom" "peers" .Values.networkPolicy.metricsIngressFrom) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "crab-server.fullname" . }}
  labels:
    {{- include "crab-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "crab-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: management
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              {{- include "crab-server.selectorLabels" . | nindent 14 }}
    {{- with .Values.networkPolicy.publicIngressFrom }}
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.networkPolicy.metricsIngressFrom }}
    - ports:
        - port: management
          protocol: TCP
      from:
        {{- toYaml . | nindent 8 }}
    {{- end }}
{{- end }}
