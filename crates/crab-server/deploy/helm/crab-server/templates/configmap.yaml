{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crab-server.fullname" . }}
  labels:
    {{- include "crab-server.labels" . | nindent 4 }}
data:
  {{ .Values.config.key }}: |
    {{- include "crab-server.managedConfig" . | nindent 4 }}
{{- end }}
