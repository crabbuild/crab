kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    labels:
      topology.kubernetes.io/zone: local-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-b
      crab.build/qualification-storage: "true"
    extraMounts:
      - hostPath: /tmp/crab-kubernetes-objectstore
        containerPath: /crab-objectstore
  - role: worker
    labels:
      topology.kubernetes.io/zone: local-b
