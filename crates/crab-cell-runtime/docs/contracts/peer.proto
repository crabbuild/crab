syntax = "proto3";
package crab.cell.peer.v1;

// Private messages for enrolled Crab nodes, not a public gRPC service.
// Rust message types are generated privately inside crab-cell-runtime.
message PeerAuthorization {
  bytes origin_session = 1;  // 16 bytes; enrollment binds the signing public key.
  string principal_issuer = 2;
  string principal_subject = 3;
  repeated string actions = 4; // Sorted unique compiled action identifiers.
  bytes release_digest = 5;  // 32 bytes.
  int64 issued_at_ms = 6;
  int64 expires_at_ms = 7;
  bytes payload_digest = 8;  // BLAKE3 of exact nested operation bytes.
  bytes signature = 9;       // Ed25519; 64 bytes.
}
message PeerRequest {
  uint32 version = 1;        // Exactly 1.
  PeerAuthorization authorization = 2;
  uint32 hop_count = 3;      // 1..2 on wire; local calls do not forward.
  uint32 remaining_ms = 4;   // 1..60000; never extend the signed expiry.
  oneof operation {
    MutationRequest mutate = 10;
    ReadRequest read = 11;
    ResolveRequest resolve = 12;
    EffectRequest deliver_effect = 13;
    EffectResolveRequest resolve_effect = 14;
    MigrationRequest migrate = 15;
  }
}
message PeerReply {
  oneof outcome {
    MutationReply mutation = 1;
    ReadReply read = 2;
    ResolveReply resolve = 3;
    Error error = 4;
    MigrationReply migration = 5;
  }
}

message EffectIdentity {
  bytes effect_id = 1;
  bytes source_cell = 2;
  bytes source_incarnation = 3;
  uint64 source_sequence = 4;
  uint32 ordinal = 5;
  int64 expires_at_ms = 6;
}
message EffectRequest {
  Target target = 1;
  bytes destination_incarnation = 2;
  EffectIdentity identity = 3;
  oneof operation {
    // Native primitives cross the peer boundary through the registered typed
    // command codec. There is no second primitive-specific wire path.
    CellCommand cell_command = 10;
  }
  reserved 11 to 17;
}
message EffectResolveRequest {
  Target target = 1;
  bytes destination_incarnation = 2;
  EffectIdentity identity = 3;
  bytes operation_digest = 4;
}

// Release control request. The receiver derives SQL from its frozen registry;
// callers can only bind the exact source and expected successor versions.
message MigrationRequest {
  Target target = 1;
  bytes incarnation = 2;
  bytes from_code = 3;
  uint32 from_schema = 4;
  bytes to_code = 5;
  uint32 to_schema = 6;
}
message MigrationReply { CellDescription description = 1; }

message Target {
  bytes tenant_id = 1;
  bytes application_id = 2;
  bytes namespace_id = 3;
  bytes partition = 4;
}
message MutationIdentity {
  bytes request_id = 1;       // 16 bytes; immutable across retries.
  bytes incarnation = 2;      // 16 bytes; obtained by Read or provisioning.
  int64 issued_at_ms = 3;
  int64 expires_at_ms = 4;
}
// Native primitive payloads are encoded by the registered module codec.
message CellCommand { uint32 command_id = 1; uint32 codec_version = 2; bytes input = 3; }
message MutationRequest {
  Target target = 1;
  MutationIdentity identity = 2;
  uint32 timeout_ms = 3;
  oneof operation {
    CellCommand cell_command = 10;
  }
  reserved 11 to 20;
}
message Receipt {
  bytes cell_id = 1;
  bytes incarnation = 2;
  uint64 commit_sequence = 3;
}
message Error {
  enum Code {
    INVALID = 0;
    INVALID_ARGUMENT = 1;
    PERMISSION_DENIED = 2;
    NOT_FOUND = 3;
    PRECONDITION_FAILED = 4;
    REQUEST_ID_CONFLICT = 5;
    REQUEST_EXPIRED = 6;
    LEASE_LOST = 7;
    RESOURCE_EXHAUSTED = 8;
    OUTCOME_UNKNOWN = 9;
    UNAVAILABLE = 10;
    SCHEMA_INCOMPATIBLE = 11;
    INTERNAL = 12;
    REPLICA_BEHIND = 13;
    REPLICA_UNAVAILABLE = 14;
  }
  enum Outcome { UNSPECIFIED = 0; NOT_STARTED = 1; REJECTED = 2; UNKNOWN = 3; }
  Code code = 1;
  Outcome outcome = 2;
  string message = 3;
  uint32 retry_after_ms = 4;
  bytes application_details = 5;
}
message MutationResult {
  oneof result {
    bytes command_output = 1;
  }
  reserved 2 to 7;
}
message MutationReply {
  Receipt receipt = 1; // Present for a durable success or stored rejection.
  oneof outcome { MutationResult result = 2; Error error = 3; }
}
message CellQuery { uint32 query_id = 1; uint32 codec_version = 2; bytes input = 3; }
message ReadRequest {
  Target target = 1;
  uint32 timeout_ms = 2;
  Receipt minimum = 3;
  oneof operation {
    bool describe = 10;
    CellQuery cell_query = 15;
    bool replica_activate = 16; // Advisory; receiver verifies policy and current owner.
    CellQuery replica_query = 17; // Explicit snapshot-consistent read.
    bool replica_reconcile = 18; // Advisory owner wake-up after policy CAS.
    bool replica_status = 19; // Fresh readiness check; never activates a view.
  }
  reserved 11 to 14;
}
message CellDescription {
  bytes cell_id = 1;
  bytes incarnation = 2;
  bytes code = 3;
  uint32 schema = 4;
}
message ReadReply {
  Receipt receipt = 1;
  oneof result {
    CellDescription description = 2;
    bytes command_output = 6;
    Error error = 7;
    bool replica_ready = 8; // Exact local snapshot; false means warm only, never readable.
    bool replica_reconciled = 9; // Owner accepted a reconciliation hint.
  }
  reserved 3 to 5;
}
message ResolveRequest { Target target = 1; MutationIdentity identity = 2; bytes operation_digest = 3; }
message ResolveReply {
  enum State { INVALID = 0; COMMITTED = 1; REJECTED = 2; ABSENT = 3; UNKNOWN = 4; EXPIRED = 5; }
  State state = 1;
  MutationReply reply = 2;
}
