[package]
name = "crab-workflow"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
description = "Workflow contracts and runtime engine for Crab."

[features]
default = []
crash-injection = []
gix-facade = ["dep:gix"]
testing = []
watch = ["dep:notify"]

[lib]
name = "crab_workflow"
path = "src/lib.rs"

[dependencies]
blake3 = { workspace = true }
md-5 = { workspace = true }
bytes = { workspace = true }
crab-storage = { workspace = true }
crab-coordination = { workspace = true, features = ["object-store-lock"] }
crab-types = { workspace = true }
fs4 = "0.13"
futures-util = { workspace = true }
gix-discover = { workspace = true }
gix = { workspace = true, optional = true }
gix-hash = { workspace = true, features = ["sha1"] }
gix-object = { workspace = true }
gix-odb = { workspace = true, features = ["sha1"] }
globset = { workspace = true }
notify = { version = "7", optional = true }
object_store = { workspace = true, features = ["aws", "gcp", "azure", "fs", "http"] }
reqwest = { workspace = true, features = ["blocking", "rustls-tls", "stream"] }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
petgraph = "0.6"
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "io-util", "io-std", "fs", "time", "signal", "process"] }
tokio-util = { workspace = true, features = ["rt"] }
toml = { workspace = true }
tracing = { workspace = true }
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v7", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["signal"] }

[dev-dependencies]
insta = "1"
proptest = "1"
