<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="title desc">
  <title id="title">One Git history with two physical data paths</title>
  <desc id="desc">A single commit names source code and a compact Crab pointer in Git history. The pointer resolves immutable large-file data in the repository's object store, producing one visible repository state.</desc>
  <defs>
    <linearGradient id="cover-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1d2e"/>
    </linearGradient>
    <linearGradient id="commit-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172337"/>
      <stop offset="1" stop-color="#10263a"/>
    </linearGradient>
    <pattern id="cover-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1e344a" stroke-width="0.6"/>
    </pattern>
    <marker id="identity-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0 7 3.5 0 7Z" fill="#22d3ee"/>
    </marker>
    <filter id="cover-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .eyebrow { font-size: 9px; font-weight: 700; letter-spacing: 1.6px; }
    .label { font-size: 12px; font-weight: 750; }
    .detail { font-size: 9px; fill: #94a3b8; }
  </style>

  <rect x="1" y="1" width="558" height="398" rx="24" fill="url(#cover-bg)" stroke="#22364c" stroke-width="2"/>
  <rect x="1" y="1" width="558" height="398" rx="24" fill="url(#cover-grid)" opacity="0.46"/>
  <path d="M1 92H559M1 338H559" stroke="#1d3348"/>

  <g aria-hidden="true">
    <circle cx="34" cy="28" r="4" fill="#22d3ee"/>
    <circle cx="48" cy="28" r="4" fill="#334155"/>
    <circle cx="62" cy="28" r="4" fill="#334155"/>
  </g>
  <text x="82" y="32" class="mono eyebrow" fill="#7dd3fc">CURRENT SUBJECT</text>
  <g transform="translate(440 19)">
    <rect width="86" height="20" rx="10" fill="#063c31" stroke="#10b981" stroke-opacity="0.55"/>
    <circle cx="14" cy="10" r="3" fill="#34d399"/>
    <text x="27" y="13" class="mono" fill="#a7f3d0" font-size="8" font-weight="700">LIVE MODEL</text>
  </g>
  <text x="34" y="65" fill="#f8fafc" font-size="20" font-weight="760">One history. Two data paths.</text>
  <text x="34" y="82" class="detail">Git names the state; your bucket carries the weight.</text>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M280 150V167H148V184M280 167H412V184" stroke="#526579" stroke-width="1.5"/>
    <path d="M262 272H298" stroke="#22d3ee" stroke-width="1.7" stroke-dasharray="4 4" marker-end="url(#identity-arrow)"/>
  </g>

  <g filter="url(#cover-shadow)">
    <rect x="34" y="108" width="492" height="42" rx="10" fill="#07111f"/>
    <rect x="34" y="108" width="492" height="42" rx="10" fill="url(#commit-bg)" stroke="#fb923c" stroke-opacity="0.72"/>
  </g>
  <g transform="translate(52 119)" fill="none" stroke="#fb923c" stroke-width="1.5" stroke-linecap="round">
    <circle cx="4" cy="4" r="3"/>
    <circle cx="4" cy="18" r="3"/>
    <circle cx="18" cy="11" r="3"/>
    <path d="M4 7v8M7 4h3a8 8 0 0 1 8 4"/>
  </g>
  <text x="84" y="128" class="mono eyebrow" fill="#fdba74">COMMIT 8FC2</text>
  <text x="84" y="142" class="detail">one exact tree · one reviewable state</text>
  <text x="506" y="133" class="mono" fill="#64748b" font-size="8" text-anchor="end">main</text>

  <g>
    <rect x="34" y="184" width="228" height="132" rx="14" fill="#07111f"/>
    <rect x="34" y="184" width="228" height="132" rx="14" fill="rgba(124,45,18,0.16)" stroke="#fb923c" stroke-opacity="0.7"/>
    <text x="52" y="207" class="mono eyebrow" fill="#fdba74">GIT HISTORY</text>
    <text x="52" y="228" class="label" fill="#f8fafc">Code + compact pointer</text>
    <rect x="52" y="243" width="192" height="24" rx="6" fill="#101d2c" stroke="#334155"/>
    <circle cx="65" cy="255" r="3" fill="#fb923c"/>
    <text x="76" y="258" class="mono" fill="#cbd5e1" font-size="8.5">src/train.rs</text>
    <text x="231" y="258" class="mono" fill="#64748b" font-size="8" text-anchor="end">BLOB</text>
    <rect x="52" y="276" width="192" height="24" rx="6" fill="#0b2735" stroke="#22d3ee" stroke-opacity="0.7"/>
    <circle cx="65" cy="288" r="3" fill="#22d3ee"/>
    <text x="76" y="291" class="mono" fill="#bae6fd" font-size="8.5">encoder.bin</text>
    <text x="231" y="291" class="mono" fill="#67e8f9" font-size="8" text-anchor="end">f41a…</text>
  </g>

  <g>
    <rect x="298" y="184" width="228" height="132" rx="14" fill="#07111f"/>
    <rect x="298" y="184" width="228" height="132" rx="14" fill="rgba(8,51,68,0.32)" stroke="#22d3ee" stroke-opacity="0.75"/>
    <text x="316" y="207" class="mono eyebrow" fill="#67e8f9">YOUR OBJECT STORE</text>
    <text x="316" y="228" class="label" fill="#f8fafc">Immutable large-file data</text>
    <g transform="translate(318 246)" fill="none" stroke="#22d3ee" stroke-width="1.4">
      <ellipse cx="25" cy="5" rx="25" ry="5" fill="#0c3140"/>
      <path d="M0 5v31c0 3 11 5 25 5s25-2 25-5V5" fill="#0c3140"/>
      <path d="M0 18c0 3 11 5 25 5s25-2 25-5M0 31c0 3 11 5 25 5s25-2 25-5" opacity="0.58"/>
    </g>
    <g class="mono" font-size="8.5">
      <rect x="384" y="246" width="54" height="20" rx="5" fill="#11283a" stroke="#475569"/>
      <text x="411" y="259" fill="#cbd5e1" text-anchor="middle">XORBS</text>
      <rect x="446" y="246" width="62" height="20" rx="5" fill="#11283a" stroke="#475569"/>
      <text x="477" y="259" fill="#cbd5e1" text-anchor="middle">SHARDS</text>
      <rect x="384" y="276" width="124" height="24" rx="6" fill="#0b2735" stroke="#22d3ee" stroke-opacity="0.7"/>
      <text x="446" y="291" fill="#67e8f9" text-anchor="middle">RECIPE · BYTE RANGES</text>
    </g>
  </g>

  <rect x="34" y="354" width="492" height="28" rx="8" fill="#063c31" stroke="#10b981" stroke-opacity="0.58"/>
  <circle cx="53" cy="368" r="4" fill="#34d399"/>
  <path d="m51 368 2 2 4-5" fill="none" stroke="#052e2b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="372" class="mono" fill="#a7f3d0" font-size="9" font-weight="700" letter-spacing="0.8">ONE VISIBLE REPOSITORY STATE</text>
  <text x="508" y="372" class="mono" fill="#5eead4" font-size="8" text-anchor="end">COMPLETE</text>
</svg>
