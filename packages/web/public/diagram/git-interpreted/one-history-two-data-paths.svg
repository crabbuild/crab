<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">One Git history, two data paths</title>
  <desc id="desc">Normal files flow into Git blobs while large Crab-tracked files flow into pointer blobs plus xorbs and shards. Both paths become visible through one ref transaction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0f1c30"/>
    </linearGradient>
    <linearGradient id="git-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15263d"/>
      <stop offset="1" stop-color="#101e32"/>
    </linearGradient>
    <linearGradient id="xet-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3141"/>
      <stop offset="1" stop-color="#10273a"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-sky" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#38bdf8"/>
    </marker>
    <path id="normal-route" d="M280 250C350 250 354 205 424 205H742C800 205 810 260 866 260"/>
    <path id="pointer-route" d="M280 430C350 430 354 380 424 380H742C800 380 810 330 866 330"/>
    <path id="payload-route" d="M610 462C690 462 752 488 814 488H866"/>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#94a3b8}.label{fill:#cbd5e1}.strong{fill:#f8fafc}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .dash{stroke-dasharray:7 8}.animated{display:block}
      .publish-ring{transform-box:fill-box;transform-origin:center;animation:publish 4.8s ease-out infinite}
      .manifest-pulse{animation:manifest 4.8s ease-in-out infinite}
      @keyframes publish{0%,72%{transform:scale(.82);opacity:0}78%{opacity:.9}92%,100%{transform:scale(1.35);opacity:0}}
      @keyframes manifest{0%,70%{fill:#17324a;stroke:#475569}80%,90%{fill:#0c4a6e;stroke:#38bdf8}100%{fill:#17324a;stroke:#475569}}
      @media (prefers-reduced-motion:reduce){.animated{display:none}.publish-ring{animation:none;opacity:0}.manifest-pulse{animation:none}}
    </style>
  </defs>

  <g id="background">
    <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
    <path d="M0 118H1200M0 618H1200" stroke="#1e293b"/>
    <circle cx="1080" cy="80" r="170" fill="#0ea5e9" opacity=".035"/>
    <circle cx="1020" cy="590" r="210" fill="#22d3ee" opacity=".025"/>
  </g>

  <g id="containers">
    <rect x="44" y="158" width="238" height="366" rx="18" fill="#0b1728" stroke="#29384d"/>
    <rect x="386" y="148" width="390" height="142" rx="18" fill="url(#git-card)" stroke="#334155"/>
    <rect x="386" y="326" width="390" height="198" rx="18" fill="url(#xet-card)" stroke="#155e75"/>
    <rect x="864" y="158" width="292" height="366" rx="18" fill="#0b1728" stroke="#29384d"/>
  </g>

  <g id="connections" fill="none">
    <path d="M282 250C350 250 354 205 386 205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <path d="M282 430C350 430 354 380 386 380" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sky)"/>
    <path d="M776 205C818 205 824 260 864 260" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
    <path d="M776 380C818 380 824 330 864 330" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-sky)"/>
    <path d="M612 462C688 462 752 488 864 488" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-sky)"/>
    <path d="M1010 388V422" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
  </g>

  <g id="nodes">
    <rect x="68" y="184" width="190" height="66" rx="12" fill="#111f33" stroke="#334155"/>
    <rect x="68" y="274" width="190" height="66" rx="12" fill="#111f33" stroke="#334155"/>
    <rect x="68" y="364" width="190" height="66" rx="12" fill="#0c2637" stroke="#0ea5e9"/>
    <rect x="68" y="454" width="190" height="46" rx="12" fill="#111f33" stroke="#334155"/>

    <rect x="416" y="184" width="150" height="74" rx="12" fill="#111f33" stroke="#475569"/>
    <rect x="592" y="184" width="154" height="74" rx="12" fill="#111f33" stroke="#475569"/>

    <rect x="416" y="356" width="160" height="72" rx="12" fill="#082f49" stroke="#38bdf8"/>
    <rect x="602" y="356" width="144" height="72" rx="12" fill="#0c2539" stroke="#0e7490"/>
    <rect x="416" y="452" width="196" height="46" rx="12" fill="#0c2539" stroke="#0e7490"/>

    <rect x="894" y="190" width="232" height="70" rx="12" fill="#111f33" stroke="#475569"/>
    <rect x="894" y="282" width="232" height="106" rx="12" fill="#0c2539" stroke="#0e7490"/>
    <rect class="manifest-pulse" x="894" y="422" width="232" height="78" rx="12" fill="#17324a" stroke="#475569" stroke-width="1.5"/>
    <circle class="publish-ring animated" cx="1010" cy="461" r="42" fill="none" stroke="#38bdf8" stroke-width="2"/>
  </g>

  <g id="labels">
    <text x="44" y="55" fill="#f8fafc" font-size="27" font-weight="750">One Git history. Two data paths.</text>
    <text x="44" y="86" fill="#94a3b8" font-size="15">Crab keeps Git's object model and changes how selected file content is represented.</text>
    <text x="44" y="139" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.6">DEVELOPER WORKFLOW</text>
    <text x="386" y="129" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.6">PHYSICAL REPRESENTATION</text>
    <text x="864" y="139" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.6">YOUR OBJECT STORE</text>

    <text x="88" y="209" fill="#94a3b8" class="mono" font-size="12">$ git add src/</text>
    <text x="88" y="232" fill="#f8fafc" class="mono" font-size="12">$ crab add models/</text>
    <text x="88" y="299" fill="#94a3b8" class="mono" font-size="12">$ git commit</text>
    <text x="88" y="322" fill="#cbd5e1" font-size="11">one tree, both file types</text>
    <text x="88" y="389" fill="#7dd3fc" class="mono" font-size="12">$ git push origin main</text>
    <text x="88" y="412" fill="#cbd5e1" font-size="11">remote helper interprets push</text>
    <text x="88" y="482" fill="#f8fafc" font-size="12" font-weight="650">No Crab data server</text>

    <text x="406" y="171" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.2">NORMAL GIT LANE</text>
    <text x="491" y="213" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Git blobs</text>
    <text x="491" y="235" fill="#94a3b8" font-size="11" text-anchor="middle">source + text</text>
    <text x="669" y="213" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Git pack</text>
    <text x="669" y="235" fill="#94a3b8" font-size="11" text-anchor="middle">commits · trees · blobs</text>

    <text x="406" y="347" fill="#38bdf8" font-size="11" font-weight="700" letter-spacing="1.2">XET-BACKED LANE</text>
    <text x="496" y="385" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Pointer blob</text>
    <text x="496" y="407" fill="#7dd3fc" font-size="11" text-anchor="middle">hash + size + hint</text>
    <text x="674" y="385" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">CDC chunks</text>
    <text x="674" y="407" fill="#67e8f9" font-size="11" text-anchor="middle">deduplicate by content</text>
    <text x="514" y="480" fill="#f8fafc" font-size="13" font-weight="650" text-anchor="middle">xorbs + reconstruction shards</text>

    <text x="1010" y="219" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Immutable Git packs</text>
    <text x="1010" y="241" fill="#94a3b8" font-size="11" text-anchor="middle">standard Git object data</text>
    <text x="1010" y="311" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Immutable Xet objects</text>
    <text x="1010" y="335" fill="#7dd3fc" font-size="11" text-anchor="middle">xorbs · shards · indexes</text>
    <text x="1010" y="359" fill="#94a3b8" font-size="11" text-anchor="middle">only when pointers exist</text>
    <text x="1010" y="451" fill="#f8fafc" font-size="14" font-weight="750" text-anchor="middle">Ref transaction</text>
    <text x="1010" y="474" fill="#7dd3fc" font-size="11" font-weight="650" text-anchor="middle">one visibility switch</text>

    <text x="600" y="574" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">Git names the state. Crab proves the bytes. The ref publishes both.</text>
    <text x="600" y="599" fill="#94a3b8" font-size="12" text-anchor="middle">Animated packets show the two storage lanes; motion stops when reduced motion is requested.</text>
    <text x="44" y="648" fill="#64748b" font-size="11">CRAB ARCHITECTURE · GIT INTERPRETABILITY</text>
  </g>

  <g id="animation" class="animated">
    <circle r="5" fill="#cbd5e1" filter="url(#glow)">
      <animateMotion dur="4.8s" repeatCount="indefinite" keyTimes="0;0.52;1" keyPoints="0;0;1" calcMode="linear"><mpath href="#normal-route"/></animateMotion>
    </circle>
    <circle r="5" fill="#38bdf8" filter="url(#glow)">
      <animateMotion dur="4.8s" begin=".25s" repeatCount="indefinite" keyTimes="0;0.32;1" keyPoints="0;0;1" calcMode="linear"><mpath href="#pointer-route"/></animateMotion>
    </circle>
    <circle r="5" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="4.8s" begin=".55s" repeatCount="indefinite" keyTimes="0;0.4;1" keyPoints="0;0;1" calcMode="linear"><mpath href="#payload-route"/></animateMotion>
    </circle>
  </g>
</svg>
