<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Add chooses a representation per file</title>
  <desc id="desc">An ordinary source file is stored as a full Git blob. A large Crab-tracked file is streamed through hashing and content-defined chunking, staged locally, and represented in Git by a pointer blob.</desc>
  <defs>
    <linearGradient id="bg-add" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/><stop offset="1" stop-color="#101d31"/>
    </linearGradient>
    <linearGradient id="lane-normal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#101d30"/><stop offset="1" stop-color="#142237"/>
    </linearGradient>
    <linearGradient id="lane-xet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b2435"/><stop offset="1" stop-color="#0d2b3c"/>
    </linearGradient>
    <marker id="add-arrow-slate" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <marker id="add-arrow-sky" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#38bdf8"/></marker>
    <filter id="add-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="normal-add-route" d="M220 238H403H610H824H1010"/>
    <path id="xet-add-route" d="M220 465H388H560H740H950"/>
    <style>
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}.strong{fill:#f8fafc}.label{fill:#cbd5e1}.muted{fill:#94a3b8}.animated{display:block}
      .chunk{animation:chunk-in 5.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.c2{animation-delay:.12s}.c3{animation-delay:.24s}.c4{animation-delay:.36s}.c5{animation-delay:.48s}
      .pointer{animation:pointer-ready 5.4s ease-in-out infinite}.stage-pulse{animation:stage-ready 5.4s ease-in-out infinite}
      @keyframes chunk-in{0%,22%{transform:translateX(-34px);opacity:0}34%,82%{transform:translateX(0);opacity:1}100%{opacity:.35}}
      @keyframes pointer-ready{0%,57%{opacity:.28}66%,92%{opacity:1}100%{opacity:.4}}
      @keyframes stage-ready{0%,42%{stroke:#0e7490}52%,78%{stroke:#67e8f9}100%{stroke:#0e7490}}
      @media (prefers-reduced-motion:reduce){.animated{display:none}.chunk,.pointer,.stage-pulse{animation:none}}
    </style>
  </defs>

  <g id="background">
    <rect width="1200" height="720" rx="28" fill="url(#bg-add)"/>
    <path d="M0 118H1200M0 654H1200" stroke="#1e293b"/>
  </g>

  <g id="containers">
    <rect x="38" y="154" width="1124" height="172" rx="18" fill="url(#lane-normal)" stroke="#334155"/>
    <rect x="38" y="354" width="1124" height="252" rx="18" fill="url(#lane-xet)" stroke="#155e75"/>
    <rect x="48" y="164" width="130" height="26" rx="13" fill="#1e293b"/>
    <rect x="48" y="364" width="164" height="26" rx="13" fill="#0c4a6e"/>
  </g>

  <g id="connections" fill="none">
    <path d="M244 238H366" stroke="#64748b" stroke-width="2" marker-end="url(#add-arrow-slate)"/>
    <path d="M496 238H573" stroke="#64748b" stroke-width="2" marker-end="url(#add-arrow-slate)"/>
    <path d="M687 238H787" stroke="#64748b" stroke-width="2" marker-end="url(#add-arrow-slate)"/>
    <path d="M897 238H972" stroke="#64748b" stroke-width="2" marker-end="url(#add-arrow-slate)"/>

    <path d="M244 465H350" stroke="#38bdf8" stroke-width="2" marker-end="url(#add-arrow-sky)"/>
    <path d="M480 465H522" stroke="#38bdf8" stroke-width="2" marker-end="url(#add-arrow-sky)"/>
    <path d="M650 465H694" stroke="#38bdf8" stroke-width="2" marker-end="url(#add-arrow-sky)"/>
    <path d="M814 465H906" stroke="#38bdf8" stroke-width="2" marker-end="url(#add-arrow-sky)"/>
    <path d="M754 508V548H986V508" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#add-arrow-sky)"/>
  </g>

  <g id="nodes">
    <rect x="76" y="207" width="168" height="64" rx="12" fill="#101c2c" stroke="#475569"/>
    <rect x="366" y="207" width="130" height="64" rx="12" fill="#101c2c" stroke="#475569"/>
    <rect x="573" y="207" width="114" height="64" rx="12" fill="#101c2c" stroke="#475569"/>
    <rect x="787" y="207" width="110" height="64" rx="12" fill="#101c2c" stroke="#475569"/>
    <rect x="972" y="207" width="144" height="64" rx="12" fill="#101c2c" stroke="#475569"/>

    <rect x="76" y="424" width="168" height="82" rx="12" fill="#0c2537" stroke="#0e7490"/>
    <rect x="350" y="424" width="130" height="82" rx="12" fill="#082f49" stroke="#38bdf8"/>
    <rect x="522" y="424" width="128" height="82" rx="12" fill="#0c2537" stroke="#0e7490"/>
    <rect class="stage-pulse" x="694" y="424" width="120" height="82" rx="12" fill="#0c2537" stroke="#0e7490" stroke-width="1.5"/>
    <rect class="pointer" x="906" y="424" width="210" height="82" rx="12" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>

    <rect x="530" y="535" width="154" height="42" rx="10" fill="#101c2c" stroke="#334155"/>
    <rect x="704" y="535" width="146" height="42" rx="10" fill="#101c2c" stroke="#334155"/>
    <rect x="870" y="535" width="236" height="42" rx="10" fill="#101c2c" stroke="#334155"/>
  </g>

  <g id="labels">
    <text x="38" y="53" fill="#f8fafc" font-size="27" font-weight="750">Add chooses the representation per file</text>
    <text x="38" y="84" fill="#94a3b8" font-size="15">The worktree stays familiar; Git's indexed blob changes only for paths routed through Crab.</text>

    <text x="113" y="181" fill="#cbd5e1" font-size="10" font-weight="750" letter-spacing="1.2" text-anchor="middle">NORMAL GIT</text>
    <text x="130" y="381" fill="#bae6fd" font-size="10" font-weight="750" letter-spacing="1.2" text-anchor="middle">XET-BACKED CONTENT</text>

    <text x="160" y="232" fill="#f8fafc" class="mono" font-size="12" text-anchor="middle">src/parser.rs</text>
    <text x="160" y="251" fill="#94a3b8" font-size="10" text-anchor="middle">full bytes in worktree</text>
    <text x="431" y="233" fill="#f8fafc" class="mono" font-size="12" text-anchor="middle">git add</text>
    <text x="431" y="252" fill="#94a3b8" font-size="10" text-anchor="middle">hash content</text>
    <text x="630" y="233" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Git blob</text>
    <text x="630" y="252" fill="#94a3b8" font-size="10" text-anchor="middle">full file</text>
    <text x="842" y="233" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Index</text>
    <text x="842" y="252" fill="#94a3b8" font-size="10" text-anchor="middle">blob OID</text>
    <text x="1044" y="233" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Commit tree</text>
    <text x="1044" y="252" fill="#94a3b8" font-size="10" text-anchor="middle">ordinary Git</text>

    <text x="160" y="452" fill="#f8fafc" class="mono" font-size="12" text-anchor="middle">encoder.safetensors</text>
    <text x="160" y="472" fill="#7dd3fc" font-size="10" text-anchor="middle">filter=crab</text>
    <text x="160" y="490" fill="#94a3b8" font-size="10" text-anchor="middle">full bytes stay visible</text>
    <text x="415" y="451" fill="#e0f2fe" class="mono" font-size="12" text-anchor="middle">crab add</text>
    <text x="415" y="471" fill="#7dd3fc" font-size="10" text-anchor="middle">parallel streaming</text>
    <text x="415" y="489" fill="#94a3b8" font-size="10" text-anchor="middle">or Git clean filter</text>
    <text x="586" y="451" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">BLAKE3 + CDC</text>
    <text x="586" y="471" fill="#67e8f9" font-size="10" text-anchor="middle">stable chunk boundaries</text>
    <text x="586" y="489" fill="#94a3b8" font-size="10" text-anchor="middle">bounded memory</text>
    <text x="754" y="451" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">Local staging</text>
    <text x="754" y="471" fill="#67e8f9" font-size="10" text-anchor="middle">ordered chunks</text>
    <text x="754" y="489" fill="#94a3b8" font-size="10" text-anchor="middle">flush before index</text>
    <text x="1011" y="451" fill="#f8fafc" font-size="12" font-weight="750" text-anchor="middle">Pointer in Git index</text>
    <text x="1011" y="472" fill="#7dd3fc" font-size="10" text-anchor="middle">file hash · size · shard hint</text>
    <text x="1011" y="490" fill="#94a3b8" font-size="10" text-anchor="middle">small Git blob</text>

    <text x="607" y="561" fill="#cbd5e1" font-size="10" text-anchor="middle">push plan candidate</text>
    <text x="777" y="561" fill="#cbd5e1" font-size="10" text-anchor="middle">prepared xorbs</text>
    <text x="988" y="561" fill="#cbd5e1" font-size="10" text-anchor="middle">rollback if publication fails</text>

    <text x="600" y="635" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Same working-tree experience. Different indexed representation.</text>
    <text x="38" y="688" fill="#64748b" font-size="11">ADD FLOW · ORDINARY GIT VS CRAB-TRACKED LARGE FILES</text>
  </g>

  <g id="animation" class="animated">
    <circle r="4.5" fill="#cbd5e1" filter="url(#add-glow)"><animateMotion dur="5.4s" repeatCount="indefinite" keyTimes="0;0.18;1" keyPoints="0;0;1" calcMode="linear"><mpath href="#normal-add-route"/></animateMotion></circle>
    <circle r="4.5" fill="#38bdf8" filter="url(#add-glow)"><animateMotion dur="5.4s" begin=".2s" repeatCount="indefinite" keyTimes="0;0.12;1" keyPoints="0;0;1" calcMode="linear"><mpath href="#xet-add-route"/></animateMotion></circle>
    <g transform="translate(704 398)">
      <rect class="chunk" x="0" y="0" width="14" height="14" rx="3" fill="#38bdf8"/>
      <rect class="chunk c2" x="20" y="0" width="14" height="14" rx="3" fill="#22d3ee"/>
      <rect class="chunk c3" x="40" y="0" width="14" height="14" rx="3" fill="#38bdf8"/>
      <rect class="chunk c4" x="60" y="0" width="14" height="14" rx="3" fill="#22d3ee"/>
      <rect class="chunk c5" x="80" y="0" width="14" height="14" rx="3" fill="#38bdf8"/>
    </g>
  </g>
</svg>
