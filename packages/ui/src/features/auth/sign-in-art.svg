<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600">
  <style>
    svg {
      --paper: #f1f2ee;
      --light: #fbfaf5;
      --shade: #dbe8e2;
      --frame: #a1b5ad;
      --dot: #738c85;
      --main: #31665f;
      --feature: #a3543d;
      --experiment: #536891;
      --node: #fbfaf5;
      --label: #25463f;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --paper: #152725;
        --light: #233733;
        --shade: #1b3b35;
        --frame: #5a7a70;
        --dot: #7a9b91;
        --main: #8dc7b6;
        --feature: #efad91;
        --experiment: #a7bcea;
        --node: #1b302c;
        --label: #e3eee9;
      }
    }
  </style>
  <defs>
    <radialGradient id="paper" cx="22%" cy="12%" r="92%">
      <stop stop-color="var(--light)"/>
      <stop offset="1" stop-color="var(--shade)"/>
    </radialGradient>
    <radialGradient id="fade">
      <stop offset="0.36" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="grid-fade">
      <rect width="720" height="600" fill="url(#fade)"/>
    </mask>
    <pattern id="grid" x="12" y="9" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="var(--dot)" opacity=".32"/>
    </pattern>
    <circle id="commit" r="7" fill="var(--node)" stroke-width="2.75"/>
    <circle id="tip" r="3" stroke="none"/>
  </defs>

  <rect width="720" height="600" fill="var(--paper)"/>
  <rect width="720" height="600" fill="url(#paper)"/>
  <rect width="720" height="600" fill="url(#grid)" mask="url(#grid-fade)"/>
  <rect x="24.5" y="24.5" width="671" height="551" rx="13" fill="none" stroke="var(--frame)" opacity=".45"/>

  <g fill="none" stroke-linecap="round" stroke-width="2.75">
    <path d="M183 303C225 303 235 202 278 202H489C535 202 545 303 588 303" stroke="var(--feature)"/>
    <path d="M327 303C367 303 385 402 430 402H520" stroke="var(--experiment)"/>
    <path d="M79 303H641" stroke="var(--main)"/>
  </g>

  <g stroke="var(--main)">
    <use href="#commit" x="79" y="303"/>
    <use href="#commit" x="126" y="303"/>
    <use href="#commit" x="183" y="303"/>
    <use href="#commit" x="327" y="303"/>
    <use href="#commit" x="428" y="303"/>
    <circle cx="588" cy="303" r="14" fill="var(--main)" stroke="none" opacity=".15"/>
    <use href="#commit" x="588" y="303"/>
    <use href="#commit" x="641" y="303"/>
    <use href="#tip" x="641" y="303" fill="var(--main)"/>
  </g>
  <g stroke="var(--feature)">
    <use href="#commit" x="278" y="202"/>
    <use href="#commit" x="383" y="202"/>
    <use href="#commit" x="489" y="202"/>
    <use href="#tip" x="489" y="202" fill="var(--feature)"/>
  </g>
  <g stroke="var(--experiment)">
    <use href="#commit" x="430" y="402"/>
    <use href="#commit" x="520" y="402"/>
    <use href="#tip" x="520" y="402" fill="var(--experiment)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="600">
    <g transform="translate(396 152)">
      <rect width="100" height="31" rx="8" fill="var(--node)" stroke="var(--feature)" stroke-opacity=".43"/>
      <circle cx="15" cy="15.5" r="3.25" fill="var(--feature)"/>
      <text x="28" y="20.75" fill="var(--label)">feature</text>
    </g>
    <g transform="translate(567 253)">
      <rect width="80" height="31" rx="8" fill="var(--node)" stroke="var(--main)" stroke-opacity=".48"/>
      <circle cx="15" cy="15.5" r="3.25" fill="var(--main)"/>
      <text x="28" y="20.75" fill="var(--label)">main</text>
    </g>
    <g transform="translate(400 420)">
      <rect width="127" height="31" rx="8" fill="var(--node)" stroke="var(--experiment)" stroke-opacity=".43"/>
      <circle cx="15" cy="15.5" r="3.25" fill="var(--experiment)"/>
      <text x="28" y="20.75" fill="var(--label)">experiment</text>
    </g>
  </g>
</svg>
